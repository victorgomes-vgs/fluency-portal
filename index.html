}

function TimelineLesson({item,uid,isAdmin,defaultOpen,onFocused,isLast}){
  const [open,setOpen]=useState(false);
  const rootRef=useRef(null);
  const concluida=item.status==="concluida"||item.status==="realizada";
  const andamento=item.status==="andamento";
  const isPending=!concluida&&!andamento;
  // Aluno: lição pendente bloqueada (não abre). Admin: pode abrir sempre.
  const locked=isPending&&!isAdmin;
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const typeTag=isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":isOutput?"Output":"Input";
  useEffect(()=>{
    if(!defaultOpen)return;
    if(locked){onFocused?.();return;}
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});onFocused?.();},120);
    return()=>clearTimeout(t);
  },[defaultOpen,locked]);
  function toggle(){
    if(locked)return;
    if(!open)playLessonSound();
    setOpen(o=>!o);
  }
  let pillCls;
  if(concluida){
    pillCls="tl-pill-done"+(isOutput?" tl-pill-done-output":isReview?" tl-pill-done-review":"");
  }else if(andamento){
    pillCls="tl-pill-active";
  }else{
    pillCls="tl-pill-pending"+(locked?" tl-pill-locked":"");
  }
  const nodeCls="tl-node-lesson"+(concluida?(" tl-node-done"+(isOutput?" tl-node-done-output":isReview?" tl-node-done-review":"")):andamento?" tl-node-active":"");
  const temaRaw=item.tema||(item.objetivos?item.objetivos.split(/[.!?\n]/)[0]:"");
  const tema=temaRaw?String(temaRaw).replace(/^\(|\)$/g,"").trim():"";
  const temaShort=tema?(tema.length>36?tema.slice(0,36)+"…":tema):"";
  const label=item.displayLabel?("Lesson "+item.displayLabel):(isReview?("R"+item.num):("Lesson "+item.num));
  return(
    <div ref={rootRef} className="tl-lesson-row">
      <div className="tl-lesson-rail">
        <div className={"tl-node "+nodeCls}/>
        {!isLast&&<div className="tl-segment-sm"><TimelineSegment height={20}/></div>}
      </div>
      <div className="tl-lesson-body">
        <button type="button" className={"tl-lesson-pill "+pillCls} onClick={toggle} aria-disabled={locked} title={locked?"Lição bloqueada — disponível quando for liberada":undefined}>
          <div style={{minWidth:0,flex:1}}>
            <div className="tl-lesson-title" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span>{label}{temaShort?<> <span style={{fontWeight:500,opacity:.9}}>{temaShort}</span></>:null}</span>
              <span className={typeTag} style={{fontSize:9}}>{typeLabel}</span>
            </div>
            {item.dataPrevista&&!locked&&<div className="tl-lesson-meta"><span className="tl-previsao">previsão</span> · {formatDateBR(item.dataPrevista).slice(0,5)}</div>}
          </div>
          {isPending&&(
            <span className="tl-badge-pendente" title={locked?"Lição pendente e bloqueada":"Pendente"}>
              <Icon name="lock" size={10}/> Pendente
            </span>
          )}
          {concluida&&<span className={"tl-badge-done"+(isOutput?" tl-badge-done-output":isReview?" tl-badge-done-review":"")}>concluída</span>}
          {andamento&&!concluida&&<span className="tl-badge-current">atual</span>}
          {!locked&&<Icon name="chevron-down" size={14} className={"tl-mod-chevron"+(open?" tl-mod-chevron-open":"")} style={{opacity:.75,color:"inherit"}}/>}
        </button>
        {open&&!locked&&<div className="tl-lesson-expand"><LessonItem item={item} uid={uid} isAdmin={isAdmin} embedMode={true}/></div>}
      </div>
    </div>
  );
}

function TrilhaTimelineModule({bookIdx,modMeta,items,uid,isAdmin,hidden,onToggleHidden,focusLessonId,onLessonFocused,isLast,defaultOpen}){
  const hasFocus=focusLessonId&&items.some(i=>i.id===focusLessonId);
  const [open,setOpen]=useState(defaultOpen||hasFocus);
  const mod=modMeta||{name:"Módulo "+bookIdx};
  useEffect(()=>{if(hasFocus)setOpen(true);},[hasFocus]);
  return(
    <div className="tl-module-block">
      <div className="tl-rail">
        <div className="tl-node tl-node-mod"/>
        {!isLast&&<TimelineSegment height={48} variant="mod"/>}
      </div>
      <div className="tl-content">
        <div className="tl-mod-row">
          <button type="button" className="tl-mod-header" onClick={()=>setOpen(o=>!o)}>
            <div className="tl-mod-num"><span className="tl-mod-lbl">Módulo</span><span className="tl-mod-id">{bookIdx}</span></div>
            <div className="tl-mod-sep"/>
            <div className="tl-mod-title">{mod.name}{hidden&&<span className="tl-mod-hidden-badge">oculto</span>}</div>
            <Icon name="chevron-down" size={16} className={"tl-mod-chevron"+(open?" tl-mod-chevron-open":"")}/>
          </button>
          {isAdmin&&<button type="button" className={"tl-hide-btn"+(hidden?" tl-hidden-active":"")} onClick={onToggleHidden} title={hidden?"Mostrar módulo ao aluno":"Ocultar módulo do aluno"}>
            <Icon name={hidden?"eye-off":"eye"} size={15}/>
            <span>{hidden?"Oculto":"Visível"}</span>
          </button>}
        </div>
        {open&&items.map((item,idx)=><TimelineLesson key={item.id} item={item} uid={uid} isAdmin={isAdmin} defaultOpen={item.id===focusLessonId} onFocused={item.id===focusLessonId?onLessonFocused:undefined} isLast={idx===items.length-1}/>)}
      </div>
    </div>
  );
}

function statusClassForLesson(item){
  const done=item.status==="concluida"||item.status==="realizada";
  const andamento=item.status==="andamento";
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  if(done)return"done"+(isOutput?"-output":isReview?"-review":"");
  if(andamento)return"active";
  return"pending";
}
function statusLabelShort(item){
  if(item.status==="concluida"||item.status==="realizada")return"ok";
  if(item.status==="andamento")return"atual";
  return"pend.";
}

/** Timeline vertical mobile: módulos em círculos + lições em círculos + sheet fullscreen */
function StudentTrilhaJourney({uid,visibleModules,books,modulosOcultos,isAdmin,focusLessonId,onLessonFocused,onOpenLesson,progress,course,onToggleHidden}){
  const [openMod,setOpenMod]=useState(null);
  const [sheetItem,setSheetItem]=useState(null);
  const allLessons=useMemo(()=>books.flatMap(book=>book.items||[]),[books]);
  const suggestedMod=useMemo(()=>{
    const activeBook=books.find(book=>(book.items||[]).some(item=>item.status==="andamento"));
    const firstPendingBook=books.find(book=>(book.items||[]).some(item=>!(item.status==="concluida"||item.status==="realizada")));
    const candidate=activeBook?.bookIdx||firstPendingBook?.bookIdx||visibleModules[0]?.id||null;
    return visibleModules.some(mod=>mod.id===candidate)?candidate:(visibleModules[0]?.id||null);
  },[books,visibleModules]);

  useEffect(()=>{
    if(!openMod||!visibleModules.some(mod=>mod.id===openMod))setOpenMod(suggestedMod);
  },[openMod,suggestedMod,visibleModules]);

  // URL / focusLessonId é a fonte da verdade do sheet (voltar do browser fecha a lição)
  useEffect(()=>{
    if(!focusLessonId){
      setSheetItem(null);
      return;
    }
    const modId=parseInt((focusLessonId.split("-")[0]||"").slice(1),10);
    if(modId)setOpenMod(modId);
    const book=books.find(b=>b.bookIdx===modId);
    const item=book?.items?.find(i=>i.id===focusLessonId);
    if(item){
      const locked=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento")&&!isAdmin;
      if(!locked)setSheetItem(item);
      else setSheetItem(null);
    }
  },[focusLessonId,books,isAdmin]);

  function toggleMod(id){
    playClickSound("mod");
    setOpenMod(cur=>cur===id?null:id);
  }
  function openLesson(item){
    const isPending=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento");
    const locked=isPending&&!isAdmin;
    if(locked)return;
    playClickSound("open");
    // Navega via URL para empilhar no histórico do browser
    if(onOpenLesson)onOpenLesson(item.id);
    else setSheetItem(item);
  }
  function closeSheet(){
    playClickSound("mod");
    setSheetItem(null);
    onLessonFocused?.();
  }

  // Sheet aberta: trava scroll de fundo + Escape fecha (igual botão X / voltar)
  useBodyScrollLock(!!sheetItem);
  useEscapeKey(closeSheet,!!sheetItem);

  const selectedModule=visibleModules.find(mod=>mod.id===openMod)||visibleModules[0];
  const selectedItems=books.find(book=>book.bookIdx===selectedModule?.id)?.items||[];
  const completedCount=allLessons.filter(item=>item.status==="concluida"||item.status==="realizada").length;
  const totalCount=allLessons.length||1;
  const currentOrdinal=Math.min(completedCount+1,totalCount);
  const sheetLessonLabel=sheetItem?.displayLabel||((sheetItem?.type==="review"||sheetItem?.lessonType==="review")?("R"+sheetItem?.num):sheetItem?.num);

  return(
    <div>
      <div className="cosmic-stage">
        <div className="cosmic-meta">
          <div className="cosmic-meta-brand"><span className="cosmic-meta-icon"><Icon name="zap" size={20}/></span><span>Fluency Studio</span></div>
          <div className="cosmic-meta-item"><span className="cosmic-meta-icon"><Icon name="book-open" size={19}/></span><span>{course?.nome||"Seu curso"}</span></div>
          <div className="cosmic-meta-progress"><span className="cosmic-meta-ring"/><span>{currentOrdinal} de {totalCount}</span></div>
          <div className="cosmic-meta-trail"><span className="cosmic-meta-icon"><Icon name="route" size={20}/></span><span>Sua Trilha</span></div>
          <span className="cosmic-meta-underline"/>
        </div>

        <div className="cosmic-intro">
          <h2>Constellation Journey</h2>
          <p>Sua jornada de aprendizado em inglês, uma constelação de conquistas.</p>
        </div>

        <div className="cosmic-module-tabs" role="tablist" aria-label="Módulos do curso">
          {visibleModules.map(mod=>(
            <button key={mod.id} type="button" role="tab" aria-selected={openMod===mod.id} className={"cosmic-module-tab"+(openMod===mod.id?" active":"")} onClick={()=>toggleMod(mod.id)}>
              Módulo {mod.id} · {mod.name||"Trilha"}
            </button>
          ))}
          {isAdmin&&selectedModule&&(
            <button type="button" className={"tl-hide-btn"+(isModuleHidden(modulosOcultos,selectedModule.id)?" tl-hidden-active":"")} onClick={()=>onToggleHidden(selectedModule.id)}>
              <Icon name={isModuleHidden(modulosOcultos,selectedModule.id)?"eye-off":"eye"} size={14}/>
              <span>{isModuleHidden(modulosOcultos,selectedModule.id)?"Oculto":"Visível"}</span>
            </button>
          )}
        </div>

        {selectedItems.length>0?(
          <div className="cosmic-route-scroll">
            <div className="cosmic-route" style={{minWidth:Math.max(920,selectedItems.length*160+220)}}>
              <div className="cosmic-energy-route" aria-hidden="true"/>
              {selectedItems.map((item,idx)=>{
                const isReview=item.type==="review"||item.lessonType==="review";
                const isOutput=item.lessonType==="output";
                const isPending=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento");
                const locked=isPending&&!isAdmin;
                const sc=statusClassForLesson(item);
                const label=getLessonDisplayLabel(item);
                const statusText=sc==="active"?"Atual":sc.indexOf("done")===0?"Concluída":"Pendente";
                const activeIdx=selectedItems.findIndex(lesson=>statusClassForLesson(lesson)==="active");
                const effectiveActiveIdx=activeIdx>=0?activeIdx:Math.min(completedCount,selectedItems.length-1);
                const shift=idx===effectiveActiveIdx?-18:idx<effectiveActiveIdx?18:Math.min(112,18+(idx-effectiveActiveIdx)*19);
                return(
                  <div key={item.id} className={"cosmic-node-wrap "+(sc==="active"?"active":"")} style={{"--cosmic-shift":shift+"px"}}>
                    <button type="button" className={"cosmic-orb "+sc+(locked?" locked":"")} onClick={()=>openLesson(item)} title={locked?"Lição bloqueada":("Lição "+label)} aria-label={(isReview?"Review ":isOutput?"Output ":"Input ")+label+", "+statusText}>
                      <span className="cosmic-orb-asset" aria-hidden="true"/>
                      <span className="cosmic-orb-copy">
                        <span className="cosmic-orb-kicker">Lição</span>
                        <span className="cosmic-orb-num">{label}</span>
                        <span className="cosmic-orb-status">{statusText}</span>
                      </span>
                      {sc.indexOf("done")===0&&<span className="cosmic-orb-check" aria-hidden="true"><Icon name="check" size={16}/></span>}
                    </button>
                    {sc==="active"&&<button type="button" className="cosmic-continue" onClick={()=>openLesson(item)}>Continuar lição <Icon name="arrow-right" size={17}/></button>}
                  </div>
                );
              })}
            </div>
          </div>
        ):(
          <div className="text-center py-10" style={{position:"relative",zIndex:3,color:"rgba(255,255,255,.58)"}}>
            <Icon name="eye-off" size={28} className="mx-auto mb-2 opacity-50"/>
            <p className="text-sm">Nenhuma lição disponível neste módulo.</p>
          </div>
        )}

        <div className="cosmic-encouragement">
          <div className="cosmic-encouragement-icon"><Icon name="zap" size={22}/></div>
          <div><strong>Você está no caminho certo!</strong><span>Cada lição concluída te aproxima dos seus objetivos.</span></div>
        </div>
      </div>

      {sheetItem&&(
        <div className="tj-sheet" role="dialog" aria-modal="true" aria-label={"Lição "+sheetLessonLabel} onClick={e=>{if(e.target===e.currentTarget)closeSheet();}}>
          <div className="tj-sheet-panel" onClick={e=>e.stopPropagation()}>
            <div className="tj-sheet-head">
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span className={(sheetItem.lessonType==="review"||sheetItem.type==="review")?"tag-review":sheetItem.lessonType==="output"?"tag-output":"tag-input"}>
                    {(sheetItem.lessonType==="review"||sheetItem.type==="review")?"Review":sheetItem.lessonType==="output"?"Output":"Input"}
                  </span>
                  <LessonBadge status={sheetItem.status==="realizada"?"concluida":(sheetItem.status||"pendente")}/>
                </div>
                <div style={{fontSize:18,fontWeight:800,fontFamily:"'Sora',sans-serif",lineHeight:1.2}}>
                  {"Lesson "+sheetLessonLabel}
                </div>
              </div>
              <button type="button" className="tj-sheet-close" onClick={closeSheet} aria-label="Fechar lição"><Icon name="x" size={20}/></button>
            </div>
            <div className="tj-sheet-body">
              {isAdmin&&<div style={{marginBottom:14}}>
                <label className="form-label">Tipo de lição</label>
                <div className="lesson-type-picker" role="radiogroup" aria-label="Tipo de lição">
                  {[
                    {value:"input",label:"Input",color:"#1769AA"},
                    {value:"output",label:"Output",color:"#087F72"},
                    {value:"review",label:"Review",color:"#6D45B8"},
                  ].map(type=><button key={type.value} type="button" role="radio" aria-checked={sheetItem.lessonType===type.value} className={"lesson-type-option"+(sheetItem.lessonType===type.value?" active":"")} style={{"--type-color":type.color}} onClick={async()=>{
                    const next={...sheetItem,lessonType:type.value,type:type.value==="review"?"review":"lesson"};
                    setSheetItem(next);
                    try{
                      const existing=(course?.lessonContent&&course.lessonContent[sheetItem.id])||{};
                      await upsertCourseDoc({...course,sharedContentEnabled:true,lessonContent:{...(course?.lessonContent||{}),[sheetItem.id]:{...existing,lessonType:type.value}}});
                      notifySaveSuccess("Tipo da lição atualizado para "+type.label+".");
                    }catch(e){console.error("tipo de lição:",e);notifySaveError("Não foi possível atualizar o tipo da lição.");}
                  }}><span className="lesson-type-dot" aria-hidden="true"/>{type.label}</button>)}
                </div>
              </div>}
              <LessonItem item={sheetItem} uid={uid} isAdmin={isAdmin} embedMode={true}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TrilhaSection({uid,isAdmin,focusLessonId,onLessonFocused,onOpenLesson,contrato}){
  const courses=useCourses();
  const [trilhaData,setTrilhaData]=useState(null);
  const [modulosOcultos,setModulosOcultos]=useState([]);
  const [studentContrato,setStudentContrato]=useState(contrato||"");
  useEffect(()=>db.collection("students").doc(uid).onSnapshot(doc=>{
    if(!doc.exists){setTrilhaData({});setModulosOcultos([]);return;}
    const d=doc.data();
    setTrilhaData(d.trilha||{});
    setModulosOcultos(d.modulosOcultos||[]);
    if(d.contrato)setStudentContrato(d.contrato);
  }),[uid]);
  const course=useMemo(()=>getCourseById(contrato||studentContrato),[courses,contrato,studentContrato]);
  const books=useMemo(()=>trilhaData?mergeBooks(trilhaData,course):[],[trilhaData,course]);
  const visibleModules=getVisibleModules(modulosOcultos,isAdmin,course);
  const {totalDone,totalItems}=useMemo(()=>{
    let done=0,total=0;
    books.filter(b=>isAdmin||!isModuleHidden(modulosOcultos,b.bookIdx)).forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida"||i.status==="realizada")done++;}));
    return{totalDone:done,totalItems:total};
  },[books,modulosOcultos,isAdmin]);
  const progress=totalItems?Math.round((totalDone/totalItems)*100):0;
  async function toggleModuleHidden(modId){
    const next=modulosOcultos.includes(modId)?modulosOcultos.filter(id=>id!==modId):[...modulosOcultos,modId];
    await db.collection("students").doc(uid).update({modulosOcultos:next});
  }
  useEffect(()=>{
    if(isAdmin||!focusLessonId)return;
    const modId=parseInt((focusLessonId.split("-")[0]||"").slice(1),10);
    if(isModuleHidden(modulosOcultos,modId))onLessonFocused?.();
  },[focusLessonId,modulosOcultos,isAdmin]);
  if(!trilhaData)return <LoadingScreen/>;

  // Aluno (e admin em preview mobile-friendly): journey timeline
  if(!isAdmin){
    return(
      <StudentTrilhaJourney
        uid={uid}
        visibleModules={visibleModules}
        books={books}
        modulosOcultos={modulosOcultos}
        isAdmin={false}
        focusLessonId={focusLessonId}
        onLessonFocused={onLessonFocused}
        onOpenLesson={onOpenLesson}
        progress={progress}
        course={course}
        onToggleHidden={toggleModuleHidden}
      />
    );
  }

  // Admin: journey + painel de progresso
  return(
    <div>
      <div className="glass rounded-2xl p-5 mb-5 text-center">
        <h2 className="text-xl font-bold mb-1 flex items-center justify-center gap-2" style={{fontFamily:"'Sora',sans-serif"}}>
          <Icon name="route" size={18} style={{color:'rgba(44,122,142,1)'}}/>Trilha
        </h2>
        <p className="text-xs muted mb-1" style={{color:course.corBase||"var(--font-muted)"}}>{course.nome||"Curso"} · {getTotalLicoes(course)} lições</p>
        <div className="max-w-sm mx-auto mt-3">
          <div className="flex justify-between text-xs muted mb-1"><span>Progresso</span><span className="font-semibold">{progress}%</span></div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{background:"var(--badge)"}}><div className="h-full rounded-full progress-fill" style={{width:progress+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/></div>
        </div>
        <p className="text-xs muted mt-3">Toque nos círculos de módulo e lição. Use o botão de olho para ocultar módulos do aluno.</p>
      </div>
      <StudentTrilhaJourney
        uid={uid}
        visibleModules={visibleModules}
        books={books}
        modulosOcultos={modulosOcultos}
        isAdmin={true}
        focusLessonId={focusLessonId}
        onLessonFocused={onLessonFocused}
        progress={progress}
        course={course}
        onToggleHidden={toggleModuleHidden}
      />
    </div>
  );
}

}

function StudentReportCardsSection({uid,profile,contrato,isAdmin}){
  const courses=useCourses();
  const course=useMemo(()=>getCourseById(contrato||profile?.contrato),[courses,contrato,profile]);
  const menu=useMemo(()=>getCourseReportCardMenu(course),[course]);
  const books=useMemo(()=>generateBooks(course),[course]);
  const [exercisesMap,setExercisesMap]=useState({});
  const [diarioEntries,setDiarioEntries]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const student=useMemo(()=>({uid,name:profile?.name||profile?.nome||"",contrato:course?.id||contrato}),[uid,profile,course,contrato]);
  useEffect(()=>{
    let alive=true;
    (async()=>{
      setLoading(true);
      try{
        const[ex,di]=await Promise.all([loadStudentExercises(uid),loadStudentDiario(uid)]);
        if(!alive)return;
        setExercisesMap(ex||{});
        setDiarioEntries(di||[]);
      }catch(e){}
      finally{if(alive)setLoading(false);}
    })();
    return()=>{alive=false;};
  },[uid]);
  const moduleBook=useMemo(()=>{
    if(!selected)return null;
    const book=books.find(b=>b.bookIdx===selected.moduleId)||books[selected.moduleId-1];
    if(!book)return null;
    if(selected.scope==="module")return{...book,items:(book.items||[]).filter(i=>i.type!=="report_card"&&i.lessonType!=="report_card")};
    const start=selected.licaoInicio,end=selected.licaoFim;
    const items=(book.items||[]).filter(i=>{
      if(i.type==="report_card"||i.lessonType==="report_card")return false;
      const n=Number(i.num);
      if(!n||start==null||end==null)return false;
      return n>=start&&n<=end;
    });
    return{bookIdx:book.bookIdx,items,reportCardTitle:selected.label};
  },[selected,books]);
  if(loading)return <LoadingScreen/>;
  if(selected&&moduleBook){
    return(
      <ReportCardView
        student={student}
        course={course}
        moduleBook={moduleBook}
        exercisesMap={exercisesMap}
        diarioEntries={diarioEntries}
        onBack={()=>setSelected(null)}
      />
    );
  }
  return(
    <div className="space-y-4">
      <div className="glass rounded-2xl p-5">
        <h3 className="text-lg font-bold flex items-center gap-2" style={{fontFamily:"'Sora',sans-serif"}}>
          <Icon name="file-check" size={18} style={{color:"#818cf8"}}/> Report Card
        </h3>
        <p className="text-xs muted mt-1">
          {course?.unitReportCards
            ?"Há Report Card ao final de cada unidade (10 lições) e de cada módulo. A Trilha só tem as lições — os boletins ficam aqui."
            :"Escolha o módulo para ver o Report Card. A Trilha não exibe boletim; use este ícone."}
        </p>
        <div className="text-xs muted mt-2">{course?.nome||"Curso"} · {menu.length} boletim(ns)</div>
      </div>
      {menu.length===0?(
        <div className="glass rounded-2xl p-8 text-center muted">Nenhum Report Card configurado para este curso.</div>
      ):(
        <div className="space-y-2">
          {menu.map(item=>(
            <button key={item.id} type="button" className="btn rounded-2xl px-4 py-4 block w-full text-left" onClick={()=>setSelected(item)}>
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="chip w-10 h-10 rounded-xl flex items-center justify-center shrink-0"><Icon name="file-check" size={18}/></div>
                  <div className="min-w-0">
                    <div className="font-semibold truncate">{item.scope==="unit"?"Unidade":"Módulo"} · {item.label}</div>
                    <div className="text-xs muted">{item.scope==="unit"?"Report Card da unidade":"Report Card do módulo"}</div>
                  </div>
                </div>
                <Icon name="chevron-right" size={16} className="muted shrink-0"/>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function DiarioSection({uid,isAdmin,contrato}){
  const courses=useCourses();
  const [entries,setEntries]=useState(null);
  const [studentContrato,setStudentContrato]=useState(contrato||"");
  const [openContentId,setOpenContentId]=useState(null);
  const [drafts,setDrafts]=useState({}); // id -> partial overrides
  const [localNew,setLocalNew]=useState([]); // unsaved new entries
  const [dirty,setDirty]=useState({}); // id -> true
  const [savingId,setSavingId]=useState("");
  useEffect(()=>db.collection("students").doc(uid).collection("diario").orderBy("num","asc").onSnapshot(snap=>{
    const list=snap.docs.map(d=>({id:d.id,...d.data()}));
    setEntries(list);
    // Drop drafts that match server (keep only still-dirty ones that still exist or are local)
    setDrafts(prev=>{
      const next={...prev};
      Object.keys(next).forEach(id=>{
        if(String(id).startsWith("new-"))return;
        if(!list.some(e=>e.id===id))delete next[id];
      });
      return next;
    });
  }),[uid]);
  useEffect(()=>{
    if(contrato){setStudentContrato(contrato);return;}
    return db.collection("students").doc(uid).onSnapshot(doc=>{if(doc.exists&&doc.data().contrato)setStudentContrato(doc.data().contrato);});
  },[uid,contrato]);
  const course=useMemo(()=>getCourseById(studentContrato),[courses,studentContrato]);
  const lessonOptions=useMemo(()=>{
    const books=generateBooks(course);
    const opts=[];
    books.forEach(b=>{
      b.items.forEach(it=>{
        if(it.type==="report_card"||it.lessonType==="report_card")return;
        opts.push({
          id:it.id,
          num:it.num,
          label:`${getLessonDisplayLabel(it)} — ${it.title||it.tema||"Lição"}`,
          title:it.title||"",
          tema:it.tema||"",
          objetivos:it.objetivos||"",
          linkAula:it.linkAula||"",
          linkTarefa:it.linkTarefa||"",
          linkMaterial:it.linkMaterial||"",
        });
      });
    });
    return opts;
  },[course]);
  const displayEntries=useMemo(()=>{
    const base=(entries||[]).map(e=>({...e,...(drafts[e.id]||{}),_isNew:false}));
    const news=localNew.map(e=>({...e,...(drafts[e.id]||{}),_isNew:true}));
    // Mais recente primeiro (admin e aluno)
    return sortDiarioEntriesDesc([...base,...news]);
  },[entries,localNew,drafts]);
  function patchDraft(id,patch){
    setDrafts(prev=>({...prev,[id]:{...(prev[id]||{}),...patch}}));
    setDirty(prev=>({...prev,[id]:true}));
    setLocalNew(prev=>prev.map(e=>e.id===id?{...e,...patch}:e));
  }
  function addEntry(){
    const allNums=[...(entries||[]).map(e=>e.num||0),...localNew.map(e=>e.num||0)];
    const nextNum=allNums.length?Math.max(...allNums)+1:1;
    const first=lessonOptions[0];
    const id="new-"+Date.now();
    const row={
      id,num:nextNum,
      date:getTodayISO(),
      licaoNum:first?first.num:1,
      licaoId:first?first.id:"",
      licaoTitulo:first?first.title:"",
      status:"presenca",
      ocorrido:"",
      obs:"",
      reposicaoTipo:"",
      reposicaoMotivo:"",
      _isNew:true,
    };
    setLocalNew(prev=>[...prev,row]);
    setDirty(prev=>({...prev,[id]:true}));
    setOpenContentId(id);
  }
  function buildSavePayload(merged){
    const patch={
      num:merged.num||1,
      date:merged.date||getTodayISO(),
      licaoNum:merged.licaoNum||null,
      licaoId:merged.licaoId||"",
      licaoTitulo:merged.licaoTitulo||"",
      status:normalizeDiarioStatus(merged),
      ocorrido:merged.ocorrido||"",
      obs:merged.obs||"",
      reposicaoTipo:merged.reposicaoTipo||"",
      reposicaoMotivo:merged.reposicaoMotivo||"",
    };
    const statusNow=patch.status;
    if(diaryGrantsReposicao({...merged,status:statusNow})){
      if(!merged.reposicaoStatus)patch.reposicaoStatus=REPO_STATUS.PENDENTE;
      else patch.reposicaoStatus=merged.reposicaoStatus;
      if(statusNow!=="falta_professor"&&!merged.reposicaoVence){
        patch.reposicaoVence=addDaysISO(patch.date,30);
      }
      if(statusNow==="falta_professor")patch.reposicaoVence="";
      // Adequação: gera reposição gratuita com 30 dias, fora da cota do contrato
      if(statusNow==="adequacao_com_reposicao"){
        patch.reposicaoMotivo="adequacao";
        patch.reposicaoTipo="adequacao";
        patch.reposicaoNaoContaGratuita=true;
        if(!merged.reposicaoVence)patch.reposicaoVence=addDaysISO(patch.date,30);
        if(!merged.ocorrido)patch.ocorrido="Adequação pedagógica — reposição gratuita (não consome cota do contrato)";
      }
    }
    if(statusNow==="presenca"&&(merged.reposicaoStatus===REPO_STATUS.AGENDADO||merged.markReposicaoFeita)){
      patch.reposicaoStatus=REPO_STATUS.REPOSICAO_FEITA;
    }
    return{patch,statusNow};
  }
  async function saveEntry(id){
    const row=displayEntries.find(e=>e.id===id);
    if(!row)return;
    setSavingId(id);
    try{
      const {patch,statusNow}=buildSavePayload(row);
      if(row._isNew||String(id).startsWith("new-")){
        const ref=await db.collection("students").doc(uid).collection("diario").add({
          ...patch,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        });
        setLocalNew(prev=>prev.filter(e=>e.id!==id));
        setDrafts(prev=>{const n={...prev};delete n[id];return n;});
        setDirty(prev=>{const n={...prev};delete n[id];return n;});
        setOpenContentId(ref.id);
      }else{
        await db.collection("students").doc(uid).collection("diario").doc(id).update(patch);
        setDrafts(prev=>{const n={...prev};delete n[id];return n;});
        setDirty(prev=>{const n={...prev};delete n[id];return n;});
      }
      try{
        const snap=await db.collection("students").doc(uid).collection("diario").get();
        await syncStudentReposicaoCounters(uid,snap.docs.map(d=>({id:d.id,...d.data()})));
      }catch(e){}
      if(diarioIsPresence(statusNow)&&(patch.licaoId||patch.licaoNum)){
        const trilhaItemId=patch.licaoId||lessonIdFromNum(parseInt(patch.licaoNum,10),course);
        if(trilhaItemId&&!String(trilhaItemId).includes("report-card")){
          const trilhaPatch={};
          trilhaPatch[`trilha.${trilhaItemId}.status`]="concluida";
          if(patch.date)trilhaPatch[`trilha.${trilhaItemId}.date`]=patch.date;
          try{await db.collection("students").doc(uid).update(trilhaPatch);}catch(e){}
        }
      }
      notifySaveSuccess("Diário salvo!");
    }catch(e){notifySaveError(e.message||"Erro ao salvar diário");}
    finally{setSavingId("");}
  }
  function onSelectLesson(entryId,lessonId){
    const opt=lessonOptions.find(o=>o.id===lessonId);
    if(!opt)return;
    patchDraft(entryId,{licaoId:opt.id,licaoNum:opt.num,licaoTitulo:opt.title||opt.label});
    setOpenContentId(entryId);
  }
  async function deleteEntry(id){
    if(!confirm("Remover esta aula?"))return;
    if(String(id).startsWith("new-")){
      setLocalNew(prev=>prev.filter(e=>e.id!==id));
      setDrafts(prev=>{const n={...prev};delete n[id];return n;});
      setDirty(prev=>{const n={...prev};delete n[id];return n;});
      return;
    }
    try{
      await db.collection("students").doc(uid).collection("diario").doc(id).delete();
      setDrafts(prev=>{const n={...prev};delete n[id];return n;});
      setDirty(prev=>{const n={...prev};delete n[id];return n;});
      notifySaveSuccess("Aula removida.");
    }catch(e){notifySaveError(e.message||"Erro ao remover");}
  }
  if(!entries)return null;
  const stats=computeDiarioStats([...(entries||[]),...localNew]);
  const iS={background:"var(--input-bg)",border:"1px solid var(--input-border)",color:"var(--font)",borderRadius:8,padding:"4px 8px",fontSize:12,outline:"none",fontFamily:"'Outfit',sans-serif"};

  if(!isAdmin){
    return(
      <div className="space-y-4">
        <div className="glass rounded-2xl p-4 diario-grid">
          {[
            {n:stats.realizadas,l:"presenças"},
            {n:stats.ausentes,l:"ausências/faltas"},
            {n:stats.paraRepor,l:"para repor",color:"#e8a94c"},
            {n:stats.semRepor,l:"sem repor"},
            {n:stats.repFeitas,l:"reposições feitas",color:"#3ecf8e"},
            {n:stats.repVencidas,l:"reposições vencidas",color:"#e5636b"},
          ].map((s,i)=>(
            <div key={i}><div style={{fontSize:18,fontWeight:800,color:s.color||"var(--font)"}}>{s.n}</div><div className="text-xs muted">{s.l}</div></div>
          ))}
        </div>
        {displayEntries.length===0?<div className="glass rounded-2xl p-8 text-center muted">Nenhuma aula lançada ainda.</div>:(
          <div className="space-y-2">{displayEntries.map(e=>{
            const st=normalizeDiarioStatus(e);
            const ds=dStatusMap[st]||dStatusMap[e.status]||{cls:"",label:st};
            const dateLabel=e.reposicaoVence&&diarioNeedsReposicao(st)?`vence em ${formatDateBR(e.reposicaoVence).slice(0,5)}`:formatDateBR(e.date).slice(0,5);
            return(
              <div key={e.id} className="glass rounded-xl px-4 py-3 flex justify-between items-center gap-3">
                <div>
                  <div className="text-sm font-semibold">Aula {e.num} · {dateLabel}</div>
                  <div className="text-xs muted">{e.licaoTitulo||(e.licaoNum?`Lição ${e.licaoNum}`:"—")}</div>
                  {e.ocorrido?<div className="text-xs muted mt-1">Ocorrido: {e.ocorrido}</div>:null}
                </div>
                <span className={"diario-badge "+ds.cls}>{ds.label}</span>
              </div>
            );
          })}</div>
        )}
      </div>
    );
  }

  return(
    <div><div className="glass rounded-2xl p-5">
      <div className="flex items-center justify-between gap-3 flex-wrap mb-5">
        <div><h3 className="text-lg font-bold flex items-center gap-2"><Icon name="book-open" size={18} style={{color:'rgba(44,122,142,1)'}}/>Diário de Aulas</h3>
          <p className="text-xs muted mt-1">Preencha a entrada e clique em <strong>Salvar</strong> para gravar. Alterações só entram no Firebase após salvar.</p>
        </div>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={addEntry}><Icon name="plus" size={16}/> Nova Aula</button>
      </div>
      {displayEntries.length===0?<div className="text-center py-12 muted"><p>Nenhuma aula lançada ainda.</p></div>:(
        <div className="space-y-4">{displayEntries.map(e=>{
          const st=normalizeDiarioStatus(e);
          const ds=dStatusMap[st]||DIARIO_STATUS_SELECT[0];
          const opt=lessonOptions.find(o=>o.id===e.licaoId)||lessonOptions.find(o=>o.num===e.licaoNum);
          const showContent=openContentId===e.id;
          const needsSave=!!dirty[e.id]||!!e._isNew;
          const isSaving=savingId===e.id;
          return(
            <div key={e.id} className="rounded-2xl p-4" style={{border:needsSave?"1.5px solid rgba(180,83,9,.55)":"1px solid var(--divider)",background:"var(--badge)"}}>
              <div className="flex flex-wrap gap-3 items-start">
                <div className="num-aula inline-flex flex-col items-center" style={{minWidth:56}}><span className="text-xs opacity-70">Aula</span><span style={{fontWeight:800,fontSize:18}}>{e.num}</span></div>
                <div style={{flex:1,minWidth:200}}>
                  {needsSave&&<div className="text-xs font-semibold mb-2" style={{color:"#b45309"}}>{e._isNew?"Nova entrada — ainda não salva":"Alterações não salvas"}</div>}
                  <div className="grid gap-2" style={{gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))"}}>
                    <label className="text-xs muted">Data<input type="date" className="input-light mt-1 w-full" value={e.date||""} onChange={ev=>patchDraft(e.id,{date:ev.target.value})}/></label>
                    <label className="text-xs muted">Lição realizada
                      <select className="ds-select mt-1 w-full" value={e.licaoId||""} onChange={ev=>onSelectLesson(e.id,ev.target.value)}>
                        <option value="">— selecionar —</option>
                        {lessonOptions.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
                      </select>
                    </label>
                    <label className="text-xs muted">Status
                      <select className="ds-select mt-1 w-full" value={st} onChange={ev=>patchDraft(e.id,{status:ev.target.value})}>
                        {DIARIO_STATUS_SELECT.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                      </select>
                    </label>
                  </div>
                  <div className="mt-2"><span className={"diario-badge "+ds.cls}>{ds.label}</span>
                    {opt&&<button type="button" className="text-xs ml-3" style={{color:"rgba(44,122,142,1)"}} onClick={()=>setOpenContentId(showContent?null:e.id)}>{showContent?"Ocultar conteúdo":"Ver conteúdo da lição"}</button>}
                  </div>
                  {showContent&&opt&&(
                    <div className="mt-3 rounded-xl p-3 text-xs" style={{background:"var(--input-bg)",border:"1px solid var(--input-border)"}}>
                      <div><strong>{opt.title||opt.label}</strong></div>
                      {opt.tema?<div className="muted mt-1">Tema: {opt.tema}</div>:null}
                      {opt.objetivos?<div className="muted mt-1">Objetivos: {opt.objetivos}</div>:null}
                      <div className="flex flex-wrap gap-2 mt-2">
                        {opt.linkAula?<a className="btn rounded-lg px-2 py-1" href={resolvePortalAssetUrl(opt.linkAula)} target="_blank" rel="noreferrer">Lição</a>:null}
                        {opt.linkTarefa?<a className="btn rounded-lg px-2 py-1" href={resolvePortalAssetUrl(opt.linkTarefa)} target="_blank" rel="noreferrer">Tarefa</a>:null}
                        {opt.linkMaterial?<a className="btn rounded-lg px-2 py-1" href={resolvePortalAssetUrl(opt.linkMaterial)} target="_blank" rel="noreferrer">PDF</a>:null}
                      </div>
                    </div>
                  )}
                  <label className="text-xs muted block mt-3">Ocorrido
                    <textarea className="obs-input mt-1 w-full" rows={2} value={e.ocorrido||""} onChange={ev=>patchDraft(e.id,{ocorrido:ev.target.value})} placeholder="O que ocorreu na aula"/>
                  </label>
                  <label className="text-xs muted block mt-2">Anotações
                    <textarea className="obs-input mt-1 w-full" rows={2} value={e.obs||""} onChange={ev=>patchDraft(e.id,{obs:ev.target.value})} placeholder="Anotações do professor"/>
                  </label>
                  <div className="flex gap-2 mt-3 flex-wrap">
                    <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" disabled={!needsSave||isSaving} onClick={()=>saveEntry(e.id)}>
                      <Icon name="save" size={14}/>{isSaving?"Salvando…":"Salvar"}
                    </button>
                    {needsSave&&!e._isNew&&(
                      <button type="button" className="btn rounded-xl px-3 py-2 text-sm" onClick={()=>{
                        setDrafts(prev=>{const n={...prev};delete n[e.id];return n;});
                        setDirty(prev=>{const n={...prev};delete n[e.id];return n;});
                      }}>Descartar</button>
                    )}
                  </div>
                </div>
                <button className="btn btn-danger rounded-lg px-2.5 py-2" onClick={()=>deleteEntry(e.id)}><Icon name="trash-2" size={14}/></button>
              </div>
            </div>
          );
        })}</div>
      )}
    </div></div>
  );
}

function FinanceiroStrip({financeiro,onGoToFinanceiro,compact}){
  const parcelas=financeiro?.parcelas||[];
  const {current,next,isLate,allPaid,sorted}=resolveFinanceSnapshot(parcelas);
  const statusLabel=isLate?"EM ATRASO":allPaid||current?"EM DIA":"—";
  const statusCls=isLate?"fin-vencida":"fin-paga";
  return(
    <div className="glass rounded-2xl p-4" style={{cursor:onGoToFinanceiro?"pointer":"default"}} onClick={onGoToFinanceiro}>
      <div className="flex justify-between items-center mb-2">
        <span className="detail-label" style={{margin:0}}>Financeiro</span>
        {onGoToFinanceiro&&<span className="text-xs" style={{color:"rgba(44,122,142,1)"}}>Ver completo ↗</span>}
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        {sorted.length>0&&<span className={"fin-badge "+statusCls}>{statusLabel}</span>}
        {current?.dataVencimento&&<span className="text-xs muted">{current.mes||formatMonthDay(current.dataVencimento)} · vence <strong style={{color:"var(--font)"}}>{formatDateBR(current.dataVencimento).slice(0,5)}</strong></span>}
        {next?.dataVencimento&&<span className="text-xs muted">Próximo: <strong style={{color:"var(--font)"}}>{formatMonthDay(next.dataVencimento)}</strong></span>}
        {sorted.length===0&&!compact&&<span className="text-xs muted">Sem lançamentos cadastrados</span>}
      </div>
    </div>
  );
}

  const parcelas=financeiro?.parcelas||[];

  const todayStr=getTodayISO();
  const sorted=useMemo(()=>[...parcelas].sort((a,b)=>(a.dataVencimento||"").localeCompare(b.dataVencimento||"")),[parcelas]);
  const {isLate,allPaid}=useMemo(()=>resolveFinanceSnapshot(parcelas),[parcelas,todayStr]);
  const pagas=sorted.filter(p=>getEffectiveParcelStatus(p,todayStr)==="paga").length;

  return(
    <div className="space-y-4">
      <div className="fin-hero fin-hero-glow">
        <div style={{position:"relative",zIndex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:44,height:44,borderRadius:14,background:"linear-gradient(135deg,rgba(30,143,168,.35),rgba(20,95,122,.2))",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Icon name="wallet" size={22} style={{color:"#5eead4"}}/>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:800,letterSpacing:".12em",opacity:.65}}>SEU CONTRATO</div>
              <div style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800}}>Financeiro</div>
            </div>
          </div>
          <div className="fin-summary-strip">
            <span className="fin-summary-pill">{sorted.length} parcela{sorted.length!==1?"s":""}</span>
            <span className="fin-summary-pill" style={{borderColor:isLate?"rgba(200,60,80,.4)":"rgba(30,160,110,.4)",color:isLate?"#f0909a":"#60daa8"}}>{allPaid?"Tudo em dia":isLate?"Em atraso":"Em dia"}</span>
            <span className="fin-summary-pill">{pagas} paga{pagas!==1?"s":""}</span>
          </div>
        </div>
      </div>

      {tipo==="creditos"&&creditosTotal>0&&(
        <div className="glass rounded-2xl p-5">
          <div className="flex items-center justify-between">
            <div><h3 className="font-bold text-base">Seus Créditos</h3><p className="muted text-sm">{creditosUsados} usados de {creditosTotal}</p></div>
            <div className="text-center"><div className="text-3xl font-extrabold" style={{color:"rgba(44,122,142,1)"}}>{creditosRestantes}</div><div className="text-xs muted">restantes</div></div>
          </div>
          <div className="mt-3 h-2 rounded-full overflow-hidden" style={{background:"var(--badge)"}}>
            <div className="h-full rounded-full progress-fill" style={{width:Math.round((creditosUsados/creditosTotal)*100)+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/>
          </div>
        </div>
      )}

      {sorted.length===0?(
        <div className="glass rounded-2xl p-12 text-center">
          <Icon name="credit-card" size={40} className="mx-auto mb-4 opacity-30"/>
          <p className="muted text-sm">Nenhum pagamento cadastrado ainda.</p>
        </div>
      ):(
        <div className="space-y-3">
          {sorted.map((p,idx)=>{
            const effStatus=getEffectiveParcelStatus(p,todayStr);
            const fs=finStatusMap[effStatus]||FIN_STATUS[3];
            const isPaid=effStatus==="paga";
            const cardCls=isPaid?"fin-pay-card-paid":effStatus==="vencida"?"fin-pay-card-late":"fin-pay-card-open";
            const valor=getParcelValor(p);
            return(
              <div key={p.id} className={"fin-pay-card "+cardCls} style={{animationDelay:idx*60+"ms"}}>
                <div className="fin-pay-head">
                  <div>
                    <div className="fin-pay-mes">{p.mes||`Parcela ${idx+1}`}</div>
                    {p.dataVencimento&&<div className="text-xs muted mt-1">Vencimento: {formatDateBR(p.dataVencimento)}</div>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <span className={"fin-badge "+fs.cls}>{fs.label}</span>
                    {valor>0&&<div className="fin-pay-val" style={{marginTop:8}}>{formatCurrency(valor)}</div>}
                  </div>
                </div>
                <div className="fin-pay-meta">
                  {p.valor>0&&p.valorDesconto>0&&<div className="fin-pay-meta-item">Valor original: <strong>{formatCurrency(p.valor)}</strong></div>}
                  {isPaid&&p.dataPagamento&&<div className="fin-pay-meta-item">Pago em: <strong>{formatDateBR(p.dataPagamento)}</strong></div>}
                </div>
                <div className="fin-pay-actions">
                  {isPaid?(
                    p.comprovante
                      ?<a href={p.comprovante} target="_blank" rel="noreferrer" className="fin-btn-comprovante"><Icon name="file-text" size={14}/> Comprovante</a>
                      :<span className="fin-btn-comprovante fin-btn-disabled"><Icon name="file-text" size={14}/> Comprovante</span>
                  ):(
                    p.boletoPix
                      ?<a href={p.boletoPix} target="_blank" rel="noreferrer" className="fin-btn-boleto"><Icon name="qr-code" size={14}/> Boleto ou Pix</a>
                      :<span className="fin-btn-boleto fin-btn-disabled"><Icon name="qr-code" size={14}/> Boleto ou Pix</span>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function FinanceiroSection({uid,isAdmin,financeiro}){
  if(!isAdmin)return <StudentFinanceView financeiro={financeiro}/>;
  const [tipo,setTipoLocal]=useState(financeiro?.tipo||"mensalidade");
  const [creditosTotal,setCredTotal]=useState(financeiro?.creditosTotal||0);
  const [creditosUsados,setCredUsados]=useState(financeiro?.creditosUsados||0);
  const [parcelas,setParcelas]=useState(()=>Array.isArray(financeiro?.parcelas)?financeiro.parcelas.map(p=>({...p})):[]);
  const [savingKey,setSavingKey]=useState("");
  useEffect(()=>{
    setTipoLocal(financeiro?.tipo||"mensalidade");
    setCredTotal(financeiro?.creditosTotal||0);
    setCredUsados(financeiro?.creditosUsados||0);
    setParcelas(Array.isArray(financeiro?.parcelas)?financeiro.parcelas.map(p=>({...p})):[]);
  },[financeiro]);
  const creditosRestantes=creditosTotal-creditosUsados;
  const sorted=[...parcelas].sort((a,b)=>(a.dataVencimento||"").localeCompare(b.dataVencimento||""));
  function patchLocal(id,field,val){
    setParcelas(prev=>prev.map(p=>{
      if(p.id!==id)return p;
      const u={...p,[field]:val};
      if(field==="status"&&val==="paga"&&!u.dataPagamento)u.dataPagamento=getTodayISO();
      return u;
    }));
  }
  async function saveContratoTipo(){
    setSavingKey("tipo");
    try{
      await db.collection("students").doc(uid).update({
        "financeiro.tipo":tipo,
        "financeiro.creditosTotal":parseInt(creditosTotal)||0,
        "financeiro.creditosUsados":parseInt(creditosUsados)||0,
      });
      notifySaveSuccess("Tipo de contrato / créditos salvos!");
    }catch(e){notifySaveError(e.message||"Erro ao salvar");}
    finally{setSavingKey("");}
  }
  async function addParcela(){
    const nova={id:Date.now().toString(),mes:"",valor:0,valorDesconto:0,status:"em_aberto",dataVencimento:"",comprovante:"",boletoPix:"",dataPagamento:""};
    setParcelas(prev=>[...prev,nova]);
  }
  async function saveParcela(id){
    const p=parcelas.find(x=>x.id===id);
    if(!p)return;
    setSavingKey("p_"+id);
    try{
      const next=parcelas.map(x=>x.id===id?p:x);
      await db.collection("students").doc(uid).update({"financeiro.parcelas":next});
      await upsertInvoiceFromParcela(uid,p);
      notifySaveSuccess("Parcela salva!");
    }catch(e){notifySaveError(e.message||"Erro ao salvar parcela");}
    finally{setSavingKey("");}
  }
  async function deleteParcela(id){
    if(!confirm("Remover esta parcela do contrato do aluno?"))return;
    setSavingKey("del_"+id);
    try{
      const next=parcelas.filter(p=>p.id!==id);
      setParcelas(next);
      await db.collection("students").doc(uid).update({"financeiro.parcelas":next});
      notifySaveSuccess("Parcela removida.");
    }catch(e){notifySaveError(e.message||"Erro ao remover");}
    finally{setSavingKey("");}
  }
  return(
    <div className="space-y-4">
      <div className="glass rounded-2xl p-5">
        <h3 className="font-bold text-base mb-3 flex items-center gap-2">
          <Icon name="dollar-sign" size={16} style={{color:'rgba(44,122,142,1)'}}/>
          Tipo de Contrato
        </h3>
        <div className="flex gap-2 mb-4">
          <button type="button" onClick={()=>setTipoLocal("mensalidade")} className={"sbtn "+(tipo==="mensalidade"?"sbtn-concluida":"sbtn-off")}>Mensalidade</button>
          <button type="button" onClick={()=>setTipoLocal("creditos")} className={"sbtn "+(tipo==="creditos"?"sbtn-andamento":"sbtn-off")}>Créditos</button>
        </div>
        {tipo==="creditos"&&<div className="grid grid-cols-2 gap-4 mb-3">
          <div><div className="detail-label">Total de Créditos</div><input type="number" min={0} className="input-light mt-1" value={creditosTotal} onChange={e=>setCredTotal(parseInt(e.target.value)||0)}/></div>
          <div><div className="detail-label">Créditos Usados</div><input type="number" min={0} className="input-light mt-1" value={creditosUsados} onChange={e=>setCredUsados(parseInt(e.target.value)||0)}/></div>
        </div>}
        <div className="save-bar">
          <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={saveContratoTipo} disabled={savingKey==="tipo"}>
            <Icon name="save" size={14}/>{savingKey==="tipo"?"Salvando…":"Salvar tipo / créditos"}
          </button>
        </div>
      </div>
      {tipo==="creditos"&&creditosTotal>0&&<div className="chip rounded-2xl p-4 flex items-center justify-between"><span className="text-sm font-semibold">Créditos Restantes</span><span className="fin-badge fin-creditos" style={{fontSize:13}}>{creditosRestantes} de {creditosTotal}</span></div>}
      <div className="glass rounded-2xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-base flex items-center gap-2">
            <Icon name="credit-card" size={16} style={{color:'rgba(44,122,142,1)'}}/>
            {tipo==="creditos"?"Lançamentos":"Parcelas do Contrato"}
          </h3>
          <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={addParcela}><Icon name="plus" size={14}/> Adicionar</button>
        </div>
        {sorted.length===0?<div className="text-center py-8 muted"><Icon name="credit-card" size={28} className="mx-auto mb-2 opacity-30"/><p className="text-sm">Nenhum lançamento cadastrado ainda.</p></div>:(
          <div className="space-y-3">{sorted.map(p=>{const fs=finStatusMap[p.status]||FIN_STATUS[3];return(
            <div key={p.id} className="chip rounded-2xl p-4" style={{borderColor:fs.cls.includes("fin-")?"":undefined}}>
              <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                <span className={"fin-badge "+fs.cls}>{fs.label}</span>
                <div style={{display:"flex",gap:8}}>
                  <button type="button" className="btn btn-primary rounded-lg px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1.5" onClick={()=>saveParcela(p.id)} disabled={savingKey==="p_"+p.id}>
                    <Icon name="save" size={12}/>{savingKey==="p_"+p.id?"Salvando…":"Salvar"}
                  </button>
                  <button type="button" className="btn btn-danger rounded-lg px-3 py-1.5 text-xs inline-flex items-center gap-1.5" onClick={()=>deleteParcela(p.id)}><Icon name="trash-2" size={12}/> Remover</button>
                </div>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div><div className="detail-label">Mês / Referência</div><input className="input-light mt-1" placeholder="Ex: Abril 2026" value={p.mes||""} onChange={e=>patchLocal(p.id,"mes",e.target.value)}/></div>
                <div><div className="detail-label">Vencimento</div><input type="date" className="input-light mt-1" value={p.dataVencimento||""} onChange={e=>patchLocal(p.id,"dataVencimento",e.target.value)}/></div>
                <div><div className="detail-label">Status</div><select className="ds-select mt-1" value={p.status||"em_aberto"} onChange={e=>patchLocal(p.id,"status",e.target.value)}>{FIN_STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></div>
                <div><div className="detail-label">Valor (R$)</div><input type="number" step="0.01" min="0" className="input-light mt-1" value={p.valor||0} onChange={e=>patchLocal(p.id,"valor",parseFloat(e.target.value)||0)}/></div>
                <div><div className="detail-label">Com Desconto (R$)</div><input type="number" step="0.01" min="0" className="input-light mt-1" value={p.valorDesconto||0} onChange={e=>patchLocal(p.id,"valorDesconto",parseFloat(e.target.value)||0)}/></div>
                <div><div className="detail-label">Data Pagamento</div><input type="date" className="input-light mt-1" value={p.dataPagamento||""} onChange={e=>patchLocal(p.id,"dataPagamento",e.target.value)}/></div>
                <div className="sm:col-span-2"><div className="detail-label">Boleto ou Pix (Link)</div><input type="url" className="input-light mt-1" placeholder="https://..." value={p.boletoPix||""} onChange={e=>patchLocal(p.id,"boletoPix",e.target.value)}/></div>
                <div className="sm:col-span-2"><div className="detail-label">Comprovante (Link)</div><input type="url" className="input-light mt-1" placeholder="https://drive.google.com/..." value={p.comprovante||""} onChange={e=>patchLocal(p.id,"comprovante",e.target.value)}/></div>
              </div>
            </div>);
          })}</div>
        )}
      </div>
    </div>
  );
}

function AdminFinanceiroDashboard({students,onBack,onSelectStudent}){
  const [monthKey,setMonthKey]=useState(()=>getMonthKey(new Date()));
  const [filtroStatus,setFiltroStatus]=useState("ativo");
  const [busca,setBusca]=useState("");
  const [kpiDetail,setKpiDetail]=useState(null); // null | 'revenue' | 'outstanding' | 'overdue'
  const [openChargesMonth,setOpenChargesMonth]=useState(()=>getMonthKey(new Date()));
  const [showVerPorAluno,setShowVerPorAluno]=useState(false);
  const [buscaPagante,setBuscaPagante]=useState("");
  const [despesasPorMes,setDespesasPorMes]=useState({});
  const [despesasFixas,setDespesasFixas]=useState([]);
  const [fixasPagasPorMes,setFixasPagasPorMes]=useState({});
  const chartRef=useRef(null);
  const chartInstance=useRef(null);

  const DESPESAS_LS_KEY="fluency_studio_despesasPorMes";
  const FIXAS_LS_KEY="fluency_studio_despesasFixas";
  const FIXAS_PAGAS_LS_KEY="fluency_studio_despesasFixasPagas";
  function readLocalPorMes(){try{return JSON.parse(localStorage.getItem(DESPESAS_LS_KEY)||"{}")||{};}catch(e){return{};}}
  function readLocalFixas(){try{const v=JSON.parse(localStorage.getItem(FIXAS_LS_KEY)||"[]");return Array.isArray(v)?v:[];}catch(e){return[];}}
  function normalizeFixasPagas(raw){
    if(!raw||typeof raw!=="object")return{};
    const out={};
    Object.keys(raw).forEach(mk=>{
      const v=raw[mk];
      if(Array.isArray(v)){const map={};v.forEach(id=>{if(id)map[id]=true;});out[mk]=map;}
      else if(v&&typeof v==="object")out[mk]={...v};
    });
    return out;
  }
  function readLocalFixasPagas(){try{return normalizeFixasPagas(JSON.parse(localStorage.getItem(FIXAS_PAGAS_LS_KEY)||"{}"));}catch(e){return{};}}

  useEffect(()=>{
    setDespesasPorMes(readLocalPorMes());
    setDespesasFixas(readLocalFixas());
    setFixasPagasPorMes(readLocalFixasPagas());
    (async()=>{
      try{
        const snap=await db.collection("users").doc(ADMIN_UID).get();
        if(snap.exists){
          const data=snap.data()||{};
          if(data.despesasPorMes)setDespesasPorMes(prev=>({...prev,...data.despesasPorMes}));
          if(Array.isArray(data.despesasFixas))setDespesasFixas(data.despesasFixas);
          if(data.despesasFixasPagasPorMes)setFixasPagasPorMes(normalizeFixasPagas(data.despesasFixasPagasPorMes));
        }
      }catch(e){}
    })();
  },[]);

  // Fonte única: parcelas reais dos alunos (evita cobranças fantasma da coleção invoices)
  const built=useMemo(()=>buildFinanceFromStudents(students),[students]);
  const effectiveInvoices=built.invoices;
  const effectiveTransactions=built.transactions;

  const kpis=useMemo(()=>computeFinanceKpis(effectiveInvoices,effectiveTransactions,monthKey),[effectiveInvoices,effectiveTransactions,monthKey]);
  const isCurrentMonth=monthKey===getMonthKey(new Date());
  const vigencyMonthKey=getMonthKey(new Date());

  // Cobranças em aberto: ordenadas por vencimento; UI mostra mês vigente + links dos outros meses
  const unpaidByMonth=useMemo(()=>{
    const map={};
    effectiveInvoices.filter(i=>i.status!=="paid").forEach(inv=>{
      const mk=inv.dueDate?String(inv.dueDate).slice(0,7):vigencyMonthKey;
      if(!map[mk])map[mk]=[];
      map[mk].push(inv);
    });
    Object.keys(map).forEach(mk=>{
      map[mk].sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
    });
    return map;
  },[effectiveInvoices,vigencyMonthKey]);
  const unpaidMonthKeys=useMemo(()=>{
    const keys=Object.keys(unpaidByMonth).sort((a,b)=>b.localeCompare(a));
    if(!keys.includes(vigencyMonthKey))keys.unshift(vigencyMonthKey);
    return keys;
  },[unpaidByMonth,vigencyMonthKey]);
  const openChargesShown=unpaidByMonth[openChargesMonth]||[];
  const otherUnpaidMonths=unpaidMonthKeys.filter(mk=>mk!==openChargesMonth&&(unpaidByMonth[mk]||[]).length>0);

  // Ativos com cobranças cadastradas (pagantes)
  const alunosPagantes=useMemo(()=>{
    return(students||[]).filter(s=>{
      const st=(s.status||normalizeStatus(null,s));
      if(st!=="ativo")return false;
      const parcelas=(s.financeiro?.parcelas||[]).filter(p=>getParcelValor(p)>0);
      return parcelas.length>0;
    }).sort((a,b)=>getShortName(a.name).localeCompare(getShortName(b.name),"pt-BR"));
  },[students]);
  const alunosPagantesFiltrados=useMemo(()=>{
    if(!buscaPagante.trim())return alunosPagantes;
    const q=buscaPagante.toLowerCase();
    return alunosPagantes.filter(s=>(s.name||"").toLowerCase().includes(q)||(s.email||"").toLowerCase().includes(q));
  },[alunosPagantes,buscaPagante]);

  const expensesByMonth=useMemo(()=>{
    const out={};
    Object.keys(despesasPorMes||{}).forEach(mk=>{
      const arr=despesasPorMes[mk]||[];
      out[mk]=(out[mk]||0)+arr.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
    });
    Object.keys(fixasPagasPorMes||{}).forEach(mk=>{
      const map=fixasPagasPorMes[mk]||{};
      const sum=(despesasFixas||[]).reduce((s,d)=>s+(map[d.id]?parseFloat(d.valor)||0:0),0);
      out[mk]=(out[mk]||0)+sum;
    });
    return out;
  },[despesasPorMes,despesasFixas,fixasPagasPorMes]);

  const cashFlow=useMemo(()=>computeCashFlowSeries(effectiveTransactions,expensesByMonth),[effectiveTransactions,expensesByMonth]);

  useEffect(()=>{
    if(!chartRef.current||typeof Chart==="undefined")return;
    if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}
    const labels=cashFlow.months.map(mk=>{
      const[y,m]=mk.split("-");
      return MESES_CURTOS[parseInt(m,10)-1]+"/"+String(y).slice(2);
    });
    chartInstance.current=new Chart(chartRef.current,{
      type:"bar",
      data:{
        labels,
        datasets:[
          {label:"Recebido no mês",data:cashFlow.revenue,backgroundColor:"rgba(21,128,61,0.75)",borderRadius:6},
          {label:"Despesas",data:cashFlow.expenses,backgroundColor:"rgba(185,28,28,0.65)",borderRadius:6},
        ],
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{labels:{color:"#1E1E1E",font:{family:"Inter, sans-serif",size:12}}},
          tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+": "+formatCurrency(ctx.parsed.y)}},
        },
        scales:{
          x:{ticks:{color:"#475569"},grid:{color:"#E2E8F0"}},
          y:{ticks:{color:"#475569",callback:(v)=>"R$ "+v},grid:{color:"#E2E8F0"}},
        },
      },
    });
    return()=>{if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}};
  },[cashFlow]);

  const recentTx=useMemo(()=>{
    return[...effectiveTransactions].sort((a,b)=>{
      const da=toJsDate(a.date)?.getTime()||0;
      const db=toJsDate(b.date)?.getTime()||0;
      return db-da;
    }).slice(0,10);
  },[effectiveTransactions]);

  const studentsByStatus=useMemo(()=>filterStudentsByStatus(students,filtroStatus),[students,filtroStatus]);
  const contadores=useMemo(()=>getAdminStatusCounts(students),[students]);
  const alunosFiltrados=useMemo(()=>{
    let list=studentsByStatus;
    if(!busca.trim())return list;
    const q=busca.toLowerCase();
    return list.filter(s=>(s.name||"").toLowerCase().includes(q)||(s.email||"").toLowerCase().includes(q));
  },[studentsByStatus,busca]);

  const detailTitle=kpiDetail==="revenue"
    ?"Recebido em "+formatMonthYear(monthKey)
    :kpiDetail==="outstanding"?"Saldos em aberto (por quê)"
    :kpiDetail==="overdue"?"Valores em atraso (por quê)"
    :"";
  const detailRows=kpiDetail==="revenue"?kpis.revenueItems
    :kpiDetail==="outstanding"?kpis.outstandingItems
    :kpiDetail==="overdue"?kpis.overdueItems
    :[];
  const detailTotal=kpiDetail==="revenue"?kpis.revenueMonth
    :kpiDetail==="outstanding"?kpis.outstanding
    :kpiDetail==="overdue"?kpis.overdue
    :0;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:20}}>
        <div>
          <button className="btn rounded-xl px-4 py-2 text-sm inline-flex items-center gap-2 mb-3" onClick={onBack}>
            <Icon name="arrow-left" size={14}/> Voltar ao Painel
          </button>
          <h2 style={{fontSize:22,fontWeight:800,color:"#1E1E1E",margin:0,fontFamily:"var(--ds-font)"}}>Financeiro da Escola</h2>
          <p style={{fontSize:13,color:"#475569",marginTop:4}}>
            Fonte: <strong>parcelas cadastradas em cada aluno</strong> (valor &gt; 0). Sem cobranças fantasma.
          </p>
        </div>
        <div className="fin-month-nav" style={{margin:0}}>
          <button type="button" className="fin-month-btn" onClick={()=>setMonthKey(shiftMonthKey(monthKey,-1))} aria-label="Mês anterior"><Icon name="chevron-left" size={18}/></button>
          <div className="fin-month-label" style={{minWidth:160}}>{formatMonthYear(monthKey)}{!isCurrentMonth&&<div style={{fontSize:11,fontWeight:600,opacity:.55}}>outro mês</div>}</div>
          <button type="button" className="fin-month-btn" onClick={()=>setMonthKey(shiftMonthKey(monthKey,1))} disabled={isCurrentMonth} style={{opacity:isCurrentMonth?0.4:1}} aria-label="Próximo mês"><Icon name="chevron-right" size={18}/></button>
        </div>
      </div>

      <div className="premium-card" style={{marginBottom:16,background:"#EFF6FF",borderColor:"#BFDBFE"}}>
        <p style={{fontSize:13,color:"#1e3a8a",margin:0,lineHeight:1.5}}>
          <strong>Como editar:</strong> clique no aluno abaixo (ou na linha da fatura) → aba Financeiro → edite/remova parcelas.
          Os números dos cards vêm só do que está cadastrado ali, com valor maior que zero.
        </p>
      </div>

      <button
        type="button"
        className="premium-card"
        onClick={()=>{setShowVerPorAluno(true);setBuscaPagante("");}}
        style={{marginBottom:16,width:"100%",textAlign:"left",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,borderColor:"#BFDBFE",background:"linear-gradient(135deg,#F8FAFC,#EFF6FF)"}}
      >
        <div style={{display:"flex",alignItems:"center",gap:14,minWidth:0}}>
          <div style={{width:44,height:44,borderRadius:12,background:"#0F172A",color:"#fff",display:"grid",placeItems:"center",flexShrink:0}}>
            <Icon name="users" size={20}/>
          </div>

function computeDiarioStats(entries){
  const now=new Date();
  let realizadas=0,ausentes=0,paraRepor=0,semRepor=0,repFeitas=0,repVencidas=0;
  (entries||[]).forEach(e=>{
    const s=normalizeDiarioStatus(e);
    if(s==="presenca"){realizadas++;}
    else if(s==="ausencia_com_reposicao"){ausentes++;paraRepor++;}
    else if(s==="adequacao_com_reposicao"){
      // Adequação: gera reposição (30 dias) sem contar nas gratuitas do contrato
      const due=e.reposicaoVence?new Date(e.reposicaoVence):null;
      if(due&&due<now)repVencidas++;else paraRepor++;
    }
    else if(s==="falta_aluno_com_reposicao"){
      ausentes++;
      const due=e.reposicaoVence?new Date(e.reposicaoVence):null;
      if(due&&due<now)repVencidas++;else paraRepor++;
    }
    else if(s==="falta_aluno_sem_reposicao"){ausentes++;semRepor++;}
    else if(s==="falta_professor"){ausentes++;}
    else if(e.status==="rep_feita"){repFeitas++;realizadas++;}
    else if(e.status==="rep_vencida"){repVencidas++;}
    else if(e.status==="a_repor"){
      const due=e.reposicaoVence?new Date(e.reposicaoVence):null;
      if(due&&due<now)repVencidas++;else paraRepor++;
    }
  });
  return{realizadas,ausentes,paraRepor,semRepor,repFeitas,repVencidas};
}

function MiniDonut({pct,color,size=48}){
  const r=17,circ=2*Math.PI*r,offset=circ-(Math.min(Math.max(pct,0),100)/100)*circ;
  return(
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",flexShrink:0}} aria-hidden="true">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--sd-donut-track)" strokeWidth={5}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={5} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"/>
    </svg>
  );
}

function StudentDashboard({uid,profile,trilhaData,financeiro,schedule,onNavigate,modulosOcultos}){
  const courses=useCourses();
  const course=useMemo(()=>getCourseById(profile?.contrato),[courses,profile?.contrato]);
  const books=useMemo(()=>mergeBooks(trilhaData,course),[trilhaData,course]);
  const currentMod=useMemo(()=>getCurrentModule(books,modulosOcultos),[books,modulosOcultos]);
  const currentBook=useMemo(()=>{
    if(isModuleHidden(modulosOcultos,currentMod))return books.find(b=>!isModuleHidden(modulosOcultos,b.bookIdx));
    return books.find(b=>b.bookIdx===currentMod);
  },[books,currentMod,modulosOcultos]);

  const licoesConcluidas=useMemo(()=>{

    let c=0;books.forEach(b=>b.items.forEach(i=>{if(i.tarefaFeita)c++;}));return c;
  },[books]);
  const totalLicoes=getTotalLicoes(course)||books.reduce((s,b)=>s+b.items.length,0)||1;
  const progressGeral=Math.round((licoesConcluidas/totalLicoes)*100);

  const [diarioStats,setDiarioStats]=useState({paraRepor:0});
  const [repoCounters,setRepoCounters]=useState({aFazer:0,vencidas:0});
  useEffect(()=>db.collection("students").doc(uid).collection("diario").onSnapshot(snap=>{
    const entries=snap.docs.map(d=>({id:d.id,...d.data()}));
    setDiarioStats(computeDiarioStats(entries));
    const today=new Date().toISOString().slice(0,10);
    setRepoCounters(computeReposicaoCounters(entries,today));
    syncStudentReposicaoCounters(uid,entries);

  const showPresence=typeof shouldShowPresenceConfirm==="function"&&shouldShowPresenceConfirm(schedule);

  return(
    <div className="student-dash">
      {showPresence&&(
        <button type="button" className="glass rounded-2xl p-4 w-full text-left mb-1" style={{border:"1px solid rgba(20,184,166,.45)"}} onClick={()=>onNavigate("presenca")}>

        {profile.foto
          ?<img src={profile.foto} alt="" className="sd-avatar"/>

        }
        <div className="sd-greeting-text">
          <div className="sd-hello">Hello,</div>
          <div className="sd-name" title={getFullName(profile.name)}>{getFirstName(profile.name)}</div>
        </div>
      </div>

      {/* Card 2 — Resultado (lições, tarefas, reposições em um único card) */}
      <StudentStatsCard licoesConcluidas={licoesConcluidas} tarefasFeitas={tarefasFeitas} paraRepor={repoCounters.aFazer||diarioStats.paraRepor} totalLicoes={totalLicoes}/>

      {/* Card 3 — Financeiro (Em dia/Atrasado + vencimento + Ver completo) */}
      <StudentFinanceCard financeiro={financeiro} onGo={()=>onNavigate("financeiro")}/>

      {/* Card 4 — Ícones-link (carrossel horizontal) */}
      <div className="sd-card-light">
        <div className="sd-scroll">
          {STUDENT_NAV.map(nav=>(
            <button key={nav.id} type="button" className="sd-nav-carousel" onClick={()=>onNavigate(nav.id)} title={nav.label}>
              <CosmicSectionImage meta={nav} className="sd-nav-icon"/>
              <div className="sd-nav-label">{nav.label}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Card 5 — resumo compacto da Constellation Journey */}
      {currentBook&&(
        <div className="cosmic-card">
          <div className="cosmic-card-head">
            <div>
              <div className="cosmic-card-title"><span><Icon name="route" size={17}/></span>Sua Trilha</div>
              <div className="cosmic-card-course">{course?.nome||"Seu curso"} · Módulo {currentMod}</div>
            </div>
            <div className="cosmic-card-progress"><strong>{progressGeral}%</strong>concluído</div>
          </div>
          <div className="cosmic-card-route">
            {currentBook.items.filter(it=>it.type!=="report_card"&&it.lessonType!=="report_card"&&!it.reportCard).map((item,idx)=>{
              const isReview=item.type==="review"||item.lessonType==="review";
              const isOutput=item.lessonType==="output";
              const sc=statusClassForLesson(item);
              const locked=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento");
              const label=getLessonDisplayLabel(item);
              const statusText=sc==="active"?"Atual":sc.indexOf("done")===0?"Concluída":"Pendente";
              const shiftPattern=[9,-7,11,-2,12,3];
              return(
                <div key={item.id} className={"cosmic-card-node "+(sc==="active"?"active":"")} style={{"--cosmic-card-shift":shiftPattern[idx%shiftPattern.length]+"px"}}>
                  <button
                    type="button"
                    className={"cosmic-card-orb "+sc+(locked?" locked":"")}
                    onClick={()=>{if(locked)return;playClickSound("open");onNavigate("trilha",item.id);}}
                    title={locked?"Lição bloqueada":("Lição "+label+", "+statusText)}
                  >
                    <span className="cosmic-orb-asset" aria-hidden="true"/>
                    <span className="cosmic-orb-copy">
                      <span className="cosmic-orb-kicker">Lição</span>
                      <span className="cosmic-orb-num">{label}</span>
                      <span className="cosmic-orb-status">{statusText}</span>
                    </span>
                  </button>
                </div>
              );
            })}

          <div className="cosmic-card-foot">
            <span className="cosmic-card-note">Cada lição acende um novo ponto da sua jornada.</span>
            <button type="button" className="cosmic-card-open" onClick={()=>onNavigate("trilha")}>Ver trilha <Icon name="arrow-right" size={15}/></button>
          </div>
        </div>
      )}
    </div>
  );
}

function hasPocketFlipbook(profile){
  const name=(profile?.name||profile?.nome||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const email=(profile?.email||"").toString().toLowerCase();
  if(/fonseca/.test(name) || email.includes("victorfonseca")) return false;
  const isTorifo=email.includes("victor9251") || (/\bvictor\b/.test(name) && /torifo/.test(name));
  const isAnderson=email.includes("andersonferreira") || (/\banderson\b/.test(name) && /ferreira/.test(name));
  return isTorifo || isAnderson;
}
function hasObjectiveFlipbook(profile){
  // Course-scoped: every student enrolled in Proficiency FF (now or future) gets the book in Materiais.
  const contrato=resolveContratoId(profile?.contrato||profile?.courseId||profile?.curso||"");
  if(contrato==="proficiency_ff") return true;
  // Legacy allow-list (kept as fallback if contrato field is missing on old profiles)
  const name=(profile?.name||profile?.nome||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const email=(profile?.email||"").toString().toLowerCase();
  return email.includes("thamie@") || /\bthamie\b/.test(name);
}
function hasReflectiveFlipbook(profile){
  const contrato=resolveContratoId(profile?.contrato||profile?.courseId||profile?.curso||"");
  if(contrato==="speech_b") return true;
  const name=(profile?.name||profile?.nome||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const email=(profile?.email||"").toString().toLowerCase();
  // fallback name cues
  return /reflective|reflexive/.test(name) || email.includes("reflective") || email.includes("reflexive");
}
function studentFlipbook(profile){
  if(hasReflectiveFlipbook(profile)) return {src:"flips/books/reflexive-mind-m1/index.html?embed=1", title:"Reflexive Mind — Módulo 1"};
  if(hasPocketFlipbook(profile)) return {src:"flips/books/pocket-mod2/index.html?embed=1", title:"Pocket Fluency — Módulo 2"};
  if(hasObjectiveFlipbook(profile)) return {src:"flips/books/objective-proficiency/index.html?embed=1", title:"Objective Proficiency — Units 1–3"};
  return null;
}
const POCKET_FLIP_SRC="flips/books/pocket-mod2/index.html?embed=1";

}

  const [openMod,setOpenMod]=useState(visibleModules[0]?.id||1);
  const [openLesson,setOpenLesson]=useState(null);

  async function updateModuloPdf(modId,url){
    await db.collection("students").doc(uid).update({[`materiais.mod${modId}.pdfCompleto`]:url});
  }

  return(
    <div className="space-y-3">
      {visibleModules.map(mod=>{
        const book=books.find(b=>b.bookIdx===mod.id);
        const pdfUrl=materiaisData?.[`mod${mod.id}`]?.pdfCompleto||"";
        const isOpen=openMod===mod.id;

              {(pdfUrl||isAdmin)&&(
                isAdmin
                  ?<div className="glass rounded-xl p-3"><div className="detail-label">Material Completo — PDF (Impressão)</div><input type="url" className="input-light mt-1" placeholder="https://" value={pdfUrl} onChange={e=>updateModuloPdf(mod.id,e.target.value)}/></div>
                  :pdfUrl&&<a href={pdfUrl} target="_blank" rel="noreferrer" className="btn rounded-xl px-4 py-3 block font-semibold text-sm" style={{background:"rgba(0,217,192,.06)",borderColor:"rgba(0,217,192,.3)"}}>📕 Material Completo — PDF (Impressão)</a>
              )}
              <div className="text-xs muted uppercase tracking-wide px-1">{nLicoes} lições do módulo</div>
              {book?.items.map(item=>{
                const urlLicao=resolvePortalAssetUrl(item.linkAula||"");
                const urlTarefa=resolvePortalAssetUrl(item.linkTarefa||"");
                const urlExtra=resolvePortalAssetUrl(item.linkExtra||"");
                const urlPdf=resolvePortalAssetUrl(item.linkMaterial||item.link||"");
                const urlGravacao=resolvePortalAssetUrl(item.linkGravacao||"");
                const urlRelatorio=resolvePortalAssetUrl(item.linkRelatorio||"");

                return(
                  <div key={item.id}>
                    <button type="button" className="glass rounded-xl px-4 py-3 w-full text-left flex justify-between items-center" onClick={()=>setOpenLesson(isExp?null:item.id)}>
                      <span className="text-sm font-semibold" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

                      {urlExtra&&<a href={urlExtra} target="_blank" rel="noreferrer" className="btn rounded-lg py-2 text-xs text-center">✨ Extra</a>}

function RingChart({ label, value, max, pct, color, icon, onClick }) {
  const r = 32, circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <button className="glass rounded-2xl p-4 text-center w-full btn" onClick={onClick} style={{cursor:'pointer'}}>
      <div style={{position:'relative',width:80,height:80,margin:'0 auto 8px'}}>
        <svg width={80} height={80} style={{transform:'rotate(-90deg)'}}>
          <circle cx={40} cy={40} r={r} fill="none" stroke="var(--badge)" strokeWidth={6}/>
          <circle cx={40} cy={40} r={r} fill="none" stroke={color} strokeWidth={6}
            strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="round" style={{transition:'stroke-dashoffset 600ms ease'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontSize:16,fontWeight:800,color:'var(--font)'}}>{pct}%</span>
        </div>
      </div>
      <div className="font-semibold text-xs" style={{color:'var(--font)'}}>{label}</div>
      <div className="muted text-xs mt-0.5">{value} de {max}</div>
    </button>
  );
}

function StatCard({ icon, iconColor, label, value, onClick }) {
  return (
    <button className="glass rounded-2xl p-4 text-left w-full btn" onClick={onClick} style={{cursor:'pointer'}}>
      <div style={{
        width:36,height:36,borderRadius:10,display:'flex',alignItems:'center',
        justifyContent:'center',background:iconColor+'22',marginBottom:8
      }}>
        <Icon name={icon} size={18} style={{color:iconColor}}/>
      </div>
      <div style={{fontSize:22,fontWeight:800,color:'var(--font)'}}>{value}</div>
      <div className="muted text-xs mt-0.5">{label}</div>
    </button>
  );
}
