function OverviewSection({ uid, profile, trilhaData, financeiro, onGoToTab, hideGreeting=false }) {
  const courses = useCourses();
  const course = useMemo(() => getCourseById(profile?.contrato), [courses, profile?.contrato]);
  const books = useMemo(() => mergeBooks(trilhaData, course), [trilhaData, course]);

  const licoesConcluidas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (i.status === "concluida" || i.status === "realizada") count++;
    }));
    return count;
  }, [books]);

  const totalLicoes = getTotalLicoes(course) || books.reduce((s,b)=>s+b.items.length,0) || 1;

  const tarefasFeitas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (!i.isReview && i.tarefaFeita) count++;
    }));
    return count;
  }, [books]);

  const [diarioStats, setDiarioStats] = useState({ realizadas: 0, paraRepor: 0 });
  useEffect(() => {
    return db.collection("students").doc(uid).collection("diario")
      .onSnapshot(snap => {
        const stats = computeDiarioStats(snap.docs.map(d => d.data()));
        setDiarioStats({ realizadas: stats.realizadas, paraRepor: stats.paraRepor });
      });
  }, [uid]);

  const progressGeral = Math.round((licoesConcluidas / totalLicoes) * 100);
  const progressTarefas = licoesConcluidas > 0
    ? Math.round((tarefasFeitas / licoesConcluidas) * 100)
    : 0;

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
  const hoje = getTodayPT();
  const hojeDisplay = hoje.charAt(0).toUpperCase() + hoje.slice(1);

  return (
    <div className="space-y-4">
      {/* Saudação só para o aluno (admin não vê) */}
      {!hideGreeting&&(
        <div className="glass rounded-2xl p-5">
          <p className="muted text-sm">{saudacao} 👋</p>
          <h2 className="text-2xl font-extrabold mt-1" style={{fontFamily:"'Sora',sans-serif"}}>
            {getFirstName(profile?.name)}
          </h2>
          {getFullName(profile?.name)!==getFirstName(profile?.name)&&(
            <p className="muted text-sm mt-1" style={{wordBreak:"break-word"}}>{getFullName(profile?.name)}</p>
          )}
          <p className="muted text-xs mt-1">{hojeDisplay}</p>
        </div>
      )}

      {/* Ring charts de progresso */}
      <div className="grid grid-cols-2 gap-3">
        <RingChart
          label="Lições Concluídas"
          value={licoesConcluidas}
          max={totalLicoes}
          pct={progressGeral}
          color="#1e8fa8"
          icon="check-circle"
          onClick={() => onGoToTab("trilha")}
        />
        <RingChart
          label="Tarefas Entregues"
          value={tarefasFeitas}
          max={licoesConcluidas || 1}
          pct={progressTarefas}
          color="#7c5cbf"
          icon="file-check"
          onClick={() => onGoToTab("trilha")}
        />
      </div>

      {/* Cards de estatística */}
      <div className="grid grid-cols-2 gap-3">
        <StatCard
          icon="calendar-check"
          iconColor="#22c55e"
          label="Aulas Realizadas"
          value={diarioStats.realizadas}
          onClick={() => onGoToTab("diario")}
        />
        <StatCard
          icon="user-x"
          iconColor="#f59e0b"
          label="Reposições a Fazer"
          value={diarioStats.paraRepor}
          onClick={() => onGoToTab("diario")}
        />
      </div>

      {/* Banner Financeiro no Overview */}
      {financeiro && (
        <div style={{marginTop:4}}>
          <FinanceiroStrip financeiro={financeiro} onGoToFinanceiro={()=>onGoToTab("financeiro")}/>
        </div>
      )}

      {/* Barra de progresso geral */}
      <div className="glass rounded-2xl p-5">
        <div className="flex justify-between text-sm mb-2">
          <span className="font-semibold">Progresso Geral</span>
          <span className="muted">{licoesConcluidas} / {totalLicoes} lições</span>
        </div>
        <div style={{height:8,borderRadius:99,background:'var(--badge)',overflow:'hidden'}}>
          <div style={{
            height:'100%',
            borderRadius:99,
            width: progressGeral + '%',
            background:'linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))',
            transition:'width 600ms ease'
          }}/>
        </div>
        <p className="muted text-xs mt-2 text-right">{progressGeral}% concluído</p>
      </div>

      {/* Atalhos rápidos */}
      <div className="glass rounded-2xl p-5">
        <h3 className="font-bold mb-3 flex items-center gap-2">
          <Icon name="zap" size={15} style={{color:'rgba(44,122,142,1)'}}/>
          Acesso Rápido
        </h3>
        <div className="grid grid-cols-2 gap-2">
          {[
            { id:"trilha",     icon:"map",        label:"Trilha",     color:"#1e8fa8" },
            { id:"materiais",  icon:"file-text",  label:"Materiais",  color:"#5b9be8" },
            { id:"diario",     icon:"book-open",  label:"Diário",     color:"#7c5cbf" },
            { id:"financeiro", icon:"dollar-sign",label:"Financeiro", color:"#22c55e" },
          ].map(a => (
            <button
              key={a.id}
              className="btn rounded-2xl p-4 text-left"
              onClick={() => onGoToTab(a.id)}
              style={{display:'flex',flexDirection:'column'}}
            >
              <Icon name={a.icon} size={20} style={{color:a.color,marginBottom:6}}/>
              <div className="font-semibold text-sm">{a.label}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const IVI_RULES_REPOSICAO_STUDENT=`**Reposições — regras com calma e clareza**

Use **Agenda** ou **Reposições** no menu. Não há mais link externo de Google Calendar.

**Quando nasce o direito**
• **Falta do aluno com reposição** (ou ausência com reposição) → +1 reposição a fazer, válida por **30 dias corridos**. Depois disso, vai para “vencidas”.
• **Falta do professor** → +1 reposição a fazer, **sem prazo de validade**.

**Status no diário da falta**
• **PENDENTE** → ainda precisa agendar  
• **AGENDADO** → horário marcado  
• **REPOSIÇÃO FEITA** → concluída (sai do contador “a fazer”)

**Como agendar**
1. Em Agenda/Reposições, toque em **Agendar Reposição** (só aparece se houver reposição válida).
2. Escolha a falta que deseja repor.
3. O sistema mostra **apenas horários vagos** da agenda do professor.
4. Ao confirmar, o status daquela falta passa para **AGENDADO**.

**Confirmação no dia da aula**
No dia, o portal pede confirmação de presença. Aviso importante: **reposição só é liberada se a ausência for informada com pelo menos 3 horas de antecedência e se ainda houver reposição gratuita do seu contrato**. Se faltar esse prazo ou as gratuitas já tiverem acabado, a ausência é registrada **sem** direito a reposição.

**Quantas gratuitas tenho?**  
O número acompanha suas **aulas semanais** cadastradas no contrato (ex.: 2x/semana → 2 gratuitas). Em caso de dúvida no seu caso específico, fale com o Victor.`;

const IVI_RULES_REPOSICAO_ADMIN=`**Reposições e Agenda — procedimento admin**

**Cadastro do aluno:** em **aulas semanais**, cada aula (dia + horário) conta. O sistema grava \`reposicoesGratuitasContrato\` = quantidade dessas aulas. Isso limita o direito na confirmação de ausência (regra das 3h + saldo de gratuitas).

**Diário → direito a repor**
• \`falta_aluno_com_reposicao\` / \`ausencia_com_reposicao\` → validade 30 dias (consome gratuita do contrato)  
• \`adequacao_com_reposicao\` → **Adequação com reposição**: gera reposição gratuita com 30 dias, **não** consome a cota de gratuitas; se não repor a tempo, perde normalmente  
• \`falta_professor\` → sem validade  
• Fluxo do aluno: selecionar falta → horário vago → status **PENDENTE → AGENDADO → REPOSIÇÃO FEITA**

**Não usar Google Calendar** no portal. Eventos manuais: botão **Agendar** na própria Agenda admin.`;

const IVI_RULES_FALE=`**Avaliação F/A/L/E (0 a 100%)**

• **F — Fluência Oral**  
• **A — Compreensão Auditiva**  
• **L — Leitura**  
• **E — Escrita**

Valores de 0 a 100. Formatos antigos (revisão / atingiu / superou) ainda são lidos, mas o padrão atual é percentual.

**Como entra no Report Card do módulo**
• **F** e **A**: usam só a média do **diário** (peso 100% diário).  
• **L (Leitura)**: **80% tarefa** + **20% diário**.  
• **E (Escrita)**: **50% tarefa** + **50% diário**.  

Se faltar um dos lados (só diário ou só tarefa), o sistema usa o que existir. O aluno vê um gráfico vertical moderno das competências; o admin monta/consulta em **Relatórios → Por aluno → Report Card**.`;

const IVI_RULES_RELATORIOS_ADMIN=`**Relatórios (somente admin)**

• **Por curso** — módulos, âncoras de Report Card e alunos vinculados.  
• **Por período** — consolidado de presença e atividade no intervalo.

O Report Card usa as notas F/A/L/E e os pesos (F/A 100% diário; L 80% tarefa + 20% diário; E 50/50). Na trilha, o card “Report Card” é âncora estrutural do módulo — a consulta completa fica em Relatórios.`;

  if(mode==="admin")return "Olá, Victor. Sou a **iVi**. Estou atualizada com Agenda (calendário interno), Reposições, aulas semanais → gratuitas do contrato, Diário F/A/L/E, Relatórios/Report Card e Materiais/flipbooks. Em que posso ajudar, com calma?";
  return "Olá. Sou a **iVi**, sua assistente no portal. Posso ensinar Trilha, Materiais, Diário, Agenda, Reposições, Financeiro e as regras de reposição — com calma e clareza. Se quiser, peça o **tutorial do portal**.";
}

function iviQuickChips(mode){
  if(mode==="visitor")return["Como me matricular?","Aula demonstrativa","Quais os cursos?","Falar com Victor"];
  if(mode==="admin")return["Tutorial admin","Regras de reposição","Report Card FALE","Calendário principal"];
  return["Tutorial do portal","Como agendar reposição","O que é FALE","Materiais / livro"];
}

function iviRespond(question,mode){
  const q=question.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let best=null,bestScore=0;
  IVI_KB.forEach(entry=>{
    if(!entry.audience.includes(mode)&&!entry.audience.includes("all"))return;
    let score=0;
    entry.keys.forEach(k=>{
      const kn=k.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(q.includes(kn))score+=kn.length;
    });
    if(score>bestScore){bestScore=score;best=entry;}
  });
  if(best&&bestScore>0)return best.answer;
  if(/^(oi|olá|ola|hey|bom dia|boa tarde|boa noite|hi|hello)$/i.test(q.trim()))return iviWelcome(mode);
  if(mode==="visitor")return `Não tenho essa resposta completa aqui. Para matrícula, valores e plano personalizado, o Victor atende com calma pelo WhatsApp: ${WPP_SITE}. Se quiser, posso falar de cursos, método PEH 5.0 ou aula demonstrativa.`;
  if(mode==="student")return `Ainda não tenho essa resposta específica — e não acesso seus dados individuais (notas, valores ou datas particulares). Posso orientar sobre **tutorial**, **Agenda/Reposições**, **FALE**, **Materiais** ou **Trilha**. Para o seu caso concreto: ${WPP_VICTOR}.`;
  return "Ainda não tenho essa resposta específica. Posso detalhar **Agenda principal**, **reposição**, **Report Card/FALE**, **Diário**, **Relatórios** ou o **tutorial admin**. É só dizer o tema.";
}

  const closeIvi=useCallback(()=>setOpen(false),[]);
  useEscapeKey(closeIvi,open);

  useEffect(()=>{
    if(open&&messagesEndRef.current)messagesEndRef.current.scrollIntoView({behavior:"smooth"});
  },[messages,open]);
  useEffect(()=>{
    if(open&&inputRef.current){
      try{inputRef.current.focus({preventScroll:true});}catch(e){}
    }
  },[open]);

  useEffect(()=>{
    if(mode==="student"&&!localStorage.getItem("fs-ivi-hint")){
      localStorage.setItem("fs-ivi-hint","1");
    }
  },[mode]);

  function reply(text){
    setLoading(true);
    setTimeout(()=>{
      setMessages(prev=>[...prev,{role:"assistant",content:iviRespond(text,mode)}]);
      setLoading(false);
    },350+Math.random()*300);
  }

  function sendMessage(textOverride){
    const text=(textOverride||input).trim();
    if(!text||loading)return;
    setMessages(prev=>[...prev,{role:"user",content:text}]);
    setInput("");
    reply(text);
  }

  function handleKey(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
  }

  return(
    <>
      {open&&(
        <div className="ivictor-panel" style={{width:320,maxHeight:"70vh",display:"flex",flexDirection:"column"}}>
          <div className="ivictor-header">
            <div className="ivictor-avatar">
              {imgOk
                ?<img src={IVI_PHOTO} alt="iVi" className="w-full h-full object-cover" loading="lazy" decoding="async" onError={()=>setImgOk(false)}/>
                :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff"}}>iVi</div>
              }
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>iVi</div>
              <div style={{fontSize:11,color:"rgba(234,242,247,.75)"}}>Assistente calma · Fluency Studio</div>
            </div>
            <button type="button" className="btn btn-bar" style={{marginLeft:"auto",padding:"8px",borderRadius:8,minWidth:40,minHeight:40}} onClick={closeIvi} aria-label="Fechar iVi">
              <Icon name="x" size={14}/>
            </button>
          </div>
          <div className="ivi-quick-chips">
            {chips.map(c=><button key={c} type="button" className="ivi-chip" onClick={()=>sendMessage(c)}>{c}</button>)}
          </div>
          <div className="ivictor-body" style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:8,minHeight:0}}>
            {messages.map((msg,i)=>(
              <div key={i} style={{display:"flex",justifyContent:msg.role==="user"?"flex-end":"flex-start"}}>
                <div style={{
                  maxWidth:"82%",padding:"9px 13px",fontSize:13,lineHeight:1.55,whiteSpace:"pre-wrap",
                  borderRadius:msg.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",
                  background:msg.role==="user"?"linear-gradient(135deg,#1e8fa8,#145f7a)":"rgba(30,143,168,.12)",
                  border:msg.role==="user"?"none":"1px solid rgba(30,143,168,.22)",
                  color:msg.role==="user"?"#fff":"var(--font)",
                }}>{msg.content}</div>
              </div>
            ))}
            {loading&&(
              <div style={{display:"flex",justifyContent:"flex-start"}}>
                <div style={{padding:"9px 16px",borderRadius:"12px 12px 12px 3px",background:"rgba(30,143,168,.12)",border:"1px solid rgba(30,143,168,.22)",display:"flex",gap:4}}>
                  {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"rgba(44,122,142,.7)",animation:`bounce 1.2s ease infinite ${i*0.2}s`}}/>)}
                </div>
              </div>
            )}
            <div ref={messagesEndRef}/>
          </div>
          <div className="ivictor-footer">
            <input ref={inputRef} className="input" style={{flex:1,borderRadius:10,padding:"10px 12px"}} placeholder="Pergunte à iVi..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey} disabled={loading} enterKeyHint="send" aria-label="Mensagem para iVi"/>
            <button type="button" className="btn btn-primary" style={{padding:"10px 12px",borderRadius:10,flexShrink:0,minWidth:44,minHeight:44}} onClick={()=>sendMessage()} disabled={loading||!input.trim()} aria-label="Enviar">
              <Icon name="send" size={14}/>
            </button>
          </div>
        </div>
      )}
      <button type="button" className="ivictor-btn" onClick={()=>setOpen(o=>!o)} title="iVi — Assistente" aria-label="Abrir assistente iVi" aria-expanded={open}>
        {imgOk
          ?<img src={IVI_PHOTO} alt="iVi" className="w-full h-full object-cover" loading="lazy" decoding="async" onError={()=>setImgOk(false)}/>
          :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:"#fff",fontFamily:"'Sora',sans-serif"}}>iVi</div>
        }
      </button>
    </>
  );
}

// ── StudentDetail com todas as modificações ────────────────────────────────
function StudentDetail({uid,isAdmin,onBack,initialTab}){
  const courses=useCourses();
  const [profile,setProfile]=useState(null);
  const [links,setLinks]=useState([]);
  const [trilhaData,setTrilhaData]=useState({});
  const [materiaisData,setMateriaisData]=useState({});
  const [financeiro,setFinanceiro]=useState(null);
  const [modulosOcultos,setModulosOcultos]=useState([]);
  const [studentSchedule,setStudentSchedule]=useState(null);
  useEffect(()=>{ if(uid) installExerciseBridge(uid); },[uid]);
  // Estado inicial a partir da URL (refresh / deep link / botão voltar)
  const [activeTab,setActiveTab]=useState(()=>{
    if(isAdmin){
      const r=parsePortalRoute();
      if(r.role==="admin"&&r.view==="student"&&r.studentUid===uid&&r.tab)return r.tab;
      return initialTab||"overview";
    }
    return initialTab||"overview";
  });
  const [studentPage,setStudentPage]=useState(()=>{
    if(isAdmin)return"dashboard";
    const r=parsePortalRoute();
    if(r.role==="student"&&STUDENT_PAGES.includes(r.page))return r.page;
    return"dashboard";
  });
  const [focusLessonId,setFocusLessonId]=useState(()=>{
    if(isAdmin)return null;
    const r=parsePortalRoute();
    return(r.role==="student"&&r.page==="trilha"&&r.lessonId)?r.lessonId:null;
  });

  const navigateStudent=useCallback((page,lessonId,opts)=>{
    const p=STUDENT_PAGES.includes(page)?page:"dashboard";
    const lid=(p==="trilha"&&lessonId)?lessonId:null;
    setStudentPage(p);
    setFocusLessonId(lid);
    if(!isAdmin){
      portalGo({role:"student",page:p,view:null,studentUid:null,tab:null,lessonId:lid},opts||{});
    }
  },[isAdmin]);

  const goStudentBack=useCallback(()=>{
    // Mesmo comportamento do botão voltar do browser/SO: usa a pilha de histórico
    if(studentPage==="dashboard"&&!focusLessonId)return;
    try{
      if(window.history.state&&window.history.state.portal){
        history.back();
        return;
      }
    }catch(e){}
    // Fallback (refresh mid-navegação sem state): sobe na hierarquia
    if(studentPage==="trilha"&&focusLessonId){
      navigateStudent("trilha",null,{replace:true});
      return;
    }
    navigateStudent("dashboard",null,{replace:true});
  },[studentPage,focusLessonId,navigateStudent]);

  // Sync com botão voltar do browser / refresh / bfcache
  const onPortalRoute=useCallback((route)=>{
    if(isAdmin){
      if(route.role==="admin"&&route.view==="student"){
        if(route.studentUid&&route.studentUid!==uid){
          // Outro aluno no histórico — devolve ao admin shell
          if(onBack)onBack(route);
          return;
        }
        if(route.tab&&ADMIN_STUDENT_TABS.includes(route.tab))setActiveTab(route.tab);
      }else if(route.role==="admin"&&route.view!=="student"){
        if(onBack)onBack(route);
      }
      return;
    }
    // aluno
    if(route.role==="admin")return; // ignora rotas admin no portal do aluno
    const page=STUDENT_PAGES.includes(route.page)?route.page:"dashboard";
    setStudentPage(page);
    setFocusLessonId((page==="trilha"&&route.lessonId)?route.lessonId:null);
  },[isAdmin,uid,onBack]);
  usePortalRouteListener(onPortalRoute);

  // Garante URL base ao montar (aluno) e restaura se vazio
  useEffect(()=>{
    if(isAdmin){
      // Admin ficha do aluno: sincroniza URL se ainda não estiver nela
      const r=parsePortalRoute();
      if(!(r.role==="admin"&&r.view==="student"&&r.studentUid===uid)){
        portalGo({role:"admin",view:"student",studentUid:uid,tab:activeTab||initialTab||"overview",page:null,lessonId:null},{replace:true});
      }
      return;
    }
    const r=parsePortalRoute();
    if(!location.hash||location.hash==="#"||r.role==="admin"){
      portalEnsureBase({role:"student",page:studentPage||"dashboard",view:null,studentUid:null,tab:null,lessonId:focusLessonId});
    }else if(r.role==="student"||!r.role){
      // alinha sessionStorage
      persistPortalRoute({role:"student",page:studentPage,view:null,studentUid:null,tab:null,lessonId:focusLessonId});
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[uid,isAdmin]);

  const setActiveTabNav=useCallback((tab)=>{
    setActiveTab(tab);
    if(isAdmin){
      portalGo({role:"admin",view:"student",studentUid:uid,tab:tab||"overview",page:null,lessonId:null},{});
    }
  },[isAdmin,uid]);
  useScrollActiveTab(isAdmin?activeTab:null);

  // Admin: pré-visualizar portal exatamente como o aluno vê
  const [viewAsStudent,setViewAsStudent]=useState(false);
  useEffect(()=>{setViewAsStudent(false);},[uid]);
  const showStudentUi=!isAdmin||viewAsStudent;
  function enterViewAsStudent(){
    setStudentPage("dashboard");
    setFocusLessonId(null);
    setViewAsStudent(true);
    try{window.scrollTo(0,0);}catch(e){}
  }
  function exitViewAsStudent(){
    setViewAsStudent(false);
    setStudentPage("dashboard");
    setFocusLessonId(null);
    try{window.scrollTo(0,0);}catch(e){}
  }

  // Após troca de página interna, sobe e foca o main (leitores de tela + teclado)
  useEffect(()=>{
    if(isAdmin&&!viewAsStudent)return;
    const main=document.getElementById("portal-main");
    if(main){
      try{main.focus({preventScroll:true});}catch(e){}
    }
  },[studentPage,isAdmin,viewAsStudent]);

  const [showFullProfile,setShowFullProfile]=useState(false);
  const [profileErr,setProfileErr]=useState("");
  const [fullStudent,setFullStudent]=useState(null);

  useEffect(()=>{
    if(!uid){setProfileErr("ID do aluno inválido.");return;}
    const ref=db.collection("students").doc(uid);
    let cancelled=false;
    const t=setTimeout(()=>{
      if(!cancelled)setProfileErr(prev=>prev||"Conexão lenta. Aguarde ou recarregue com Ctrl+Shift+R.");
    },12000);
    if(isAdmin){
      ref.get().then(doc=>{
        if(!doc.exists)ref.set({
          name:"Aluno",level:"A1",program:"Fluency Studio",coach:"Victor Gomes",
          profession:"",birthday:"",foto:"",email:"",phone:"",status:"lead",
          contrato:"foundation_general",
          links:[],trilha:{},materiais:{},financeiro:FINANCEIRO_DEFAULT,modulosOcultos:[],
        });
      }).catch(()=>{});
    }
    const unsub=ref.onSnapshot(doc=>{
      if(cancelled)return;
      if(doc.exists){
        const n=normalizeStudent(uid,doc.data());
        setFullStudent(n);
        setProfile({
          uid:n.uid,name:n.name,level:n.level,program:n.program,coach:n.coach,
          profession:n.profession,birthday:n.birthday,foto:n.foto,email:n.email,phone:n.phone,status:n.status,
          contrato:n.contrato||"",
        });
        setLinks(n.links);
        setTrilhaData(n.trilha);
        setMateriaisData(n.materiais);
        setFinanceiro(n.financeiro);
        setModulosOcultos(n.modulosOcultos);
        setStudentSchedule({
          dataInicio:n.dataInicio||"",diasAulas:n.diasAulas||[],horarioAulas:n.horarioAulas||"",
          calendarioCompleto:n.calendarioCompleto||[],calendarioResumo:n.calendarioResumo||null,
          program:n.program||"",licaoInicio:n.licaoInicio||1,contrato:n.contrato||"",
        });
        setProfileErr("");
      }else{
        if(isAdmin){
          setProfile(null);
          setFullStudent(null);
          setProfileErr("Cadastro removido ou não encontrado.");
          if(onBack)setTimeout(()=>onBack(),400);
        }else{
          setProfileErr("Seu perfil ainda não foi encontrado. Se você já é aluno, fale com o Victor no WhatsApp para vincular sua conta.");
        }
      }
    },err=>{
      console.error("StudentDetail snapshot:",err);
      if(!cancelled)setProfileErr("Erro ao carregar perfil. Recarregue a página ou fale com o professor.");
    });
    return()=>{cancelled=true;clearTimeout(t);unsub();};
  },[uid,isAdmin,onBack]);

  const course=useMemo(()=>getCourseById(profile?.contrato),[courses,profile?.contrato]);
  const modMeta=useMemo(()=>buildModuleMeta(course),[course]);
  const books=useMemo(()=>mergeBooks(trilhaData,course),[trilhaData,course]);
  const currentMod=useMemo(()=>getCurrentModule(books,modulosOcultos),[books,modulosOcultos]);
  const currentModMeta=modMeta.find(m=>m.id===currentMod)||modMeta[0];
  function calcAge(bday){if(!bday)return null;const[y,m,d]=bday.split("-").map(Number);const today=new Date();let age=today.getFullYear()-y;if(today.getMonth()+1<m||(today.getMonth()+1===m&&today.getDate()<d))age--;return age;}
  if(profileErr&&!profile)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm" style={{color:"#f0a0a8"}}>{profileErr}</p>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 mt-4 text-sm font-semibold" onClick={()=>window.location.reload()}>Recarregar</button>
      </div>
    </div>
  );
  if(!profile)return <LoadingScreen/>;
  const age=calcAge(profile.birthday);
  const courseName=getCourseLabel(profile.contrato);

  const adminTabs=[
    {id:"overview",   label:"Início",     icon:"home"},
    {id:"trilha",     label:"Trilha",     icon:"map"},
    {id:"materiais",  label:"Materiais",  icon:"file-text"},
    {id:"diario",     label:"Diário",     icon:"book-open"},
    {id:"reportcard", label:"Report Card",icon:"file-check"},
    {id:"financeiro", label:"Financeiro", icon:"dollar-sign"},
    {id:"recursos",   label:"Recursos",   icon:"link"},
  ];

  const pageTitles={trilha:"Trilha",materiais:"Materiais",diario:"Diário",reportcard:"Report Card",agenda:"Agenda",reposicoes:"Reposições",calendario:"Agenda",contato:"Contato",agendamento:"Reposições",financeiro:"Financeiro",presenca:"Confirmar aula"};

  function renderStudentPage(){
    if(studentPage==="dashboard")return <StudentDashboard uid={uid} profile={profile} trilhaData={trilhaData} financeiro={financeiro} schedule={studentSchedule} onNavigate={navigateStudent} modulosOcultos={modulosOcultos}/>;
    const sectionId=studentPage==="calendario"?"agenda":studentPage==="agendamento"?"reposicoes":studentPage==="presenca"?"agenda":studentPage;
    const sectionMeta=STUDENT_NAV.find(item=>item.id===sectionId)||null;
    const sectionTitle=pageTitles[studentPage]||studentPage;
    return(
      <div className="student-section-page" style={{"--section-accent":sectionMeta?.color||"#38bdf8"}}>
        {sectionMeta&&<CosmicSectionImage meta={sectionMeta} className="student-section-watermark"/>}
        <div className="student-section-content">
        <button type="button" className="page-back" onClick={goStudentBack}><Icon name="arrow-left" size={16}/> Voltar</button>
        <StudentSectionHero meta={sectionMeta} title={sectionTitle}/>
        {studentPage==="trilha"&&(
          <TrilhaSection
            uid={uid}
            isAdmin={false}
            focusLessonId={focusLessonId}
            onLessonFocused={()=>navigateStudent("trilha",null,{replace:true})}
            onOpenLesson={(lessonId)=>navigateStudent("trilha",lessonId,{})}
            contrato={profile.contrato}
          />
        )}
        {studentPage==="materiais"&&<MateriaisSection uid={uid} isAdmin={false} profile={profile} trilhaData={trilhaData} materiaisData={materiaisData} modulosOcultos={modulosOcultos} contrato={profile.contrato}/>}
        {studentPage==="diario"&&<DiarioSection uid={uid} isAdmin={false} contrato={profile.contrato}/>}
        {studentPage==="reportcard"&&<StudentReportCardsSection uid={uid} profile={profile} contrato={profile.contrato} isAdmin={false}/>}
        {studentPage==="financeiro"&&<FinanceiroSection uid={uid} isAdmin={false} financeiro={financeiro||FINANCEIRO_DEFAULT} />}
        {(studentPage==="agenda"||studentPage==="calendario")&&(
          <StudentAgendaPage uid={uid} profile={profile} trilhaData={trilhaData} financeiro={financeiro||FINANCEIRO_DEFAULT} schedule={studentSchedule} onNavigate={navigateStudent}/>
        )}
        {(studentPage==="reposicoes"||studentPage==="agendamento")&&(
          <StudentReposicoesPage uid={uid} financeiro={financeiro||FINANCEIRO_DEFAULT}/>
        )}
        {studentPage==="presenca"&&(
          <PresenceConfirmPage uid={uid} profile={profile} schedule={studentSchedule} trilhaData={trilhaData} financeiro={financeiro||FINANCEIRO_DEFAULT} onDone={()=>navigateStudent("agenda")}/>
        )}
        {studentPage==="contato"&&(
          <div className="space-y-3">
            <PendingPage icon="💬" title="Contato"/>
            <a href={WPP_VICTOR} target="_blank" rel="noreferrer" className="btn btn-primary rounded-xl px-4 py-3 block text-center font-semibold">WhatsApp — Victor</a>
          </div>
        )}
        </div>
      </div>
    );
  }

  const studentDisplayName=getFullName(profile.name||profile.nome||"Aluno");

  return(
    <div className={"min-h-screen pb-20"+(showStudentUi?" student-universe":"")}>
      <LogoBar
        onBack={isAdmin?(viewAsStudent?exitViewAsStudent:(onBack||null)):null}
        isAdmin={isAdmin&&!viewAsStudent}
        showLogout={true}
      />
      {isAdmin&&viewAsStudent&&(
        <div className="view-as-banner" role="status" aria-live="polite">
          <Icon name="eye" size={18}/>
          <span className="view-as-label">Vendo como</span>
          <strong title={studentDisplayName}>{studentDisplayName}</strong>
          <button type="button" className="view-as-banner-btn" onClick={exitViewAsStudent}>
            <Icon name="x" size={14}/> Sair da visão do aluno
          </button>
        </div>
      )}
      {isAdmin&&!viewAsStudent&&(
        <div style={{background:"#1E293B",color:"#CBD5E1",padding:"10px 16px",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
          <span className="role-pill role-pill-admin">Admin</span>
          <span>Você está na visão de ficha do aluno — não é o portal do estudante</span>
        </div>
      )}
      {isAdmin&&showFullProfile&&fullStudent&&(
        <ModalEdicao
          student={fullStudent}
          onClose={()=>setShowFullProfile(false)}
          onSaved={()=>setShowFullProfile(false)}
        />
      )}

      <main id="portal-main" className={"max-w-3xl mx-auto "+(showStudentUi?"student-dash-wrap":"px-4 pt-6")+(showStudentUi&&studentPage==="materiais"&&studentFlipbook(profile)?" materiais-fullbleed":"")} tabIndex={-1}>
        {showStudentUi&&(
          <div style={{maxWidth:480,margin:"0 auto 12px",padding:"0 4px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span className="role-pill role-pill-student">Portal do aluno</span>
            {isAdmin&&viewAsStudent&&(
              <span style={{fontSize:11,color:"#B45309",fontWeight:700}}>Pré-visualização · o que o aluno vê</span>
            )}
          </div>
        )}
        {isAdmin&&!viewAsStudent?(
          <>
            <div className="glass rounded-2xl p-5 mb-5">
              <div className="flex items-start gap-4 flex-wrap">
                {profile.foto
                  ?<img src={profile.foto} alt="" style={{width:64,height:64,borderRadius:"50%",objectFit:"cover",border:"2.5px solid var(--divider)",flexShrink:0}} onError={e=>{e.target.style.display="none";}}/>
                  :<div style={{width:64,height:64,borderRadius:"50%",background:"var(--badge)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"2px solid var(--divider)"}}><Icon name="user" size={28}/></div>
                }
                <div className="flex-1 min-w-0">
                  <div className="sd-hello" style={{marginBottom:2}}>Visão do aluno</div>
                  <h1 className="text-2xl font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--font,#1E1E1E)",lineHeight:1.25}} title={getFullName(profile.name)}>
                    {getShortName(profile.name)}
                  </h1>
                  {getFullName(profile.name)!==getShortName(profile.name)&&(
                    <p style={{fontSize:11,color:"#475569",marginTop:4}} title={getFullName(profile.name)}>Completo no perfil</p>
                  )}
                  <div className="student-card-meta" style={{marginTop:12}}>
                    <div><span className="meta-label">Curso</span><span className="meta-val">{courseName||"—"}</span></div>
                    <div><span className="meta-label">Módulo</span><span className="meta-val">{currentMod} · {currentModMeta?.name||"—"}</span></div>
                    <div><span className="meta-label">Aniversário</span><span className="meta-val">{profile.birthday?formatDateBR(profile.birthday)+(age!=null?" · "+age+" anos":""):"—"}</span></div>
                    <div><span className="meta-label">Status</span><span className="meta-val" style={{display:"inline-flex",marginTop:2}}><StatusBadge status={profile.status||"lead"}/></span></div>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8,flexShrink:0,alignItems:"stretch"}}>
                  <button type="button" className="btn btn-primary rounded-xl px-4 py-2.5 text-sm font-semibold inline-flex items-center justify-center gap-2" onClick={()=>setShowFullProfile(true)}>
                    <Icon name="user" size={14}/> Perfil completo
                  </button>
                  <button type="button" className="btn-view-as-student" onClick={enterViewAsStudent} title="Abre o portal exatamente como o aluno enxerga">
                    <Icon name="eye" size={16}/> Ver como aluno
                  </button>
                </div>
              </div>
            </div>
            <div className="tab-bar mb-5" role="tablist" aria-label="Seções do aluno">
              {adminTabs.map(t=>(
                <button key={t.id} type="button" data-tab-id={t.id} role="tab" aria-selected={activeTab===t.id} className={"tab-btn"+(activeTab===t.id?" tab-btn-active":"")} onClick={()=>setActiveTabNav(t.id)}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                    <Icon name={t.icon} size={15}/><span style={{fontSize:10}}>{t.label}</span>
                  </div>
                </button>
              ))}
            </div>
            {activeTab==="overview"&&<OverviewSection uid={uid} profile={profile} trilhaData={trilhaData} financeiro={financeiro} onGoToTab={setActiveTabNav} hideGreeting/>}
            {activeTab==="financeiro"&&<FinanceiroSection uid={uid} isAdmin={true} financeiro={financeiro||FINANCEIRO_DEFAULT}/>}
            {activeTab==="trilha"&&<TrilhaSection uid={uid} isAdmin={true} contrato={profile.contrato}/>}

            {activeTab==="recursos"&&<RecursosSection uid={uid} isAdmin={true} links={links}/>}
            {activeTab==="diario"&&<DiarioSection uid={uid} isAdmin={true} contrato={profile.contrato}/>}
            {activeTab==="reportcard"&&<StudentReportCardsSection uid={uid} profile={profile} contrato={profile.contrato} isAdmin={true}/>}
          </>
        ):renderStudentPage()}
      </main>
      {showStudentUi&&!(studentPage==="materiais"&&studentFlipbook(profile))&&<WhatsAppFloat/>}
      {showStudentUi&&!(studentPage==="materiais"&&studentFlipbook(profile))&&<IVi mode="student"/>}
    </div>
  );
}

  idadeFaixa:"",

const DIAS_SEMANA=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const HORARIOS_AULA_OPTS=["06:30","07:00","07:30","08:00","08:10","09:00","10:00","11:00","12:00","12:15","12:50","13:00","13:25","14:00","15:00","16:00","16:20","17:00","17:25","17:30","18:00","18:05","18:40","19:00","19:15","19:30","19:50","20:00","20:20","20:25","20:55","21:00"];
function blankAulaSemanal(n){return{id:n||1,dia:"",horario:""};}
function normalizeAulasSemanais(raw,diasAulas,horarioAulas){
  if(Array.isArray(raw)&&raw.length){
    return raw.map((a,i)=>({
      id:a.id!=null?a.id:(i+1),
      dia:a.dia||a.day||"",
      horario:String(a.horario||a.time||"").slice(0,5),
    }));
  }
  const dias=Array.isArray(diasAulas)?diasAulas:[];
  const h=String(horarioAulas||"").slice(0,5);
  if(dias.length)return dias.map((d,i)=>({id:i+1,dia:d,horario:h}));
  return[blankAulaSemanal(1)];
}
function deriveScheduleFromAulas(aulas){
  const list=(aulas||[]).filter(a=>a&&(a.dia||a.horario));
  const dias=[...new Set(list.map(a=>a.dia).filter(Boolean))];
  const horarios=[...new Set(list.map(a=>String(a.horario||"").slice(0,5)).filter(Boolean))];
  return{
    diasAulas:dias,
    horarioAulas:horarios[0]||"",
    aulasSemanais:list.length?list.map((a,i)=>({id:a.id!=null?a.id:(i+1),dia:a.dia||"",horario:String(a.horario||"").slice(0,5)})):[blankAulaSemanal(1)],
    reposicoesGratuitasContrato:Math.max(1,list.filter(a=>a.dia&&a.horario).length||list.length||1),
  };
}
function WeeklyClassesEditor({value,onChange}){
  const aulas=normalizeAulasSemanais(value);
  function setAula(idx,patch){
    const next=aulas.map((a,i)=>i===idx?{...a,...patch}:a);
    onChange(next);
  }
  function addAula(){
    const nextId=aulas.reduce((m,a)=>Math.max(m,Number(a.id)||0),0)+1;
    onChange([...aulas,{id:nextId,dia:"",horario:""}]);
  }
  function removeAula(idx){
    if(aulas.length<=1){onChange([blankAulaSemanal(1)]);return;}
    onChange(aulas.filter((_,i)=>i!==idx).map((a,i)=>({...a,id:i+1})));
  }
  const qtd=aulas.filter(a=>a.dia&&a.horario).length||aulas.length;
  return(
    <div style={{gridColumn:"1/-1"}}>
      <label className="form-label">Aulas semanais contratadas</label>
      <p className="text-xs muted mb-2">Cada aula semanal dá direito a <strong>1 reposição gratuita</strong>. Agora: <strong>{qtd}</strong> reposição(ões) gratuita(s).</p>
      <div className="space-y-3">
        {aulas.map((a,idx)=>(
          <div key={a.id||idx} className="rounded-xl p-3" style={{border:"1px solid var(--divider)",background:"var(--badge)"}}>
            <div className="flex items-center justify-between gap-2 mb-2">
              <div className="text-sm font-bold">Aula {idx+1}</div>
              {aulas.length>1&&<button type="button" className="btn btn-danger rounded-lg px-2 py-1 text-xs" onClick={()=>removeAula(idx)}>Remover</button>}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="form-label">Dia da semana</label>
                <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={a.dia||""} onChange={e=>setAula(idx,{dia:e.target.value})}>
                  <option value="">— selecionar —</option>
                  {DIAS_SEMANA.map(d=><option key={d} value={d}>{d}</option>)}
                </select>
              </div>
              <div>
                <label className="form-label">Horário disponível</label>
                <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={a.horario||""} onChange={e=>setAula(idx,{horario:e.target.value})}>
                  <option value="">— selecionar —</option>
                  {HORARIOS_AULA_OPTS.map(h=><option key={h} value={h}>{h}</option>)}
                </select>
              </div>
            </div>
          </div>
        ))}
      </div>
      <button type="button" className="btn rounded-xl px-4 py-2 text-sm font-semibold mt-3 inline-flex items-center gap-2" onClick={addAula}>
        <Icon name="plus" size={14}/> Adicionar aulas semanais
      </button>
    </div>
  );
}

              </div>

              <div className="form-section-title" style={{marginTop:20}}>Status</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATUS_OPTIONS.map(s=>{
                  const cls={lead:"status-pill-lead",interessado:"status-pill-interesse",ativo:"status-pill-ativo",trancado:"status-pill-trancado",evadido:"status-pill-evadido"}[s]||"status-pill-inactive";
                  const lbl={lead:"Lead",interessado:"Interessado",ativo:"Ativo",trancado:"Trancado",evadido:"Evadido"}[s]||s;
                  return <button key={s} onClick={()=>setD("status",s)} className={"status-pill "+(dados.status===s?cls:"status-pill-inactive")} style={{fontSize:12}}>{lbl}</button>;
                })}
              </div>

              <div className="form-section-title" style={{marginTop:20}}>Controle</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Data de Cadastro</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataCadastro} onChange={e=>setD("dataCadastro",e.target.value)}/></div>
              </div>
            </div>
          )}

          {/* ─── ABA 1: PERFIL / TRIAGEM ─── */}
          {tab===1&&(
            <div>
              <p style={{fontSize:12,color:"var(--font-muted)",marginBottom:16,fontStyle:"italic"}}>
                Todas as informações serão usadas exclusivamente para personalizar a experiência no curso.
              </p>

              <div className="form-section-title">1. Faixa Etária</div>
              <div className="triagem-group">
                {["Menos de 18 anos","18–24 anos","25–34 anos","35–44 anos","45–54 anos","55+ anos"].map(v=>(
                  <TriagemOption key={v} label={v} field="idadeFaixa" value={v}/>
                ))}
              </div>

              <div className="form-section-title">2. Formação</div>
              <div className="triagem-group">
                {["Ensino Fundamental Incompleto","Ensino Fundamental Completo","Ensino Médio Incompleto","Ensino Médio Completo","Ensino Superior Incompleto","Ensino Superior Completo","Pós-graduação ou mais"].map(v=>(
                  <TriagemOption key={v} label={v} field="formacao" value={v}/>
                ))}
              </div>

              <div className="form-section-title">3. Situação Profissional</div>
              <div className="triagem-group">
                {["Estudante","Autônomo","Funcionário público","CLT","Empreendedor","Outro"].map(v=>(
                  <TriagemOption key={v} label={v} field="ocupacao" value={v}/>
                ))}
              </div>
              <div style={{marginTop:8}}>
                <label className="form-label">Área de interesse (se não estiver trabalhando)</label>
                <input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Ex: Marketing, Saúde..." value={triagem.areaInteresse} onChange={e=>setT("areaInteresse",e.target.value)}/>
              </div>

              <div className="form-section-title">4. Experiência com Inglês</div>
              <div style={{marginBottom:10}}>
                <label className="form-label">Já estudou inglês antes?</label>
                <div style={{display:"flex",gap:8,marginTop:4}}>
                  {["Sim","Não"].map(v=>(
                    <button key={v} onClick={()=>setT("estudouIngles",v)}
                      className={"status-pill "+(triagem.estudouIngles===v?"status-pill-ativo":"status-pill-inactive")}
                      style={{fontSize:12}}>{v}</button>
                  ))}
                </div>
              </div>
              {triagem.estudouIngles==="Sim"&&(
                <>
                  <div style={{marginBottom:8}}>
                    <label className="form-label">Onde estudou (pode marcar mais de um)</label>
                    <div className="triagem-group" style={{marginTop:4}}>
                      {["Escola regular","Curso de idiomas","Online","Outro"].map(v=>(
                        <TriagemMulti key={v} label={v} field="ondeComo" value={v}/>
                      ))}
                    </div>
                  </div>
                  <div style={{marginBottom:8}}>
                    <label className="form-label">Avaliação da experiência anterior (1 = muito ruim · 5 = excelente)</label>
                    <div style={{marginTop:8}}>
                      <Rating field="qualidadeMaterial" label="Qualidade do material"/>
                      <Rating field="qualidadeProfessores" label="Professores"/>
                      <Rating field="qualidadeMetodologia" label="Metodologia"/>
                    </div>
                  </div>
                  <div style={{marginBottom:8}}>
                    <label className="form-label">Pontos positivos</label>
                    <textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.pontosPositivos} onChange={e=>setT("pontosPositivos",e.target.value)}/>
                  </div>
                  <div style={{marginBottom:8}}>
                    <label className="form-label">O que poderia ter sido melhor</label>
                    <textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.melhorias} onChange={e=>setT("melhorias",e.target.value)}/>
                  </div>
                </>
              )}

              <div className="form-section-title">5. Interesses e Hobbies</div>
              <div style={{marginBottom:10}}>
                <label className="form-label">Selecione os tópicos de interesse</label>
                <div className="triagem-group" style={{marginTop:4}}>
                  {["Cultura (artes, história, tradições)","Tecnologia","Esportes","Moda e tendências","Negócios e economia","Sustentabilidade e meio ambiente"].map(v=>(
                    <TriagemMulti key={v} label={v} field="topicos" value={v}/>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:8}}>
                <label className="form-label">Temas que não gosta de conversar</label>
                <textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} placeholder="Ex: Política, Religião..." value={triagem.temasSemInteresse} onChange={e=>setT("temasSemInteresse",e.target.value)}/>
              </div>

              <div className="form-section-title">6. Expectativas</div>
              <div style={{marginBottom:10}}>
                <label className="form-label">Objetivo principal</label>
                <div className="triagem-group" style={{marginTop:4}}>
                  {["Conseguir um emprego","Falar fluentemente em viagens","Passar em testes de proficiência","Melhorar minha confiança na comunicação","Outro"].map(v=>(
                    <TriagemOption key={v} label={v} field="objetivo" value={v}/>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <label className="form-label">Horas por semana disponíveis</label>
                <div className="triagem-group" style={{marginTop:4}}>
                  {["Menos de 1 hora","1–2 horas","3–4 horas","Mais de 4 horas"].map(v=>(
                    <TriagemOption key={v} label={v} field="horasSemana" value={v}/>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <label className="form-label">Prazo esperado para atingir os objetivos</label>
                <div className="triagem-group" style={{marginTop:4}}>
                  {["3 meses","6 meses","1 ano","Mais de 1 ano"].map(v=>(
                    <TriagemOption key={v} label={v} field="prazo" value={v}/>
                  ))}
                </div>
              </div>
              <div>
                <label className="form-label">Observações e motivações adicionais</label>
                <textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={3} style={{resize:"vertical"}} placeholder="Compartilhe o que quiser sobre suas motivações ou expectativas..." value={triagem.observacoes} onChange={e=>setT("observacoes",e.target.value)}/>
              </div>
            </div>
          )}
        </div>

        {err&&<div className="err-box" role="alert" style={{margin:"0 20px 12px"}}>{err}</div>}
        <div className="modal-footer">
          {tab===1&&<button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setTab(0)}>← Dados Pessoais</button>}
          {tab===0&&<button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={()=>setTab(1)}>Perfil do Aluno →</button>}
          <button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={onClose}>Cancelar</button>
          <button type="button" className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={handleSave} disabled={saving}>
            {saving?<div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>:<Icon name="check-circle" size={15}/>}
            {saving?"Salvando...":"Salvar Aluno"}
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

/* ── CADASTROS PENDENTES (form-self) ── */
function ModalAutorizarLancar({pendente,onClose,onLaunched}){
  const courses=useCourses();
  const contratosAtivos=useMemo(()=>getActiveContratos(),[courses]);
  const raw=pendente||{};
  const studentUid=pendente?.uid;
  const isTerceirizado=!!(raw.alunoTerceirizado||raw.cadastroOrigem==="form-self-alunosfora");
  const origemLabel=isTerceirizado?"form-self-alunosfora (terceirizado)":(raw.cadastroOrigem||"form-self");
  const [tab,setTab]=useState(0);
  const [dados,setDados]=useState({
    nome:raw.name||raw.nome||"",cpf:raw.cpf||"",rg:raw.rg||"",
    email:raw.email||"",telefone:raw.phone||raw.telefone||"",telefone2:raw.telefone2||"",
    dataNasc:raw.dataNasc||"",estadoCivil:raw.estadoCivil||"",
    profissao:raw.profissao||raw.profession||"",nacionalidade:raw.nacionalidade||"",
    endereco:raw.endereco||"",foto:raw.foto||"",
    contrato:resolveContratoId(raw.contrato||"foundation_general"),duracao:raw.duracao||"",
    diasAulas:Array.isArray(raw.diasAulas)?raw.diasAulas:[],horarioAulas:raw.horarioAulas||"",
    aulasSemanais:normalizeAulasSemanais(raw.aulasSemanais,raw.diasAulas,raw.horarioAulas),
    reposicoesGratuitasContrato:raw.reposicoesGratuitasContrato||null,
    valorCheio:raw.valorCheio??"",descontos:raw.descontos??"",
    valorFinal:raw.valorFinal??"",diaVencimento:raw.diaVencimento??"",
    dataInicio:raw.dataInicio||"",licaoInicio:raw.licaoInicio||"1",
    numParcelas:isTerceirizado?(raw.numParcelas||0):(raw.numParcelas||18),
  });
  const triagem=pendente.triagem||BLANK_TRIAGEM;
  const [level,setLevel]=useState(pendente.level||"A1");
  const [status,setStatus]=useState("ativo");
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const courseSel=useMemo(()=>getCourseById(dados.contrato),[courses,dados.contrato]);
  const totalLicoesCurso=getTotalLicoes(courseSel)||150;

  function setD(k,v){setDados(p=>({...p,[k]:v}));}
  function setAulasSemanais(list){
    const der=deriveScheduleFromAulas(list);
    setDados(p=>({...p,aulasSemanais:der.aulasSemanais,diasAulas:der.diasAulas,horarioAulas:der.horarioAulas,reposicoesGratuitasContrato:der.reposicoesGratuitasContrato}));
  }

  function TriRead({label,field}){
    const v=triagem[field];
    if(!v||(Array.isArray(v)&&!v.length))return null;
    return <div style={{marginBottom:8,fontSize:13}}><span style={{fontWeight:700,color:"var(--font-muted)",fontSize:11,textTransform:"uppercase"}}>{label}: </span>{Array.isArray(v)?v.join(", "):v}</div>;
  }

  async function handleLancar(){
    if(!dados.nome.trim()){setErr("Nome é obrigatório.");return;}
    if(!dados.email.trim()){setErr("Email é obrigatório.");return;}
    if(!studentUid){setErr("UID do aluno não encontrado.");return;}
    const confMsg=isTerceirizado
      ?`Autorizar e lançar ${dados.nome.trim()} (aluno terceirizado)?\n\nLogin já existe — acesso ao conteúdo será liberado. Financeiro é opcional neste tipo de cadastro.`
      :`Autorizar e lançar ${dados.nome.trim()} no sistema?\n\nLogin já existe — será ativado o perfil completo com financeiro.`;
    if(!confirm(confMsg))return;
    setSaving(true);setErr("");
    try{
      const email=dados.email.trim().toLowerCase();
      const nParcelas=parseInt(dados.numParcelas,10)||0;
      const parcelas=(!isTerceirizado||(dados.dataInicio&&dados.diaVencimento&&dados.valorFinal&&nParcelas>0))
        ? (gerarParcelas(dados.dataInicio,dados.diaVencimento,dados.valorFinal,nParcelas||18,[])||[])
        : [];
      const financeiro={...FINANCEIRO_DEFAULT,parcelas};
      const programName=getCourseLabel(dados.contrato)||"Fluency General";

      await db.collection("students").doc(studentUid).update({
        name:dados.nome.trim(),email,
        phone:dados.telefone.trim(),telefone2:dados.telefone2.trim(),
        cpf:dados.cpf.trim(),rg:dados.rg.trim(),
        dataNasc:dados.dataNasc,estadoCivil:dados.estadoCivil,
        profissao:dados.profissao.trim(),nacionalidade:dados.nacionalidade.trim(),
        endereco:dados.endereco.trim(),foto:dados.foto.trim(),
        contrato:dados.contrato,duracao:dados.duracao.trim(),
        ...(()=>{const der=deriveScheduleFromAulas(dados.aulasSemanais||normalizeAulasSemanais(null,dados.diasAulas,dados.horarioAulas));return{aulasSemanais:der.aulasSemanais,diasAulas:der.diasAulas,horarioAulas:der.horarioAulas,reposicoesGratuitasContrato:der.reposicoesGratuitasContrato};})(),
        valorCheio:parseFloat(dados.valorCheio)||0,
        descontos:parseFloat(dados.descontos)||0,
        valorFinal:parseFloat(dados.valorFinal)||0,
        diaVencimento:parseInt(dados.diaVencimento,10)||1,
        dataInicio:dados.dataInicio||"",
        licaoInicio:parseInt(dados.licaoInicio,10)||1,
        numParcelas:isTerceirizado?nParcelas:(nParcelas||18),
        status,level,triagem,
        program:programName,
        birthday:dados.dataNasc||"",profession:dados.profissao.trim(),
        financeiro,
        alunoTerceirizado:isTerceirizado,
        aguardandoLancamento:false,
        autorizadoAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection("users").doc(studentUid).set({
        name:dados.nome.trim(),email,role:"student",studentId:studentUid,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      },{merge:true});
      onLaunched(studentUid);onClose();
    }catch(e){
      setErr("Erro ao lançar: "+(e.message||e.code||"desconhecido"));
      setSaving(false);
    }
  }

  async function handleRejeitar(){
    if(!confirm("Rejeitar este cadastro pendente?"))return;
    await db.collection("students").doc(studentUid).update({
      status:"rejeitado",aguardandoLancamento:false,
      rejeitadoAt:firebase.firestore.FieldValue.serverTimestamp(),
    });
    onClose();
  }

  const tabLabels=["Respostas do Aluno","Contrato & Financeiro","Autorizar"];
  return(
    <ModalOverlay onClose={onClose} labelledBy="modal-autorizar-title">
      <div className="modal-box" style={{maxWidth:800}}>
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="clipboard-check" size={18}/>
            <div>
              <div id="modal-autorizar-title" style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Revisar Cadastro</div>
              <div style={{fontSize:11,opacity:.75}}>{dados.nome||pendente.name} · {origemLabel}</div>
            </div>
          </div>
          <button type="button" onClick={onClose} aria-label="Fechar" style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff",display:"flex",alignItems:"center"}}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-tab-bar">
          {tabLabels.map((l,i)=><button key={i} className={"modal-tab"+(tab===i?" modal-tab-active":"")} onClick={()=>setTab(i)}>{l}</button>)}
        </div>
        <div className="modal-body">
          {tab===0&&(
            <div>
              {isTerceirizado&&(
                <div className="info-box" style={{marginBottom:14,background:"rgba(30,143,168,.10)",border:"1px solid rgba(30,143,168,.28)"}}>
                  <strong>Aluno terceirizado</strong> — contrato com outra escola. CPF, RG, foto e financeiro não foram solicitados no formulário.
                </div>
              )}
              <div className="form-section-title">Dados Pessoais</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 16px",fontSize:13,marginBottom:16}}>
                {[["Nome",dados.nome],["Email",dados.email],["Telefone",dados.telefone],["CPF",dados.cpf],["Profissão",dados.profissao],["Nascimento",dados.dataNasc],["Endereço",dados.endereco]].map(([l,v])=>
                  v?<div key={l}><span style={{fontSize:10,fontWeight:700,color:"var(--font-muted)",textTransform:"uppercase"}}>{l}</span><div style={{marginTop:2}}>{v}</div></div>:null
                )}
              </div>
              <div className="form-section-title">Perfil do Aluno (Triagem)</div>
              <TriRead label="Faixa etária" field="idadeFaixa"/>
              <TriRead label="Formação" field="formacao"/>
              <TriRead label="Ocupação" field="ocupacao"/>
              <TriRead label="Área interesse" field="areaInteresse"/>
              <TriRead label="Estudou inglês" field="estudouIngles"/>
              <TriRead label="Onde estudou" field="ondeComo"/>
              <TriRead label="Objetivo" field="objetivo"/>
              <TriRead label="Horas/semana" field="horasSemana"/>
              <TriRead label="Prazo" field="prazo"/>
              {triagem.observacoes&&<div style={{marginTop:8,padding:12,borderRadius:10,background:"var(--detail)",fontSize:13}}><strong>Observações:</strong> {triagem.observacoes}</div>}
            </div>
          )}
          {tab===1&&(
            <div>
              <p style={{fontSize:12,color:"var(--font-muted)",marginBottom:14}}>
                {isTerceirizado
                  ?"Aluno terceirizado: financeiro é opcional. Preencha só se quiser controlar acesso/conteúdo ou datas de aula na plataforma."
                  :"Confira e complete o que faltar — especialmente financeiro e datas."}
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Tipo de Contrato (Curso)</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.contrato} onChange={e=>setD("contrato",e.target.value)}>
                    {contratosAtivos.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Duração</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.duracao} onChange={e=>setD("duracao",e.target.value)}/></div>
                <div><label className="form-label">Data de Início</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataInicio} onChange={e=>setD("dataInicio",e.target.value)}/></div>
                <div><label className="form-label">Lição de Início ({getCourseLessonLabel(courseSel,1)||1}–{getCourseLessonLabel(courseSel,totalLicoesCurso)||totalLicoesCurso})</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.licaoInicio} onChange={e=>setD("licaoInicio",e.target.value)}>
                    {Array.from({length:totalLicoesCurso},(_,i)=><option key={i+1} value={i+1}>{getCourseLessonLabel(courseSel,i+1)||(i+1)}</option>)}
                  </select>
                </div>
                <WeeklyClassesEditor value={dados.aulasSemanais||normalizeAulasSemanais(null,dados.diasAulas,dados.horarioAulas)} onChange={setAulasSemanais}/>
                <div><label className="form-label">Valor Cheio (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorCheio} onChange={e=>setD("valorCheio",e.target.value)}/></div>
                <div><label className="form-label">Descontos (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.descontos} onChange={e=>setD("descontos",e.target.value)}/></div>
                <div><label className="form-label">Valor Final (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorFinal} onChange={e=>setD("valorFinal",e.target.value)}/></div>
                <div><label className="form-label">Dia Vencimento</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.diaVencimento} onChange={e=>setD("diaVencimento",e.target.value)}>
                    <option value="">—</option>{Array.from({length:31},(_,i)=><option key={i+1} value={i+1}>Dia {i+1}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Nº Parcelas</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.numParcelas} onChange={e=>setD("numParcelas",parseInt(e.target.value)||0)}>
                    {isTerceirizado&&<option value={0}>0 (sem parcelas)</option>}
                    {Array.from({length:24},(_,i)=><option key={i+1} value={i+1}>{i+1}x</option>)}
                  </select>
                </div>
              </div>
              {dados.dataInicio&&dados.diaVencimento&&dados.valorFinal&&(parseInt(dados.numParcelas,10)||0)>0&&(
                <div style={{marginTop:14,padding:"12px 14px",borderRadius:12,background:"rgba(30,143,168,.08)",border:"1px solid rgba(30,143,168,.25)",fontSize:12}}>
                  <Icon name="info" size={12} style={{display:"inline",marginRight:4}}/>Ao autorizar, serão geradas <strong>{dados.numParcelas||18} parcelas</strong> de {formatCurrency(parseFloat(dados.valorFinal)||0)} automaticamente.
                </div>
              )}
            </div>
          )}
          {tab===2&&(
            <div>
              <div className="info-box" style={{background:"rgba(30,160,110,.10)",border:"1px solid rgba(30,160,110,.30)",borderRadius:12,padding:14,marginBottom:16,fontSize:13}}>
                <strong style={{color:"#60daa8"}}>Pronto para lançar?</strong><br/>
                {isTerceirizado
                  ?<>Ao clicar em <strong>Autorizar Lançar</strong>, o login do aluno terceirizado é ativado e o acesso ao conteúdo personalizado é liberado.</>
                  :<>Ao clicar em <strong>Autorizar Lançar</strong>, o login do aluno (já criado no form-self) é ativado com financeiro, parcelas e status definitivo.</>}
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Nível Inicial</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={level} onChange={e=>setLevel(e.target.value)}>
                    {["A1","A2","B1","B2","C1","C2"].map(l=><option key={l}>{l}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Status</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={status} onChange={e=>setStatus(e.target.value)}>
                    {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>

function gerarParcelas(dataInicio,diaVenc,valorFinal,numParcelas,parcelasExistentes){
  if(!dataInicio||!diaVenc||!valorFinal||!numParcelas)return null;
  const pagas=(parcelasExistentes||[]).filter(p=>p.status==="paga");
  const base=new Date(dataInicio+"T12:00:00");
  const parcelas=[];
  for(let i=0;i<numParcelas;i++){
    const d=new Date(base.getFullYear(),base.getMonth()+i,parseInt(diaVenc));
    const mesStr=MESES_CURTOS[d.getMonth()]+"/"+String(d.getFullYear()).slice(2);
    const dataVenc=d.toISOString().slice(0,10);
    const jaFoi=pagas.find(p=>p.mes===mesStr||p.dataVencimento===dataVenc);
    parcelas.push(jaFoi||{
      id:Date.now().toString()+i,
      mes:mesStr,
      dataVencimento:dataVenc,
      valor:parseFloat(valorFinal)||0,
      valorDesconto:0,
      status:"a_vencer",
      comprovante:"",
      boletoPix:"",
      dataPagamento:"",
    });
  }
  return parcelas;
}

const JS_TO_DIA=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const STUDIO_CLOSED_MAP=(()=>{
  const m={};
  STUDIO_HOLIDAY_ENTRIES.forEach(h=>{m[h.d]={type:h.t,label:h.l};});
  STUDIO_RECESS_RANGES.forEach(r=>{
    const d=new Date(r.s+"T12:00:00"),end=new Date(r.e+"T12:00:00");
    while(d<=end){const iso=d.toISOString().slice(0,10);if(!m[iso])m[iso]={type:"recesso",label:r.l};d.setDate(d.getDate()+1);}
  });
  return m;
})();
function isStudioClosed(iso){return!!STUDIO_CLOSED_MAP[iso];}
function getStudioDayInfo(iso){return STUDIO_CLOSED_MAP[iso]||null;}
function gerarCalendarioCompleto({dataInicio,diasAulas,licaoInicio=1,totalLicoes=150,trilhaExistente={},horarioAulas="",aulasSemanais=null,course=null}){
  const aulasNorm=normalizeAulasSemanais(aulasSemanais,diasAulas,horarioAulas).filter(a=>a.dia);
  const diasList=aulasNorm.length?aulasNorm.map(a=>a.dia):diasAulas;
  if(!dataInicio||!diasList?.length)return null;
  const courseObj=course||DEFAULT_COURSES[0];
  const total=totalLicoes||getTotalLicoes(courseObj)||150;
  const diasSet=new Set(diasList.map(d=>DIA_TO_JS[d]).filter(v=>v!==undefined));
  if(!diasSet.size)return null;
  const horarioPorDia={};
  aulasNorm.forEach(a=>{if(a.dia&&a.horario)horarioPorDia[a.dia]=a.horario;});
  let current=new Date(dataInicio+"T12:00:00");
  let lessonNum=parseInt(licaoInicio,10)||1;
  const trilhaUpdates={};
  const calendario=[];
  const maxDate=new Date(dataInicio+"T12:00:00");maxDate.setFullYear(maxDate.getFullYear()+5);
  while(lessonNum<=total&&current<=maxDate){
    const iso=current.toISOString().slice(0,10);
    if(isStudioClosed(iso)){current.setDate(current.getDate()+1);continue;}
    if(diasSet.has(current.getDay())){
      const id=lessonIdFromNum(lessonNum,courseObj);
      const diaNome=JS_TO_DIA[current.getDay()];
      const horario=horarioPorDia[diaNome]||horarioAulas||"";
      trilhaUpdates[id]={...(trilhaExistente[id]||{}),dataPrevista:iso};
      calendario.push({lessonNum,lessonId:id,date:iso,diaSemana:diaNome,horario});
      lessonNum++;
    }
    current.setDate(current.getDate()+1);
  }
  if(calendario.length===0)return null;
  const ultima=calendario[calendario.length-1];
  return{trilhaUpdates,calendario,total:calendario.length,dataFim:ultima.date,dataInicio:calendario[0].date};
}
async function aplicarCalendarioAluno(uid,student,trilhaExistente){
  const course=getCourseById(student.contrato);
  const result=gerarCalendarioCompleto({
    dataInicio:student.dataInicio,diasAulas:student.diasAulas||[],
    licaoInicio:student.licaoInicio||1,trilhaExistente:trilhaExistente||student.trilha||{},
    horarioAulas:student.horarioAulas||"",
    aulasSemanais:student.aulasSemanais||null,
    totalLicoes:getTotalLicoes(course),
    course,
  });
  if(!result)return null;
  const trilha={...(student.trilha||{})};
  Object.entries(result.trilhaUpdates).forEach(([id,data])=>{trilha[id]={...(trilha[id]||{}),...data};});

    calendarioResumo:{total:result.total,dataInicio:result.dataInicio,dataFim:result.dataFim},
  });
  return result;
}
function collectStudentLessonEvents(students,monthKey,onlyUid=null){
  const events=[];
  (students||[]).forEach(s=>{
    if(onlyUid&&s.uid!==onlyUid)return;
    if(!onlyUid&&(s.status||normalizeStatus(null,s))!=="ativo")return;
    const push=(date,lessonNum,extra={})=>{
      if(!date||!date.startsWith(monthKey))return;
      events.push({date,type:"aula",label:`${s.name||"Aluno"} · Lição ${lessonNum}`,time:s.horarioAulas||"",studentUid:s.uid,studentName:s.name||"Aluno",lessonNum,color:"#1e8fa8",...extra});
    };
    Object.entries(s.trilha||{}).forEach(([id,lesson])=>{
      const num=lesson.pos||parseInt((id.match(/l(\d+)/)||[])[1],10);
      if(lesson.dataPrevista)push(lesson.dataPrevista,num,{lessonId:id,status:lesson.status});
    });
    (s.calendarioCompleto||[]).forEach(c=>{
      if(!events.some(e=>e.date===c.date&&e.studentUid===s.uid&&e.lessonNum===c.lessonNum))
        push(c.date,c.lessonNum,{horario:c.horario});
    });
  });
  return events.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
}
function findProximaAula(students){
  const today=new Date().toISOString().slice(0,10);
  let best=null;
  (students||[]).forEach(s=>{
    if((s.status||normalizeStatus(null,s))!=="ativo")return;
    const scan=(date,lessonNum,lesson,extra={})=>{
      if(!date||date<today)return;
      if(lesson?.status==="concluida"||lesson?.status==="realizada")return;
      if(!best||date<best.date||(date===best.date&&(s.horarioAulas||"").localeCompare(best.time||"")<0)){
        best={date,time:s.horarioAulas||"",student:s,lessonNum,lesson,...extra};
      }
    };
    Object.entries(s.trilha||{}).forEach(([id,lesson])=>{
      const num=lesson.pos||parseInt((id.match(/l(\d+)/)||[])[1],10);
      if(lesson.dataPrevista)scan(lesson.dataPrevista,num,lesson,{lessonId:id});
    });
    if(!(s.trilha&&Object.keys(s.trilha).length)&&(s.calendarioCompleto||[]).length){
      s.calendarioCompleto.forEach(c=>scan(c.date,c.lessonNum,null,{fromCalendario:true}));
    }
  });
  return best;
}
function getStudioEventsForMonth(monthKey){
  const events=[];
  Object.entries(STUDIO_CLOSED_MAP).forEach(([date,info])=>{
    if(!date.startsWith(monthKey))return;
    const color=info.type==="recesso"?"#c0a0f8":info.type==="carnaval"?"#f0cc60":"#f09090";
    events.push({date,type:info.type,label:info.label,time:"",color,studio:true,source:"studio"});
  });
  return events;
}
function collectRecurringClassEvents(students,monthKey,onlyUid=null){
  const[y,m]=monthKey.split("-").map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const events=[];
  (students||[]).forEach(s=>{
    if(onlyUid&&s.uid!==onlyUid)return;
    if(!onlyUid&&(s.status||normalizeStatus(null,s))!=="ativo")return;
    const aulas=normalizeAulasSemanais(s.aulasSemanais,s.diasAulas,s.horarioAulas).filter(a=>a.dia);
    if(!aulas.length)return;
    for(let d=1;d<=daysInMonth;d++){
      const iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      if(s.dataInicio&&iso<s.dataInicio)continue;
      if(isStudioClosed(iso))continue;
      const dow=JS_TO_DIA[new Date(iso+"T12:00:00").getDay()];
      aulas.filter(a=>a.dia===dow).forEach(a=>{
        events.push({
          date:iso,type:"aula",source:"recorrente",
          label:`${s.name||"Aluno"} · Aula`,time:a.horario||s.horarioAulas||"",
          studentUid:s.uid,studentName:s.name||"Aluno",color:"#1e8fa8",
        });
      });
    }
  });
  return events;
}
function buildAgendaEventsForMonth(students,monthKey,agendaExtra={}){
  const studio=getStudioEventsForMonth(monthKey);
  const fromPrevista=collectStudentLessonEvents(students,monthKey,agendaExtra.onlyUid||null);
  fromPrevista.forEach(e=>{e.source="prevista";});
  const previstaKeys=new Set(fromPrevista.map(e=>`${e.studentUid}|${e.date}`));
  const fromRecurring=collectRecurringClassEvents(students,monthKey,agendaExtra.onlyUid||null)
    .filter(e=>!previstaKeys.has(`${e.studentUid}|${e.date}`));
  const custom=(agendaExtra.eventos||[]).map(e=>({
    date:e.data,type:"agenda",source:"manual",label:e.titulo,time:e.hora||"",color:"#60daa8",notas:e.notas,id:e.id,
  }));
  return[...studio,...fromPrevista,...fromRecurring,...custom]
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
}
function buildAgendaEventsForRange(students,startISO,endISO,agendaExtra={}){
  const seen=new Set();const out=[];
  let mk=getMonthKey(new Date(startISO+"T12:00:00"));
  const endMk=getMonthKey(new Date(endISO+"T12:00:00"));
  for(let i=0;i<18;i++){
    buildAgendaEventsForMonth(students,mk,agendaExtra).forEach(e=>{
      if(e.date<startISO||e.date>endISO)return;
      const key=(e.id||"")+e.date+e.type+e.label+(e.time||"");
      if(seen.has(key))return;
      seen.add(key);out.push(e);
    });
    if(mk===endMk)break;
    mk=shiftMonthKey(mk,1);
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
}
function addDaysISO(iso,delta){
  const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+delta);

}
function getWeekStartMonday(iso){
  const d=new Date(iso+"T12:00:00");
  const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return d.toISOString().slice(0,10);
}
function getWeekDaysFrom(iso){
  const start=getWeekStartMonday(iso);
  return Array.from({length:7},(_,i)=>addDaysISO(start,i));
}
function eventsToAulasCards(events,students){
  return(events||[]).map((e,i)=>{

    const name=e.studentName||s?.name||e.label?.split(" · ")[0]||e.label||"Evento";
    let contrato="";
    if(e.lessonNum)contrato=`Lição ${e.lessonNum}`;
    else if(s)contrato=getCourseLabel(s.contrato);
    else contrato=e.source==="recorrente"?"Aula semanal":"—";
    return{
      uid:e.studentUid||e.id||("ev-"+i),name,horario:e.time||"—",contrato,

function findProximaAulaUnified(students,agendaExtra={}){
  const nowParts=studioParts(getStudioNow());
  const today=nowParts.date;
  let best=null;
  for(let i=0;i<4;i++){
    const mk=shiftMonthKey(today.slice(0,7),i);
    buildAgendaEventsForMonth(students,mk,agendaExtra).forEach(e=>{
      if(e.type!=="aula"||!e.date)return;
      if(classDateTimePassed(e.date,e.time,nowParts))return;
      const stu=(students||[]).find(s=>s.uid===e.studentUid);
      const lesson=e.lessonNum&&stu?(stu.trilha||{})[lessonIdFromNum(e.lessonNum,getCourseById(stu.contrato))]:null;
      if(lesson?.status==="concluida"||lesson?.status==="realizada")return;
      if(!best||e.date<best.date||(e.date===best.date&&(e.time||"").localeCompare(best.time||"")<0)){
        best={
          date:e.date,time:e.time||"",lessonNum:e.lessonNum,
          student:(students||[]).find(s=>s.uid===e.studentUid)||{name:e.studentName},
          source:e.source,
        };
      }
    });
  }
  return best;
}
function collectClassSlotsForRange(students,startISO,endISO){
  const out=[];
  const seen=new Set();
  let mk=startISO.slice(0,7);
  const endMk=endISO.slice(0,7);
  for(let i=0;i<8;i++){
    buildAgendaEventsForMonth(students,mk).forEach(e=>{
      if(e.type!=="aula"||!e.date||!e.studentUid)return;
      if(e.date<startISO||e.date>endISO)return;
      const key=e.studentUid+"|"+e.date+"|"+String(e.time||"").slice(0,5);
      if(seen.has(key))return;
      seen.add(key);
      out.push({
        studentUid:e.studentUid,
        studentName:e.studentName||"",
        date:e.date,
        time:String(e.time||"").slice(0,5),
        lessonNum:e.lessonNum||null,
        source:e.source||"aula",
      });
    });
    if(mk===endMk)break;
    mk=shiftMonthKey(mk,1);
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
}
function computeDiarioPendencias(students,diarioByUid,nowParts){
  const np=nowParts||studioParts(getStudioNow());
  const end=np.date;
  const start=addDaysISO(end,-45);
  const ativos=(students||[]).filter(s=>(s.status||normalizeStatus(null,s))==="ativo");
  const slots=collectClassSlotsForRange(ativos,start,end);
  const pending=[];
  slots.forEach(slot=>{
    if(!classDateTimePassed(slot.date,slot.time,np))return;
    const entries=diarioByUid&&diarioByUid[slot.studentUid]||[];
    const has=entries.some(en=>{
      const d=en.date||en.data||"";
      if(d!==slot.date)return false;
      // Um lançamento no dia cobre o(s) slot(s) daquele dia.
      return true;
    });
    if(has)return;
    const st=ativos.find(s=>s.uid===slot.studentUid);
    pending.push({
      ...slot,
      studentName:slot.studentName||st?.name||"Aluno",
      courseLabel:getCourseLabel(st?.contrato)||st?.program||"—",
    });
  });
  return pending;
}
