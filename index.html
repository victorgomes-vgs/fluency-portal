                    <div style={{marginTop:8}}><StatusBadge status={dados.status||"lead"}/></div>
                  </div>
                </div>
              </div>
              <div className="profile-sheet-body">
                <div style={{fontSize:12,fontWeight:800,color:"#0f2c5c",marginBottom:8,letterSpacing:".06em"}}>DADOS PESSOAIS</div>
                {sheetRow("Nome completo",full)}
                {sheetRow("Email",dados.email)}
                {sheetRow("Telefone",dados.telefone)}
                {sheetRow("Telefone 2",dados.telefone2)}
                {sheetRow("CPF",dados.cpf)}
                {sheetRow("RG",dados.rg)}
                {sheetRow("Nascimento",dados.dataNasc?formatDateBR(dados.dataNasc):"")}
                {sheetRow("Estado civil",dados.estadoCivil)}
                {sheetRow("Profissão",dados.profissao)}
                {sheetRow("Nacionalidade",dados.nacionalidade)}
                {sheetRow("Endereço",dados.endereco)}
                <div style={{fontSize:12,fontWeight:800,color:"#0f2c5c",margin:"18px 0 8px",letterSpacing:".06em"}}>CONTRATO & AULAS</div>
                {sheetRow("Curso",getCourseLabel(dados.contrato))}
                {sheetRow("Status",dados.status)}
                {sheetRow("Início",dados.dataInicio?formatDateBR(dados.dataInicio):"")}
                {sheetRow("Dias",dias)}
                {sheetRow("Horário",dados.horarioAulas)}
                {sheetRow("Valor final",dados.valorFinal?formatCurrency(parseFloat(dados.valorFinal)||0):"")}
                {sheetRow("Vencimento",dados.diaVencimento?"Dia "+dados.diaVencimento:"")}
              </div>
            </div>
          </div>
          <div className="modal-footer">
            <button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={onClose}>Fechar</button>
            <button type="button" className="btn btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold inline-flex items-center gap-2" onClick={()=>setEditing(true)}>
              <Icon name="pencil" size={15}/> Editar
            </button>
          </div>
        </div>
      </ModalOverlay>
    );
  }

  return(
    <ModalOverlay onClose={onClose} labelledBy="modal-editar-title">
      <div className="modal-box">
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="pencil" size={18}/>
            <div><div id="modal-editar-title" style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Editar cadastro</div>
            <div style={{fontSize:11,opacity:.75}}>{getFullName(student.name||student.nome)}</div></div>
          </div>
          <button type="button" onClick={onClose} aria-label="Fechar" style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff",display:"flex",alignItems:"center"}}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-tab-bar">
          {["Dados Pessoais","Perfil do Aluno"].map((l,i)=><button key={i} className={"modal-tab"+(tab===i?" modal-tab-active":"")} onClick={()=>setTab(i)}>{l}</button>)}
        </div>
        <div className="modal-body">
          {tab===0&&(
            <div>
              <div className="form-section-title">Identificação</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1",marginBottom:4}}>
                  <FotoUploadField
                    previewUrl={fotoPreview||dados.foto||""}
                    onSelectFile={handleFotoSelect}
                    onClear={handleFotoClear}
                    disabled={saving}
                    busy={saving&&!!fotoFile}
                  />
                </div>
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Nome Completo *</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.nome} onChange={e=>setD("nome",e.target.value)}/></div>
                <div><label className="form-label">Nacionalidade</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.nacionalidade} onChange={e=>setD("nacionalidade",e.target.value)}/></div>
                <div><label className="form-label">Estado Civil</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.estadoCivil} onChange={e=>setD("estadoCivil",e.target.value)}>
                    <option value="">Selecione...</option>
                    {["Solteiro(a)","Casado(a)","Divorciado(a)","Viúvo(a)","União Estável","Outro"].map(o=><option key={o}>{o}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Profissão</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.profissao} onChange={e=>setD("profissao",e.target.value)}/></div>
                <div><label className="form-label">Data de Nascimento</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataNasc} onChange={e=>setD("dataNasc",e.target.value)}/></div>
                <div><label className="form-label">CPF</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.cpf} onChange={e=>setD("cpf",e.target.value)}/></div>
                <div><label className="form-label">RG</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.rg} onChange={e=>setD("rg",e.target.value)}/></div>
              </div>
              <div className="form-section-title">Contato</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Email</label><input type="email" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.email} onChange={e=>setD("email",e.target.value)}/></div>
                <div><label className="form-label">Telefone / WhatsApp</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.telefone} onChange={e=>setD("telefone",e.target.value)}/></div>
                <div><label className="form-label">Telefone 2</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.telefone2} onChange={e=>setD("telefone2",e.target.value)}/></div>
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Endereço</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.endereco} onChange={e=>setD("endereco",e.target.value)}/></div>
              </div>
              <div className="form-section-title">Acesso ao Portal (alunos antigos)</div>
              <div style={{padding:"12px 14px",borderRadius:12,background:"rgba(30,143,168,.08)",border:"1px solid rgba(30,143,168,.25)",marginBottom:12,fontSize:12,lineHeight:1.5}}>
                {student.hasPortalLogin||student.authUid
                  ?<>Login já vinculado{student.authUid?<> · authUid: <code style={{fontSize:10}}>{student.authUid}</code></>:null}. O aluno entra com o email cadastrado.</>
                  :<>Este aluno pode não ter login Firebase. Defina uma senha e clique em <strong>Criar login</strong> para liberar o portal.</>
                }
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3" style={{marginBottom:8}}>
                <div>
                  <label className="form-label">Nova senha do portal</label>
                  <input type="text" className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="mín. 6 caracteres" value={novaSenha} onChange={e=>setNovaSenha(e.target.value)} autoComplete="new-password"/>
                </div>
                <div style={{display:"flex",alignItems:"flex-end"}}>
                  <button type="button" className="btn btn-primary rounded-xl px-4 py-2.5 text-sm font-semibold w-full" onClick={handleCreateLogin} disabled={saving}>
                    {saving?"Aguarde...":"Criar / vincular login"}
                  </button>
                </div>
              </div>
              {loginMsg&&<div style={{fontSize:12,color:"#60daa8",marginBottom:10,padding:"8px 12px",borderRadius:10,background:"rgba(30,160,110,.12)",border:"1px solid rgba(30,160,110,.3)"}}>{loginMsg}</div>}
              <div className="form-section-title">Contrato / Curso</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Tipo de Contrato (Curso)</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.contrato} onChange={e=>setD("contrato",e.target.value)}>
                    {contratosAtivos.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
                    {!contratosAtivos.find(c=>c.v===dados.contrato)&&dados.contrato&&<option value={dados.contrato}>{getCourseLabel(dados.contrato)} (inativo)</option>}
                  </select>
                </div>
                <div><label className="form-label">Duração</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.duracao} onChange={e=>setD("duracao",e.target.value)}/></div>
                <div><label className="form-label">Data de Início</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataInicio} onChange={e=>setD("dataInicio",e.target.value)}/></div>
                <div><label className="form-label">Lição de Início ({getCourseLessonLabel(courseSel,1)||1}–{getCourseLessonLabel(courseSel,totalLicoesCurso)||totalLicoesCurso})</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.licaoInicio} onChange={e=>setD("licaoInicio",e.target.value)}>
                    {Array.from({length:totalLicoesCurso},(_,i)=><option key={i+1} value={i+1}>{getCourseLessonLabel(courseSel,i+1)||(i+1)}</option>)}
                  </select>
                </div>
                <div style={{gridColumn:"1/-1"}}>
                <WeeklyClassesEditor value={dados.aulasSemanais||normalizeAulasSemanais(null,dados.diasAulas,dados.horarioAulas)} onChange={setAulasSemanais}/>
                </div>
                <div><label className="form-label">Valor Cheio (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorCheio} onChange={e=>setD("valorCheio",e.target.value)}/></div>
                <div><label className="form-label">Descontos (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.descontos} onChange={e=>setD("descontos",e.target.value)}/></div>
                <div><label className="form-label">Valor Final (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorFinal} onChange={e=>setD("valorFinal",e.target.value)}/></div>
                <div><label className="form-label">Dia de Vencimento</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.diaVencimento} onChange={e=>setD("diaVencimento",e.target.value)}>
                    <option value="">Selecione...</option>
                    {Array.from({length:31},(_,i)=><option key={i+1} value={i+1}>Dia {i+1}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Nº de Parcelas</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.numParcelas||18} onChange={e=>setD("numParcelas",parseInt(e.target.value))}>
                    {Array.from({length:24},(_,i)=><option key={i+1} value={i+1}>{i+1}x</option>)}
                  </select>
                </div>
              </div>
              {/* GERAR PARCELAS + CALENDÁRIO */}
              {((dados.dataInicio&&dados.diaVencimento&&dados.valorFinal)||(dados.dataInicio&&dados.diasAulas?.length>0))&&(
                <div style={{marginTop:14,padding:"14px 16px",borderRadius:14,border:"1px solid rgba(30,143,168,.3)",background:"rgba(30,143,168,.06)"}}>
                  <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:12}}>
                    <strong style={{color:"#1e8fa8"}}>Automação</strong> — gere parcelas financeiras e/ou o calendário completo de aulas (Data Prevista em cada lição).
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                    {dados.dataInicio&&dados.diaVencimento&&dados.valorFinal&&(
                      <button
                        onClick={async()=>{
                          const novas=gerarParcelas(dados.dataInicio,dados.diaVencimento,dados.valorFinal,dados.numParcelas||18,student.financeiro?.parcelas||[]);
                          if(!novas){alert("Preencha: Data de Início, Dia de Vencimento e Valor Final.");return;}
                          if(!confirm(`Gerar ${novas.length} parcelas para ${student.name}?`))return;
                          try{
                            await db.collection("students").doc(student.uid).update({"financeiro.parcelas":novas});
                            notifySaveSuccess("Parcelas geradas com sucesso!");
                          }catch(e){alert("Erro: "+e.message);}
                        }}
                        className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2">
                        <Icon name="refresh-cw" size={14}/>Gerar {dados.numParcelas||18} Parcelas
                      </button>
                    )}
                    {dados.dataInicio&&dados.diasAulas?.length>0&&(
                      <button
                        onClick={async()=>{
                          const courseCal=getCourseById(dados.contrato);
                          const preview=gerarCalendarioCompleto({
                            dataInicio:dados.dataInicio,diasAulas:dados.diasAulas,licaoInicio:dados.licaoInicio||1,
                            trilhaExistente:student.trilha||{},horarioAulas:dados.horarioAulas||"",
                            totalLicoes:getTotalLicoes(courseCal),course:courseCal,
                          });
                          if(!preview){alert("Preencha Data de Início e selecione os Dias das Aulas.");return;}
                          if(!confirm(`Gerar calendário completo com ${preview.total} aulas (${formatDateBR(preview.dataInicio)} → ${formatDateBR(preview.dataFim)}) para ${student.name}? As Data Prevista serão atualizadas na trilha.`))return;
                          try{
                            const result=await aplicarCalendarioAluno(student.uid,{...student,...dados,licaoInicio:parseInt(dados.licaoInicio,10)||1},student.trilha||{});
                            alert(`Calendário gerado! ${result.total} aulas previstas até ${formatDateBR(result.dataFim)}.`);
                          }catch(e){alert("Erro: "+e.message);}
                        }}
                        className="btn rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2"
                        style={{background:"linear-gradient(135deg,#9b7de8,#6b4fc8)",color:"#fff",border:"none"}}>
                        <Icon name="calendar-days" size={14}/>Gerar Calendário Completo
                      </button>
                    )}
                  </div>
                </div>
              )}
              <div className="form-section-title">Status</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATUS_OPTIONS.map(s=>{
                  const cls={lead:"status-pill-lead",interessado:"status-pill-interesse",ativo:"status-pill-ativo",trancado:"status-pill-trancado",evadido:"status-pill-evadido"}[s]||"status-pill-inactive";
                  const lbl={lead:"Lead",interessado:"Interessado",ativo:"Ativo",trancado:"Trancado",evadido:"Evadido"}[s];
                  return <button key={s} onClick={()=>setD("status",s)} className={"status-pill "+(dados.status===s?cls:"status-pill-inactive")} style={{fontSize:12}}>{lbl}</button>;
                })}
              </div>
            </div>
          )}
          {tab===1&&(
            <div>
              <p style={{fontSize:12,color:"var(--font-muted)",marginBottom:16,fontStyle:"italic"}}>Perfil pedagógico e triagem do aluno.</p>
              <div className="form-section-title">1. Faixa Etária</div>
              <div className="triagem-group">{["Menos de 18 anos","18–24 anos","25–34 anos","35–44 anos","45–54 anos","55+ anos"].map(v=><TriOpt key={v} label={v} field="idadeFaixa" value={v}/>)}</div>
              <div className="form-section-title">2. Formação</div>
              <div className="triagem-group">{["Ensino Fundamental Incompleto","Ensino Fundamental Completo","Ensino Médio Incompleto","Ensino Médio Completo","Ensino Superior Incompleto","Ensino Superior Completo","Pós-graduação ou mais"].map(v=><TriOpt key={v} label={v} field="formacao" value={v}/>)}</div>
              <div className="form-section-title">3. Situação Profissional</div>
              <div className="triagem-group">{["Estudante","Autônomo","Funcionário público","CLT","Empreendedor","Outro"].map(v=><TriOpt key={v} label={v} field="ocupacao" value={v}/>)}</div>
              <div style={{marginTop:8}}><label className="form-label">Área de interesse</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={triagem.areaInteresse||""} onChange={e=>setT("areaInteresse",e.target.value)}/></div>
              <div className="form-section-title">4. Experiência com Inglês</div>
              <div style={{marginBottom:10}}><label className="form-label">Já estudou inglês antes?</label>
                <div style={{display:"flex",gap:8,marginTop:4}}>{["Sim","Não"].map(v=><button key={v} onClick={()=>setT("estudouIngles",v)} className={"status-pill "+(triagem.estudouIngles===v?"status-pill-ativo":"status-pill-inactive")} style={{fontSize:12}}>{v}</button>)}</div>
              </div>
              {triagem.estudouIngles==="Sim"&&(<>
                <div style={{marginBottom:8}}><label className="form-label">Onde estudou</label><div className="triagem-group" style={{marginTop:4}}>{["Escola regular","Curso de idiomas","Online","Outro"].map(v=><TriMulti key={v} label={v} field="ondeComo" value={v}/>)}</div></div>
                <div style={{marginBottom:8}}><label className="form-label">Avaliação</label><div style={{marginTop:8}}><Rating field="qualidadeMaterial" label="Material"/><Rating field="qualidadeProfessores" label="Professores"/><Rating field="qualidadeMetodologia" label="Metodologia"/></div></div>
                <div style={{marginBottom:8}}><label className="form-label">Pontos positivos</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.pontosPositivos||""} onChange={e=>setT("pontosPositivos",e.target.value)}/></div>
                <div style={{marginBottom:8}}><label className="form-label">O que poderia melhorar</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.melhorias||""} onChange={e=>setT("melhorias",e.target.value)}/></div>
              </>)}
              <div className="form-section-title">5. Interesses</div>
              <div style={{marginBottom:10}}><label className="form-label">Tópicos</label><div className="triagem-group" style={{marginTop:4}}>{["Cultura (artes, história, tradições)","Tecnologia","Esportes","Moda e tendências","Negócios e economia","Sustentabilidade e meio ambiente"].map(v=><TriMulti key={v} label={v} field="topicos" value={v}/>)}</div></div>
              <div style={{marginBottom:8}}><label className="form-label">Temas que não gosta</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.temasSemInteresse||""} onChange={e=>setT("temasSemInteresse",e.target.value)}/></div>
              <div className="form-section-title">6. Expectativas</div>
              <div style={{marginBottom:10}}><label className="form-label">Objetivo</label><div className="triagem-group" style={{marginTop:4}}>{["Conseguir um emprego","Falar fluentemente em viagens","Passar em testes de proficiência","Melhorar minha confiança na comunicação","Outro"].map(v=><TriOpt key={v} label={v} field="objetivo" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Horas por semana</label><div className="triagem-group" style={{marginTop:4}}>{["Menos de 1 hora","1–2 horas","3–4 horas","Mais de 4 horas"].map(v=><TriOpt key={v} label={v} field="horasSemana" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Prazo esperado</label><div className="triagem-group" style={{marginTop:4}}>{["3 meses","6 meses","1 ano","Mais de 1 ano"].map(v=><TriOpt key={v} label={v} field="prazo" value={v}/>)}</div></div>
              <div><label className="form-label">Observações</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={3} style={{resize:"vertical"}} value={triagem.observacoes||""} onChange={e=>setT("observacoes",e.target.value)}/></div>
            </div>
          )}
        </div>
        {err&&<div className="err-box" role="alert" style={{margin:"0 20px 12px"}}>{err}</div>}
        <div className="modal-footer" style={{flexWrap:"wrap",gap:8}}>
          <button type="button" className="btn btn-danger rounded-xl px-4 py-2 text-sm inline-flex items-center gap-1.5" onClick={handleDelete} disabled={saving}>
            <Icon name="trash-2" size={14}/> Excluir
          </button>
          <div style={{flex:1}}/>
          {tab===1&&<button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setTab(0)}>← Dados Pessoais</button>}
          {tab===0&&<button type="button" className="btn rounded-xl px-4 py-2 text-sm font-semibold" onClick={()=>setTab(1)}>Perfil →</button>}
          <button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setEditing(false)}>Voltar à folha</button>
          <button type="button" className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={handleSave} disabled={saving}>
            {saving?<div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>:<Icon name="check-circle" size={15}/>}
            {saving?"Salvando...":"Salvar alterações"}
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

/* ── CSS EXTRA PARA DASHBOARD ── */
const dashCSS=`
.dash-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 12px;border-radius:16px;cursor:pointer;border:1px solid var(--divider);background:var(--card);transition:all .18s;min-width:90px;flex:1;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--font);position:relative;overflow:hidden;}
.dash-nav-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(30,143,168,.06));opacity:0;transition:opacity .18s;}
.dash-nav-btn:hover::before{opacity:1;}
.dash-nav-btn:hover{border-color:rgba(30,143,168,.55);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.22);}
.dash-stat-card{background:var(--card);border:1px solid var(--divider);border-radius:16px;padding:16px 20px;transition:transform .15s,box-shadow .15s;}
.dash-stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.dash-stat-num{font-size:28px;font-weight:800;font-family:'Sora',sans-serif;line-height:1;}
.dash-stat-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--font-muted);margin-top:4px;}
.aula-hoje-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid var(--divider);background:var(--lesson);margin-bottom:6px;transition:background .12s,border-color .12s;}
.aula-hoje-item:hover{border-color:rgba(30,143,168,.35);background:rgba(30,143,168,.04);}

function FluencyCalendar({monthKey,events,onMonthChange,selectedDate,onSelectDate,compact,dayDetailEvents,embedded}){
  const [y,m]=monthKey.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startPad=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  const cells=[];
  for(let i=0;i<startPad;i++)cells.push({empty:true,key:"p"+i});
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells.push({iso,day:d,events:(events||[]).filter(e=>e.date===iso)});
  }
  const selectedEvents=selectedDate?(dayDetailEvents||(events||[]).filter(e=>e.date===selectedDate)):[];
  const evCls={aula:"fc-ev-aula",feriado:"fc-ev-feriado",carnaval:"fc-ev-carnaval",recesso:"fc-ev-recesso",agenda:"fc-ev-custom"};
  const inner=(
    <>
      <div className="fc-head">
        <button className="fin-month-btn" onClick={()=>onMonthChange(shiftMonthKey(monthKey,-1))}><Icon name="chevron-left" size={16}/></button>
        <div className="fc-title">{formatMonthYear(monthKey)}</div>
        <button className="fin-month-btn" onClick={()=>onMonthChange(shiftMonthKey(monthKey,1))}><Icon name="chevron-right" size={16}/></button>
        <button className="btn rounded-xl px-3 py-1.5 text-xs" onClick={()=>{
          const today=new Date().toISOString().slice(0,10);
          onMonthChange(getMonthKey(new Date()));
          onSelectDate&&onSelectDate(today);
        }}>Hoje</button>
      </div>
      <div className="fc-grid">
        {["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=><div key={d} className="fc-dow">{d}</div>)}
        {cells.map((c,i)=>{
          if(c.empty)return <div key={c.key} className="fc-day other"/>;
          const closed=isStudioClosed(c.iso);
          return(
            <div key={c.iso} className={"fc-day"+(c.iso===todayStr?" today":"")+(closed?" closed":"")+(selectedDate===c.iso?" ring-2":"")}
              style={selectedDate===c.iso?{boxShadow:"inset 0 0 0 2px rgba(30,143,168,.6)"}:{}} onClick={()=>onSelectDate&&onSelectDate(c.iso)}>
              <div className="fc-day-num">{c.day}</div>
              {!compact&&c.events.slice(0,3).map((e,j)=><div key={j} className={"fc-ev "+(evCls[e.type]||"fc-ev-custom")} title={e.label}>{e.time?e.time.split("–")[0].trim()+" · ":""}{e.label}</div>)}
              {compact&&c.events.length>0&&<div style={{display:"flex",gap:3,marginTop:2,flexWrap:"wrap"}}>
                {c.events.slice(0,4).map((e,j)=><span key={j} style={{width:6,height:6,borderRadius:99,background:e.color||"#1e8fa8",display:"inline-block"}}/>)}
              </div>}
            </div>
          );
        })}
      </div>
      {selectedDate&&onSelectDate&&(
        <div className="fc-side">
          <div className="fc-side-title">{formatDateBR(selectedDate)}</div>
          {selectedEvents.length===0
            ?<div style={{fontSize:12,color:"var(--font-muted)"}}>Nenhum evento neste dia.</div>
            :selectedEvents.map((e,i)=><div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:6,alignItems:"flex-start"}}>
              <span className={"fc-ev "+(evCls[e.type]||"fc-ev-custom")} style={{flexShrink:0,padding:"1px 5px",fontSize:8}}>{e.type==="aula"?"Aula":e.type==="agenda"?"Agenda":e.type}</span>
              <span style={{fontWeight:700,color:e.color||"var(--font)"}}>{e.time?e.time+" · ":""}{e.label}</span>
            </div>)}
        </div>
      )}
    </>
  );
  return embedded?inner:<div className="fc-wrap">{inner}</div>;
}

function ModalAgendar({onClose,onSave}){
  const [titulo,setTitulo]=useState("");
  const [data,setData]=useState(new Date().toISOString().slice(0,10));
  const [hora,setHora]=useState("10:00");
  const [notas,setNotas]=useState("");
  return(
    <ModalOverlay onClose={onClose} labelledBy="modal-agendar-title">
      <div className="modal-box" style={{maxWidth:480}}>
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}><Icon name="calendar-plus" size={18}/><div id="modal-agendar-title" style={{fontWeight:800,fontSize:15}}>Agendar</div></div>
          <button type="button" onClick={onClose} aria-label="Fechar" style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff"}}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-body space-y-3">
          <div><label className="form-label" htmlFor="agendar-titulo">Título</label><input id="agendar-titulo" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Ex: Reunião, avaliação..." autoFocus/></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="form-label">Data</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={data} onChange={e=>setData(e.target.value)}/></div>
            <div><label className="form-label">Horário</label><input type="time" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={hora} onChange={e=>setHora(e.target.value)}/></div>
          </div>
          <div><label className="form-label">Notas</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} value={notas} onChange={e=>setNotas(e.target.value)}/></div>
        </div>
        <div className="modal-footer">
          <button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={onClose}>Cancelar</button>
          <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={()=>{
            if(!titulo.trim()){alert("Informe um título.");return;}
            onSave({id:Date.now().toString(),titulo:titulo.trim(),data,hora,notas:notas.trim(),type:"agenda"});
            onClose();
          }}>Salvar</button>
        </div>
      </div>
    </ModalOverlay>
  );
}

function AdminAgendaDashboard({students,onBack}){
  const clock=useStudioClock(30000);
  const hojeISO=clock.todayISO;
  const [agenda,setAgenda]=useState({todos:[],eventos:[],workingDays:PROF_WORKING_DAYS_DEFAULT,workingHours:PROF_WORKING_HOURS_DEFAULT,regularOccupied:{}});
  const [showAgendar,setShowAgendar]=useState(false);
  const [newTodo,setNewTodo]=useState("");
  const [prepLesson,setPrepLesson]=useState(null);
  const [syncOccMsg,setSyncOccMsg]=useState("");

  useEffect(()=>db.collection("studio").doc("agenda").onSnapshot(doc=>{
    const d=doc.exists?doc.data():{};
    const avail=getProfessorAvailability(d);
    setAgenda({
      todos:d.todos||[],
      eventos:d.eventos||[],
      workingDays:avail.workingDays,
      workingHours:avail.workingHours,
      regularOccupied:avail.regularOccupied,
      bookedSlots:d.bookedSlots||{},
    });
  }),[]);

  useEffect(()=>{
    if(!students||!students.length)return;
    const map=buildRegularOccupiedMap(students,60);
    db.collection("studio").doc("agenda").set({regularOccupied:map,regularOccupiedAt:new Date().toISOString()},{merge:true}).catch(()=>{});
  },[students]);

  async function saveAgenda(patch){
    const ref=db.collection("studio").doc("agenda");
    const cur=await ref.get();
    const base=cur.exists?cur.data():{todos:[],eventos:[]};
    await ref.set({...base,...patch},{merge:true});
  }

  async function syncRegularOccupation(){
    setSyncOccMsg("Sincronizando ocupação das aulas regulares…");
    try{
      const map=buildRegularOccupiedMap(students,60);
      await saveAgenda({regularOccupied:map,regularOccupiedAt:new Date().toISOString()});
      setSyncOccMsg("Ocupação atualizada: "+Object.keys(map).length+" slots de aulas regulares.");
    }catch(e){setSyncOccMsg("Erro ao sincronizar: "+(e.message||e));}
  }

  function toggleWorkingDay(day){
    const cur=agenda.workingDays||PROF_WORKING_DAYS_DEFAULT;
    const next=cur.includes(day)?cur.filter(d=>d!==day):[...cur,day];
    const ordered=DIAS_SEMANA.filter(d=>next.includes(d));
    saveAgenda({workingDays:ordered.length?ordered:PROF_WORKING_DAYS_DEFAULT});
  }
  function toggleWorkingHour(h){
    const cur=agenda.workingHours||PROF_WORKING_HOURS_DEFAULT;
    const next=cur.includes(h)?cur.filter(x=>x!==h):[...cur,h].sort();
    saveAgenda({workingHours:next.length?next:PROF_WORKING_HOURS_DEFAULT});
  }

  const agendaExtra=useMemo(()=>({eventos:agenda.eventos}),[agenda.eventos]);

  const proxima=useMemo(()=>findProximaAulaUnified(students,agendaExtra),[students,agendaExtra,clock.tick,clock.todayISO,clock.timeHHMM]);
  const aulasHoje=useMemo(()=>getAulasDoDia(students,hojeISO,agendaExtra),[students,hojeISO,agendaExtra,clock.tick]);
  const todosPendentes=(agenda.todos||[]).filter(t=>!t.done).length;
  const adminFcEvents=useMemo(()=>{
    const out=[];
    for(let i=0;i<3;i++){
      const mk=shiftMonthKey(getMonthKey(new Date()),i);
      buildAgendaEventsForMonth(students,mk,agendaExtra).forEach(e=>{
        const t=String(e.time||"").slice(0,5);
        const start=t?`${e.date}T${t}:00`:e.date;
        const colors={aula:"#0f766e",reposicao:"#7c3aed",agenda:"#60daa8",feriado:"#64748b",recesso:"#94a3b8",carnaval:"#f59e0b"};
        out.push({
          id:(e.id||e.type)+"-"+e.date+"-"+(e.time||"")+"-"+e.label,
          title:(t?t+" · ":"")+(e.label||e.type),
          start,
          allDay:!t,
          backgroundColor:colors[e.type]||"#334155",
          borderColor:colors[e.type]||"#334155",
          extendedProps:{...e}
        });
      });
    }
    return out;
  },[students,agendaExtra]);

  return(
    <div>
      <button className="btn rounded-xl px-3 py-2 text-sm mb-4 inline-flex items-center gap-2" onClick={onBack}><Icon name="arrow-left" size={14}/> Voltar ao Dashboard</button>

      <div className="glass rounded-2xl p-4 mb-4" style={{borderColor:"rgba(15,118,110,.35)"}}>
        <div className="font-bold text-sm" style={{fontFamily:"'Sora',sans-serif"}}>Calendário principal do estúdio</div>
        <p className="text-xs muted mt-1">Esta é a agenda-mãe: aulas dos alunos + eventos manuais + feriados. Os horários vagos de reposição saem daqui (dias/horários do professor − ocupação).</p>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#0f2c5c",fontSize:18}}>{proxima?formatDateBR(proxima.date).slice(0,5):"—"}</div><div className="dash-stat-label">Próxima Aula</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#0e4d6e"}}>{aulasHoje.length}</div><div className="dash-stat-label">Aulas Hoje</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#1e3a8a"}}>{todosPendentes}</div><div className="dash-stat-label">Tarefas Pendentes</div></div>
      </div>

      <div className="glass rounded-2xl p-4 mb-5">
        <div className="font-bold text-sm mb-2">Disponibilidade do professor (horários para reposição)</div>
        <div className="text-xs muted mb-2">Dias</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {DIAS_SEMANA.map(d=>(
            <button key={d} type="button" className={"status-pill "+((agenda.workingDays||[]).includes(d)?"status-pill-ativo":"status-pill-inactive")} style={{fontSize:11}} onClick={()=>toggleWorkingDay(d)}>{d}</button>
          ))}
        </div>
        <div className="text-xs muted mb-2">Horários</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {HORARIOS_AULA_OPTS.map(h=>(
            <button key={h} type="button" className={"status-pill "+((agenda.workingHours||[]).includes(h)?"status-pill-ativo":"status-pill-inactive")} style={{fontSize:11}} onClick={()=>toggleWorkingHour(h)}>{h}</button>
          ))}
        </div>
        <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={syncRegularOccupation}>Sincronizar ocupação das aulas regulares</button>
        {syncOccMsg&&<div className="text-xs muted mt-2">{syncOccMsg}</div>}
      </div>

      <div className="agenda-grid mb-5">
        <div className="space-y-4">
          <div className="agenda-next">
            <div className="agenda-next-label"><Icon name="zap" size={12} style={{display:"inline",marginRight:4}}/>Próxima Aula</div>
            {proxima
              ?<>
                <div className="agenda-next-title">{proxima.student?.name||"Aluno"}</div>
                <div style={{fontSize:13,color:"var(--font-muted)"}}>{formatDateBR(proxima.date)} · {proxima.time||"—"}</div>
                <div style={{fontSize:12,marginTop:6}}>Lição {proxima.lessonNum||"—"} · {getCourseLabel(proxima.student?.contrato)||proxima.student?.program||"—"}</div>
              </>
              :<div style={{fontSize:13,color:"var(--font-muted)"}}>Nenhuma aula prevista. Gere o calendário dos alunos em Alunos → Editar.</div>}
          </div>

          <div className="glass rounded-2xl p-5">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <Icon name="calendar-check" size={16} style={{color:"#1e8fa8"}}/>
              <span style={{fontWeight:700,fontSize:14}}>Aulas e Eventos de Hoje</span>
              <span style={{fontSize:11,color:"var(--font-muted)"}}>{getTodayPT()}</span>
            </div>
            {aulasHoje.length===0
              ?<div style={{textAlign:"center",padding:"12px 0",color:"var(--font-muted)",fontSize:13}}>Nenhuma aula para hoje.</div>
              :aulasHoje.map((s,i)=>(
                <button key={s.uid+"-"+i} type="button" className="aula-hoje-item" style={{width:"100%",textAlign:"left",cursor:"pointer"}} onClick={()=>{
                  const st=(students||[]).find(x=>x.uid===s.uid);
                  const course=getCourseById(st?.contrato);

  );

/* ── AGENDA DO ALUNO + REPOSIÇÕES (FullCalendar) ── */
const REPO_STATUS={PENDENTE:"PENDENTE",AGENDADO:"AGENDADO",REPOSICAO_FEITA:"REPOSICAO_FEITA"};
/* Must match JS_TO_DIA / DIAS_SEMANA names (NOT "seg"/"ter") */
const PROF_WORKING_DAYS_DEFAULT=["Segunda","Terça","Quarta","Quinta","Sexta"];
const PROF_WORKING_HOURS_DEFAULT=["06:30","07:00","08:00","08:10","09:00","10:00","11:00","12:00","12:15","12:50","13:25","14:00","15:00","16:00","16:20","17:00","17:25","17:30","18:00","18:05","18:40","19:00","19:15","19:50","20:00","20:25"];
function getProfessorAvailability(agendaDoc){
  const d=agendaDoc||{};
  const days=Array.isArray(d.workingDays)&&d.workingDays.length?d.workingDays:PROF_WORKING_DAYS_DEFAULT;
  const hours=Array.isArray(d.workingHours)&&d.workingHours.length?d.workingHours:PROF_WORKING_HOURS_DEFAULT;
  return{workingDays:days,workingHours:hours,regularOccupied:d.regularOccupied||{}};
}
function buildRegularOccupiedMap(students,daysAhead=60){
  const map={};
  const today=new Date().toISOString().slice(0,10);
  const list=(students||[]).filter(s=>(s.status||normalizeStatus(null,s))==="ativo");
  for(let i=0;i<=daysAhead;i++){
    const iso=addDaysISO(today,i);
    if(isStudioClosed(iso))continue;
    const mk=iso.slice(0,7);
    buildAgendaEventsForMonth(list,mk).forEach(e=>{
      if(e.type!=="aula"||e.date!==iso)return;
      const t=String(e.time||"").slice(0,5);
      if(!t)return;
      map[iso+"_"+t]={studentUid:e.studentUid,studentName:e.studentName,type:"aula_regular"};
    });
  }
  return map;
}

function diaryGrantsReposicao(entry){
  const st=normalizeDiarioStatus(entry);
  return st==="falta_aluno_com_reposicao"||st==="ausencia_com_reposicao"||st==="falta_professor"||st==="adequacao_com_reposicao"||st==="a_repor";
}
function diaryReposicaoTipoLabel(entry){
  const st=normalizeDiarioStatus(entry);
  if(st==="falta_professor"||entry.reposicaoMotivo==="professor")return"Falta do professor";
  if(isReposicaoAdequacao(entry)||st==="adequacao_com_reposicao")return"Adequação (não consome gratuita)";
  return"Falta do aluno";
}
function diaryReposicaoValidUntil(entry){
  const st=normalizeDiarioStatus(entry);
  if(st==="falta_professor")return null; // sem limite
  // Adequação e falta do aluno: 30 dias (vence e perde normalmente)
  if(entry.reposicaoVence)return entry.reposicaoVence;
  if(!entry.date)return null;
  return addDaysISO(entry.date,30);
}
function isReposicaoVencida(entry,todayISO){
  const st=normalizeDiarioStatus(entry);
  if(st==="falta_professor")return false;
  if((entry.reposicaoStatus||REPO_STATUS.PENDENTE)===REPO_STATUS.REPOSICAO_FEITA)return false;
  if((entry.reposicaoStatus||"")===REPO_STATUS.AGENDADO)return false;
  const until=diaryReposicaoValidUntil(entry);
  return !!(until&&todayISO>until);
}
function isReposicaoAFazer(entry,todayISO){
  if(!diaryGrantsReposicao(entry))return false;
  const rs=entry.reposicaoStatus||REPO_STATUS.PENDENTE;
  if(rs===REPO_STATUS.REPOSICAO_FEITA)return false;
  if(rs===REPO_STATUS.AGENDADO)return true; // ainda conta até ser feita? Spec: a fazer decrements when FEITA. AGENDADO still "a fazer" scheduled.
  return !isReposicaoVencida(entry,todayISO);
}
function computeReposicaoCounters(diarioEntries,todayISO){
  const today=todayISO||new Date().toISOString().slice(0,10);
  let aFazer=0,vencidas=0,agendadas=0;
  (diarioEntries||[]).forEach(e=>{
    if(!diaryGrantsReposicao(e))return;
    const rs=e.reposicaoStatus||REPO_STATUS.PENDENTE;
    if(rs===REPO_STATUS.REPOSICAO_FEITA)return;
    if(rs===REPO_STATUS.AGENDADO){agendadas++;aFazer++;return;}
    if(isReposicaoVencida(e,today))vencidas++;
    else aFazer++;
  });
  return{aFazer,vencidas,agendadas};
}
async function syncStudentReposicaoCounters(uid,diarioEntries){
  const c=computeReposicaoCounters(diarioEntries);
  try{
    await db.collection("students").doc(uid).set({
      reposicoesAFazer:c.aFazer,
      reposicoesVencidas:c.vencidas,
      reposicoesAgendadas:c.agendadas,
      reposicoesUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    },{merge:true});
  }catch(e){console.warn("sync reposicao counters",e);}
  return c;
}
function nextPaymentInfo(financeiro){
  const parcelas=financeiro?.parcelas||[];
  const snap=typeof resolveFinanceSnapshot==="function"?resolveFinanceSnapshot(parcelas):{};
  const today=getTodayISO();
  const open=(parcelas||[]).filter(p=>getEffectiveParcelStatus(p,today)!=="paga").sort((a,b)=>(a.dataVencimento||"").localeCompare(b.dataVencimento||""));
  const next=open[0]||null;
  if(!next||!next.dataVencimento)return{date:null,status:"sem_vencimento",label:"Sem vencimento cadastrado",days:null};
  const due=next.dataVencimento;
  const eff=getEffectiveParcelStatus(next,today);
  if(eff==="vencida"||due<today)return{date:due,status:"atrasado",label:"Atrasado",days:Math.round((new Date(today+"T12:00:00")-new Date(due+"T12:00:00"))/86400000)};
  const days=Math.round((new Date(due+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(days===0)return{date:due,status:"hoje",label:"Vence hoje",days:0};
  if(days<=7)return{date:due,status:"proximo",label:"Vence em "+days+" dia(s)",days};
  return{date:due,status:"em_dia",label:"Em dia",days};
}
function findNextClassEvent(uid,schedule,trilhaData){
  const today=new Date().toISOString().slice(0,10);
  const arr=[{
    uid,name:"",status:"ativo",
    diasAulas:schedule?.diasAulas||[],horarioAulas:schedule?.horarioAulas||"",
    dataInicio:schedule?.dataInicio||"",trilha:trilhaData||{},calendarioCompleto:schedule?.calendarioCompleto||[],
  }];
  for(let i=0;i<6;i++){
    const mk=shiftMonthKey(getMonthKey(new Date()),i);
    const evs=buildAgendaEventsForMonth(arr,mk,{onlyUid:uid}).filter(e=>e.type==="aula"&&e.date>=today);
    if(evs.length)return evs.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""))[0];
  }
  return null;
}
function lessonForCalendarDate(trilhaData,schedule,course,dateISO){
  const cal=(schedule?.calendarioCompleto||[]).find(c=>c.date===dateISO);
  if(cal?.lessonId){
    const books=mergeBooks(trilhaData||{},course);
    for(const b of books){const it=b.items.find(i=>i.id===cal.lessonId);if(it)return it;}
  }
  if(cal?.lessonNum){
    const id=lessonIdFromNum(cal.lessonNum,course);
    const books=mergeBooks(trilhaData||{},course);
    for(const b of books){const it=b.items.find(i=>i.id===id);if(it)return it;}
  }
  // fallback: next pending/atual lesson
  const books=mergeBooks(trilhaData||{},course);
  for(const b of books){
    const it=b.items.find(i=>i.status==="atual"||i.status==="andamento");
    if(it)return it;
  }
  return null;
}

function FullCalendarBox({events,onEventClick,selectable,onDateSelect,height}){
  const ref=useRef(null);
  const calRef=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof FullCalendar==="undefined")return;
    if(calRef.current){calRef.current.destroy();calRef.current=null;}
    calRef.current=new FullCalendar.Calendar(ref.current,{
      locale:"pt-br",
      initialView:"dayGridMonth",
      height:height||520,
      headerToolbar:{left:"prev,next today",center:"title",right:"dayGridMonth,timeGridWeek,listWeek"},
      buttonText:{today:"Hoje",month:"Mês",week:"Semana",list:"Lista"},
      navLinks:true,
      editable:false,
      selectable:!!selectable,
      selectMirror:true,
      dayMaxEvents:3,
      events:events||[],
      eventClick:(info)=>{
        info.jsEvent.preventDefault();
        onEventClick&&onEventClick(info.event);
      },
      select:(sel)=>{
        if(onDateSelect)onDateSelect(sel);
        calRef.current.unselect();
      },
      eventDidMount:(info)=>{
        if(info.event.extendedProps?.blocked){
          info.el.style.opacity=".45";
          info.el.style.pointerEvents="none";
        }
      }
    });
    calRef.current.render();
    return()=>{if(calRef.current){calRef.current.destroy();calRef.current=null;}};
  },[events,selectable,height]);
  if(typeof FullCalendar==="undefined"){
    return <div className="glass rounded-2xl p-6 text-center muted">FullCalendar não carregou. Verifique a conexão e recarregue a página.</div>;
  }
  return <div className="fc-host glass rounded-2xl p-3" ref={ref}/>;
}

function ScheduleReposicaoModal({uid,faltas,onClose,onDone}){
  const [step,setStep]=useState("pick"); // pick | slot | saving | done | error
  const [faltaselected,setFalta]=useState(null);
  const [slots,setSlots]=useState([]);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [picked,setPicked]=useState(null);

  useEffect(()=>{
    if(step!=="slot")return;
    let alive=true;
    (async()=>{
      setBusy(true);setErr("");
      try{
        let booked={};
        let avail={workingDays:PROF_WORKING_DAYS_DEFAULT,workingHours:PROF_WORKING_HOURS_DEFAULT,regularOccupied:{}};
        try{
          const bookedSnap=await db.collection("bookedSlots").get();
          bookedSnap.docs.forEach(d=>{booked[d.id]=d.data();});
        }catch(e){}
        try{
          const agenda=await db.collection("studio").doc("agenda").get();
          const ad=agenda.exists?agenda.data():{};
          Object.assign(booked,ad.bookedSlots||{});
          avail=getProfessorAvailability(ad);
        }catch(e){}
        const occupied={...avail.regularOccupied,...booked};
        const out=[];
        const today=new Date().toISOString().slice(0,10);
        for(let d=1;d<=45;d++){
          const iso=addDaysISO(today,d);
          if(typeof isStudioClosed==="function"&&isStudioClosed(iso))continue;
          const dow=JS_TO_DIA[new Date(iso+"T12:00:00").getDay()];
          if(!avail.workingDays.includes(dow))continue;
          avail.workingHours.forEach(h=>{
            const id=iso+"_"+h;
            if(occupied[id])return;
            out.push({id,date:iso,time:h,label:formatDateBR(iso)+" · "+h});
          });
        }
        if(alive){
          setSlots(out.slice(0,120));
          if(!out.length)setErr("Nenhum horário livre. No admin: Agenda → configure dias/horários do professor e sincronize a ocupação.");
        }
      }catch(e){if(alive)setErr("Não foi possível carregar horários vagos.");}
      finally{if(alive)setBusy(false);}
    })();
    return()=>{alive=false;};
  },[step]);

  async function confirm(){
    if(!faltaselected||!picked)return;
    setStep("saving");setErr("");
    const slotId=picked.id;
    const payload={
      studentUid:uid,
      type:"reposicao",
      date:picked.date,
      time:picked.time,
      diarioId:faltaselected.id,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    };
    try{
      await db.runTransaction(async(tx)=>{
        const ref=db.collection("bookedSlots").doc(slotId);
        const snap=await tx.get(ref);
        if(snap.exists)throw new Error("Horário acabou de ser ocupado. Escolha outro.");
        tx.set(ref,payload);
        const dRef=db.collection("students").doc(uid).collection("diario").doc(faltaselected.id);
        tx.update(dRef,{
          reposicaoStatus:REPO_STATUS.AGENDADO,
          reposicaoAgendadaEm:picked.date,
          reposicaoHorario:picked.time,
          reposicaoSlotId:slotId,
        });
        const cRef=db.collection("students").doc(uid).collection("calendarEvents").doc("repo_"+faltaselected.id);
        tx.set(cRef,{
          type:"reposicao",
          date:picked.date,
          time:picked.time,
          diarioId:faltaselected.id,
          title:"Reposição",
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        },{merge:true});
      });
      try{
        await db.collection("studio").doc("agenda").set({bookedSlots:{[slotId]:payload}},{merge:true});
      }catch(e){}
      setStep("done");
      onDone&&onDone();
    }catch(e){
      setErr(e.message||"Falha ao agendar.");
      setStep("slot");
    }
  }

  return(
    <div className="tj-sheet" role="dialog" aria-modal="true" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="tj-sheet-panel" onClick={e=>e.stopPropagation()} style={{maxWidth:560}}>
        <div className="tj-sheet-head">
          <div>
            <div style={{fontSize:11,opacity:.7,textTransform:"uppercase",letterSpacing:".08em"}}>Reposições</div>
            <div style={{fontSize:18,fontWeight:800,fontFamily:"'Sora',sans-serif"}}>Agendar Reposição</div>
          </div>
          <button type="button" className="tj-sheet-close" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <div className="tj-sheet-body space-y-3">
          {err&&<div className="err-box text-sm">{err}</div>}
          {step==="pick"&&(
            <>
              <p className="text-sm muted">Selecione a falta que deseja repor:</p>
              {faltas.length===0?<p className="text-sm">Nenhuma reposição pendente.</p>:faltas.map(f=>(
                <button key={f.id} type="button" className="glass rounded-xl px-4 py-3 w-full text-left" onClick={()=>{setFalta(f);setStep("slot");}}>
                  <div className="font-semibold text-sm">{formatDateBR(f.date)} · {diaryReposicaoTipoLabel(f)}</div>
                  <div className="text-xs muted">Aula {f.num}{f.licaoTitulo?(" · "+f.licaoTitulo):""}{diaryReposicaoValidUntil(f)?(" · válido até "+formatDateBR(diaryReposicaoValidUntil(f))):" · sem prazo"}</div>
                </button>
              ))}
            </>
          )}
          {step==="slot"&&(
            <>
              <button type="button" className="page-back" onClick={()=>setStep("pick")}><Icon name="arrow-left" size={14}/> Trocar falta</button>
              <p className="text-sm muted">Horários vagos do professor:</p>
              {busy&&<div className="text-sm muted">Carregando horários…</div>}
              {!busy&&slots.length===0&&<div className="text-sm muted">Nenhum horário vago nos próximos dias.</div>}
              <div className="space-y-2" style={{maxHeight:320,overflow:"auto"}}>
                {slots.map(s=>(
                  <button key={s.id} type="button" className={"rounded-xl px-3 py-2 w-full text-left text-sm "+(picked?.id===s.id?"btn-primary btn":"glass")} onClick={()=>setPicked(s)}>{s.label}</button>
                ))}
              </div>
              <button type="button" className="btn btn-primary rounded-xl px-4 py-3 w-full font-semibold" disabled={!picked} onClick={confirm}>Confirmar horário</button>
            </>
          )}
          {step==="saving"&&<div className="text-center py-8 muted">Agendando…</div>}
          {step==="done"&&(
            <div className="text-center space-y-3 py-4">
              <div className="text-lg font-bold" style={{color:"#14b8a6"}}>Reposição agendada!</div>
              <p className="text-sm muted">Status no diário: AGENDADO</p>
              <button type="button" className="btn btn-primary rounded-xl px-4 py-2" onClick={onClose}>Fechar</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

async function ensureTrilhaAtual(uid,trilhaData,schedule,course,diarioEntries){
  const today=new Date().toISOString().slice(0,10);
  const lesson=lessonForCalendarDate(trilhaData,schedule,course,today);
  if(!lesson||!lesson.id)return;
  if(lesson.status==="concluida"||lesson.status==="realizada"||lesson.status==="atual")return;
  // only promote if there is a class today for this student
  const hasClassToday=(schedule?.calendarioCompleto||[]).some(c=>c.date===today)
    || ((schedule?.diasAulas||[]).includes(JS_TO_DIA[new Date(today+"T12:00:00").getDay()]));
  if(!hasClassToday)return;
  const patch={};patch[`trilha.${lesson.id}.status`]="atual";
  await db.collection("students").doc(uid).update(patch);
}

function PresenceConfirmPage({uid,profile,schedule,trilhaData,financeiro,onDone}){
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  const courses=useCourses();
  const c=useMemo(()=>getCourseById(profile?.contrato),[courses,profile?.contrato]);
  const today=getTodayISO();
  const horario=(schedule?.horarioAulas||"09:00").slice(0,5);
  async function confirm(present){
    setBusy(true);setMsg("");
    try{
      if(present){
        await db.collection("students").doc(uid).collection("notifications").add({
          type:"presence_confirm",title:"Presença confirmada",message:"Você confirmou presença na aula de hoje.",read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),date:today
        });
        setMsg("Presença confirmada. Bom estudo!");
        onDone&&onDone(true);
        return;
      }
      // AUSENTE
      const [hh,mm]=(horario||"09:00").split(":").map(Number);
      const classAt=new Date(today+"T"+String(hh||9).padStart(2,"0")+":"+String(mm||0).padStart(2,"0")+":00");
      const hoursAhead=(classAt-new Date())/3600000;
      const diarioSnap=await db.collection("students").doc(uid).collection("diario").get();
      const entries=diarioSnap.docs.map(d=>({id:d.id,...d.data()}));
      const counters=computeReposicaoCounters(entries,today);
      // gratuitas: count how many falta_aluno_com_reposicao not vencida + contract limit if any
      const aulasCount=normalizeAulasSemanais(profile?.aulasSemanais,profile?.diasAulas,profile?.horarioAulas).filter(a=>a.dia&&a.horario).length;
      const limit=Number(profile?.reposicoesGratuitasContrato??financeiro?.reposicoesGratuitas??(aulasCount||1));
      // Adequação NÃO entra na cota de gratuitas do contrato
      const used=entries.filter(e=>countsAgainstGratuitasContrato(e)).length;
      const hasGratis=used<limit;
      const okTime=hoursAhead>=3;
      let grant=okTime&&hasGratis;
      let reason="";
      if(!okTime)reason="menos de 3h de antecedência";
      else if(!hasGratis)reason="esgotou as gratuitas do contrato";

      const nextNum=entries.length?Math.max(...entries.map(e=>e.num||0))+1:1;
      const lesson=lessonForCalendarDate(trilhaData,schedule,c,today);
      const entry={
        num:nextNum,
        date:today,
        licaoNum:lesson?.num||null,
        licaoId:lesson?.id||"",
        licaoTitulo:lesson?.title||"",
        status:grant?"falta_aluno_com_reposicao":"falta_aluno_sem_reposicao",
        reposicaoTipo:grant?"com":"sem",
        reposicaoStatus:grant?REPO_STATUS.PENDENTE:"",
        reposicaoVence:grant?addDaysISO(today,30):"",
        ocorrido:grant?"Ausência com direito a reposição (auto)":("Ausência sem reposição. Motivo: "+reason),
        obs:"Confirmado pelo aluno via portal",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        source:"presence_confirm",
      };
      await db.collection("students").doc(uid).collection("diario").add(entry);
      await db.collection("students").doc(uid).collection("notifications").add({
        type:"presence_absent",title:"Ausência registrada",message:grant?"Direito a reposição gerado.":("Não há direito a reposição. Motivo: "+reason),read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),date:today
      });
      // notify admin
      try{
        await db.collection("studio").doc("adminNotifications").collection("items").add({
          type:"aluno_ausente",studentUid:uid,studentName:profile?.name||"",reason:grant?"com reposição":reason,date:today,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false
        });
      }catch(e){}
      if(grant)setMsg("Ausência registrada. Direito a reposição liberado.");
      else setMsg("Não há direito a reposição. Motivo: "+reason);
      onDone&&onDone(false);
    }catch(e){setMsg("Erro: "+(e.message||e));}
    finally{setBusy(false);}
  }

  return(
    <div className="glass rounded-2xl p-6 space-y-4">
      <h3 className="text-xl font-bold" style={{fontFamily:"'Sora',sans-serif"}}>CONFIRME SUA AULA DE HOJE</h3>
      <p className="text-sm">Horário previsto: <strong>{horario}</strong></p>
      <div className="rounded-xl p-3 text-sm" style={{background:"rgba(245,158,11,.12)",border:"1px solid rgba(245,158,11,.35)"}}>
        Reposição somente liberada se for desmarcado até 3h de antecedência e se estiver dentro do número de reposições gratuitas do seu contrato.
      </div>
      <div className="grid gap-3 sm:grid-cols-2">
        <button type="button" className="btn btn-primary rounded-2xl px-4 py-6 text-base font-bold" disabled={busy} onClick={()=>confirm(true)}>CONFIRMAR PRESENÇA</button>
        <button type="button" className="btn rounded-2xl px-4 py-6 text-base font-bold" style={{background:"rgba(229,99,107,.15)",border:"1px solid rgba(229,99,107,.4)"}} disabled={busy} onClick={()=>confirm(false)}>AUSENTE</button>
      </div>
      {msg&&<div className="text-sm font-semibold">{msg}</div>}
    </div>
  );
}

/** Resolve links relativos da programação (ex.: materiais/...) a partir da pasta do portal.html. */
function resolvePortalAssetUrl(url){
  const u=String(url||"").trim();
  if(!u)return"";
  if(/^(https?:|mailto:|tel:|data:)/i.test(u))return u;
  if(u.startsWith("//"))return(typeof location!=="undefined"?location.protocol:"https:")+u;
  if(u.startsWith("/"))return u;
  try{
    const base=typeof location!=="undefined"?location.href:"";
    // portal.html na raiz da pasta → materiais/... relativo à pasta
    if(/portal\.html/i.test(base)){
      return new URL(u, base.replace(/[^/]*portal\.html.*$/i,"")).href;
    }
    return new URL(u, base).href;
  }catch(e){
    return u;
  }
}
