    try{ localStorage.removeItem('fs-theme'); }catch(e){}
    // local first (só cores)
    try{
      var local=JSON.parse(localStorage.getItem('fs-appearance')||'null');
      if(local){
        local=stripThemeMode(local);
        applyTheme(local);
        try{ localStorage.setItem('fs-appearance', JSON.stringify(local)); }catch(e){}
      }else{
        applyTheme(window.__APPEARANCE_DEFAULTS);
      }
    }catch(e){
      applyTheme(window.__APPEARANCE_DEFAULTS);
    }
    try{
      firebase.firestore().collection('config').doc('aparencia').get().then(function(doc){
        if(doc.exists){

          try{ localStorage.setItem('fs-appearance', JSON.stringify(data)); }catch(e){}
        }

    }catch(e){}

function _normHash(h){
  let s=String(h||"").trim();
  if(!s||s==="#")return "#/";
  if(s.charAt(0)!=="#")s="#"+s;
  if(s==="#")return "#/";
  // "#foo" -> "#/foo" ; keep "#/..."
  if(s.length>1&&s.charAt(1)!=="/")s="#/"+s.slice(1);
  // strip trailing slash except root
  if(s.length>2&&s.endsWith("/"))s=s.slice(0,-1);
  return s;
}

function parsePortalRoute(){
  const fullHash=location.hash||"";
  // Só usa sessionStorage quando NÃO há hash (WebView/edge). "#/" é home legítima.
  if(!fullHash||fullHash==="#"){
    try{
      const saved=sessionStorage.getItem(PORTAL_ROUTE_SS_KEY);
      if(saved){
        const o=JSON.parse(saved);
        if(o&&typeof o==="object"&&(o.role||o.page||o.view))return o;
      }
    }catch(e){}
    return{role:null,page:"dashboard",view:"dashboard",studentUid:null,tab:null,lessonId:null};
  }
  let raw=fullHash.replace(/^#/,"");
  if(raw.charAt(0)==="/")raw=raw.slice(1);
  const q=raw.indexOf("?");
  if(q>=0)raw=raw.slice(0,q);
  const parts=raw.split("/").filter(Boolean).map(p=>{try{return decodeURIComponent(p);}catch(e){return p;}});

  if(parts[0]==="admin"){
    if(parts[1]==="student"&&parts[2]){
      const tab=ADMIN_STUDENT_TABS.includes(parts[3])?parts[3]:"overview";
      return{role:"admin",page:null,view:"student",studentUid:parts[2],tab,lessonId:null};
    }
    const view=ADMIN_VIEWS.includes(parts[1])?parts[1]:"dashboard";
    return{role:"admin",page:null,view,studentUid:null,tab:null,lessonId:null};
  }

  // student routes: / , /trilha , /trilha/:lessonId , /materiais , ...
  if(!parts.length||parts[0]==="dashboard"){
    return{role:"student",page:"dashboard",view:null,studentUid:null,tab:null,lessonId:null};
  }
  const page=STUDENT_PAGES.includes(parts[0])?parts[0]:"dashboard";
  const lessonId=(page==="trilha"&&parts[1])?parts[1]:null;
  return{role:"student",page,view:null,studentUid:null,tab:null,lessonId};
}

function buildPortalHash(route){
  if(!route)return "#/";
  if(route.role==="admin"){
    if(route.view==="student"&&route.studentUid){
      const tab=route.tab&&route.tab!=="overview"?"/"+encodeURIComponent(route.tab):"";
      return "#/admin/student/"+encodeURIComponent(route.studentUid)+tab;
    }
    if(route.view&&route.view!=="dashboard")return "#/admin/"+encodeURIComponent(route.view);
    return "#/admin";
  }
  // student
  const page=route.page||"dashboard";
  if(page==="dashboard")return "#/";
  if(page==="trilha"&&route.lessonId)return "#/trilha/"+encodeURIComponent(route.lessonId);
  return "#/"+encodeURIComponent(page);
}

function routesEqual(a,b){
  if(!a||!b)return false;
  return a.role===b.role&&a.page===b.page&&a.view===b.view&&a.studentUid===b.studentUid&&a.tab===b.tab&&a.lessonId===b.lessonId;
}

function persistPortalRoute(route){
  try{sessionStorage.setItem(PORTAL_ROUTE_SS_KEY,JSON.stringify(route));}catch(e){}
}

/** Navega no histórico do browser (push/replace) e dispara sync da UI. */
function portalGo(route,opts){
  opts=opts||{};
  const hash=buildPortalHash(route);
  const state={portal:1,route};
  persistPortalRoute(route);
  const curHash=_normHash(location.hash);
  const nextHash=_normHash(hash);
  if(opts.replace||curHash===nextHash){
    history.replaceState(state,"",nextHash);
  }else{
    history.pushState(state,"",nextHash);
  }
  try{if(!opts.keepScroll)window.scrollTo(0,0);}catch(e){}
  try{window.dispatchEvent(new CustomEvent("portal-route",{detail:route}));}catch(e){}
}

/** Garante uma entrada base no histórico ao entrar no app (login → home). */
function portalEnsureBase(route){
  const r=route||{role:"student",page:"dashboard",view:null,studentUid:null,tab:null,lessonId:null};
  const hash=buildPortalHash(r);
  persistPortalRoute(r);
  history.replaceState({portal:1,route:r},"",_normHash(hash));
}

/** Hook: escuta voltar do browser, hashchange e bfcache (pageshow). */
function usePortalRouteListener(handler){
  useEffect(()=>{
    const apply=(fromEvent)=>{
      try{if(fromEvent!=="custom")window.scrollTo(0,0);}catch(e){}
      try{handler(parsePortalRoute());}catch(e){console.error("portal route:",e);}
    };
    const onPop=()=>apply("pop");
    const onHash=()=>apply("hash");
    const onCustom=(e)=>{
      // portalGo já fez scroll; só aplica o detail se existir
      try{
        if(e&&e.detail)handler(e.detail);
        else apply("custom");
      }catch(err){console.error("portal route:",err);}
    };
    const onPageShow=(e)=>{if(e.persisted)apply("pageshow");};
    window.addEventListener("popstate",onPop);
    window.addEventListener("hashchange",onHash);
    window.addEventListener("portal-route",onCustom);
    window.addEventListener("pageshow",onPageShow);
    return()=>{
      window.removeEventListener("popstate",onPop);
      window.removeEventListener("hashchange",onHash);
      window.removeEventListener("portal-route",onCustom);
      window.removeEventListener("pageshow",onPageShow);
    };
  },[handler]);
}

/** Trava o scroll do body (modais / sheet) — evita “página por baixo” no mobile. */
function useBodyScrollLock(locked){
  useEffect(()=>{
    if(!locked)return;
    const body=document.body;
    const html=document.documentElement;
    const scrollY=window.scrollY||window.pageYOffset||0;
    const prev={
      overflow:body.style.overflow,
      position:body.style.position,
      top:body.style.top,
      width:body.style.width,
      htmlOverflow:html.style.overflow,
    };
    body.classList.add("portal-scroll-lock");
    body.style.overflow="hidden";
    body.style.position="fixed";
    body.style.top=(-scrollY)+"px";
    body.style.width="100%";
    html.style.overflow="hidden";
    return()=>{
      body.classList.remove("portal-scroll-lock");
      body.style.overflow=prev.overflow;
      body.style.position=prev.position;
      body.style.top=prev.top;
      body.style.width=prev.width;
      html.style.overflow=prev.htmlOverflow;
      try{window.scrollTo(0,scrollY);}catch(e){}
    };
  },[locked]);
}

/** Fecha com tecla Escape (modais, sheets, painéis). */
function useEscapeKey(onEscape,enabled){
  useEffect(()=>{
    if(enabled===false||typeof onEscape!=="function")return;
    const h=(e)=>{
      if(e.key==="Escape"||e.key==="Esc"){
        e.preventDefault();
        onEscape();
      }
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[onEscape,enabled]);
}

/** Scrolla o erro / campo para a área visível (teclado virtual no celular). */
function scrollElIntoView(el,offset){
  if(!el)return;
  try{
    el.scrollIntoView({behavior:"smooth",block:"center"});
    if(offset&&typeof window.scrollBy==="function"){
      setTimeout(()=>window.scrollBy(0,-(offset||0)),80);
    }
  }catch(e){
    try{el.scrollIntoView(true);}catch(e2){}
  }
}

/** Overlay de modal com lock de scroll, Escape e foco inicial. */
function ModalOverlay({onClose,children,className,style,labelledBy}){
  const ref=useRef(null);
  useBodyScrollLock(true);
  useEscapeKey(onClose,!!onClose);
  useEffect(()=>{
    const root=ref.current;
    if(!root)return;
    const prevActive=document.activeElement;
    const focusable=root.querySelector(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    );
    if(focusable){
      try{focusable.focus({preventScroll:true});}catch(e){try{focusable.focus();}catch(e2){}}
    }
    return()=>{
      if(prevActive&&typeof prevActive.focus==="function"){
        try{prevActive.focus({preventScroll:true});}catch(e){}
      }
    };
  },[]);
  return(
    <div
      ref={ref}
      className={"modal-overlay"+(className?" "+className:"")}
      style={style}
      role="dialog"
      aria-modal="true"
      aria-labelledby={labelledBy||undefined}
      onClick={e=>{if(e.target===e.currentTarget&&onClose)onClose();}}
    >
      {children}
    </div>
  );
}

/** Mantém a aba ativa visível no scroll horizontal da tab-bar. */
function useScrollActiveTab(activeId,containerSelector){

    if(!activeId)return;

    if(!root)return;
    const btn=root.querySelector(".tab-btn-active")||root.querySelector('[data-tab-id="'+activeId+'"]');

function withTimeout(promise, ms, label){
  let timer;
  return Promise.race([
    Promise.resolve(promise).finally(()=>{if(timer)clearTimeout(timer);}),
    new Promise((_,reject)=>{
      timer=setTimeout(()=>reject(new Error((label||"Operação")+" demorou demais. Tente uma foto menor.")), ms);
    }),
  ]);
}

function dataUrlFromCanvas(canvas, quality){
  const dataUrl=canvas.toDataURL("image/jpeg", quality);
  if(!dataUrl||dataUrl==="data:,")throw new Error("Falha ao processar a imagem.");
  return dataUrl;
}
function dataUrlToBlob(dataUrl){
  const parts=String(dataUrl).split(",");
  const mime=(parts[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
  const bin=atob(parts[1]||"");
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

/** Redimensiona/comprime imagem no browser antes do upload (JPEG). */
function compressImageFile(file, maxSide, quality){
  maxSide=maxSide||520; quality=quality==null?0.75:quality;
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error("Nenhuma foto selecionada."));return;}
    const type=String(file.type||"");
    // Alguns celulares mandam type vazio — ainda tentamos ler como imagem
    if(type&&!type.startsWith("image/")&&type!=="application/octet-stream"){
      reject(new Error("Selecione um arquivo de imagem (JPG, PNG ou WEBP)."));
      return;
    }
    if(file.size>FOTO_MAX_MB*1024*1024){
      reject(new Error("Foto muito grande (máximo "+FOTO_MAX_MB+" MB)."));
      return;
    }
    const objUrl=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        URL.revokeObjectURL(objUrl);
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){reject(new Error("Imagem inválida."));return;}
        if(w>maxSide||h>maxSide){
          if(w>=h){h=Math.round(h*maxSide/w);w=maxSide;}
          else{w=Math.round(w*maxSide/h);h=maxSide;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        if(canvas.toBlob){
          canvas.toBlob(blob=>{
            if(blob&&blob.size>0)resolve(blob);
            else{
              try{resolve(dataUrlToBlob(dataUrlFromCanvas(canvas,quality)));}
              catch(err){reject(err);}
            }
          },"image/jpeg",quality);
        }else{
          try{resolve(dataUrlToBlob(dataUrlFromCanvas(canvas,quality)));}
          catch(err){reject(err);}
        }
      }catch(err){reject(err||new Error("Falha ao processar a imagem."));}
    };
    img.onerror=()=>{URL.revokeObjectURL(objUrl);reject(new Error("Não foi possível ler a imagem. Use JPG ou PNG."));};
    img.src=objUrl;
  });
}

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("Falha ao converter a foto."));
    reader.readAsDataURL(blob);
  });
}

/** Comprime até tamanho seguro para gravar no perfil (Firestore). */
async function prepareStudentFotoBlob(file){
  let maxSide=520, quality=0.75;
  let blob=await compressImageFile(file, maxSide, quality);
  let tries=0;
  while(blob.size>FOTO_MAX_STORE_BYTES && tries<5){
    maxSide=Math.max(220, Math.round(maxSide*0.78));
    quality=Math.max(0.48, quality-0.08);
    blob=await compressImageFile(file, maxSide, quality);
    tries++;
  }
  if(blob.size>350*1024){
    throw new Error("A foto ainda ficou grande demais após compressão. Escolha outra imagem.");
  }
  return blob;
}

/**
 * Prepara a foto do aluno e devolve valor para o campo `foto`.
 * Comprime no browser e grava como data URL no Firestore (campo students.foto).
 * Não depende do Firebase Storage — evita travar em "Enviando/Salvando".
 */
async function uploadStudentFoto(file, studentUid){
  if(!studentUid)throw new Error("ID do aluno ausente para salvar a foto.");
  if(!file)throw new Error("Nenhuma foto selecionada.");
  const blob=await withTimeout(prepareStudentFotoBlob(file), 20000, "Processamento da foto");
  return await withTimeout(blobToDataUrl(blob), 10000, "Salvar foto");
}

function makeBlankCourseModulos(totalLicoes){
  const total=Math.max(1,Math.min(150,parseInt(totalLicoes,10)||150));
  const modulos=[];
  let restante=total;
  let id=1;
  while(restante>0){
    const qtd=Math.min(50,restante);
    modulos.push({id,nome:"Módulo "+id,totalLicoes:qtd,semBlocos:true,tipoLivre:true});
    restante-=qtd;
    id++;
  }
  return modulos;
}

function hexToRgb(hex){
  const h=String(hex||"#00BFA5").replace("#","");
  const full=h.length===3?h.split("").map(c=>c+c).join(""):h.padEnd(6,"0").slice(0,6);
  const n=parseInt(full,16);if(isNaN(n))return{r:0,g:191,b:165};
  return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function rgbToHex(r,g,b){
  return"#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("");
}

function getModuleLessonCount(mod){
  if(!mod)return 0;
  if(mod.semBlocos||mod.totalLicoes)return parseInt(mod.totalLicoes,10)||0;
  if(mod.blocos&&mod.blocos.length)return mod.blocos.reduce((s,b)=>s+(b.tamanho||(b.padrao&&b.padrao.length)||0),0);
  return 50;
}
function getTotalLicoes(course){
  if(!course||!course.modulos)return 150;
  return course.modulos.reduce((s,m)=>s+getModuleLessonCount(m),0);
}
function getCourseLessonLabel(course,globalIdx){
  const labels=course&&Array.isArray(course.lessonLabels)?course.lessonLabels:null;
  return labels&&labels[globalIdx-1]!=null?String(labels[globalIdx-1]):null;
}

/** Gera meta visual dos módulos a partir da corBase do curso. */
function buildModuleMeta(course){
  const base=course&&course.corBase||"#00BFA5";
  const rgb=hexToRgb(base);
  const mods=(course&&course.modulos)||[];
  return mods.map((m,i)=>{
    const t=mods.length<=1?0:i/(mods.length-1);
    const r=Math.max(0,Math.min(255,Math.round(rgb.r+(t*40-12))));
    const g=Math.max(0,Math.min(255,Math.round(rgb.g+(t*28-18))));
    const b=Math.max(0,Math.min(255,Math.round(rgb.b+(t*20-8))));
    return{
      id:m.id!=null?m.id:i+1,
      name:m.nome||("Módulo "+(i+1)),
      bookClass:"book-m"+((i%6)+1),
      accent:`rgba(${r},${g},${b},`,
      teal:rgbToHex(r,g,b),
    };
  });
}

function loadCoursesLocal(){

function normalizeCoursesList(list){
  if(!Array.isArray(list)||!list.length)return DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
  return list.map(c=>({...c,id:c.id,modulos:Array.isArray(c.modulos)?c.modulos:[]}))
    .sort((a,b)=>(a.ordem||0)-(b.ordem||0));
}
/** Grava o catálogo onde o admin tem permissão (students/__system_courses) e tenta a coleção `courses`. */
async function writeCoursesCatalog(list){
  const clean=normalizeCoursesList(list).map(c=>JSON.parse(JSON.stringify(c)));
  _coursesCache=clean;
  persistCoursesLocal(clean);
  let lastErr=null;
  try{
    await coursesCatalogRef().set({
      type:"courses_catalog",
      courses:clean,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    },{merge:true});
  }catch(e){lastErr=e;}
  // Espelho opcional na coleção `courses` (quando as regras permitirem)
  try{
    const batch=db.batch();
    clean.forEach(c=>{batch.set(db.collection("courses").doc(c.id),c,{merge:true});});
    await batch.commit();
  }catch(e){/* coleção courses pode estar bloqueada */}
  if(lastErr)throw lastErr;
  return clean;
}
async function upsertCourseDoc(course){
  const list=normalizeCoursesList(_coursesCache);
  const idx=list.findIndex(c=>c.id===course.id);
  const next={...course};
  if(idx>=0)list[idx]={...list[idx],...next};
  else list.push(next);
  return writeCoursesCatalog(list);
}
async function deleteCourseDoc(courseId){
  const list=normalizeCoursesList(_coursesCache).filter(c=>c.id!==courseId);
  return writeCoursesCatalog(list);
}

/** Sincroniza nome/cor/ordem dos 6 cursos oficiais (landing) sem apagar estrutura editada. */
async function ensureCoursesSeeded(forceBrandMeta){
  try{
    let existing=null;
    try{
      const doc=await coursesCatalogRef().get();
      if(doc.exists&&Array.isArray(doc.data().courses)&&doc.data().courses.length){
        existing=doc.data().courses;
      }
    }catch(e){/* sem permissão de leitura do catálogo */}
    if(!existing){
      try{
        const snap=await db.collection("courses").get();
        if(!snap.empty)existing=snap.docs.map(d=>({id:d.id,...d.data()}));
      }catch(e){/* coleção courses bloqueada */}
    }
    if(!existing)existing=loadCoursesLocal();
    if(!existing||!existing.length){
      const seeded=DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
      try{await writeCoursesCatalog(seeded);}catch(e){
        _coursesCache=seeded;
        persistCoursesLocal(seeded);
        console.warn("ensureCoursesSeeded write:",e.message||e);
      }
      return;
    }
    const byId={};
    existing.forEach(c=>{if(c&&c.id)byId[c.id]=c;});
    // Garante Proficiency FF com lessonContent completo da collection courses (database)
    if(!byId.proficiency_ff||!byId.proficiency_ff.lessonContent||!Object.keys(byId.proficiency_ff.lessonContent||{}).length){
      try{
        const pf=await db.collection("courses").doc("proficiency_ff").get();
        if(pf.exists){
          const pd=pf.data()||{};
          byId.proficiency_ff={
            ...(byId.proficiency_ff||{}),
            id:"proficiency_ff",
            nome:pd.nome||"Proficiency FF",
            corBase:pd.corBase||"#10B981",
            ativo:pd.ativo!==false,
            ordem:pd.ordem!=null?pd.ordem:10,
            grupo:pd.grupo||"special",
            padraoVisual:pd.padraoVisual||"emerald",
            totalLicoes:pd.totalLicoes||65,
            sharedContentEnabled:true,
            descricao:pd.descricao||"",
            modulos:Array.isArray(pd.modulos)&&pd.modulos.length?pd.modulos:PROFICIENCY_FF_MODULOS.map(m=>({...m})),
            lessonContent:pd.lessonContent||{},
            sourceCourseId:pd.sourceCourseId||"legacy-course-5",
          };
        }
      }catch(e){/* ok */}
    }
    for(const c of DEFAULT_COURSES){
      const payload=JSON.parse(JSON.stringify(c));
      if(!byId[c.id]){
        byId[c.id]=payload;
        continue;
      }
      const cur=byId[c.id];
      cur.nome=c.nome;
      cur.corBase=c.corBase;
      cur.ordem=c.ordem;
      if(c.grupo!=null)cur.grupo=c.grupo;
      if(c.padraoVisual!=null)cur.padraoVisual=c.padraoVisual;
      if(c.numeroInicio!=null)cur.numeroInicio=c.numeroInicio;
      if(forceBrandMeta||!cur.modulos||!cur.modulos.length){
        cur.modulos=payload.modulos;
      }
      // Proficiency FF: 1 módulo × 60 lições; não apaga lessonContent do Firebase
      if(c.id==="foundation_general"){
        cur.nome="Fluency General";
        cur.modulos=payload.modulos;
        cur.totalLicoes=150;
        cur.unitReportCards=true;
        cur.unitSize=10;
        cur.descricao=payload.descricao||cur.descricao;
        cur.ativo=true;
        cur.grupo="general";
        cur.padraoVisual="teal";
        cur.corBase=c.corBase;
      }
      if(c.id==="proficiency_ff"){
        cur.modulos=payload.modulos;
        cur.totalLicoes=60;
        cur.sharedContentEnabled=true;
        cur.ativo=true;
        cur.nome="Proficiency FF";
      }
      if(c.id==="speech_b"){
        cur.numeroInicio=121;
        cur.sharedContentEnabled=true;
        cur.ativo=true;
        cur.nome="Reflective Mind";
        if(forceBrandMeta||!cur.modulos||!cur.modulos.length){
          cur.modulos=payload.modulos;
        }
        // Merge Módulo 1 HTML/flip links (database → portal) without wiping admin overrides
        const rm1=(typeof REFLECTIVE_M1_LESSON_CONTENT==="object"&&REFLECTIVE_M1_LESSON_CONTENT)?REFLECTIVE_M1_LESSON_CONTENT:{};
        const prevLc=cur.lessonContent&&typeof cur.lessonContent==="object"?cur.lessonContent:{};
        const nextLc={...prevLc};
        Object.keys(rm1).forEach(k=>{
          const base=rm1[k]||{};
          const old=prevLc[k]||{};
          nextLc[k]={
            ...base,
            ...old,
            // keep program links from package when empty on existing doc
            linkAula:old.linkAula||base.linkAula||"",
            linkLivroDigital:old.linkLivroDigital||base.linkLivroDigital||"",
            linkMaterial:old.linkMaterial||base.linkMaterial||"",
            lessonType:old.lessonType||base.lessonType||"",
            title:old.title||base.title||"",
          };
        });
        cur.lessonContent=nextLc;
      }
      byId[c.id]=cur;
    }
    const merged=Object.values(byId);
    try{await writeCoursesCatalog(merged);}catch(e){
      _coursesCache=normalizeCoursesList(merged);
      persistCoursesLocal(_coursesCache);
      console.warn("ensureCoursesSeeded (ok se não-admin):",e.message||e);
    }
  }catch(e){
    console.warn("ensureCoursesSeeded (ok se não-admin):",e.message||e);
  }
}

/** Migra alunos com contrato legado (fluency_foundation etc.) sem alterar trilha. */
async function migrateLegacyContratosIfNeeded(){
  try{
    const flagRef=db.collection("config").doc("migrations");
    const flag=await flagRef.get();
    if(flag.exists&&flag.data().contratosV2)return{skipped:true};
    const snap=await db.collection("students").get();
    let migrated=0;
    const docs=snap.docs.filter(d=>{
      const c=d.data().contrato;
      return c&&CONTRATO_LEGACY_MAP[c];
    });
    for(let i=0;i<docs.length;i+=400){
      const batch=db.batch();
      docs.slice(i,i+400).forEach(d=>{
        const old=d.data().contrato;
        const newId=CONTRATO_LEGACY_MAP[old];
        const course=DEFAULT_COURSES.find(c=>c.id===newId);
        batch.update(d.ref,{
          contrato:newId,
          program:course?course.nome:(d.data().program||""),
          contratoMigradoDe:old,
        });
        migrated++;
      });
      await batch.commit();
    }
    await flagRef.set({contratosV2:true,migrated,at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    return{migrated};
  }catch(e){
    console.error("migrateLegacyContratos:",e);
    return{error:e.message};
  }
}

function useCourses(){
  const[courses,setCourses]=useState(()=>{
    const local=loadCoursesLocal();
    return local?normalizeCoursesList(local):_coursesCache;
  });
  useEffect(()=>{
    let unsub=()=>{};
    let alive=true;
    (async()=>{
      try{await ensureCoursesSeeded();}catch(e){console.error("ensureCoursesSeeded",e);}
      if(!alive)return;
      // Fonte principal: students/__system_courses (admin consegue criar/editar)
      unsub=coursesCatalogRef().onSnapshot(doc=>{
        if(doc.exists&&Array.isArray(doc.data().courses)&&doc.data().courses.length){
          _coursesCache=normalizeCoursesList(doc.data().courses);
          persistCoursesLocal(_coursesCache);
        }else{
          const local=loadCoursesLocal();
          _coursesCache=local?normalizeCoursesList(local):DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
        }
        if(alive)setCourses(_coursesCache);
      },err=>{
        console.warn("courses catalog listen:",err&&err.message||err);
        const local=loadCoursesLocal();
        _coursesCache=local?normalizeCoursesList(local):DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
        if(alive)setCourses(_coursesCache);
      });
    })();
    return()=>{alive=false;if(typeof unsub==="function")unsub();};
  },[]);
  return courses;
}

/* Percent 0–100 for F/A/L/E (replaces revisao/atingiu/superou). Legacy mapped for reads. */
const EVAL_LEGACY_PCT={revisao:40,atingiu:70,superou:95};
const EVAL_PCT_OPTIONS=Array.from({length:101},(_,i)=>i);
const EVAL_SKILLS = [
  {f:"evalF",l:"F",name:"Fluência Oral", reportKey:"fluenciaOral", dailyWeight:1, taskWeight:0},
  {f:"evalA",l:"A",name:"Compreensão Auditiva", reportKey:"compreensaoAuditiva", dailyWeight:1, taskWeight:0},
  {f:"evalL",l:"L",name:"Leitura", reportKey:"leitura", dailyWeight:0.2, taskWeight:0.8},
  {f:"evalE",l:"E",name:"Escrita", reportKey:"escrita", dailyWeight:0.5, taskWeight:0.5},
];
function parseEvalPercent(v){
  if(v==null||v==="")return null;
  if(typeof v==="number"&&!isNaN(v))return Math.max(0,Math.min(100,Math.round(v)));
  const n=Number(String(v).trim().replace("%",""));
  if(!isNaN(n)&&String(v).trim()!=="")return Math.max(0,Math.min(100,Math.round(n)));
  if(EVAL_LEGACY_PCT[v]!=null)return EVAL_LEGACY_PCT[v];
  return null;
}
function taskPercentFromExercise(ex){
  if(!ex||!ex.score)return null;
  if(ex.score.percentage!=null&&!isNaN(Number(ex.score.percentage)))return Math.max(0,Math.min(100,Number(ex.score.percentage)));
  if(ex.score.grade10!=null&&!isNaN(Number(ex.score.grade10)))return Math.max(0,Math.min(100,Number(ex.score.grade10)*10));
  return null;
}
/** Per-lesson competency score using daily eval + task weights. Returns 0–100 or null. */
function computeLessonCompetencyScore(skill, dailyRaw, taskPct){
  const daily=parseEvalPercent(dailyRaw);
  const tw=skill.taskWeight||0, dw=skill.dailyWeight||0;
  if(tw===0)return daily;
  if(dw===0)return taskPct;
  const hasD=daily!=null, hasT=taskPct!=null;
  if(!hasD&&!hasT)return null;
  if(hasD&&!hasT)return daily;
  if(!hasD&&hasT)return taskPct;
  return Math.round(dw*daily+tw*taskPct);
}
/** Module average of lesson scores (only lessons with a value). */
function averageScores(list){
  const nums=(list||[]).map(x=>typeof x==="number"?x:x?.score).filter(n=>n!=null&&!isNaN(n));
  if(!nums.length)return null;
  return Math.round(nums.reduce((a,b)=>a+b,0)/nums.length);
}

/* ── Studio clock (America/Sao_Paulo) — não depende só do PC ── */
const STUDIO_TZ="America/Sao_Paulo";
const _studioClock={offsetMs:0,syncedAt:null,source:null,status:"pending",listeners:new Set()};
function getStudioNow(){return new Date(Date.now()+(_studioClock.offsetMs||0));}
function studioParts(date){
  const d=date||getStudioNow();
  const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:STUDIO_TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const parts=Object.fromEntries(fmt.formatToParts(d).filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
  return{
    date:`${parts.year}-${parts.month}-${parts.day}`,
    time:`${parts.hour}:${parts.minute}`,
    second:parts.second,
    timeFull:`${parts.hour}:${parts.minute}:${parts.second}`,
  };
}
function getStudioTimeHHMM(){return studioParts().time;}
function notifyStudioClock(){_studioClock.listeners.forEach(fn=>{try{fn({..._studioClock,now:getStudioNow()});}catch(e){}});}
function subscribeStudioClock(fn){_studioClock.listeners.add(fn);return()=>_studioClock.listeners.delete(fn);}
async function syncStudioClockFirebase(){
  const t0=Date.now();
  const ref=db.collection("studio").doc("clockPing");
  await ref.set({pingAt:firebase.firestore.FieldValue.serverTimestamp(),clientAt:t0},{merge:true});
  const snap=await ref.get();
  const t1=Date.now();
  const serverTs=snap.exists&&snap.data().pingAt&&typeof snap.data().pingAt.toMillis==="function"?snap.data().pingAt.toMillis():null;
  if(!serverTs)throw new Error("firebase clock empty");
  const rtt=(t1-t0)/2;
  _studioClock.offsetMs=(serverTs+rtt)-Date.now();
  _studioClock.syncedAt=Date.now();
  _studioClock.source="firebase";
  _studioClock.status="ok";
  try{localStorage.setItem("fs-studio-clock-offset",String(_studioClock.offsetMs));localStorage.setItem("fs-studio-clock-at",String(_studioClock.syncedAt));}catch(e){}
  notifyStudioClock();
  return true;
}
async function syncStudioClockFromUrl(url,parser,source){
  const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),4500):null;
  try{
    const res=await fetch(url,{signal:ctrl?ctrl.signal:undefined,cache:"no-store"});
    if(!res.ok)throw new Error("http "+res.status);
    const data=await res.json();
    const trustedMs=parser(data);
    if(!trustedMs||isNaN(trustedMs))throw new Error("bad time payload");
    _studioClock.offsetMs=trustedMs-Date.now();
    _studioClock.syncedAt=Date.now();
    _studioClock.source=source;
    _studioClock.status="ok";
    try{localStorage.setItem("fs-studio-clock-offset",String(_studioClock.offsetMs));localStorage.setItem("fs-studio-clock-at",String(_studioClock.syncedAt));}catch(e){}
    notifyStudioClock();
    return true;
  }finally{if(timer)clearTimeout(timer);}
}
async function syncStudioClock(){
  try{
    await syncStudioClockFromUrl(
      "https://timeapi.io/api/Time/current/zone?timeZone=America%2FSao_Paulo",
      d=>{const s=d.dateTime||d.date+"T"+(d.time||"00:00:00");return new Date(s).getTime();},
      "timeapi.io"
    );
    return;
  }catch(e1){}
  try{
    await syncStudioClockFromUrl(
      "https://worldtimeapi.org/api/timezone/America/Sao_Paulo",
      d=>d.unixtime?d.unixtime*1000:Date.parse(d.datetime),
      "worldtimeapi"
    );
    return;
  }catch(e2){}
  try{
    await syncStudioClockFirebase();
    return;
  }catch(e3){
    try{
      const off=Number(localStorage.getItem("fs-studio-clock-offset"));
      const at=Number(localStorage.getItem("fs-studio-clock-at"));
      if(!isNaN(off)){_studioClock.offsetMs=off;_studioClock.syncedAt=at||null;_studioClock.source="cache";_studioClock.status="warn";notifyStudioClock();return;}
    }catch(e4){}
    _studioClock.status="warn";
    _studioClock.source="local-fallback";
    notifyStudioClock();
  }
}
function useStudioClock(tickMs){
  const [tick,setTick]=useState(0);
  const [meta,setMeta]=useState({status:_studioClock.status,source:_studioClock.source,syncedAt:_studioClock.syncedAt});
  useEffect(()=>{
    syncStudioClock();
    const syncId=setInterval(()=>syncStudioClock(),5*60*1000);
    const onVis=()=>{if(document.visibilityState==="visible")syncStudioClock();};
    document.addEventListener("visibilitychange",onVis);
    const unsub=subscribeStudioClock(m=>setMeta({status:m.status,source:m.source,syncedAt:m.syncedAt}));
    return()=>{clearInterval(syncId);document.removeEventListener("visibilitychange",onVis);unsub();};
  },[]);
  useEffect(()=>{
    const id=setInterval(()=>setTick(t=>t+1),tickMs||1000);
    return()=>clearInterval(id);
  },[tickMs]);
  const now=getStudioNow();
  const parts=studioParts(now);
  return{now,parts,todayISO:parts.date,timeHHMM:parts.time,timeFull:parts.timeFull,status:meta.status,source:meta.source,syncedAt:meta.syncedAt,tick};
}

/** Feedback de salvamento: som + toast + notificação do sistema (quando permitido) */
function playSaveChime(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    const now=ctx.currentTime;
    [[880,.0,.12],[1174.66,.11,.14],[1567.98,.24,.18]].forEach(([freq,start,dur])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,now+start);
      g.gain.exponentialRampToValueAtTime(0.12,now+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(now+start);o.stop(now+start+dur+0.02);
    });
    setTimeout(()=>{try{ctx.close();}catch(e){}},600);
  }catch(e){}
}

function getParcelValor(p){const v=p?.valorDesconto>0?p.valorDesconto:p?.valor;return v>0?v:0;}

function computeStudioFinanceMonth(students,monthKey){
  let previsto=0,recebido=0;
  (students||[]).forEach(s=>(s.financeiro?.parcelas||[]).forEach(p=>{
    const vencMonth=p.dataVencimento?p.dataVencimento.slice(0,7):null;

function getEffectiveParcelStatus(parcela,todayStr){
  if(parcela.status==="paga")return"paga";
  if(parcela.dataVencimento&&parcela.dataVencimento<todayStr)return"vencida";

function resolveFinanceSnapshot(parcelas){
  const todayStr=getTodayISO();
  const sorted=[...(parcelas||[])].filter(p=>p.dataVencimento).sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const unpaid=sorted.filter(p=>getEffectiveParcelStatus(p,todayStr)!=="paga");
  const current=unpaid[0]||null;
  let next=null;
  if(current)next=unpaid.find(p=>p.dataVencimento>current.dataVencimento)||null;
  const isLate=current?getEffectiveParcelStatus(current,todayStr)==="vencida":false;
  const allPaid=sorted.length>0&&unpaid.length===0;
  return{todayStr,current,next,isLate,isOk:allPaid||(!current?null:!isLate),allPaid,sorted};
}

function getLessonTypeFromModule(mod,posInModule){
  if(mod&&mod.tipoLivre)return"";
  if(!mod||mod.semBlocos)return"input";
  if(!mod.blocos||!mod.blocos.length)return FOUNDATION_BLOCK[(posInModule-1)%10];
  let remaining=posInModule;
  for(const bloco of mod.blocos){
    const size=bloco.tamanho||(bloco.padrao&&bloco.padrao.length)||10;
    if(remaining<=size){
      const padrao=bloco.padrao&&bloco.padrao.length?bloco.padrao:FOUNDATION_BLOCK;
      return padrao[(remaining-1)%padrao.length]||"input";
    }
    remaining-=size;
  }
  return"input";
}

const COURSE_SHARED_LESSON_FIELDS=["lessonType","title","tema","objetivos","linkAula","linkTarefa","linkMaterial","linkLivroDigital","linkChamada","linkExtra","linkGravacao","linkRelatorio"];

/** Gera estrutura de livros/lições e aplica a programação compartilhada do curso. */
function generateBooks(course){
  const c=course||DEFAULT_COURSES[0];
  const books=[];
  let globalIdx=0;
  const isReflective=c.id==="speech_b"||c.numeroInicio===121||c.padraoVisual==="orange"&&c.grupo==="special";
  const startNum=c.numeroInicio!=null?c.numeroInicio:(isReflective?121:1);
  let contentNum=startNum-1;
  let reviewNum=0;
  (c.modulos||[]).forEach((mod,mi)=>{
    const bi=mod.id!=null?mod.id:mi+1;
    const total=getModuleLessonCount(mod);
    const items=[];
    for(let li=1;li<=total;li++){
      globalIdx++;
      const lessonId=`b${bi}-l${globalIdx}`;
      const shared=(c.lessonContent&&c.lessonContent[lessonId])||{};
      const lt=Object.prototype.hasOwnProperty.call(shared,"lessonType")?shared.lessonType:getLessonTypeFromModule(mod,li);
      const isReview=lt==="review";
      let num, pos, title, tema="", objetivos="";
      if(isReview){
        reviewNum++;
        num=reviewNum;
        pos="R"+reviewNum;
        title="Review "+reviewNum;
        if(isReflective){
          const meta=getReflectiveMeta("review",0,reviewNum);
          tema=meta.tema;objetivos=meta.objetivos;
        }
      }else{
        contentNum++;
        num=contentNum;
        pos=contentNum;
        title=(mod.tipoLivre||c.unitReportCards)?("Lição "+contentNum):getLessonTitle(contentNum);
        if(isReflective){
          const meta=getReflectiveMeta(lt,contentNum,0);
          tema=meta.tema;objetivos=meta.objetivos;
        }
      }
      const lesson={
        id:lessonId,pos:pos,type:isReview?"review":"lesson",lessonType:lt||(mod.tipoLivre?"lesson":lt),num:num,
        title:title,status:"pendente",
        date:"",dataPrevista:"",tema:tema,objetivos:objetivos,feedback:"",obs:"",link:"",
        evalF:"",evalA:"",evalL:"",evalE:"",
        linkMaterial:"",linkLivroDigital:"",linkAula:"",linkChamada:"",linkTarefa:"",linkExtra:"",
        linkGravacao:"",linkRelatorio:"",tarefaFeita:false,
        materiaisModuloPdf:"",courseManaged:!!c.sharedContentEnabled,
      };
      const customLabel=getCourseLessonLabel(c,globalIdx);
      if(customLabel){
        lesson.pos=customLabel;
        lesson.displayLabel=customLabel;
      }
      COURSE_SHARED_LESSON_FIELDS.forEach(k=>{
        if(Object.prototype.hasOwnProperty.call(shared,k)){
          if(k==="title"&&!String(shared[k]||"").trim())return;
          lesson[k]=shared[k];
        }
      });
      if(mod.tipoLivre&&lesson.lessonType!=="review"){lesson.lessonType="lesson";lesson.type="lesson";}
      lesson.type=lesson.lessonType==="review"?"review":"lesson";
      items.push(lesson);
      // Regra (metadado na lição): fim de unidade — NÃO cria card na Trilha
      const unitSize=c.unitReportCards?(parseInt(c.unitSize,10)||10):0;
      if(unitSize>0&&li%unitSize===0){
        const unitNum=li/unitSize;
        const unitMeta=(mod.unidades||[])[unitNum-1];
        items[items.length-1].reportCardAfter=true;
        items[items.length-1].unitReportCardAfter=true;
        items[items.length-1].reportCardScope="unit";
        items[items.length-1].reportCardUnitId=unitNum;
        items[items.length-1].reportCardUnitName=(unitMeta&&unitMeta.nome)||("Unidade "+unitNum);
      }
    }
    // Regra (metadado): fim de módulo — NÃO cria card na Trilha (Report Card fica no ícone do portal)
    if(items.length){
      const lastLesson=items[items.length-1];
      lastLesson.reportCardAfter=true;
      lastLesson.moduleReportCardAfter=true;
      lastLesson.reportCardModuleId=bi;
      lastLesson.reportCardModuleName=mod.nome||mod.name||("Módulo "+bi);
    }
    books.push({bookIdx:bi,items});
  });
  return books;
}

const BOOKS_TEMPLATE=generateBooks(DEFAULT_COURSES[0]);
function mergeBooks(trilhaData,course){
  const template=course?generateBooks(course):BOOKS_TEMPLATE;
  return template.map(b=>({
    ...b,
    items:b.items.map(i=>{
      const saved=(trilhaData&&trilhaData[i.id])||{};
      const merged={...i,...saved};
      // A programação do curso prevalece e chega automaticamente a todos os alunos vinculados.
      const shared=(course&&course.lessonContent&&course.lessonContent[i.id])||{};
      COURSE_SHARED_LESSON_FIELDS.forEach(k=>{
        if(Object.prototype.hasOwnProperty.call(shared,k)){
          if(k==="title"&&!String(shared[k]||"").trim())return;
          merged[k]=shared[k];
        }
      });
      merged.type=merged.lessonType==="review"?"review":"lesson";
      // Preenche tema/objetivos oficiais se o aluno ainda não tiver valor salvo
      if(!merged.tema&&i.tema)merged.tema=i.tema;
      if(!merged.objetivos&&i.objetivos)merged.objetivos=i.objetivos;
      return merged;
    })
  }));
}

  return visible[0]?.bookIdx||1;

const DIARIO_STATUS_SELECT=DIARIO_STATUS.filter(s=>!s.legacy);
const dStatusMap=Object.fromEntries(DIARIO_STATUS.map(s=>[s.value,s]));
function normalizeDiarioStatus(entry){
  if(!entry)return"presenca";
  const s=entry.status;
  if(s==="realizada"||s==="rep_feita")return"presenca";
  if(s==="cancelada")return"falta_professor";
  if(s==="falta_professor"||s==="presenca"||s==="ausencia_com_reposicao"||s==="falta_aluno_com_reposicao"||s==="falta_aluno_sem_reposicao"||s==="adequacao_com_reposicao")return s;
  if(s==="a_repor"||s==="rep_vencida"){
    if(entry.reposicaoMotivo==="adequacao"||entry.reposicaoTipo==="adequacao")return"adequacao_com_reposicao";
    return entry.reposicaoMotivo==="professor"?"ausencia_com_reposicao":"falta_aluno_com_reposicao";
  }
  if(s==="ausente"){
    if(entry.reposicaoTipo==="com")return"falta_aluno_com_reposicao";
    if(entry.reposicaoTipo==="sem")return"falta_aluno_sem_reposicao";
    return"falta_aluno_sem_reposicao";
  }
  if(s==="andamento")return"presenca";
  return s||"presenca";
}
function diarioIsPresence(status){
  return status==="presenca"||status==="realizada"||status==="rep_feita";
}
function diarioNeedsReposicao(status){
  return status==="ausencia_com_reposicao"||status==="falta_aluno_com_reposicao"||status==="adequacao_com_reposicao"||status==="a_repor";
}
/** Reposição gerada por Adequação: gratuita, mas NÃO consome a cota do contrato. */
function isReposicaoAdequacao(entry){
  if(!entry)return false;
  const st=normalizeDiarioStatus(entry);
  return st==="adequacao_com_reposicao"||entry.reposicaoMotivo==="adequacao"||entry.reposicaoTipo==="adequacao"||!!entry.reposicaoNaoContaGratuita;
}
/** Conta contra o saldo de reposições gratuitas do contrato (aluno/ausência). */
function countsAgainstGratuitasContrato(entry){
  if(!entry||isReposicaoAdequacao(entry))return false;
  const st=normalizeDiarioStatus(entry);
  return st==="falta_aluno_com_reposicao"||st==="ausencia_com_reposicao";
}

/* ── Finance Architecture: invoices (owed) vs transactions (paid) ───────────
   Collections: invoices, transactions
   Legacy student.financeiro.parcelas is preserved and mirrored — never deleted.
   ─────────────────────────────────────────────────────────────────────────── */
const INVOICE_STATUS={UNPAID:"unpaid",PARTIAL:"partially_paid",PAID:"paid",OVERDUE:"overdue"};
function mapParcelaToInvoiceStatus(parcela,todayStr){
  const eff=getEffectiveParcelStatus(parcela,todayStr||getTodayISO());
  if(eff==="paga")return INVOICE_STATUS.PAID;
  if(eff==="vencida")return INVOICE_STATUS.OVERDUE;
  return INVOICE_STATUS.UNPAID;
}
function invoiceStatusBadgeClass(status){
  if(status==="paid")return"status-badge status-badge-paid";
  if(status==="overdue")return"status-badge status-badge-overdue";
  if(status==="partially_paid")return"status-badge status-badge-partial";
  return"status-badge status-badge-pending";
}
function invoiceStatusLabel(status){
  if(status==="paid")return"Pago";
  if(status==="overdue")return"Vencido";
  if(status==="partially_paid")return"Parcial";
  if(status==="unpaid")return"Em aberto";
  return status||"—";
}
function toJsDate(val){
  if(!val)return null;
  if(val instanceof Date)return val;
  if(typeof val.toDate==="function")return val.toDate();
  if(typeof val==="string"){const d=new Date(val.length===10?val+"T12:00:00":val);return isNaN(d)?null:d;}
  if(typeof val.seconds==="number")return new Date(val.seconds*1000);
  return null;
}
function invoiceDocId(studentId,parcelaId){return String(studentId||"s")+"__"+String(parcelaId||"p").replace(/[^a-zA-Z0-9_-]/g,"_");}
/** ID estável da parcela — evita cobranças fantasma (ex.: mesmo aluno várias vezes). */
function parcelaStableId(studentId,p,idx){
  if(p&&p.id!=null&&String(p.id).trim()!=="")return String(p.id).trim();
  const bits=[studentId||"s",p&&p.dataVencimento||"nodate",p&&p.mes||"nomes",String(idx)];
  return "auto_"+bits.join("_").replace(/\s+/g,"_");
}
/**
 * Fonte de verdade do financeiro: SOMENTE parcelas em students.*.financeiro.parcelas
 * — valor > 0 (sem cobrança vazia)
 * — sem duplicar o mesmo id
 * — ignora docs do sistema
 */
function buildFinanceFromStudents(students){
  const today=getTodayISO();
  const invoices=[];
  const transactions=[];
  const seen=new Set();
  (students||[]).forEach(s=>{
    if(!s)return;
    const sid=s.uid||s.id;
    if(!sid||sid===COURSES_CATALOG_DOC||String(sid).startsWith("__system"))return;
    const parcelas=Array.isArray(s.financeiro?.parcelas)?s.financeiro.parcelas:[];
    parcelas.forEach((p,idx)=>{
      if(!p||typeof p!=="object")return;
      const amount=getParcelValor(p);
      if(!(amount>0))return;
      const pid=parcelaStableId(sid,p,idx);
      const invId=invoiceDocId(sid,pid);
      if(seen.has(invId))return;
      seen.add(invId);
      const status=mapParcelaToInvoiceStatus(p,today);
      const studentName=s.name||s.nome||"Aluno";
      const description=(p.mes&&String(p.mes).trim())||("Parcela "+(p.dataVencimento?formatDateBR(p.dataVencimento):String(idx+1)));
      invoices.push({
        id:invId,studentId:sid,studentName,amount,description,status,
        dueDate:p.dataVencimento||null,createdAt:p.dataVencimento||null,
        legacyParcelaId:pid,parcelaIndex:idx,_source:"parcela",
      });
      if((p.status==="paga"||status==="paid")&&amount>0){
        const payDate=p.dataPagamento||p.dataVencimento||today;
        transactions.push({
          id:"tx_"+invId,studentId:sid,studentName,invoiceId:invId,amount,
          type:"payment",method:p.boletoPix?"bank_transfer":"cash",
          date:payDate,status:"paid",_source:"parcela",description,
        });
      }
    });
  });
  return{invoices,transactions};
}
/** @deprecated alias */
function deriveFinanceFromParcelas(students){return buildFinanceFromStudents(students);}
/** KPIs do MÊS corrente (não 30 dias / não histórico total). */
function computeFinanceKpis(invoices,transactions,monthKey){
  const mk=monthKey||getMonthKey(new Date());
  let revenueMonth=0,outstanding=0,overdue=0;
  const revenueItems=[],outstandingItems=[],overdueItems=[];
  (transactions||[]).forEach(t=>{
    if((t.type||"payment")!=="payment")return;
    const amt=parseFloat(t.amount)||0;
    if(!(amt>0))return;
    const d=toJsDate(t.date);
    if(!d)return;
    if(getMonthKey(d)!==mk)return;
    revenueMonth+=amt;
    revenueItems.push(t);
  });
  (invoices||[]).forEach(inv=>{
    const amt=parseFloat(inv.amount)||0;
    if(!(amt>0))return;
    if(inv.status!=="paid"){outstanding+=amt;outstandingItems.push(inv);}
    if(inv.status==="overdue"){overdue+=amt;overdueItems.push(inv);}
  });
  revenueItems.sort((a,b)=>(toJsDate(b.date)?.getTime()||0)-(toJsDate(a.date)?.getTime()||0));
  outstandingItems.sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
  overdueItems.sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
  return{revenueMonth,outstanding,overdue,revenueItems,outstandingItems,overdueItems,monthKey:mk};
}
function computeCashFlowSeries(transactions,expensesByMonth){
  // Last 6 months revenue (payments) vs expenses
  const months=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(getMonthKey(d));
  }
  const revenue=months.map(mk=>{
    let sum=0;
    (transactions||[]).forEach(t=>{
      if((t.type||"payment")!=="payment")return;
      const d=toJsDate(t.date);
      if(d&&getMonthKey(d)===mk)sum+=(parseFloat(t.amount)||0);
    });
    return sum;
  });
  const expenses=months.map(mk=>(expensesByMonth&&expensesByMonth[mk])||0);
  return{months,revenue,expenses};
}
/** Upsert invoice (+ optional payment transaction) from a legacy parcela. Never deletes user data. */
async function upsertInvoiceFromParcela(studentId,parcela,studentName){
  if(!studentId||!parcela)return;
  const amount=getParcelValor(parcela);
  if(!(amount>0))return; // não cria fatura fantasma sem valor
  const invId=invoiceDocId(studentId,parcelaStableId(studentId,parcela,0));
  const status=mapParcelaToInvoiceStatus(parcela);
  const invPayload={
    studentId:String(studentId),
    amount:amount||0,
    description:parcela.mes||("Parcela "+(parcela.dataVencimento||"")),
    status,
    dueDate:parcela.dataVencimento||null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    legacyParcelaId:parcela.id||null,
    studentName:studentName||null,
  };
  try{
    await db.collection("invoices").doc(invId).set(invPayload,{merge:true});
    if(status==="paid"&&amount>0){
      const txId="tx_"+invId;
      await db.collection("transactions").doc(txId).set({
        studentId:String(studentId),
        invoiceId:invId,
        amount:amount||0,
        type:"payment",
        method:parcela.boletoPix?"bank_transfer":"cash",
        date:parcela.dataPagamento||parcela.dataVencimento||getTodayISO(),
        studentName:studentName||null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      },{merge:true});
    }
  }catch(err){
    console.warn("upsertInvoiceFromParcela (check Firestore rules for invoices/transactions):",err&&err.message);
  }
}
async function syncStudentParcelasToInvoices(studentId,parcelas,studentName){
  const list=Array.isArray(parcelas)?parcelas:[];
  for(const p of list){await upsertInvoiceFromParcela(studentId,p,studentName);}
}

function normalizeStatus(raw,data){

    const mapped=STATUS_LEGACY_MAP[raw]||STATUS_LEGACY_MAP[String(raw).toLowerCase()]||String(raw).toLowerCase();

  if(data&&(data.financeiro||data.trilha||data.program||data.contrato||data.dataInicio||data.diasAulas?.length))return"ativo";

/** Auth secundário: cria login sem deslogar o admin. */
function getSecondaryAuth(){
  let app;
  try{app=firebase.app("Secondary");}
  catch(e){app=firebase.initializeApp(firebase.app().options,"Secondary");}
  return app.auth();
}
function emailVariants(email){
  const raw=(email||"").toString().trim();
  if(!raw)return[];
  const low=raw.toLowerCase();
  const set=new Set([raw,low]);
  // Hotmail/Outlook às vezes salvos com espaços ou maiúsculas
  set.add(low.replace(/\s+/g,""));
  return[...set];
}

/**
 * Resolve o ID do documento do aluno:
 * 1) students/{authUid}
 * 2) users/{authUid}.studentId
 * 3) students where email == email do login (várias capitalizações)
 */
async function resolveStudentDocId(authUid,email){
  if(!authUid)return null;
  try{
    const byUid=await db.collection("students").doc(authUid).get();
    if(byUid.exists)return authUid;
  }catch(e){console.warn("resolveStudentDocId byUid:",e);}
  try{
    const userMap=await db.collection("users").doc(authUid).get();
    if(userMap.exists){
      const sid=userMap.data().studentId;
      if(sid){
        const chk=await db.collection("students").doc(sid).get();
        if(chk.exists)return sid;
      }
    }
  }catch(e){console.warn("resolveStudentDocId users map:",e);}
  const variants=emailVariants(email);
  for(const em of variants){
    try{
      const q=await db.collection("students").where("email","==",em).limit(5).get();
      if(q.empty)continue;
      const docs=q.docs;
      const preferred=docs.find(x=>{
        const st=normalizeStatus(x.data().status,x.data());
        return st==="ativo"||st==="lead"||st==="interessado"||st==="trancado";
      })||docs[0];
      const sid=preferred.id;
      const emailNorm=em.toLowerCase();
      try{
        await db.collection("users").doc(authUid).set({
          email:emailNorm,role:"student",studentId:sid,authUid,
          linkedAt:firebase.firestore.FieldValue.serverTimestamp(),
        },{merge:true});
        await db.collection("students").doc(sid).set({authUid,email:emailNorm,hasPortalLogin:true},{merge:true});
      }catch(linkErr){console.warn("link student map:",linkErr);}
      return sid;
    }catch(e){console.warn("resolveStudentDocId email:",em,e);}
  }
  return authUid;
}

/** Admin: cria/vincula login Firebase a um doc de aluno já existente. */
async function linkStudentPortalLogin(studentUid,email,password){
  const em=(email||"").toString().trim().toLowerCase();
  const pass=(password||"").toString();
  if(!studentUid)throw new Error("UID do aluno ausente.");
  if(!em)throw new Error("Email obrigatório.");
  if(pass.length<6)throw new Error("Senha com no mínimo 6 caracteres.");
  const secondary=getSecondaryAuth();
  let authUid=null;
  let created=false;
  try{
    try{
      const cred=await secondary.createUserWithEmailAndPassword(em,pass);
      authUid=cred.user.uid;
      created=true;
    }catch(authErr){
      if(authErr.code==="auth/email-already-in-use"){
        // Conta Auth já existe: só normaliza email e marca login (aluno entra com senha atual)
        await db.collection("students").doc(studentUid).set({
          email:em,hasPortalLogin:true,loginNote:"email-already-in-use",
        },{merge:true});
        return{created:false,alreadyExists:true,studentUid,email:em};
      }
      throw authErr;
    }
  }finally{
    try{await secondary.signOut();}catch(e){}
  }
  await db.collection("students").doc(studentUid).set({
    email:em,authUid,hasPortalLogin:true,
  },{merge:true});
  await db.collection("users").doc(authUid).set({
    email:em,role:"student",studentId:studentUid,authUid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  },{merge:true});
  return{created,alreadyExists:false,studentUid,authUid,email:em};
}

      if(e.code==="auth/user-not-found")setErr("Não há conta com este email. Peça ao Victor para criar seu acesso.");
      else setErr("Não foi possível enviar o email. Tente de novo ou fale com o Victor.");
    }
    setLoading(false);
  }
  return(
    <div className="min-h-screen flex flex-col items-center justify-center px-5" style={{paddingBottom:"calc(24px + env(safe-area-inset-bottom,0px))"}}>
      <div className="login-logo-wrap" style={{filter:'drop-shadow(0 4px 12px rgba(0,0,0,.25))'}}>
        <BrandLogo large/>
      </div>
      <div className="w-full max-w-md glass rounded-2xl p-7">
          <div className="text-center mb-6">
            <h1 className="text-xl font-bold" style={{fontFamily:"'Sora',sans-serif"}}>Bem-vindo ao Portal</h1>
            <p className="muted text-sm mt-1">Student Portal · Fluency Studio</p>
          </div>
          <form className="space-y-3" onSubmit={handleLogin} noValidate>
            <div>
              <label className="block text-sm muted mb-1" htmlFor="login-email">Email</label>
              <input
                id="login-email"
                ref={emailRef}
                type="email"
                inputMode="email"
                enterKeyHint="next"
                className="w-full input rounded-xl px-4 py-3"
                placeholder="seuemail@exemplo.com"
                value={email}
                onChange={e=>setEmail(e.target.value)}
                autoComplete="email"
                autoCapitalize="none"
                autoCorrect="off"
                spellCheck={false}
                disabled={loading}
                onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();try{passRef.current&&passRef.current.focus();}catch(x){}}}}
              />
            </div>
            <div>
              <label className="block text-sm muted mb-1" htmlFor="login-pass">Senha</label>
              <input
                id="login-pass"
                ref={passRef}
                type="password"
                enterKeyHint="go"
                className="w-full input rounded-xl px-4 py-3"
                placeholder="••••••••"
                value={pass}
                onChange={e=>setPass(e.target.value)}
                autoComplete="current-password"
                disabled={loading}
              />
            </div>
            {err&&<div ref={errRef} className="err-box" role="alert" aria-live="assertive">{err}</div>}
            {info&&<div role="status" aria-live="polite" style={{background:"rgba(30,160,110,.12)",border:"1px solid rgba(30,160,110,.35)",borderRadius:12,padding:"10px 14px",fontSize:13,color:"#60daa8"}}>{info}</div>}
            <button type="submit" className="w-full btn btn-primary rounded-xl px-4 py-3 font-semibold inline-flex items-center justify-center gap-2" disabled={loading}>
              {loading?<div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>:<Icon name="log-in" size={16}/>}{loading?"Entrando...":"Entrar"}
            </button>
            <button type="button" className="w-full btn rounded-xl px-4 py-2.5 text-sm" onClick={handleReset} disabled={loading}>Esqueci a senha</button>
          </form>
      </div>
    </div>
  );
}

function LessonBadge({status}){
  const m={pendente:"ls-pendente",andamento:"ls-andamento",concluida:"ls-concluida",atual:"ls-andamento",realizada:"ls-concluida"};
  const l={pendente:"Pendente",andamento:"Em Andamento",concluida:"Concluída",atual:"Atual",realizada:"Concluída"};
  return <span className={m[status]||m.pendente}>{l[status]||status||"Pendente"}</span>;
}

function AdminLessonPanel({item,uid}){
  const ST=[{v:"pendente",l:"Pendente"},{v:"atual",l:"Atual"},{v:"andamento",l:"Em Andamento"},{v:"concluida",l:"Concluída"}];
  const LK=[
    {f:"linkAula",l:"Lição Online"},
    {f:"linkTarefa",l:"Tarefa Online"},
    {f:"linkMaterial",l:"Lição PDF"},
    {f:"linkLivroDigital",l:"Livro Digital"},
    {f:"linkChamada",l:"Aula ao Vivo"},
    {f:"linkExtra",l:"Extra (Materiais)"},
    {f:"linkGravacao",l:"Aulas Gravadas (Recorded Classes)"},
    {f:"linkRelatorio",l:"Relatório da Reunião"},
  ];
  const STUDENT_FIELD_KEYS=["status","dataPrevista","date","evalF","evalA","evalL","evalE","feedback","obs"];
  const LEGACY_CONTENT_KEYS=["tema","objetivos","linkAula","linkTarefa","linkMaterial","linkLivroDigital","linkChamada","linkExtra","linkGravacao","linkRelatorio"];
  const FIELD_KEYS=item.courseManaged?STUDENT_FIELD_KEYS:[...STUDENT_FIELD_KEYS,...LEGACY_CONTENT_KEYS];
  function snapshotFromItem(it){
    const s={};
    FIELD_KEYS.forEach(k=>{
      if(k==="linkMaterial")s[k]=it.linkMaterial||it.link||"";
      else s[k]=it[k]!=null?it[k]:"";
    });
    if(!s.status)s.status="pendente";
    return s;
  }
  const [draft,setDraft]=useState(()=>snapshotFromItem(item));
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");
  const [saveErr,setSaveErr]=useState("");
  useEffect(()=>{setDraft(snapshotFromItem(item));setSaveMsg("");setSaveErr("");},[item.id]);
  function setD(field,val){setDraft(p=>({...p,[field]:val}));setSaveMsg("");setSaveErr("");}
  async function saveLesson(){
    if(!uid||!item?.id){setSaveErr("Acesso negado: Aluno ou lição ausente.");return;}
    setSaving(true);
    setSaveErr("");
    setSaveMsg("");
    
    try{
      const patch={};
      FIELD_KEYS.forEach(k=>{
        let v=draft[k];
        if(v===undefined||v===null)v="";
        patch[`trilha.${item.id}.${k}`]=v;
      });
      
      await db.collection("students").doc(uid).update(patch);
      
      setSaveMsg("✓ Alterações salvas com sucesso!");
      notifySaveSuccess("Lição salva com sucesso!");
      setTimeout(()=>setSaveMsg(""), 3500);
    }catch(e){
      console.error("Erro no salvamento Firebase:", e);
      setSaveErr("Falha na conexão. Verifique sua rede e tente novamente.");
    }finally{
      setSaving(false);
    }
  }
  return(
    <div className="space-y-4">
      {item.courseManaged&&<div style={{padding:"10px 12px",borderRadius:10,background:"rgba(30,143,168,.10)",border:"1px solid rgba(30,143,168,.28)",fontSize:12,lineHeight:1.5,color:"var(--font-muted)"}}>
        Tipo, tema, objetivos e links são compartilhados pelo curso. Edite essa programação em <strong>Configurações → Cursos → Editar</strong>; aqui ficam apenas os dados individuais do aluno.
      </div>}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><div className="detail-label">Status</div><div className="flex gap-2 flex-wrap mt-1">{ST.map(s=><button key={s.v} type="button" onClick={()=>setD("status",s.v)} className={"sbtn "+(draft.status===s.v?"sbtn-"+s.v:"sbtn-off")}>{s.l}</button>)}</div></div>
        <div className="grid grid-cols-2 gap-2">
          <div><div className="detail-label">Data Prevista</div><input type="date" className="input-light mt-1" value={draft.dataPrevista||""} onChange={e=>setD("dataPrevista",e.target.value)}/></div>
          <div><div className="detail-label">Data Realizada</div><input type="date" className="input-light mt-1" value={draft.date||""} onChange={e=>setD("date",e.target.value)}/></div>
        </div>
      </div>
      <div>
        <div className="detail-label">Avaliação F/A/L/E (0% a 100%)</div>
        <p className="text-xs muted mb-2">Lance o percentual do dia a dia. No Report Card: F e A = 100% deste lançamento; L = 80% tarefa + 20% aqui; E = 50% tarefa + 50% aqui.</p>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-2">
          {EVAL_SKILLS.map(sk=>{
            const pct=parseEvalPercent(draft[sk.f]);
            return(
              <div key={sk.f}>
                <div className="text-xs font-bold mb-1" style={{color:"var(--font-muted)"}}>{sk.l} — {sk.name}</div>
                <select
                  className="eval-pct-select"
                  value={pct==null?"":String(pct)}
                  onChange={e=>setD(sk.f,e.target.value===""?"":Number(e.target.value))}
                >
                  <option value="">— %</option>
                  {EVAL_PCT_OPTIONS.map(n=><option key={n} value={n}>{n}%</option>)}
                </select>
              </div>
            );
          })}
        </div>
      </div>
      {!item.courseManaged&&<div>
        <div className="detail-label mb-2">Links</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {LK.map(lk=>(
            <div key={lk.f}>
              <div className="text-xs font-semibold mb-1" style={{color:"var(--font-muted)"}}>{lk.l}</div>
              <input type="url" className="input-light" placeholder="https://" value={draft[lk.f]||""} onChange={e=>setD(lk.f,e.target.value)}/>
            </div>
          ))}
        </div>
      </div>}
      {!item.courseManaged&&<div><div className="detail-label">Tema</div><input className="input-light mt-1" placeholder="Tema da lição (sem parênteses)" value={draft.tema||""} onChange={e=>setD("tema",e.target.value)}/></div>}
      {!item.courseManaged&&<div><div className="detail-label">Objetivos da Aula</div><textarea className="input-light mt-1" rows={2} style={{resize:"vertical"}} placeholder="O que será aprendido nesta aula..." value={draft.objetivos||""} onChange={e=>setD("objetivos",e.target.value)}/></div>}
      <div><div className="detail-label">Feedback para o Aluno</div><textarea className="input-light mt-1" rows={3} style={{resize:"vertical"}} placeholder="Retorno personalizado para o aluno..." value={draft.feedback||""} onChange={e=>setD("feedback",e.target.value)}/></div>
      <div><div className="detail-label">Observações Internas</div><textarea className="input-light mt-1" rows={2} style={{resize:"vertical"}} placeholder="Notas do professor (não visíveis ao aluno)..." value={draft.obs||""} onChange={e=>setD("obs",e.target.value)}/></div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",paddingTop:4,borderTop:"1px solid var(--divider)"}}>
        <button type="button" className="btn btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold inline-flex items-center gap-2" onClick={saveLesson} disabled={saving}>
          <Icon name="check" size={14}/>{saving?"Salvando…":"Salvar na Trilha"}
        </button>
        {saveMsg&&<span className="text-xs font-semibold" style={{color:"#60daa8"}}>{saveMsg}</span>}
        {saveErr&&<span className="text-xs font-semibold" style={{color:"#f0909a"}}>{saveErr}</span>}
        <span className="text-xs muted">As alterações só são gravadas ao clicar em Salvar.</span>
      </div>
    </div>
  );
}

function StudentLessonView({item}){
  const concluida=item.status==="concluida"||item.status==="realizada";
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const typeTag=isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":isOutput?"Output":"Input";
  const statusMap={pendente:"Pendente",andamento:"Em andamento",concluida:"Concluída",realizada:"Concluída"};
  const statusLabel=statusMap[item.status]||item.status||"Pendente";

  const urlLicao=resolvePortalAssetUrl(item.linkAula||"");
  const urlMaterial=resolvePortalAssetUrl(item.linkMaterial||item.link||"");
  const urlLivroDigital=resolvePortalAssetUrl(item.linkLivroDigital||"");
  const urlTarefa=resolvePortalAssetUrl(item.linkTarefa||"");
  const urlAoVivo=resolvePortalAssetUrl(item.linkChamada||"");
  const urlGravacao=resolvePortalAssetUrl(item.linkGravacao||"");
  const urlRelatorio=resolvePortalAssetUrl(item.linkRelatorio||"");
  const urlExtra=resolvePortalAssetUrl(item.linkExtra||"");
  const showAoVivo=!!urlAoVivo;
  const hasEval=EVAL_SKILLS.some(sk=>parseEvalPercent(item[sk.f])!=null);
  const pairBtns=[
    urlLicao&&{href:urlLicao,icon:"zap",label:"Lição Online"},
    urlTarefa&&{href:urlTarefa,icon:"check-square",label:"Tarefa Online"},
    urlMaterial&&{href:urlMaterial,icon:"file-text",label:"Lição PDF"},
    urlLivroDigital&&{href:urlLivroDigital,icon:"book-open",label:"Livro Digital"},
    urlExtra&&{href:urlExtra,icon:"sparkles",label:"Extra"},
    urlGravacao&&{href:urlGravacao,icon:"camera",label:"Aulas Gravadas"},
    urlRelatorio&&{href:urlRelatorio,icon:"clipboard-list",label:"Relatório"},
  ].filter(Boolean);
  const pairs=[];
  for(let i=0;i<pairBtns.length;i+=2)pairs.push(pairBtns.slice(i,i+2));

  const hasTheme=item.tema||item.objetivos;
  const hasPerf=(concluida&&item.feedback)||(concluida&&hasEval);
  const hasAny=showAoVivo||pairBtns.length||hasTheme||hasPerf;
  if(!hasAny)return <p className="text-xs muted">Nenhuma informação disponível ainda. Quando o professor liberar links e conteúdo, eles aparecem aqui.</p>;

  return(
    <div className="space-y-1">
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <span className={typeTag}>{typeLabel}</span>
        <LessonBadge status={item.status==="realizada"?"concluida":(item.status||"pendente")}/>
        <span style={{fontSize:12,color:"var(--font-muted)",fontWeight:600}}>{statusLabel}</span>
      </div>

      {showAoVivo&&(
        <div className="slv-btn-row-center">
          <a href={urlAoVivo} target="_blank" rel="noreferrer" className="slv-btn slv-btn-live">
            <Icon name="video" size={18}/> Aula ao Vivo
          </a>
        </div>
      )}

      {pairs.map((row,ri)=>(
        <div key={ri} className="slv-btn-row" style={{marginBottom:10}}>
          {row.map(b=>(
            <a key={b.label} href={b.href} target="_blank" rel="noreferrer" className="slv-btn slv-btn-pair">
              <Icon name={b.icon} size={14}/> {b.label}
            </a>
          ))}
          {row.length===1&&<div style={{flex:1}}/>}
        </div>
      ))}

      {hasTheme&&(
        <div className="slv-theme-card">
          {item.tema&&(
            <>
              <div className="slv-theme-label">Tema</div>
              <p className="slv-theme-text">{item.tema}</p>
            </>
          )}
          {item.objetivos&&(
            <>
              <div className="slv-theme-label">Objetivo</div>
              <p className="slv-theme-text">{item.objetivos}</p>
            </>
          )}
        </div>
      )}

      {hasPerf&&(
        <>
          <div className="slv-perf-line"/>
          {concluida&&item.feedback&&(
            <p style={{fontSize:14,lineHeight:1.6,color:"var(--font)",margin:"0 0 14px",fontWeight:500}}>{item.feedback}</p>
          )}
          {concluida&&hasEval&&(
            <div className="slv-perf-card">
              <div className="slv-perf-title">Sua performance</div>
              <p className="slv-perf-sub">Avaliação da aula · percentual por competência</p>
              <div className="slv-vchart" role="img" aria-label="Gráfico vertical de desempenho">
                {EVAL_SKILLS.map(sk=>{
                  const pct=parseEvalPercent(item[sk.f]);
                  const h=pct==null?0:Math.max(4,pct);
                  return(
                    <div key={sk.f} className="slv-vcol" title={sk.name+(pct==null?"":(": "+pct+"%"))}>
                      <div className="slv-vval">{pct==null?"—":(pct+"%")}</div>
                      <div className="slv-vtrack" aria-hidden="true">
                        <div className="slv-vfill" style={{height:pct==null?"0%":(h+"%")}}/>
                      </div>
                      <div className="slv-vlabel">{sk.l}<br/>{sk.name.split(" ")[0]}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── MODIFICAÇÃO 3: LessonItem com botão Tarefa Feita
// ── MODIFICAÇÃO 3: LessonItem com botão Tarefa Feita ───────────────────────
function LessonItem({item,uid,isAdmin,defaultOpen=false,onFocused,embedMode=false}){
  const [open,setOpen]=useState(embedMode||false);
  const rootRef=useRef(null);
  const isReportCard=item.type==="report_card"||item.lessonType==="report_card"||item.reportCard;
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const isDone=item.status==="concluida"||item.status==="realizada";
  const isAndamento=item.status==="andamento"||item.status==="atual";
  const isPending=!isDone&&!isAndamento;
  const locked=isPending&&!isAdmin; // status "atual" unlocks student content

  useEffect(()=>{
    if(embedMode||!defaultOpen)return;
    if(locked){onFocused?.();return;}
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{
      rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});
      onFocused?.();
    },120);
    return()=>clearTimeout(t);
  },[defaultOpen,embedMode,locked]);
  function handleToggle(){
    if(locked)return;
    if(!open)playLessonSound();
    setOpen(o=>!o);
  }
  async function toggleTarefa(e){
    e.stopPropagation();
    if(locked&&!isAdmin)return;
    const newVal=!item.tarefaFeita;
    const patch={};
    patch[`trilha.${item.id}.tarefaFeita`]=newVal;
    await db.collection("students").doc(uid).update(patch);
  }
  const borderColor=getLessonBorderColor(item);
  const typeTag=isReportCard?"tag-review":isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReportCard?"Report Card":isReview?"Review":isOutput?"Output":"Input";
  const doneTypeCls=isDone?(isOutput?" done-output":isReview?" done-review":" done-input"):"";
  const statusCls=isPending?" lesson-pending":isAndamento?" lesson-andamento":"";
  const lockCls=locked?" lesson-locked":"";
  if(isReportCard){
    return(
      <div ref={rootRef} className="lesson-card" style={{borderLeft:"3px solid #0f766e"}}>
        <div className="flex items-center gap-3 px-4 py-3">
          <span className="num-dark">RC</span>
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-sm flex items-center gap-2 flex-wrap">{item.title}<span className={typeTag}>{typeLabel}</span></div>
            <div className="text-xs muted mt-0.5">{item.reportCardScope==="unit"?`Âncora da unidade${item.reportCardUnitName?" ("+item.reportCardUnitName+")":""}`:"Âncora do módulo"} — use Relatórios → Por aluno → Report Card</div>
          </div>
        </div>
      </div>
    );
  }
  if(embedMode)return(
    <div ref={rootRef} className="lesson-detail" style={{padding:"12px 14px"}}>
      <div className="flex items-center gap-2 flex-wrap mb-3 pb-3" style={{borderBottom:"1px solid var(--divider)"}}>
        <span className={typeTag} style={{fontSize:10}}>{typeLabel}</span>
        <LessonBadge status={item.status}/>
        {!isReview&&isAdmin&&<button type="button" title={item.tarefaFeita?"Tarefa entregue":"Marcar tarefa"} onClick={toggleTarefa} style={{width:28,height:28,borderRadius:8,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",background:item.tarefaFeita?"rgba(34,197,94,.18)":"var(--badge)",color:item.tarefaFeita?"#22c55e":"var(--font-muted)",marginLeft:"auto"}}><Icon name={item.tarefaFeita?"check-square":"square"} size={14}/></button>}
      </div>
      {isAdmin?<AdminLessonPanel item={item} uid={uid}/>:<StudentLessonView item={item}/>}
    </div>
  );
  return(
    <div ref={rootRef} className={(isReview?"review-card":"lesson-card")+(isDone?" done-card":"")+doneTypeCls+statusCls+lockCls} style={{borderLeft:`3px solid ${borderColor}`}}>
      <div className="flex items-center gap-3 px-4 py-3" style={{cursor:locked?"not-allowed":"pointer"}} onClick={handleToggle} title={locked?"Lição bloqueada":undefined}>
        <span className={isReview?"num-dark":"num-light"}>{item.pos}</span>
        <div className="flex-1 min-w-0">
          <div className="font-semibold text-sm flex items-center gap-2 flex-wrap">
            {item.title}
            <span className={typeTag}>{typeLabel}</span>
          </div>
          <div className="text-xs mt-0.5 flex items-center gap-2 flex-wrap" style={{opacity:.85}}>
            <span>{item.displayLabel?("Lesson "+item.displayLabel):(isReview?("R"+item.num):("Lesson "+item.num))}</span>
            {item.tema&&!locked&&<span style={{opacity:.9}}>{item.tema}</span>}
            {item.date&&!locked&&<span className="flex items-center gap-1"><Icon name="calendar" size={10}/>{formatDateBR(item.date)}</span>}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {isPending&&<span className="tl-badge-pendente"><Icon name="lock" size={10}/> Pendente</span>}
          {!isReview&&isAdmin&&(
            <button
              type="button"
              title={item.tarefaFeita ? "Tarefa entregue ✓" : "Marcar tarefa como entregue"}
              onClick={toggleTarefa}
              style={{
                width:28,height:28,borderRadius:8,border:'none',cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',
                background:item.tarefaFeita?'rgba(34,197,94,.18)':'var(--badge)',
                color:item.tarefaFeita?'#22c55e':'var(--font-muted)',
                transition:'all 180ms ease',
                flexShrink:0,
              }}
            >
              <Icon name={item.tarefaFeita?"check-square":"square"} size={14}/>
            </button>
          )}
          <LessonBadge status={item.status}/>
          {!locked&&<Icon name="chevron-down" size={14} className={"chevron-icon"+(open?" chevron-open":"")} style={{opacity:.75}}/>}
        </div>
      </div>
      {open&&!locked&&<div className="lesson-detail">{isAdmin?<AdminLessonPanel item={item} uid={uid}/>:<StudentLessonView item={item}/>}</div>}
    </div>
  );
}

function TimelineSegment({height,variant}){
