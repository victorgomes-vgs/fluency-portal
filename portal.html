// ─── Helpers ──────────────────────────────────────────────────────────────────
function getLessonTitle(n){ return `Lesson ${n}`; }

function getTodayPT(){
  return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function formatDateBR(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function playLessonSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[440,0],[660,.07],[880,.13]].forEach(([freq,delay])=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type='sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime+delay);
      osc.frequency.exponentialRampToValueAtTime(freq*1.5, ctx.currentTime+delay+.1);
      gain.gain.setValueAtTime(.07, ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+.28);
      osc.start(ctx.currentTime+delay);
      osc.stop(ctx.currentTime+delay+.3);
    });
  }catch(e){}
}

function generateBooks(){
  const books=[]; let g=0;
  for(let bi=1;bi<=6;bi++){
    const items=[];
    for(let bl=1;bl<=5;bl++){
      for(let sq=1;sq<=10;sq++){
        g++;
        const isReview=(sq===10);
        const lt = isReview ? null : ([3,6,9].includes(sq) ? "output" : "input");
        items.push({
          id: isReview ? `b${bi}-r${bl}` : `b${bi}-l${g}`,
          pos:g, type:isReview?"review":"lesson", lessonType:lt,
          num:g, title:getLessonTitle(g),
          status:"pendente", date:"", obs:"", link:"",
          attendance:"", evaluation:"", linkMaterial:"", linkAula:"", linkChamada:"", linkTarefa:"",
        });
      }
    }
    books.push({ bookIdx:bi, items });
  }
  return books;
}
const BOOKS_TEMPLATE = generateBooks();

function mergeBooks(trilhaData){
  return BOOKS_TEMPLATE.map(b=>({
    ...b,
    items: b.items.map(i=>({ ...i, ...(trilhaData[i.id]||{}) }))
  }));
}

function getCurrentModule(books){
  for(let i=books.length-1;i>=0;i--){
    if(books[i].items.some(it=>it.status==="andamento"||it.status==="concluida")) return i+1;
  }
  return 1;
}

      setTrilhaData(doc.exists ? doc.data().trilha||{} : {});
    });

  const books = useMemo(()=> trilhaData ? mergeBooks(trilhaData) : [], [trilhaData]);
  const { totalDone, totalItems } = useMemo(()=>{

// ─── Diário Section ────────────────────────────────────────────────────────────
function DiarioSection({ uid, isAdmin }){
  const [entries,setEntries]=useState(null);

  useEffect(()=>{
    return db.collection("students").doc(uid).collection("diario")
      .orderBy("num","asc")
      .onSnapshot(snap=>{
        setEntries(snap.docs.map(d=>({id:d.id,...d.data()})));
      });
  },[uid]);

  async function addEntry(){
    const nextNum = entries&&entries.length>0 ? Math.max(...entries.map(e=>e.num))+1 : 1;
    await db.collection("students").doc(uid).collection("diario").add({
      num:nextNum, date:new Date().toISOString().slice(0,10),
      licaoNum:1, status:"andamento", obs:"",
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    });
  }

  async function updateEntry(id,patch){
    await db.collection("students").doc(uid).collection("diario").doc(id).update(patch);
  }

  async function deleteEntry(id){
    if(!confirm("Remover esta aula?")) return;
    await db.collection("students").doc(uid).collection("diario").doc(id).delete();
  }

  if(!entries) return null;

  return (
    <div>
      <div className="glass rounded-2xl p-5">
        <div className="flex items-center justify-between gap-3 flex-wrap mb-5">
          <div>
            <h3 className="text-lg font-bold">Diário de Aulas</h3>
            <p className="muted text-sm mt-0.5">Registro por aula — acompanhamento e histórico.</p>
          </div>
          <div className="flex items-center gap-3">
            <div className="chip rounded-2xl px-4 py-2 text-sm">
              <span className="muted">Total:</span>{" "}
              <span className="font-semibold">{entries.length} aulas</span>
            </div>
            {isAdmin && (
              <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold"
                onClick={addEntry}>
                <Icon name="plus" size={16}/> Nova Aula
              </button>
            )}
          </div>
        </div>

        {entries.length===0 ? (
          <div className="text-center py-12 muted">
            <Icon name="book-open" size={32} className="mx-auto mb-3 opacity-30"/>
            <p>Nenhuma aula lançada ainda.</p>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left muted text-xs">
                  <th className="py-3 pr-3">Aula</th>
                  <th className="py-3 pr-3">Data</th>
                  <th className="py-3 pr-3">Lição</th>
                  <th className="py-3 pr-3">Status</th>
                  <th className="py-3 pr-3">Observações</th>
                  {isAdmin && <th className="py-3"/>}
                </tr>
              </thead>
              <tbody>
                {entries.map(e=>{
                  const ds = dStatusMap[e.status]||DIARIO_STATUS[0];
                  return (
                    <tr key={e.id} className="dtable-row align-top">
                      <td className="py-3 pr-3">
                        <div className="num-aula inline-flex flex-col items-center">
                          <span className="text-xs opacity-70">Aula</span>
                          <span>{e.num}</span>
                        </div>
                      </td>
                      <td className="py-3 pr-3 whitespace-nowrap">
                        {isAdmin ? (
                          <input type="date" value={e.date||""}
                            onChange={ev=>updateEntry(e.id,{date:ev.target.value})}
                            style={{background:"rgba(0,0,0,.22)",border:"1px solid rgba(255,255,255,.12)",color:"#eaf2f7",borderRadius:8,padding:"4px 8px",fontSize:12,outline:"none",width:130,fontFamily:"'Outfit',sans-serif"}}/>
                        ) : (
                          <span className="muted">{formatDateBR(e.date)||"—"}</span>
                        )}
                      </td>
                      <td className="py-3 pr-3">
                        {isAdmin ? (
                          <>
                            <input type="number" min={1} max={300} value={e.licaoNum||1}
                              onChange={ev=>updateEntry(e.id,{licaoNum:parseInt(ev.target.value)||1})}
                              style={{background:"rgba(0,0,0,.22)",border:"1px solid rgba(255,255,255,.12)",color:"#eaf2f7",borderRadius:8,padding:"4px 8px",fontSize:12,outline:"none",width:65,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}/>
                            <div className="text-xs muted mt-1 max-w-[160px] truncate">{getLessonTitle(e.licaoNum)}</div>
                          </>
                        ) : (
                          <>
                            <span className="font-semibold">Lesson {e.licaoNum}</span>
                            <div className="text-xs muted mt-0.5 max-w-[160px] truncate">{getLessonTitle(e.licaoNum)}</div>
                          </>
                        )}
                      </td>
                      <td className="py-3 pr-3 whitespace-nowrap">
                        {isAdmin ? (
                          <>
                            <select className="ds-select" value={e.status}
                              onChange={ev=>updateEntry(e.id,{status:ev.target.value})}>
                              {DIARIO_STATUS.map(s=>(
                                <option key={s.value} value={s.value}>{s.label}</option>
                              ))}
                            </select>
                            <div className="mt-1.5">
                              <span className={"diario-badge "+ds.cls}>{ds.label}</span>
                            </div>
                          </>
                        ) : (
                          <span className={"diario-badge "+ds.cls}>{ds.label}</span>
                        )}
                      </td>
                      <td className="py-3 pr-3" style={{minWidth:200}}>
                        {isAdmin ? (
                          <textarea className="obs-input" rows={2}
                            placeholder="Resumo, notas..."
                            value={e.obs||""}
                            onChange={ev=>updateEntry(e.id,{obs:ev.target.value})}/>
                        ) : (
                          <span className="muted text-xs">{e.obs||"—"}</span>
                        )}
                      </td>
                      {isAdmin && (
                        <td className="py-3">
                          <button className="btn btn-danger rounded-lg px-2.5 py-2"
                            onClick={()=>deleteEntry(e.id)} title="Remover">
                            <Icon name="trash-2" size={14}/>
                          </button>
                        </td>
                      )}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Student Detail ────────────────────────────────────────────────────────────
function StudentDetail({ uid, isAdmin, onBack }){
  const [profile,setProfile]=useState(null);
  const [links,setLinks]=useState([]);
  const [trilhaData,setTrilhaData]=useState({});
  const [activeTab,setActiveTab]=useState("trilha");
  const [editProfile,setEditProfile]=useState(false);
  const [editFields,setEditFields]=useState({});
  const [imgOk,setImgOk]=useState(true);

  useEffect(()=>{
    const ref = db.collection("students").doc(uid);
    ref.get().then(doc=>{
      if(!doc.exists){
        ref.set({
          name:"Aluno", level:"A1", program:"Fluência Real em 18 Meses", coach:"Victor Gomes",
          profession:"", birthday:"",
          links:[
            {id:1,label:"Materiais (Drive)",  url:"https://drive.google.com/"},
            {id:2,label:"Tarefas (Classroom)",url:"https://classroom.google.com/"},
            {id:3,label:"Agendamento",         url:SCHED_URL},
          ],
          trilha:{},
        });
      }
    });

    return ref.onSnapshot(doc=>{
      if(doc.exists){
        const d=doc.data();
        setProfile({ uid, name:d.name, level:d.level, program:d.program,
          coach:d.coach, profession:d.profession||"", birthday:d.birthday||"" });
        setLinks(d.links||[]);
        setTrilhaData(d.trilha||{});
      }
    });
  },[uid]);

  const books = useMemo(()=>mergeBooks(trilhaData),[trilhaData]);
  const currentMod = useMemo(()=>getCurrentModule(books),[books]);

  async function saveProfile(){
    await db.collection("students").doc(uid).update(editFields);
    setEditProfile(false);
  }

  function startEditProfile(){
    setEditFields({
      name:profile.name, level:profile.level,
      profession:profile.profession, birthday:profile.birthday,
    });
    setEditProfile(true);
  }

  if(!profile) return <LoadingScreen/>;

  const tabs = [
    { id:"trilha",   label:"Trilha da Fluência" },
    { id:"recursos", label:"Recursos" },
    { id:"diario",   label:"Diário de Aulas" },
  ];

  // Calc age from birthday
  function calcAge(bday){
    if(!bday) return null;
    const [y,m,d] = bday.split("-").map(Number);
    const today = new Date();
    let age = today.getFullYear()-y;
    if(today.getMonth()+1<m||(today.getMonth()+1===m&&today.getDate()<d)) age--;
    return age;
  }
  const age = calcAge(profile.birthday);

  return (
    <div className="min-h-screen pb-20">
      {/* ── Header ── */}
      <header className="px-4 py-4 sticky top-0 z-50" style={{background:"rgba(8,14,26,.85)",backdropFilter:"blur(14px)",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
        <div className="max-w-3xl mx-auto flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            {isAdmin && onBack && (
              <button className="btn rounded-xl px-3 py-2.5 inline-flex items-center gap-2" onClick={onBack}>
                <Icon name="arrow-left" size={16}/>
              </button>
            )}
            {imgOk
              ? <img src={LOGO_URL} alt="Fluency Studio" className="h-8" onError={()=>setImgOk(false)}/>
              : <span className="font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif"}}>Fluency Studio</span>
            }
          </div>
          <div className="flex items-center gap-2">
            {isAdmin && (
              <span className="text-xs font-bold tracking-widest px-3 py-1.5 rounded-full"
                style={{background:"rgba(44,122,142,.2)",border:"1px solid rgba(44,122,142,.4)",color:"rgba(44,122,142,1)"}}>
                ADMIN
              </span>
            )}
            {!isAdmin && (
              <button className="btn rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm" onClick={()=>auth.signOut()}>
                <Icon name="log-out" size={16}/><span className="hidden sm:inline">Sair</span>
              </button>
            )}
            {isAdmin && (
              <button className="btn rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm" onClick={()=>auth.signOut()}>
                <Icon name="log-out" size={16}/>
              </button>
            )}
          </div>
        </div>
      </header>

      <main className="px-4 pt-6 max-w-3xl mx-auto">
        {/* ── Profile Card ── */}
        <div className="glass rounded-2xl p-5 mb-5">
          <div className="flex items-start justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif"}}>
                {profile.name}
              </h1>
              {!editProfile && (
                <div className="flex flex-wrap gap-2 mt-2">
                  {profile.profession && (
                    <span className="chip rounded-full px-3 py-1 text-xs font-medium">{profile.profession}</span>
                  )}
                  {age !== null && (
                    <span className="chip rounded-full px-3 py-1 text-xs font-medium">{age} anos</span>
                  )}
                  {profile.birthday && (
                    <span className="chip rounded-full px-3 py-1 text-xs font-medium">
                      🎂 {formatDateBR(profile.birthday).slice(0,5)}
                    </span>
                  )}
                  <span className="rounded-full px-3 py-1 text-xs font-bold"
                    style={{background:MODULES[currentMod-1]?.accent+".18)",border:"1px solid "+MODULES[currentMod-1]?.accent+".40)"}}>
                    Módulo {currentMod} · {MODULES[currentMod-1]?.name}
                  </span>
                </div>
              )}
            </div>
            {isAdmin && !editProfile && (
              <button className="btn rounded-lg px-3 py-1.5 text-xs inline-flex items-center gap-1.5 shrink-0"
                onClick={startEditProfile}>
                <Icon name="pencil" size={12}/> Perfil
              </button>
            )}
          </div>

          {editProfile && (
            <div className="mt-4 space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <div className="detail-label">Nome</div>
                  <input className="input-light mt-1" value={editFields.name||""}
                    onChange={e=>setEditFields(p=>({...p,name:e.target.value}))}/>
                </div>
                <div>
                  <div className="detail-label">Nível (CEFR)</div>
                  <select className="input-light mt-1" value={editFields.level||"A1"}
                    onChange={e=>setEditFields(p=>({...p,level:e.target.value}))}>
                    {["A1","A2","B1","B2","C1","C2"].map(l=><option key={l}>{l}</option>)}
                  </select>
                </div>
                <div>
                  <div className="detail-label">Profissão</div>
                  <input className="input-light mt-1" placeholder="Ex: Médica, Engenheiro..."
                    value={editFields.profession||""}
                    onChange={e=>setEditFields(p=>({...p,profession:e.target.value}))}/>
                </div>
                <div>
                  <div className="detail-label">Data de Nascimento</div>
                  <input type="date" className="input-light mt-1" value={editFields.birthday||""}
                    onChange={e=>setEditFields(p=>({...p,birthday:e.target.value}))}/>
                </div>
              </div>
              <div className="flex gap-2">
                <button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={saveProfile}>Salvar</button>
                <button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setEditProfile(false)}>Cancelar</button>
              </div>
            </div>
          )}
        </div>

        {/* ── Tabs ── */}
        <div className="tab-bar mb-5">
          {tabs.map(t=>(
            <button key={t.id}
              className={"tab-btn"+(activeTab===t.id?" tab-btn-active":"")}
              onClick={()=>setActiveTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>

        {/* ── Tab content ── */}
        {activeTab==="trilha"   && <TrilhaSection   uid={uid} isAdmin={isAdmin}/>}
        {activeTab==="recursos" && <RecursosSection  uid={uid} isAdmin={isAdmin} links={links}/>}
        {activeTab==="diario"   && <DiarioSection    uid={uid} isAdmin={isAdmin}/>}
      </main>

      <IVictor/>
    </div>
  );
}

        )}

        {!students ? <LoadingScreen/> : students.length===0 ? (
          <div className="glass rounded-2xl p-12 text-center muted">
            <Icon name="users" size={40} className="mx-auto mb-4 opacity-30"/>
            <p>Nenhum aluno cadastrado ainda.</p>
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {students.map(s=>{
              const merged=mergeBooks(s.trilha||{});
              let done=0,total=0;
              merged.forEach(b=>b.items.forEach(i=>{ total++; if(i.status==="concluida") done++; }));
              const pct=total ? Math.round((done/total)*100) : 0;
              const mod=getCurrentModule(merged);
              return (
                <div key={s.uid} className="student-card" onClick={()=>setSelectedUid(s.uid)}>
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-10 h-10 rounded-full chip flex items-center justify-center shrink-0">
                      <Icon name="user" size={18}/>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-bold truncate">{s.name||"Aluno"}</div>
                      <div className="text-xs muted">Módulo {mod} · Nível {s.level||"—"}</div>
                    </div>
                    <Icon name="chevron-right" size={16} className="muted shrink-0"/>
                  </div>
                  <div className="flex items-center justify-between text-xs muted mb-1">
                    <span>Progresso</span><span className="font-semibold">{pct}%</span>
                  </div>
                  <div className="h-1.5 rounded-full overflow-hidden" style={{background:"rgba(0,0,0,.30)"}}>
                    <div className="h-full rounded-full progress-fill"
                      style={{width:pct+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/>
                  </div>
                  <div className="text-xs muted mt-2">{done} de {total} lições concluídas</div>
                </div>
              );
            })}
          </div>
        )}
      </main>
    </div>
  );
}

// ─── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>{ return auth.onAuthStateChanged(u=>setUser(u||null)); },[]);
  if(user===undefined) return <LoadingScreen/>;
  if(!user)            return <Login/>;
  if(user.uid===ADMIN_UID) return <AdminApp user={user}/>;
  return <StudentDetail uid={user.uid} isAdmin={false}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
