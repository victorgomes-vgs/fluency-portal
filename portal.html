  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;margin:0;padding:0;}

    /* ── TEMA: variáveis CSS injetadas via JS após carregar do Firebase ── */
    :root{
      /* ── GLOBAL ── */
      --bg:            linear-gradient(160deg,#05080f 0%,#080e1c 35%,#0b1328 60%,#0d1a35 80%,#0a1528 100%);
      --font:          #dde6f0;
      --card:          #1c2438;
      --lesson:        #1a2236;
      --detail:        #111927;
      --header:        rgba(10,18,38,.94);
      --tabbar:        rgba(255,255,255,.04);
      --badge:         rgba(255,255,255,.07);
      --btn:           rgba(255,255,255,.07);
      --done:          rgba(30,160,110,.28);
      --done-border:   rgba(30,160,110,.55);
      --done-text:     #60daa8;

      /* ── PÁGINA PRINCIPAL ── */
      --hp-nome:       #dde6f0;
      --hp-subtitulo:  rgba(180,200,220,.55);
      --hp-progresso:  rgba(180,200,220,.55);
      --hp-pct:        #dde6f0;
      --hp-licoes:     rgba(180,200,220,.55);
      --hp-header:     #dde6f0;
      --hp-header-sub: rgba(180,200,220,.55);

      /* ── FINANCEIRO ── */
      --fin-titulo:    #dde6f0;
      --fin-label:     #5ab4cc;
      --fin-valor:     #dde6f0;
      --fin-desconto:  rgba(44,160,180,1);
      --fin-mes:       #dde6f0;
      --fin-muted:     rgba(180,200,220,.55);
      --fin-creditos-num: rgba(44,160,180,1);
      --fin-creditos-sub: rgba(180,200,220,.55);

      /* ── TRILHA ── */
      --tr-titulo:     #dde6f0;
      --tr-subtitulo:  rgba(180,200,220,.55);
      --tr-progresso:  rgba(180,200,220,.55);
      --tr-pct:        #dde6f0;
      --tr-grupo:      rgba(180,200,220,.55);
      --tr-mod-nome:   #dde6f0;
      --tr-mod-label:  rgba(180,200,220,.55);
      --tr-mod-num:    #dde6f0;
      --tr-licao-nome: #dde6f0;
      --tr-licao-sub:  rgba(180,200,220,.55);
      --tr-licao-data: rgba(180,200,220,.55);
      --tr-tag-input:  #7de0f8;
      --tr-tag-output: #f0a0c0;
      --tr-detail-label: #5ab4cc;
      --tr-detail-val: #dde6f0;
      --tr-obs:        #dde6f0;
      --tr-link-col:   #5ab4cc;
      --tr-link-btn:   #7de0f8;

      /* ── RECURSOS ── */
      --rec-titulo:    #dde6f0;
      --rec-link-nome: #dde6f0;
      --rec-link-url:  rgba(180,200,220,.55);
      --rec-wpp-nome:  #dde6f0;
      --rec-wpp-sub:   rgba(180,200,220,.55);
      --rec-agenda-nome: #dde6f0;
      --rec-agenda-sub:  rgba(180,200,220,.55);

      /* ── DIÁRIO ── */
      --di-titulo:     #dde6f0;
      --di-subtitulo:  rgba(180,200,220,.55);
      --di-total:      rgba(180,200,220,.55);
      --di-total-num:  #dde6f0;
      --di-th:         rgba(180,200,220,.55);
      --di-num-aula:   #ffffff;
      --di-data:       rgba(180,200,220,.55);
      --di-licao:      #dde6f0;
      --di-licao-sub:  rgba(180,200,220,.55);
      --di-obs:        rgba(180,200,220,.55);
    }
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--font);min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 900px 600px at 10% 0%,rgba(32,120,150,.07),transparent 65%),
                 radial-gradient(ellipse 700px 500px at 90% 95%,rgba(20,60,110,.09),transparent 65%);}
    #root{position:relative;z-index:1;}

    /* ── CARDS ── */
    .glass{background:var(--card);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
    .muted{color:rgba(180,200,220,.55);}
    .chip{background:var(--badge);border:1px solid rgba(255,255,255,.10);}
    .btn{border:1px solid rgba(255,255,255,.12);background:var(--btn);transition:transform .08s,background .12s;cursor:pointer;color:var(--font);}
    .btn:hover{filter:brightness(1.12);}
    .btn:active{transform:translateY(1px);}
    .btn-primary{border:1px solid rgba(44,160,180,.55);background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;}
    .btn-primary:hover{filter:brightness(1.10);}
    .btn-danger{border:1px solid rgba(200,60,80,.35);background:rgba(200,60,80,.10);color:#e07080;}
    .btn-danger:hover{background:rgba(200,60,80,.18);}

    /* ── INPUTS ── */
    .input{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.13);outline:none;color:var(--font);font-family:'Outfit',sans-serif;}
    .input:focus{border-color:rgba(44,160,180,.75);box-shadow:0 0 0 3px rgba(44,160,180,.14);}
    .input-light{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.11);outline:none;color:var(--font);border-radius:8px;padding:5px 10px;font-size:13px;width:100%;font-family:'Outfit',sans-serif;}
    .input-light:focus{border-color:rgba(44,160,180,.6);box-shadow:0 0 0 3px rgba(44,160,180,.12);}
    .err-box{background:rgba(200,60,70,.12);border:1px solid rgba(200,60,70,.38);border-radius:12px;padding:10px 14px;font-size:13px;color:#f0a0a8;}

    /* ── TAB BAR ── */
    .tab-bar{display:flex;background:var(--tabbar);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:3px;overflow-x:auto;}
    .tab-btn{flex:1;padding:9px 10px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;border:none;background:transparent;color:rgba(180,200,220,.45);transition:all .18s;white-space:nowrap;min-width:fit-content;}
    .tab-btn:hover{color:rgba(200,220,240,.80);background:rgba(255,255,255,.05);}
    .tab-btn-active{background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;border:1px solid rgba(44,160,180,.40)!important;box-shadow:0 2px 14px rgba(30,143,168,.25);}

    /* ── BOOK ACCORDIONS ── */
    .book-m1{background:linear-gradient(135deg,rgba(26,138,158,.18),rgba(13,82,98,.12));border:1px solid rgba(26,138,158,.32);color:#b8e8f2;}
    .book-m1:hover{background:linear-gradient(135deg,rgba(26,138,158,.26),rgba(13,82,98,.18));}
    .book-m2{background:linear-gradient(135deg,rgba(42,100,190,.18),rgba(26,58,140,.12));border:1px solid rgba(42,100,190,.32);color:#b0ccf8;}
    .book-m2:hover{background:linear-gradient(135deg,rgba(42,100,190,.26),rgba(26,58,140,.18));}
    .book-m3{background:linear-gradient(135deg,rgba(26,154,122,.18),rgba(13,90,72,.12));border:1px solid rgba(26,154,122,.32);color:#a0e8cc;}
    .book-m3:hover{background:linear-gradient(135deg,rgba(26,154,122,.26),rgba(13,90,72,.18));}
    .book-m4{background:linear-gradient(135deg,rgba(110,84,200,.18),rgba(52,26,140,.12));border:1px solid rgba(110,84,200,.32);color:#c8b8f8;}
    .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.26),rgba(52,26,140,.18));}
    .book-m5{background:linear-gradient(135deg,rgba(42,130,190,.18),rgba(26,80,140,.12));border:1px solid rgba(42,130,190,.32);color:#a8d4f8;}
    .book-m5:hover{background:linear-gradient(135deg,rgba(42,130,190,.26),rgba(26,80,140,.18));}
    .book-m6{background:linear-gradient(135deg,rgba(70,100,160,.18),rgba(30,50,100,.12));border:1px solid rgba(70,100,160,.32);color:#b0c4e8;}
    .book-m6:hover{background:linear-gradient(135deg,rgba(70,100,160,.26),rgba(30,50,100,.18));}

    /* ── LESSON CARDS ── */
    .lesson-card{background:var(--lesson);border-bottom:1px solid rgba(255,255,255,.05);color:var(--font);transition:background .12s;}
    .lesson-card:hover{filter:brightness(1.08);}
    .lesson-card:last-child{border-bottom:none;}
    /* LIÇÃO CONCLUÍDA: fundo colorido configurável */
    .lesson-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;}
    .review-card{background:rgba(30,130,155,.14);border-bottom:1px solid rgba(30,130,155,.20);color:var(--font);transition:background .12s;}
    .review-card:hover{background:rgba(30,130,155,.22);}
    .review-card:last-child{border-bottom:none;}
    .review-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;}
    .lesson-detail{background:var(--detail);border-top:1px solid rgba(255,255,255,.06);padding:14px 18px 16px;}
    .detail-label{font-size:11px;font-weight:700;color:#5ab4cc;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
    .num-light{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:var(--font);min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    .num-dark{background:rgba(30,143,168,.22);border:1px solid rgba(30,143,168,.42);color:#7de0f8;min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    .tag-input{background:rgba(30,143,168,.18);color:#7de0f8;border:1px solid rgba(30,143,168,.38);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    .tag-output{background:rgba(180,80,120,.16);color:#f0a0c0;border:1px solid rgba(180,80,120,.36);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    .chevron-icon{transition:transform .2s;}
    .chevron-open{transform:rotate(180deg);}

    /* ── STATUS BADGES ── */
    .ls-pendente{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#8ab0c8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-andamento{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.36);color:#f0cc60;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-concluida{background:rgba(30,160,110,.14);border:1px solid rgba(30,160,110,.38);color:#60daa8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .att-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .att-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .att-inactive:hover{background:rgba(255,255,255,.09);}
    .att-presente{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.45);color:#60daa8;}
    .att-ausente{background:rgba(200,60,80,.16);border-color:rgba(200,60,80,.42);color:#f0909a;}
    .att-desmarcada{background:rgba(140,140,140,.12);border-color:rgba(140,140,140,.28);color:#a0b0c0;}
    .eval-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .eval-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .eval-inactive:hover{background:rgba(255,255,255,.09);}
    .eval-revisao{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.40);color:#f0cc60;}
    .eval-atingiu{background:rgba(42,120,200,.16);border-color:rgba(42,120,200,.40);color:#88c0f8;}
    .eval-superou{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.42);color:#60daa8;}
    .sbtn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .sbtn-off{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .sbtn-off:hover{background:rgba(255,255,255,.09);}
    .sbtn-pendente{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#98bcd4;}
    .sbtn-andamento{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.42);color:#f0cc60;}
    .sbtn-concluida{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.46);color:#60daa8;}

    /* ── DIÁRIO ── */
    .ds-realizada{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .ds-andamento{background:rgba(30,143,168,.18);border:1px solid rgba(30,143,168,.36);color:#7de0f8;}
    .ds-ausente{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.38);color:#f0909a;}
    .ds-desmarcada{background:rgba(140,140,140,.11);border:1px solid rgba(140,140,140,.26);color:#a0b0c0;}
    .ds-rep-gratis{background:rgba(42,100,200,.16);border:1px solid rgba(42,100,200,.34);color:#88c0f8;}
    .ds-rep-paga{background:rgba(180,100,20,.16);border:1px solid rgba(180,100,20,.34);color:#f0b060;}
    .ds-cancelada{background:rgba(160,40,70,.16);border:1px solid rgba(160,40,70,.34);color:#f09090;}
    .diario-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-block;}
    .num-aula{background:linear-gradient(135deg,#1e8fa8,#145f7a);border:1px solid rgba(30,143,168,.50);color:#fff;min-width:3rem;text-align:center;border-radius:9px;padding:5px 8px;font-weight:700;font-size:12px;flex-shrink:0;line-height:1.3;}
    .dtable-row{border-bottom:1px solid rgba(255,255,255,.05);}
    .dtable-row:last-child{border-bottom:none;}
    .dtable-row:hover{background:rgba(255,255,255,.03);}
    select.ds-select{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.11);color:var(--font);border-radius:8px;padding:4px 8px;font-size:12px;outline:none;cursor:pointer;min-width:170px;font-family:'Outfit',sans-serif;}
    select.ds-select:focus{border-color:rgba(30,143,168,.7);}
    textarea.obs-input{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.11);color:var(--font);border-radius:8px;padding:5px 10px;font-size:12px;outline:none;resize:vertical;min-height:36px;width:100%;font-family:'Outfit',sans-serif;}
    textarea.obs-input:focus{border-color:rgba(30,143,168,.7);}

    /* ── FINANCEIRO ── */
    .fin-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block;}
    .fin-paga{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .fin-avencer{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.38);color:#f0cc60;}
    .fin-vencida{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.40);color:#f0909a;}
    .fin-aberto{background:rgba(42,120,200,.14);border:1px solid rgba(42,120,200,.33);color:#88c0f8;}
    .fin-creditos{background:rgba(110,80,200,.14);border:1px solid rgba(110,80,200,.33);color:#c0a8f8;}

    /* ── iVICTOR ── */
    .ivictor-btn{position:fixed;bottom:22px;right:22px;z-index:900;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid rgba(30,143,168,.65);box-shadow:0 4px 24px rgba(0,0,0,.40),0 0 0 4px rgba(30,143,168,.12);cursor:pointer;transition:transform .18s;background:#0c2030;}
    .ivictor-btn:hover{transform:scale(1.07);}
    .ivictor-panel{position:fixed;bottom:92px;right:22px;z-index:900;width:280px;border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.50);animation:slideUp .22s ease-out;}
    @keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .ivictor-header{background:linear-gradient(135deg,#1e8fa8,#145f7a);padding:12px 14px;display:flex;align-items:center;gap:10px;color:#fff;}
    .ivictor-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.3);flex-shrink:0;background:#0c2030;}
    .ivictor-body{background:#141e30;border:1px solid rgba(30,143,168,.22);backdrop-filter:blur(16px);padding:14px;}
    .ivictor-msg{background:rgba(30,143,168,.12);border:1px solid rgba(30,143,168,.22);border-radius:12px 12px 12px 3px;padding:10px 13px;font-size:13px;line-height:1.5;color:#d8e8f4;}
    .ivictor-date{font-size:11px;color:rgba(180,200,220,.38);margin-top:8px;text-align:center;}

    /* ── STUDENT CARDS ── */
    .student-card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;cursor:pointer;transition:all .15s;}
    .student-card:hover{filter:brightness(1.10);box-shadow:0 4px 22px rgba(0,0,0,.35);transform:translateY(-1px);}

    /* ── APARÊNCIA ── */
    .ap-section{border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:16px;background:rgba(0,0,0,.18);}
    .ap-section h4{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5ab4cc;margin-bottom:14px;}
    .ap-swatch{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}
    .ap-swatch:hover{transform:scale(1.12);}
    .ap-swatch.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(30,143,168,.5);}
    .ap-preset{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;background:rgba(255,255,255,.04);}
    .ap-preset:hover{background:rgba(255,255,255,.09);}
    .ap-preset.selected{border-color:rgba(30,143,168,.8);background:rgba(30,143,168,.14);color:#7de0f8;}

    /* ── MISC ── */
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(30,143,168,.28);border-radius:99px;}
    .progress-fill{transition:width .6s ease;}
  </style>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Outfit','ui-sans-serif']}}}}</script>

  <script>
  // Carrega tema do Firebase assim que possível e aplica CSS variables
  (function(){
    function applyTheme(t){
      if(!t)return;
      const r=document.documentElement.style;
      const s=(k,v)=>{if(v!==undefined&&v!==null&&v!=='')r.setProperty(k,v);};
      s('--bg',t.bg);s('--font',t.font);s('--card',t.card);
      s('--header',t.header);s('--tabbar',t.tabbar);s('--badge',t.badge);s('--btn',t.btn);
      s('--done',t.done);s('--done-border',t.doneBorder);s('--done-text',t.doneText);
      s('--hp-nome',t.hp_nome);s('--hp-subtitulo',t.hp_subtitulo);
      s('--hp-progresso',t.hp_progresso);s('--hp-pct',t.hp_pct);
      s('--hp-licoes',t.hp_licoes);s('--hp-header',t.hp_header);s('--hp-header-sub',t.hp_header_sub);
      s('--fin-titulo',t.fin_titulo);s('--fin-label',t.fin_label);
      s('--fin-valor',t.fin_valor);s('--fin-desconto',t.fin_desconto);

function playLessonSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
  [[440,0],[660,.07],[880,.13]].forEach(([freq,delay])=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';
    osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);osc.frequency.exponentialRampToValueAtTime(freq*1.5,ctx.currentTime+delay+.1);
    gain.gain.setValueAtTime(.07,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.28);
    osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+.3);});}catch(e){}
}

      }
    }
    books.push({bookIdx:bi,items});
  }
  return books;
}

function FinanceiroStrip({financeiro,onGoToFinanceiro}){
  const tipo=financeiro?.tipo||"mensalidade";const parcelas=financeiro?.parcelas||[];const creditosTotal=financeiro?.creditosTotal||0;
  const hasData=parcelas.length>0||(tipo==="creditos"&&creditosTotal>0);
  if(!hasData)return null;
  const sorted=[...parcelas].sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const lastPaid=[...sorted].reverse().find(p=>p.status==="paga");
  const next=sorted.find(p=>p.status!=="paga");
  let statusLabel="",statusCls="";
  if(tipo==="creditos"){const r=creditosTotal-(financeiro?.creditosUsados||0);statusLabel=`${r} Crédito${r!==1?"s":""} Restante${r!==1?"s":""}`;statusCls="fin-creditos";}
  else if(sorted.some(p=>p.status==="vencida")){statusLabel="Atrasado";statusCls="fin-vencida";}
  else if(sorted.some(p=>p.status==="paga")){statusLabel="Em Dia";statusCls="fin-paga";}
  return(
    <div onClick={onGoToFinanceiro} style={{background:"#0c1524",borderRadius:12,padding:"10px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,marginTop:12,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}><Icon name="dollar-sign" size={13} style={{color:"rgba(44,122,142,1)"}}/><span style={{color:"#eaf2f7",fontWeight:700,fontSize:11,letterSpacing:"0.07em",textTransform:"uppercase"}}>Financeiro</span></div>
      <div style={{width:1,height:14,background:"rgba(255,255,255,.15)",flexShrink:0}}/>
      {lastPaid&&<span style={{color:"rgba(234,242,247,.65)",fontSize:12}}>Última: <strong style={{color:"#eaf2f7"}}>{lastPaid.mes}</strong> <span className="fin-badge fin-paga" style={{fontSize:10}}>Paga</span></span>}
      {next&&<><div style={{width:1,height:14,background:"rgba(255,255,255,.15)",flexShrink:0}}/><span style={{color:"rgba(234,242,247,.65)",fontSize:12}}>Próx: <strong style={{color:"#eaf2f7"}}>{next.mes}</strong>{next.dataVencimento&&<span> · {formatDateBR(next.dataVencimento)}</span>}</span></>}
      {statusLabel&&<span className={"fin-badge "+statusCls} style={{marginLeft:"auto",fontSize:10}}>{statusLabel}</span>}
    </div>
  );
}

  const today=getTodayPT();const todayDisplay=today.charAt(0).toUpperCase()+today.slice(1);
  return(<>
    {open&&<div className="ivictor-panel">
      <div className="ivictor-header"><div className="ivictor-avatar">{imgOk&&VICTOR_PHOTO?<img src={VICTOR_PHOTO} alt="Victor" className="w-full h-full object-cover" onError={()=>setImgOk(false)}/>:<div className="w-full h-full flex items-center justify-center text-lg font-bold" style={{color:"rgba(44,122,142,1)"}}>V</div>}</div><div><div className="font-bold text-sm">iVictor</div><div className="text-xs" style={{color:"rgba(234,242,247,.65)"}}>Seu coach virtual</div></div><button className="ml-auto btn rounded-lg p-1.5" onClick={()=>setOpen(false)}><Icon name="x" size={14}/></button></div>
      <div className="ivictor-body"><div className="ivictor-msg">Sou o iVictor, pode perguntar o que quiser 😊</div><div className="ivictor-date">{todayDisplay}</div></div>
    </div>}
    <button className="ivictor-btn" onClick={()=>setOpen(o=>!o)} title="iVictor">{imgOk&&VICTOR_PHOTO?<img src={VICTOR_PHOTO} alt="Victor" className="w-full h-full object-cover" onError={()=>setImgOk(false)}/>:<div className="w-full h-full flex items-center justify-center font-bold text-xl" style={{color:"rgba(44,122,142,1)",fontFamily:"'Sora',sans-serif"}}>V</div>}</button>
  </>);
}

function StudentDetail({uid,isAdmin,onBack,appTheme={},onThemeSave=()=>{}}){
  const [profile,setProfile]=useState(null);const [links,setLinks]=useState([]);const [trilhaData,setTrilhaData]=useState({});const [financeiro,setFinanceiro]=useState(null);const [activeTab,setActiveTab]=useState("financeiro");const [editProfile,setEditProfile]=useState(false);const [editFields,setEditFields]=useState({});const [imgOk,setImgOk]=useState(true);
  useEffect(()=>{
    const ref=db.collection("students").doc(uid);
    ref.get().then(doc=>{if(!doc.exists)ref.set({name:"Aluno",level:"A1",program:"Fluência Real em 18 Meses",coach:"Victor Gomes",profession:"",birthday:"",links:[{id:1,label:"Materiais (Drive)",url:"https://drive.google.com/"},{id:2,label:"Tarefas (Classroom)",url:"https://classroom.google.com/"}],trilha:{},financeiro:FINANCEIRO_DEFAULT});});
    return ref.onSnapshot(doc=>{if(doc.exists){const d=doc.data();setProfile({uid,name:d.name,level:d.level,program:d.program,coach:d.coach,profession:d.profession||"",birthday:d.birthday||""});setLinks(d.links||[]);setTrilhaData(d.trilha||{});setFinanceiro(d.financeiro||FINANCEIRO_DEFAULT);}});
  },[uid]);
  const books=useMemo(()=>mergeBooks(trilhaData),[trilhaData]);
  const currentMod=useMemo(()=>getCurrentModule(books),[books]);
  async function saveProfile(){await db.collection("students").doc(uid).update(editFields);setEditProfile(false);}
  function startEditProfile(){setEditFields({name:profile.name,level:profile.level,profession:profile.profession,birthday:profile.birthday});setEditProfile(true);}
  function calcAge(bday){if(!bday)return null;const[y,m,d]=bday.split("-").map(Number);const today=new Date();let age=today.getFullYear()-y;if(today.getMonth()+1<m||(today.getMonth()+1===m&&today.getDate()<d))age--;return age;}
  if(!profile)return <LoadingScreen/>;
  const age=calcAge(profile.birthday);
  const tabs=[{id:"financeiro",label:"Financeiro"},{id:"trilha",label:"Trilha"},{id:"recursos",label:"Recursos"},{id:"diario",label:"Diário"},...(isAdmin?[{id:"config",label:"⚙ Config"}]:[])];
  return(
    <div className="min-h-screen pb-20">
      <header className="px-4 py-4 sticky top-0 z-50" style={{background:"var(--header)",backdropFilter:"blur(14px)",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
        <div className="max-w-3xl mx-auto flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            {isAdmin&&onBack&&<button className="btn rounded-xl px-3 py-2.5 inline-flex items-center gap-2" onClick={onBack}><Icon name="arrow-left" size={16}/></button>}
            {imgOk?<img src={LOGO_URL} alt="Fluency Studio" className="h-8" onError={()=>setImgOk(false)}/>:<span className="font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif"}}>Fluency Studio</span>}
          </div>
          <div className="flex items-center gap-2">
            {isAdmin&&<span className="text-xs font-bold tracking-widest px-3 py-1.5 rounded-full" style={{background:"rgba(44,122,142,.12)",border:"1px solid rgba(44,122,142,.32)",color:"rgba(44,122,142,1)"}}>ADMIN</span>}
            <button className="btn rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm" onClick={()=>auth.signOut()}><Icon name="log-out" size={16}/><span className="hidden sm:inline">Sair</span></button>
          </div>
        </div>
      </header>
      <main className="px-4 pt-6 max-w-3xl mx-auto">
        <div className="glass rounded-2xl p-5 mb-5">
          <div className="flex items-start justify-between gap-4">
            <div className="flex-1">
              <h1 className="text-2xl font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif"}}>{profile.name}</h1>
              {!editProfile&&<div className="flex flex-wrap gap-2 mt-2">
                {profile.profession&&<span className="chip rounded-full px-3 py-1 text-xs font-medium">{profile.profession}</span>}
                {age!==null&&<span className="chip rounded-full px-3 py-1 text-xs font-medium">{age} anos</span>}
                {profile.birthday&&<span className="chip rounded-full px-3 py-1 text-xs font-medium">🎂 {formatDateBR(profile.birthday).slice(0,5)}</span>}
                <span className="rounded-full px-3 py-1 text-xs font-bold" style={{background:MODULES[currentMod-1]?.accent+".12)",border:"1px solid "+MODULES[currentMod-1]?.accent+".30)"}}>Módulo {currentMod} · {MODULES[currentMod-1]?.name}</span>
              </div>}
              {!editProfile&&financeiro&&<FinanceiroStrip financeiro={financeiro} onGoToFinanceiro={()=>setActiveTab("financeiro")}/>}
            </div>
            {isAdmin&&!editProfile&&<div className="flex gap-2 shrink-0"><button className="btn rounded-lg px-3 py-1.5 text-xs inline-flex items-center gap-1.5" onClick={startEditProfile}><Icon name="pencil" size={12}/> Perfil</button></div>}
          </div>
          {editProfile&&<div className="mt-4 space-y-3">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><div className="detail-label">Nome</div><input className="input-light mt-1" value={editFields.name||""} onChange={e=>setEditFields(p=>({...p,name:e.target.value}))}/></div>
              <div><div className="detail-label">Nível (CEFR)</div><select className="input-light mt-1" value={editFields.level||"A1"} onChange={e=>setEditFields(p=>({...p,level:e.target.value}))}>{["A1","A2","B1","B2","C1","C2"].map(l=><option key={l}>{l}</option>)}</select></div>
              <div><div className="detail-label">Profissão</div><input className="input-light mt-1" placeholder="Ex: Médica..." value={editFields.profession||""} onChange={e=>setEditFields(p=>({...p,profession:e.target.value}))}/></div>
              <div><div className="detail-label">Data de Nascimento</div><input type="date" className="input-light mt-1" value={editFields.birthday||""} onChange={e=>setEditFields(p=>({...p,birthday:e.target.value}))}/></div>
            </div>
            <div className="flex gap-2"><button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={saveProfile}>Salvar</button><button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setEditProfile(false)}>Cancelar</button></div>
          </div>}
        </div>
        <div className="tab-bar mb-5">{tabs.map(t=><button key={t.id} className={"tab-btn"+(activeTab===t.id?" tab-btn-active":"")} onClick={()=>setActiveTab(t.id)}>{t.label}</button>)}</div>
        {activeTab==="financeiro"&&<>{isAdmin&&<PageConfigBtn page="financeiro" label="Financeiro" theme={appTheme} onSave={onThemeSave}/>}<FinanceiroSection uid={uid} isAdmin={isAdmin} financeiro={financeiro||FINANCEIRO_DEFAULT}/></>
        }{activeTab==="trilha"&&<>{isAdmin&&<PageConfigBtn page="trilha" label="Trilha" theme={appTheme} onSave={onThemeSave}/>}<TrilhaSection uid={uid} isAdmin={isAdmin}/></>
        }{activeTab==="recursos"&&<>{isAdmin&&<PageConfigBtn page="recursos" label="Recursos" theme={appTheme} onSave={onThemeSave}/>}<RecursosSection uid={uid} isAdmin={isAdmin} links={links}/></>
        }{activeTab==="diario"&&<>{isAdmin&&<PageConfigBtn page="diario" label="Diário de Aulas" theme={appTheme} onSave={onThemeSave}/>}<DiarioSection uid={uid} isAdmin={isAdmin}/></>
        }{activeTab==="config"&&isAdmin&&<AparenciaSection theme={appTheme} onSave={onThemeSave}/>}
      </main>
      <IVictor/>
    </div>
  );
}

// ── Botão flutuante que abre o painel da guia ────────────────────
function PageConfigBtn({page, label, theme, onSave}){
  const [open, setOpen] = useState(false);
  const [local, setLocal] = useState({});
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(()=>{
    if(open){
      // Carrega valores atuais do tema para esse page
      const fields = PAGE_FIELDS[page]||[];
      const snap = {};
      fields.forEach(f=>{ snap[f.key] = theme[f.key] || PAGE_DEFAULTS[f.key] || "#ffffff"; });
      setLocal(snap);
    }
  },[open, theme, page]);

  function setVal(key,val){
    setLocal(p=>({...p,[key]:val}));
    // preview ao vivo
    window.__applyTheme && window.__applyTheme({...theme,...local,[key]:val});
  }

  async function save(){
    setSaving(true);
    const merged = {...theme,...local};
    await db.collection("config").doc("aparencia").set(merged);
    window.__applyTheme && window.__applyTheme(merged);
    onSave(merged);
    setSaving(false);
    setSaved(true);
    setTimeout(()=>{ setSaved(false); setOpen(false); },1800);
  }

  const fields = PAGE_FIELDS[page]||[];

  return(
    <>
      {/* Botão ⚙ flutuante no canto da guia */}
      <button onClick={()=>setOpen(true)}
        title={"Configurar cores — "+label}
        style={{
          position:"fixed", bottom:90, right:88, zIndex:800,
          width:40, height:40, borderRadius:"50%",
          background:"linear-gradient(135deg,#1e8fa8,#145f7a)",
          border:"1px solid rgba(30,143,168,.6)",
          boxShadow:"0 2px 16px rgba(0,0,0,.4)",
          cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:16, color:"#fff", transition:"transform .15s",
        }}
        onMouseEnter={e=>e.currentTarget.style.transform="scale(1.12)"}
        onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
      >⚙</button>

      {/* Painel lateral */}
      {open&&(
        <div style={{
          position:"fixed", inset:0, zIndex:1000,
          display:"flex", alignItems:"flex-end", justifyContent:"flex-end",
          background:"rgba(0,0,0,.55)", backdropFilter:"blur(3px)"
        }} onClick={e=>{if(e.target===e.currentTarget)setOpen(false);}}>
          <div style={{
            width:"min(420px,96vw)", height:"92vh",
            background:"#0d1628", borderRadius:"20px 0 0 20px",
            border:"1px solid rgba(255,255,255,.09)",
            display:"flex", flexDirection:"column",
            boxShadow:"-8px 0 40px rgba(0,0,0,.5)",
            animation:"slideInRight .22s ease-out",
          }}>
            {/* Header do painel */}
            <div style={{
              padding:"18px 20px 14px",
              borderBottom:"1px solid rgba(255,255,255,.07)",
              background:"linear-gradient(135deg,rgba(30,143,168,.15),rgba(20,95,122,.10))",
              borderRadius:"20px 0 0 0",
              flexShrink:0,
            }}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontSize:11,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",color:"#5ab4cc",marginBottom:3}}>
                    ⚙ Configurar Cores
                  </div>
                  <div style={{fontSize:17,fontWeight:800,color:"#fff",fontFamily:"'Sora',sans-serif"}}>
                    {label}
                  </div>
                </div>
                <button onClick={()=>setOpen(false)} style={{
                  background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.12)",
                  borderRadius:10,width:36,height:36,cursor:"pointer",color:"#aac",fontSize:18,
                  display:"flex",alignItems:"center",justifyContent:"center",
                }}>×</button>
              </div>
              <div style={{fontSize:12,color:"rgba(180,200,220,.55)",marginTop:6}}>
                Alterações em tempo real • Clique em Salvar para publicar.
              </div>
            </div>

            {/* Lista de campos */}
            <div style={{flex:1,overflowY:"auto",padding:"16px 20px",display:"flex",flexDirection:"column",gap:14}}>
              {fields.map(f=>(
                <div key={f.key} style={{display:"flex",alignItems:"center",gap:12,justifyContent:"space-between"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:600,color:"#c8d8e8",marginBottom:2}}>{f.label}</div>
                    <div style={{fontSize:11,fontFamily:"monospace",color:"rgba(180,200,220,.45)"}}>{local[f.key]||""}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                    {/* Prévia da cor */}
                    <div style={{
                      width:22,height:22,borderRadius:6,
                      background:local[f.key]||"#888",
                      border:"1px solid rgba(255,255,255,.2)",
                    }}/>
                    <input type="color"
                      value={/^#[0-9a-fA-F]{6}$/.test(local[f.key]||"")?local[f.key]:"#dddddd"}
                      onChange={e=>setVal(f.key,e.target.value)}
                      style={{
                        width:40,height:34,border:"1px solid rgba(255,255,255,.15)",
                        borderRadius:8,cursor:"pointer",background:"none",padding:2,
                      }}
                    />
                  </div>
                </div>
              ))}
            </div>

            {/* Footer */}
            <div style={{padding:"14px 20px",borderTop:"1px solid rgba(255,255,255,.07)",flexShrink:0}}>
              <button onClick={save} disabled={saving}
                style={{
                  width:"100%",padding:"12px",borderRadius:12,
                  background:saved?"rgba(30,160,110,.3)":"linear-gradient(135deg,#1e8fa8,#145f7a)",
                  border:saved?"1px solid rgba(30,160,110,.5)":"1px solid rgba(30,143,168,.5)",
                  color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",
                  transition:"all .2s",
                }}>
                {saving?"Salvando…":saved?"✓ Salvo!":"Salvar e Publicar"}
              </button>
            </div>
          </div>
        </div>
      )}

      <style>{`
        @keyframes slideInRight{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
      `}</style>
    </>
  );
}

// Contexto global do tema
const ThemeContext=React.createContext({theme:DEFAULT_THEME,setThemeKey:()=>{},saveTheme:()=>{}});

function useTheme(){return React.useContext(ThemeContext);}

function ThemeProvider({children}){
  const [theme,setTheme]=useState(DEFAULT_THEME);
  const [saved,setSaved]=useState(false);

  useEffect(()=>{
    db.collection("config").doc("aparencia").get().then(doc=>{
      if(doc.exists){const t={...DEFAULT_THEME,...doc.data()};setTheme(t);window.__applyTheme&&window.__applyTheme(t);}
    }).catch(()=>{});
  },[]);

  function setThemeKey(key,val){
    setTheme(prev=>{
      const next={...prev,[key]:val};
      window.__applyTheme&&window.__applyTheme(next);
      return next;
    });
  }
  function setThemeKeys(patch){
    setTheme(prev=>{
      const next={...prev,...patch};
      window.__applyTheme&&window.__applyTheme(next);
      return next;
    });
  }
  async function saveTheme(){
    await db.collection("config").doc("aparencia").set(theme);
    setSaved(true);setTimeout(()=>setSaved(false),2500);
  }
  return <ThemeContext.Provider value={{theme,setThemeKey,setThemeKeys,saveTheme,saved}}>{children}</ThemeContext.Provider>;
}

function CP({label,k,w=28}){
  const {theme,setThemeKey}=useTheme();

  const isHex=val&&val.startsWith("#");

    <div className="flex items-center gap-3 py-1.5">
      <label className="text-xs shrink-0" style={{color:"rgba(180,200,220,.6)",width:w*4+"px"}}>{label}</label>

        <input type="color" value={isHex?val:"#888888"}
          onChange={e=>setThemeKey(k,e.target.value)}
          style={{width:32,height:32,borderRadius:8,border:"1px solid rgba(255,255,255,.15)",cursor:"pointer",padding:2,background:"none"}}/>

          <h3 className="font-bold text-lg mb-4">Adicionar Aluno</h3>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div><label className="block text-xs muted mb-1">UID do Firebase</label><input className="w-full input rounded-xl px-4 py-3 text-sm" placeholder="UID" value={newUid} onChange={e=>setNewUid(e.target.value)}/></div>
            <div><label className="block text-xs muted mb-1">Nome</label><input className="w-full input rounded-xl px-4 py-3 text-sm" placeholder="Nome completo" value={newName} onChange={e=>setNewName(e.target.value)}/></div>
            <div><label className="block text-xs muted mb-1">Nível</label><select className="w-full input rounded-xl px-4 py-3 text-sm" value={newLevel} onChange={e=>setNewLevel(e.target.value)}>{["A1","A2","B1","B2","C1","C2"].map(l=><option key={l}>{l}</option>)}</select></div>
          </div>
          {addErr&&<div className="err-box mt-3">{addErr}</div>}
          <div className="flex gap-3 mt-4"><button className="btn btn-primary rounded-xl px-5 py-2.5 font-semibold text-sm" onClick={createStudent}>Criar</button><button className="btn rounded-xl px-5 py-2.5 text-sm" onClick={()=>{setShowAdd(false);setAddErr("");}}>Cancelar</button></div>
        </div>}
        {!students?<LoadingScreen/>:students.length===0?<div className="glass rounded-2xl p-12 text-center muted"><Icon name="users" size={40} className="mx-auto mb-4 opacity-30"/><p>Nenhum aluno cadastrado ainda.</p></div>:(
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {students.map(s=>{
              const merged=mergeBooks(s.trilha||{});let done=0,total=0;merged.forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida")done++;}));const pct=total?Math.round((done/total)*100):0;const mod=getCurrentModule(merged);const finVencida=s.financeiro?.parcelas?.some(p=>p.status==="vencida");
              return(<div key={s.uid} className="student-card" onClick={()=>setSelectedUid(s.uid)}>
                <div className="flex items-center gap-3 mb-3"><div className="w-10 h-10 rounded-full chip flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div><div className="flex-1 min-w-0"><div className="font-bold truncate" style={{color:"var(--hp-nome)"}}>{s.name||"Aluno"}</div><div className="text-xs" style={{color:"var(--hp-subtitulo)"}}>Módulo {mod} · Nível {s.level||"—"}</div></div>{finVencida&&<span className="fin-badge fin-vencida" style={{fontSize:10}}>Atrasado</span>}<Icon name="chevron-right" size={16} className="muted shrink-0"/></div>
                <div className="flex items-center justify-between text-xs mb-1"><span style={{color:"var(--hp-progresso)"}}>Progresso</span><span className="font-semibold" style={{color:"var(--hp-pct)"}}>{pct}%</span></div>
                <div className="h-1.5 rounded-full overflow-hidden" style={{background:"rgba(255,255,255,.09)"}}><div className="h-full rounded-full progress-fill" style={{width:pct+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/></div>
                <div className="text-xs mt-2" style={{color:"var(--hp-licoes)"}}>{done} de {total} lições concluídas</div>
              </div>);
            })}
          </div>
        )}
      </main>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>auth.onAuthStateChanged(u=>setUser(u||null)),[]);
  // Carrega tema para alunos também
  useEffect(()=>{
    db.collection("config").doc("aparencia").get().then(doc=>{
      if(doc.exists&&window.__applyTheme)window.__applyTheme({...PAGE_DEFAULTS,...doc.data()});
    });
  },[]);
  if(user===undefined)return <LoadingScreen/>;
  if(!user)return <ThemeProvider><Login/></ThemeProvider>;
  if(user.uid===ADMIN_UID)return <ThemeProvider><AdminApp user={user}/></ThemeProvider>;
  return <ThemeProvider><StudentDetail uid={user.uid} isAdmin={false}/></ThemeProvider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
