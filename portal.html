function AdminAgendaDashboard({students,onBack}){
  const hoje=new Date();
  const hojeISO=hoje.toISOString().slice(0,10);
  const [agenda,setAgenda]=useState({todos:[],eventos:[]});
  const [showAgendar,setShowAgendar]=useState(false);
  const [newTodo,setNewTodo]=useState("");
  const [googleEvents,setGoogleEvents]=useState([]);
  const [googleSyncing,setGoogleSyncing]=useState(false);
  const [googleLastSync,setGoogleLastSync]=useState(null);
  const [googleError,setGoogleError]=useState(null);

  useEffect(()=>db.collection("studio").doc("agenda").onSnapshot(doc=>{
    const d=doc.exists?doc.data():{};
    setAgenda({todos:d.todos||[],eventos:d.eventos||[]});
  }),[]);

  async function syncGoogle(){
    setGoogleSyncing(true);setGoogleError(null);
    try{
      const events=await fetchGoogleCalendarEvents();
      setGoogleEvents(events);
      setGoogleLastSync(new Date());
      if(!events.length)setGoogleError("Nenhum evento Google. Torne o calendário público nas configurações.");
    }catch(e){setGoogleError("Falha ao sincronizar Google Calendar.");}
    finally{setGoogleSyncing(false);}
  }
  useEffect(()=>{syncGoogle();},[]);

  async function saveAgenda(patch){
    const ref=db.collection("studio").doc("agenda");
    const cur=await ref.get();
    const base=cur.exists?cur.data():{todos:[],eventos:[]};
    await ref.set({...base,...patch},{merge:true});
  }

  const agendaExtra=useMemo(()=>({eventos:agenda.eventos,googleEvents}),[agenda.eventos,googleEvents]);

  const proxima=useMemo(()=>findProximaAulaUnified(students,agendaExtra),[students,agendaExtra]);
  const aulasHoje=useMemo(()=>getAulasDoDia(students,hojeISO,agendaExtra),[students,hojeISO,agendaExtra]);
  const todosPendentes=(agenda.todos||[]).filter(t=>!t.done).length;

  return(
    <div>
      <button className="btn rounded-xl px-3 py-2 text-sm mb-4 inline-flex items-center gap-2" onClick={onBack}><Icon name="arrow-left" size={14}/> Voltar ao Dashboard</button>

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#0f2c5c",fontSize:18}}>{proxima?formatDateBR(proxima.date).slice(0,5):"—"}</div><div className="dash-stat-label">Próxima Aula</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#0e4d6e"}}>{aulasHoje.length}</div><div className="dash-stat-label">Aulas Hoje</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#1e3a8a"}}>{todosPendentes}</div><div className="dash-stat-label">Tarefas Pendentes</div></div>
      </div>

      <div className="agenda-grid mb-5">
        <div className="space-y-4">
          <div className="agenda-next">
            <div className="agenda-next-label"><Icon name="zap" size={12} style={{display:"inline",marginRight:4}}/>Próxima Aula</div>
            {proxima
              ?<>
                <div className="agenda-next-title">{proxima.student?.name||"Aluno"}</div>
                <div style={{fontSize:13,color:"var(--font-muted)"}}>{formatDateBR(proxima.date)} · {proxima.time||"—"}</div>
                <div style={{fontSize:12,marginTop:6}}>Lição {proxima.lessonNum||"—"} · {getCourseLabel(proxima.student?.contrato)||proxima.student?.program||"—"}</div>
              </>
              :<div style={{fontSize:13,color:"var(--font-muted)"}}>Nenhuma aula prevista. Gere o calendário dos alunos em Alunos → Editar.</div>}
          </div>

          <div className="glass rounded-2xl p-5">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <Icon name="calendar-check" size={16} style={{color:"#1e8fa8"}}/>
              <span style={{fontWeight:700,fontSize:14}}>Aulas e Eventos de Hoje</span>
              <span style={{fontSize:11,color:"var(--font-muted)"}}>{hoje.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</span>
            </div>
            {aulasHoje.length===0
              ?<div style={{textAlign:"center",padding:"12px 0",color:"var(--font-muted)",fontSize:13}}>Nenhuma aula para hoje.</div>
              :aulasHoje.map((s,i)=>(
                <div key={s.uid+"-"+i} className="aula-hoje-item">
                  {s.foto?<img src={s.foto} alt="" style={{width:36,height:36,borderRadius:"50%",objectFit:"cover",border:"2px solid var(--divider)",flexShrink:0}}/>
                    :<div style={{width:36,height:36,borderRadius:"50%",background:"var(--badge)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="user" size={16}/></div>}
                  <div className="aula-hoje-hora">{s.horario}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13}}>{s.name}</div>
                    <div style={{fontSize:11,color:"var(--font-muted)"}}>{s.contrato}{s.tipo==="prevista"?" · prevista":s.tipo==="recorrente"?" · semanal":s.tipo==="google"?" · Google":""}</div>
                  </div>
                </div>
              ))}
          </div>
        </div>

        <div className="glass rounded-2xl p-5">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><Icon name="clipboard-list" size={16} style={{color:"#c0a0f8"}}/><span style={{fontWeight:700,fontSize:14}}>To-Do</span></div>
            <button className="btn btn-primary rounded-xl px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1" onClick={()=>setShowAgendar(true)}><Icon name="calendar-plus" size={13}/>Agendar</button>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input className="flex-1 input rounded-xl px-3 py-2 text-sm" placeholder="Nova tarefa..." value={newTodo} onChange={e=>setNewTodo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newTodo.trim()){saveAgenda({todos:[...agenda.todos,{id:Date.now().toString(),text:newTodo.trim(),done:false}]});setNewTodo("");}}}/>
            <button className="btn rounded-xl px-3 py-2" onClick={()=>{if(!newTodo.trim())return;saveAgenda({todos:[...agenda.todos,{id:Date.now().toString(),text:newTodo.trim(),done:false}]});setNewTodo("");}}><Icon name="plus" size={16}/></button>
          </div>
          {(agenda.todos||[]).length===0
            ?<div style={{fontSize:12,color:"var(--font-muted)",textAlign:"center",padding:"12px 0"}}>Lista vazia.</div>
            :(agenda.todos||[]).map(t=>(
              <div key={t.id} className={"agenda-todo-item"+(t.done?" done":"")}>
                <div className={"agenda-todo-check"+(t.done?" on":"")} onClick={()=>saveAgenda({todos:agenda.todos.map(x=>x.id===t.id?{...x,done:!x.done}:x)})}>
                  {t.done&&<Icon name="check" size={11} style={{color:"#fff"}}/>}
                </div>
                <div style={{flex:1,fontSize:13,textDecoration:t.done?"line-through":"none"}}>{t.text}</div>
                <button onClick={()=>saveAgenda({todos:agenda.todos.filter(x=>x.id!==t.id)})} style={{background:"none",border:"none",cursor:"pointer",color:"var(--font-muted)",padding:2}}><Icon name="trash-2" size={14}/></button>
              </div>
            ))}
        </div>
      </div>

      <div style={{marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:13,letterSpacing:".04em",color:"var(--font-muted)",textTransform:"uppercase"}}>Calendário do Portal</div>
        <div style={{fontSize:12,color:"var(--font-muted)"}}>Aulas, feriados, eventos manuais e Google Calendar sincronizado · Hoje · Semana · Mês</div>
      </div>
      <PlatformCalendar students={students} agendaExtra={agendaExtra} showGoogleSync onRefreshGoogle={syncGoogle} googleSyncing={googleSyncing} googleLastSync={googleLastSync} googleError={googleError} googleEventCount={googleEvents.length}/>

      <div style={{marginTop:24,marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:13,letterSpacing:".04em",color:"var(--font-muted)",textTransform:"uppercase"}}>Google Calendar</div>
        <div style={{fontSize:12,color:"var(--font-muted)"}}>Visualização ao vivo da agenda do Victor</div>
      </div>
      <GoogleCalendarEmbed/>
      {showAgendar&&<ModalAgendar onClose={()=>setShowAgendar(false)} onSave={ev=>saveAgenda({eventos:[...agenda.eventos,ev]})}/>}
    </div>
  );
}

function StudentCalendarView({uid,trilhaData,schedule,studentName}){
  const studentAsArray=useMemo(()=>[{
    uid,name:studentName||"Aluno",status:"ativo",
    diasAulas:schedule?.diasAulas||[],horarioAulas:schedule?.horarioAulas||"",
    dataInicio:schedule?.dataInicio||"",trilha:trilhaData||{},calendarioCompleto:schedule?.calendarioCompleto||[],
  }],[uid,studentName,schedule,trilhaData]);
  const agendaExtra=useMemo(()=>({onlyUid:uid}),[uid]);
  const proximas=useMemo(()=>{
    const today=new Date().toISOString().slice(0,10);
    const out=[];
    for(let i=0;i<3;i++){
      const mk=shiftMonthKey(getMonthKey(new Date()),i);
      buildAgendaEventsForMonth(studentAsArray,mk,agendaExtra).forEach(e=>{
        if(e.type==="aula"&&e.date>=today)out.push(e);
      });
    }
    return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  },[studentAsArray,agendaExtra]);

  return(
    <div className="space-y-4">
      {schedule?.dataInicio&&(
        <div className="glass rounded-2xl p-4" style={{borderColor:"rgba(155,125,232,.25)"}}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#9b7de8",marginBottom:6}}>Seu Curso</div>
          <div style={{fontSize:14,fontWeight:700}}>{schedule.program||"Fluency Studio"}</div>
          <div style={{fontSize:12,color:"var(--font-muted)",marginTop:4}}>
            Início {formatDateBR(schedule.dataInicio)}
            {schedule.diasAulas?.length?` · ${schedule.diasAulas.join(", ")}`:""}
            {schedule.horarioAulas?` · ${schedule.horarioAulas}`:""}
          </div>
          {schedule.calendarioResumo&&<div style={{fontSize:11,color:"var(--font-muted)",marginTop:6}}>{schedule.calendarioResumo.total} aulas previstas · até {formatDateBR(schedule.calendarioResumo.dataFim)}</div>}
        </div>
      )}
      {proximas.length>0&&(
        <div className="glass rounded-2xl p-4">
          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Próximas Aulas</div>
          {proximas.map((e,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"6px 0",borderBottom:i<proximas.length-1?"1px solid var(--divider)":"none"}}>
            <span style={{fontWeight:600}}>{e.label}</span>
            <span style={{color:"var(--font-muted)"}}>{formatDateBR(e.date).slice(0,5)}</span>
          </div>)}
        </div>
      )}
      <PlatformCalendar students={studentAsArray} agendaExtra={agendaExtra}/>
    </div>
  );
}

/* ── CONFIGURAÇÕES → CURSOS (controle total do admin) ── */
function AdminCursos({students}){
  const courses=useCourses();
  const [editId,setEditId]=useState(null);
  const [draft,setDraft]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [newForm,setNewForm]=useState({nome:"",corBase:"#00BFA5",template:"foundation",ativo:true});
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [migMsg,setMigMsg]=useState("");

  const editing=editId?courses.find(c=>c.id===editId):null;

  function openEdit(c){
    setEditId(c.id);
    setDraft({
      nome:c.nome||"",
      corBase:c.corBase||"#00BFA5",
      ativo:c.ativo!==false,
      ordem:c.ordem||1,
      modulos:(c.modulos||[]).map(m=>({...m,nome:m.nome||""})),
    });
    setErr("");setMsg("");
  }

  function setModNome(idx,nome){
    setDraft(p=>{
      const modulos=[...(p.modulos||[])];
      modulos[idx]={...modulos[idx],nome};
      return{...p,modulos};
    });
  }

  async function saveEdit(){
    if(!editId||!draft)return;
    if(!draft.nome.trim()){setErr("Nome do curso é obrigatório.");return;}
    setBusy(true);setErr("");
    try{
      const prev=(courses||[]).find(c=>c.id===editId)||{};
      await upsertCourseDoc({
        ...prev,
        id:editId,
        nome:draft.nome.trim(),
        corBase:draft.corBase||"#00BFA5",
        ativo:!!draft.ativo,
        ordem:parseInt(draft.ordem,10)||1,
        modulos:(draft.modulos||[]).map((m,i)=>({
          ...m,
          id:m.id!=null?m.id:i+1,
          nome:(m.nome||"").trim()||("Módulo "+(i+1)),
        })),
      });
      // Atualiza program nos alunos deste curso
      try{
        const snap=await db.collection("students").where("contrato","==",editId).get();
        for(let i=0;i<snap.docs.length;i+=400){
          const batch=db.batch();
          snap.docs.slice(i,i+400).forEach(d=>{
            if(d.id===COURSES_CATALOG_DOC)return;
            batch.update(d.ref,{program:draft.nome.trim()});
          });
          await batch.commit();
        }
      }catch(e){/* opcional */}
      setMsg("Curso salvo.");
      setEditId(null);setDraft(null);
    }catch(e){setErr(e.message||String(e));}
    finally{setBusy(false);}
  }

  async function deleteCourse(c){
    const linked=(students||[]).filter(s=>resolveContratoId(s.contrato)===c.id);
    if(linked.length>0){
      alert(`Não é possível excluir "${c.nome}": há ${linked.length} aluno(s) vinculado(s).\nDesative o curso ou migre os alunos antes.`);
      return;
    }
    if(!confirm(`Excluir o curso "${c.nome}" permanentemente?\nIsso não remove dados de trilha de alunos (já bloqueado se houver vínculos).`))return;
    setBusy(true);
    try{
      await deleteCourseDoc(c.id);
      try{await db.collection("courses").doc(c.id).delete();}catch(e){}
      setMsg("Curso excluído.");
      if(editId===c.id){setEditId(null);setDraft(null);}
    }catch(e){alert("Erro: "+(e.message||e));}
    finally{setBusy(false);}
  }

  async function createCourse(){
    if(!newForm.nome.trim()){setErr("Informe o nome do novo curso.");return;}
    setBusy(true);setErr("");
    try{
      let id=slugifyCourseId(newForm.nome);
      if(!id||id.indexOf("/")>=0)id="curso_"+Date.now().toString(36);
      if((courses||[]).some(c=>c.id===id)||id===COURSES_CATALOG_DOC)id=id+"_"+Date.now().toString(36).slice(-4);
      const tpl=COURSE_TEMPLATES.find(t=>t.id===newForm.template);
      let built=null;
      if(tpl&&typeof tpl.builder==="function"){
        built=tpl.builder();
      }
      let modulos=null;
      let numeroInicio=null;
      if(Array.isArray(built)){
        modulos=built;
      }else if(built&&typeof built==="object"){
        modulos=Array.isArray(built.modulos)?built.modulos:null;
        if(built.numeroInicio!=null)numeroInicio=built.numeroInicio;
      }
      if(!Array.isArray(modulos)||!modulos.length){
        modulos=makeFoundationModulos(["Módulo 1","Módulo 2","Módulo 3"]);
      }
      if(newForm.template==="reflective"&&numeroInicio==null)numeroInicio=121;
      const maxOrdem=(courses||[]).reduce((m,c)=>Math.max(m,Number(c.ordem)||0),0);
      const corRaw=String(newForm.corBase||"#00BFA5").trim();
      const corBase=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(corRaw)?corRaw:"#00BFA5";
      const payload=JSON.parse(JSON.stringify({
        id,
        nome:newForm.nome.trim(),
        corBase,
        ativo:newForm.ativo!==false,
        ordem:maxOrdem+1,
        modulos,
        ...(numeroInicio!=null?{numeroInicio}:{}),
        ...(newForm.template==="reflective"?{grupo:"special",padraoVisual:"orange"}:{}),
      }));
      if(!payload.modulos||!payload.modulos.length){
        throw new Error("Falha ao montar a estrutura do curso (módulos vazios). Tente outro template.");
      }
      await upsertCourseDoc(payload);
      setShowNew(false);
      setNewForm({nome:"",corBase:"#00BFA5",template:"foundation",ativo:true});
      setMsg("Curso criado. Edite os nomes dos módulos e preencha as lições na Trilha de cada aluno.");
    }catch(e){
      const code=e&&e.code?String(e.code):"";
      const raw=e&&e.message?String(e.message):String(e);
      let msg=raw;
      if(code==="permission-denied"||/insufficient permissions|permission/i.test(raw)){
        msg="Sem permissão no Firestore. O portal grava cursos em students/__system_courses — confirme que o admin pode escrever na coleção students.";
      }else if(/unsupported field value|undefined/i.test(raw)){
        msg="Dados inválidos ao salvar o curso (campo vazio/undefined). Tente novamente; se persistir, use o template Foundation.";
      }
      setErr(msg);
    }
    finally{setBusy(false);}
  }

  async function runMigration(){
    setBusy(true);setMigMsg("");
    try{
      await db.collection("config").doc("migrations").set({contratosV2:false},{merge:true});
      const r=await migrateLegacyContratosIfNeeded();
      if(r.skipped)setMigMsg("Migração já havia sido executada. Flag resetada e reexecutada — sem alunos legados pendentes.");
      else if(r.error)setMigMsg("Erro: "+r.error);
      else setMigMsg(`Migração concluída: ${r.migrated||0} aluno(s) atualizados para os novos IDs de curso.`);
    }catch(e){setMigMsg("Erro: "+(e.message||e));}
    finally{setBusy(false);}
  }

  async function reseedDefaults(){
    if(!confirm("Sincronizar os 6 cursos oficiais com as cores/nomes do site (landing)?\n\n• Fluency Foundation → #00a89d (teal)\n• Flash Talk → #3b82f6 (blue)\n• Corporate Speech (Business) → #8b5cf6 (purple)\n• Fluency Foundation Corporate → #c9a84c (gold)\n• Flash Talk Corporate → #d4788a (rose)\n• Reflective Mind → #f59e0b (orange)\n\nNomes e cores serão atualizados. Estrutura de módulos existente é preservada."))return;
    setBusy(true);
    try{
      await ensureCoursesSeeded(true);
      setMsg("Cursos sincronizados com as cores e nomes oficiais do landing.");
    }catch(e){setErr(e.message||String(e));}
    finally{setBusy(false);}
  }

  const sorted=[...courses].sort((a,b)=>(a.ordem||0)-(b.ordem||0));

  return(
    <div>
      <div className="glass rounded-2xl p-5 mb-5">
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <h2 className="text-lg font-bold flex items-center gap-2" style={{fontFamily:"'Sora',sans-serif"}}>
              <Icon name="book-open" size={18} style={{color:"#1e8fa8"}}/> Cursos
            </h2>
            <p className="text-xs muted mt-1" style={{maxWidth:480,lineHeight:1.5}}>
              Controle total: renomear, cor, ativar/desativar, editar módulos, criar e excluir.
              Cores e nomes iguais aos cards do site. Alunos veem só o curso do contrato; conteúdo das lições se preenche na Trilha.
            </p>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn rounded-xl px-3 py-2 text-xs font-semibold" onClick={reseedDefaults} disabled={busy}>Sincronizar cores do site</button>
            <button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={()=>{setShowNew(true);setErr("");}} disabled={busy}>
              <Icon name="plus" size={14}/> Novo curso
            </button>
          </div>
        </div>
        {msg&&<div style={{marginTop:12,padding:"10px 12px",borderRadius:10,background:"rgba(30,160,110,.12)",border:"1px solid rgba(30,160,110,.3)",fontSize:13,color:"#60daa8"}}>{msg}</div>}
        {err&&!showNew&&!editId&&<div className="err-box" style={{marginTop:12}}>{err}</div>}
      </div>

      <div className="space-y-3 mb-6">
        {sorted.map(c=>{
          const nMod=(c.modulos||[]).length;
          const nLic=getTotalLicoes(c);
          const linked=(students||[]).filter(s=>resolveContratoId(s.contrato)===c.id).length;
          const cor=c.corBase||"#00a89d";
          const grupoLbl=c.grupo==="corporate"?"CORPORATE ENGLISH":c.grupo==="general"?"GENERAL ENGLISH":c.grupo==="special"?"ESPECIAL":null;
          return(
            <div key={c.id} className="glass rounded-2xl overflow-hidden" style={{opacity:c.ativo===false?.65:1,borderLeft:"4px solid "+cor}}>
              <div style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px"}}>
                <div style={{
                  width:48,height:48,borderRadius:12,flexShrink:0,
                  background:"linear-gradient(145deg,"+cor+"33,"+cor+"18)",
                  border:"1.5px solid "+cor+"66",
                  boxShadow:"0 0 16px "+cor+"33",
                  display:"flex",alignItems:"center",justifyContent:"center",
                }}>
                  <div style={{width:16,height:16,borderRadius:4,background:cor}}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  {grupoLbl&&<div style={{fontSize:9,fontWeight:800,letterSpacing:".14em",color:cor,marginBottom:2}}>{grupoLbl}</div>}
                  <div style={{fontWeight:700,fontSize:14}}>{c.nome}</div>
                  <div style={{fontSize:11,color:"var(--font-muted)",marginTop:2}}>
                    <span style={{color:cor,fontFamily:"monospace",fontSize:10}}>{cor}</span>
                    {" · "}{nMod} módulos · {nLic} lições · {linked} aluno{linked!==1?"s":""}
                    {c.ativo===false&&<span style={{marginLeft:8,color:"#e8a94c"}}>· inativo</span>}
                  </div>
                </div>
                <button className="btn rounded-lg px-3 py-2 text-xs inline-flex items-center gap-1.5" onClick={()=>openEdit(c)} title="Editar curso"
                  style={{borderColor:cor+"55"}}>
                  <Icon name="settings" size={14} style={{color:cor}}/> Editar
                </button>
              </div>
            </div>
          );
        })}
        {sorted.length===0&&<div className="glass rounded-2xl p-8 text-center muted">Nenhum curso. Clique em «Novo curso» ou «Sincronizar cores do site».</div>}
      </div>

      <div className="glass rounded-2xl p-4 mb-4">
        <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>Migração de contratos legados</div>
        <p className="text-xs muted mb-3" style={{lineHeight:1.5}}>
          Converte <code>fluency_foundation</code> → Foundation General (e flash/speech), preservando 100% da trilha.
        </p>
        <button className="btn rounded-xl px-4 py-2 text-sm font-semibold" onClick={runMigration} disabled={busy}>Executar migração</button>
        {migMsg&&<p className="text-xs mt-2" style={{color:"#60daa8"}}>{migMsg}</p>}
      </div>

      {/* Painel de edição */}
      {editId&&draft&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setEditId(null);setDraft(null);}}}>
          <div className="modal-box" style={{maxWidth:560}}>
            <div className="modal-header">
              <div>
                <div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Editar curso</div>
                <div style={{fontSize:11,opacity:.75}}>{editId}</div>
              </div>
              <button onClick={()=>{setEditId(null);setDraft(null);}} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff"}}><Icon name="x" size={16}/></button>
            </div>
            <div className="modal-body">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1"}}>
                  <label className="form-label">Nome do curso</label>
                  <input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={draft.nome} onChange={e=>setDraft(p=>({...p,nome:e.target.value}))}/>
                </div>
                <div>
                  <label className="form-label">Cor base</label>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <input type="color" value={draft.corBase||"#00BFA5"} onChange={e=>setDraft(p=>({...p,corBase:e.target.value}))} style={{width:44,height:36,border:"none",background:"transparent",cursor:"pointer"}}/>
                    <input className="flex-1 input rounded-xl px-3 py-2 text-sm" value={draft.corBase} onChange={e=>setDraft(p=>({...p,corBase:e.target.value}))}/>
                  </div>
                </div>
                <div>
                  <label className="form-label">Ordem de exibição</label>
                  <input type="number" min={1} className="w-full input rounded-xl px-3 py-2.5 text-sm" value={draft.ordem} onChange={e=>setDraft(p=>({...p,ordem:e.target.value}))}/>
                </div>
                <div style={{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:10}}>
                  <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
                    <input type="checkbox" checked={!!draft.ativo} onChange={e=>setDraft(p=>({...p,ativo:e.target.checked}))}/>
                    Curso ativo (aparece no campo Contrato do cadastro)
                  </label>
                </div>
              </div>
              <div className="form-section-title" style={{marginTop:16}}>Módulos</div>
              <p className="text-xs muted mb-2">A estrutura (qtd. de lições/blocos) é fixa por template. Você edita os nomes aqui; o conteúdo de cada lição fica nos cards da Trilha.</p>
              {(draft.modulos||[]).map((m,idx)=>(
                <div key={idx} style={{marginBottom:8}}>
                  <label className="form-label">Módulo {m.id||idx+1} · {getModuleLessonCount(m)} lições{m.semBlocos?" (sem blocos)":""}</label>
                  <input className="w-full input rounded-xl px-3 py-2 text-sm" value={m.nome||""} onChange={e=>setModNome(idx,e.target.value)}/>
                </div>
              ))}
              {err&&<div className="err-box" style={{marginTop:12}}>{err}</div>}
            </div>
            <div className="modal-footer" style={{flexWrap:"wrap",gap:8}}>
              <button className="btn btn-danger rounded-xl px-4 py-2 text-sm" onClick={()=>deleteCourse(editing||{id:editId,nome:draft.nome})} disabled={busy}>Excluir</button>
              <div style={{flex:1}}/>
              <button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>{setEditId(null);setDraft(null);}}>Cancelar</button>
              <button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={saveEdit} disabled={busy}>{busy?"Salvando…":"Salvar"}</button>
            </div>
          </div>
        </div>
      )}

      {/* Novo curso */}
      {showNew&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowNew(false);}}>
          <div className="modal-box" style={{maxWidth:480}}>
            <div className="modal-header">
              <div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Novo curso</div>
              <button onClick={()=>setShowNew(false)} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff"}}><Icon name="x" size={16}/></button>
            </div>
            <div className="modal-body">
              <label className="form-label">Nome</label>
              <input className="w-full input rounded-xl px-3 py-2.5 text-sm mb-3" placeholder="Ex: Flash Talk Custom" value={newForm.nome} onChange={e=>setNewForm(p=>({...p,nome:e.target.value}))}/>
              <label className="form-label">Cor base</label>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12}}>
                <input type="color" value={/^#([0-9a-fA-F]{6})$/.test(newForm.corBase||"")?newForm.corBase:"#00BFA5"} onChange={e=>setNewForm(p=>({...p,corBase:e.target.value}))} style={{width:44,height:36,border:"none",background:"transparent",cursor:"pointer"}}/>
                <input className="flex-1 input rounded-xl px-3 py-2 text-sm" value={newForm.corBase} onChange={e=>setNewForm(p=>({...p,corBase:e.target.value}))} placeholder="#00BFA5"/>
              </div>
              <label className="form-label">Estrutura (template)</label>
              <select className="w-full input rounded-xl px-3 py-2.5 text-sm mb-3" value={newForm.template} onChange={e=>setNewForm(p=>({...p,template:e.target.value}))}>
                {COURSE_TEMPLATES.filter(t=>typeof t.builder==="function").map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}}>
                <input type="checkbox" checked={!!newForm.ativo} onChange={e=>setNewForm(p=>({...p,ativo:e.target.checked}))}/> Ativo no cadastro
              </label>
              {err&&<div className="err-box" style={{marginTop:12}}>{err}</div>}
            </div>
            <div className="modal-footer">
              <button type="button" className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setShowNew(false)}>Cancelar</button>
              <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={createCourse} disabled={busy}>{busy?"Criando…":"Criar curso"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function loadAppearanceState(){
  try{
    const local=JSON.parse(localStorage.getItem("fs-appearance")||"null");
    if(local&&typeof local==="object")return{...APPEARANCE_DEFAULTS,...stripAppearanceMode(local)};
  }catch(e){}
  if(typeof window!=="undefined"&&window.__fsAppearance)return{...APPEARANCE_DEFAULTS,...stripAppearanceMode(window.__fsAppearance)};
  return{...APPEARANCE_DEFAULTS};
}

function parsePaintValue(value){
  const v=String(value||"").trim();
  const isGrad=/gradient\(/i.test(v);
  if(!isGrad){
    const hex=/^#([0-9a-fA-F]{3,8})$/.test(v)?v:"#000000";
    return{mode:"solid",c1:hex.length===4||hex.length===7||hex.length===9?hex:"#000000",c2:"#4F46E5",angle:135,raw:v};
  }
  // linear-gradient(135deg, #aaa 0%, #bbb 100%) or linear-gradient(135deg, #aaa, #bbb)
  let angle=135;
  const am=v.match(/(\d+(?:\.\d+)?)deg/);
  if(am)angle=parseFloat(am[1])||135;
  const colors=[...v.matchAll(/#([0-9a-fA-F]{3,8})\b/g)].map(m=>m[0]);
  const c1=colors[0]||"#0F172A";
  const c2=colors[1]||colors[0]||"#4F46E5";
  return{mode:"gradient",c1,c2,angle,raw:v};
}
function buildGradient(angle,c1,c2){
  return "linear-gradient("+angle+"deg, "+c1+" 0%, "+c2+" 100%)";
}
function normalizeColorInput(hex){
  if(!hex)return"#000000";
  let h=String(hex).trim();
  if(/^#[0-9a-fA-F]{3}$/.test(h)){
    h="#"+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  }
  if(!/^#[0-9a-fA-F]{6}$/.test(h))return"#000000";
  return h;
}

/** Campo de cor com opção Sólida | Gradiente (em todos os lugares com gradient:true). */
function ColorField({label,value,onChange,allowGradient=true,forceGradient=false,wide=false}){
  const parsed=parsePaintValue(value);
  const [mode,setMode]=useState(forceGradient?"gradient":(parsed.mode==="gradient"?"gradient":"solid"));
  const [c1,setC1]=useState(normalizeColorInput(parsed.c1));
  const [c2,setC2]=useState(normalizeColorInput(parsed.c2));
  const [angle,setAngle]=useState(parsed.angle||135);

  // Sync when external value changes (load from firebase)
  useEffect(()=>{
    const p=parsePaintValue(value);
    if(forceGradient)setMode("gradient");
    else if(p.mode==="gradient")setMode("gradient");
    setC1(normalizeColorInput(p.c1));
    setC2(normalizeColorInput(p.c2));
    setAngle(p.angle||135);
  },[value,forceGradient]);

  function emitSolid(hex){
    const h=normalizeColorInput(hex);
    setC1(h);
    onChange(h);
  }
  function emitGrad(a,a1,a2){
    const g=buildGradient(a,normalizeColorInput(a1),normalizeColorInput(a2));
    onChange(g);
  }
  function switchMode(m){
    if(forceGradient&&m==="solid")return;
    setMode(m);
    if(m==="solid")onChange(normalizeColorInput(c1));
    else emitGrad(angle,c1,c2);
  }

  const showGrad=allowGradient||forceGradient;
  const preview=mode==="gradient"?buildGradient(angle,c1,c2):c1;

  return(
    <div className={"ap-field"+(wide?" ap-field-wide":"")}>
      <label>{label}</label>
      {showGrad&&(
        <div className="ap-mode-toggle">
          {!forceGradient&&(
            <button type="button" className={"ap-mode-btn"+(mode==="solid"?" active":"")} onClick={()=>switchMode("solid")}>Sólida</button>
          )}
          <button type="button" className={"ap-mode-btn"+(mode==="gradient"?" active":"")} onClick={()=>switchMode("gradient")}>Gradiente</button>
        </div>
      )}
      {mode==="solid"?(
        <div className="ap-color-row">
          <input type="color" value={normalizeColorInput(c1)} onChange={e=>emitSolid(e.target.value)} title={label}/>
          <input type="text" value={value&&!String(value).includes("gradient")?value:c1} onChange={e=>onChange(e.target.value)} placeholder="#000000" spellCheck={false}/>
        </div>
      ):(
        <>
          <div className="ap-color-row" style={{marginBottom:6}}>
            <input type="color" value={normalizeColorInput(c1)} onChange={e=>{const n=e.target.value;setC1(n);emitGrad(angle,n,c2);}} title="Cor 1"/>
            <input type="color" value={normalizeColorInput(c2)} onChange={e=>{const n=e.target.value;setC2(n);emitGrad(angle,c1,n);}} title="Cor 2"/>
            <input type="text" value={value||""} onChange={e=>onChange(e.target.value)} placeholder="linear-gradient(...)" spellCheck={false} style={{flex:1}}/>
          </div>
          <div className="ap-angle-row">
            <span>Ângulo</span>
            <input type="range" min={0} max={360} value={angle} onChange={e=>{const a=parseInt(e.target.value,10)||0;setAngle(a);emitGrad(a,c1,c2);}}/>
            <span style={{minWidth:36,textAlign:"right",fontWeight:700}}>{angle}°</span>
          </div>
          <div className="ap-grad-presets">
            {GRADIENT_PRESETS.map(p=>(
              <button key={p.v} type="button" className="ap-grad-preset" title={p.label} style={{background:p.v}} onClick={()=>onChange(p.v)}/>
            ))}
          </div>
        </>
      )}
      <div className="ap-grad-preview" style={{background:preview}} title="Prévia"/>
    </div>
  );
}

function AppearanceEditor({embedded,onClose}){

  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const isAdminUser=auth.currentUser&&auth.currentUser.uid===ADMIN_UID;

  useEffect(()=>{
    // live cloud sync load
    let unsub=null;
    try{
      unsub=db.collection("config").doc("aparencia").onSnapshot(doc=>{
        if(doc.exists){
          const data={...APPEARANCE_DEFAULTS,...stripAppearanceMode(doc.data()||{})};
          setForm(data);
          if(window.__applyTheme)window.__applyTheme(data);
        }
      },()=>{});
    }catch(e){}
    try{ localStorage.removeItem("fs-theme"); }catch(e){}
    return()=>{if(unsub)unsub();};
  },[]);

  function setKey(k,v){
    if(k==="mode"||k==="theme")return;
    setForm(prev=>{
      const next=stripAppearanceMode({...prev,[k]:v});
      if(window.__applyTheme)window.__applyTheme(next);
      return next;
    });
    setMsg("");setErr("");
  }

  async function save(){
    setSaving(true);setMsg("");setErr("");
    try{
      const colorsOnly=stripAppearanceMode(form);
      const payload={...colorsOnly,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser?auth.currentUser.uid:null};
      // Remove mode legado do doc (se existir)
      payload.mode=firebase.firestore.FieldValue.delete();
      payload.theme=firebase.firestore.FieldValue.delete();
      localStorage.setItem("fs-appearance",JSON.stringify(colorsOnly));
      try{ localStorage.removeItem("fs-theme"); }catch(e){}
      if(window.__applyTheme)window.__applyTheme(colorsOnly);
      setForm(colorsOnly);
      if(isAdminUser){
        await db.collection("config").doc("aparencia").set(payload,{merge:true});
        setMsg("Cores salvas para todo o portal. Sem dark/light — só o que você escolheu.");
        notifySaveSuccess("Aparência salva para todo o portal!");

        try{
          await db.collection("users").doc(auth.currentUser.uid).set({appearance:colorsOnly},{merge:true});
          setMsg("Cores salvas neste navegador e no seu perfil.");
        }catch(e){
          setMsg("Cores salvas neste navegador.");
        }
      }
    }catch(e){
      console.error(e);
      setErr("Não foi possível salvar no Firebase. As cores ficaram aplicadas localmente. Verifique regras de config/aparencia.");
      try{localStorage.setItem("fs-appearance",JSON.stringify(stripAppearanceMode(form)));}catch(x){}
    }finally{
      setSaving(false);
    }

    const d=stripAppearanceMode({...APPEARANCE_DEFAULTS});

    if(window.__applyTheme)window.__applyTheme(d);

                if(item.type==="select"){

                      <label>{item.label}</label>
                      <select className="ap-select" value={form[item.key]||""} onChange={e=>setKey(item.key,e.target.value)}>
                        {item.options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}

                return <ColorField key={item.key} label={item.label} value={form[item.key]} onChange={v=>setKey(item.key,v)} allowGradient={item.gradient!==false} forceGradient={!!item.forceGradient} wide={!!item.wide||!!item.forceGradient||item.gradient===true}/>;
              })}

        <div className="ap-preview-card" style={{background:form.card||"var(--card)"}}>
          <div style={{height:6,borderRadius:99,background:form.gradientBar||"var(--gradient-bar)",marginBottom:12}}/>

        {err&&<p style={{fontSize:12,color:"#B91C1C",marginTop:12,background:"#FEF2F2",padding:"8px 10px",borderRadius:8}}>{err}</p>}

  );

  if(embedded){
    return(
      <div className="premium-card" style={{marginBottom:24}}>
        <h3 style={{fontSize:18,fontWeight:800,color:"#1E1E1E",margin:"0 0 4px"}}>Aparência do portal</h3>
        <p style={{fontSize:13,color:"#475569",margin:"0 0 16px"}}>Background, cards, fontes e trilha — você decide e salva.</p>
        {body}
      </div>
    );
  }

  return(
    <div className="ap-panel" role="dialog" aria-label="Aparência">
      <div className="ap-panel-head">
        <div>
          <div style={{fontSize:11,opacity:.75,fontWeight:700,letterSpacing:".08em"}}>PERSONALIZAR</div>
          <div style={{fontWeight:800,fontSize:16}}>Aparência</div>

  );

function useGlobalAppearanceSync(){
  useEffect(()=>{
    let unsub=null;
    try{
      unsub=db.collection("config").doc("aparencia").onSnapshot(doc=>{
        if(!doc.exists)return;
        const data=typeof window.__stripThemeMode==="function"
          ?window.__stripThemeMode(doc.data()||{})
          :{...(doc.data()||{})};
        delete data.mode;delete data.theme;delete data.updatedAt;delete data.updatedBy;

    return()=>{if(unsub)unsub();};
  },[]);
}

  const [repairMsg,setRepairMsg]=useState("");
  const [repairErr,setRepairErr]=useState("");

    let list=filterStudentsByStatus(students,filtroStatus);
    const q=busca.trim().toLowerCase();

      list=list.filter(s=>
        (s.name||"").toLowerCase().includes(q)||

        (s.phone||"").toLowerCase().includes(q)

    if(!repairTarget)return;

      // Normaliza email no doc (evita falha de busca por maiúsculas)
      await db.collection("students").doc(repairTarget.uid).set({email},{merge:true});
      const res=await linkStudentPortalLogin(repairTarget.uid,email,repairPass);
      if(res.alreadyExists){
        setRepairMsg("Conta Auth já existia. Cadastro vinculado a "+email+". Peça para ela usar «Esqueci a senha» se não lembrar.");
      }else{
        setRepairMsg("Login criado para "+email+". Senha: a que você digitou agora.");
      }
      setRepairPass("");
    }catch(e){
      setRepairErr(e.message||String(e));
    }finally{
      setRepairBusy(false);
    }
  }

  return(
    <div>
      {editStudent&&<ModalEdicao student={editStudent} onClose={()=>setEditStudent(null)} onSaved={()=>setEditStudent(null)}/>}
      {repairTarget&&(

}

function AdminApp({user}){
  const [students,setStudents]=useState(null);
  const [studentsErr,setStudentsErr]=useState("");
  const [pendentesCount,setPendentesCount]=useState(0);
  const [showModal,setShowModal]=useState(false);

  // Estado inicial a partir da URL (refresh / deep link / botão voltar)
  const [selectedUid,setSelectedUid]=useState(()=>{
    const r=parsePortalRoute();
    return(r.role==="admin"&&r.view==="student"&&r.studentUid)?r.studentUid:null;
  });
  const [selectedInitialTab,setSelectedInitialTab]=useState(()=>{
    const r=parsePortalRoute();
    return(r.role==="admin"&&r.view==="student"&&r.tab)?r.tab:null;
  });
  const [adminView,setAdminView]=useState(()=>{
    const r=parsePortalRoute();
    if(r.role==="admin"){
      if(r.view==="student")return"alunos";
      if(ADMIN_VIEWS.includes(r.view))return r.view;
    }
    return"dashboard";
  });

  const goAdminView=useCallback((id,opts)=>{
    const view=ADMIN_VIEWS.includes(id)?id:"dashboard";
    setSelectedUid(null);
    setSelectedInitialTab(null);
    setAdminView(view);
    portalGo({role:"admin",view,page:null,studentUid:null,tab:null,lessonId:null},opts||{});
  },[]);

  const openStudent=useCallback((uid,tab,opts)=>{
    if(!uid)return;
    const t=tab&&ADMIN_STUDENT_TABS.includes(tab)?tab:"overview";
    setSelectedUid(uid);
    setSelectedInitialTab(t);
    portalGo({role:"admin",view:"student",studentUid:uid,tab:t,page:null,lessonId:null},opts||{});
  },[]);

  const closeStudent=useCallback((routeHint)=>{
    // Se o histórico trouxe uma view admin (popstate), só atualiza estado — URL já está certa
    if(routeHint&&routeHint.role==="admin"&&routeHint.view&&routeHint.view!=="student"){
      setSelectedUid(null);
      setSelectedInitialTab(null);
      setAdminView(ADMIN_VIEWS.includes(routeHint.view)?routeHint.view:"dashboard");
      return;
    }
    // Botão Voltar da UI: usa a pilha do browser (igual ao retornar do celular)
    try{
      if(window.history.state&&window.history.state.portal){
        history.back();
        return;
      }
    }catch(e){}
    const backView=selectedInitialTab==="financeiro"?"financeiro":"alunos";
    setSelectedUid(null);
    setSelectedInitialTab(null);
    setAdminView(backView);
    portalGo({role:"admin",view:backView,page:null,studentUid:null,tab:null,lessonId:null},{replace:true});
  },[selectedInitialTab]);

  const onPortalRoute=useCallback((route)=>{
    if(route.role!=="admin"&&route.role!==null)return;
    if(route.view==="student"&&route.studentUid){
      setSelectedUid(route.studentUid);
      setSelectedInitialTab(route.tab||"overview");
      return;
    }
    // saiu da ficha do aluno
    setSelectedUid(null);
    setSelectedInitialTab(null);
    const view=ADMIN_VIEWS.includes(route.view)?route.view:"dashboard";
    setAdminView(view);
  },[]);
  usePortalRouteListener(onPortalRoute);

  useEffect(()=>{
    // Garante hash admin na entrada (evita voltar “sair do site” no primeiro back)
    const r=parsePortalRoute();
    if(!location.hash||location.hash==="#"||r.role!=="admin"){
      if(selectedUid){
        portalEnsureBase({role:"admin",view:"student",studentUid:selectedUid,tab:selectedInitialTab||"overview",page:null,lessonId:null});
      }else{
        portalEnsureBase({role:"admin",view:adminView||"dashboard",page:null,studentUid:null,tab:null,lessonId:null});
      }
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useCourses(); // mantém cache de cursos atualizado para todo o admin

  useEffect(()=>{
    (async()=>{
      try{
        await ensureCoursesSeeded();
        await migrateLegacyContratosIfNeeded();
      }catch(e){console.error("AdminApp courses init:",e);}
    })();
  },[]);

  useEffect(()=>{
    const unsub=db.collection("students").onSnapshot(snap=>{
      try{
        const list=snap.docs
          .filter(d=>d.id!==COURSES_CATALOG_DOC&&d.data()?.type!=="courses_catalog")
          .map(d=>normalizeStudent(d.id,d.data()));
        list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","pt-BR"));
        setStudents(list);
        setStudentsErr("");
        // Heal silencioso: email em minúsculas (evita falha de lookup case-sensitive)
        snap.docs.forEach(d=>{
          if(d.id===COURSES_CATALOG_DOC)return;
          const raw=d.data().email;
          if(typeof raw==="string"&&raw.trim()){
            const norm=raw.trim().toLowerCase();
            if(raw!==norm){
              d.ref.set({email:norm},{merge:true}).catch(()=>{});
            }
          }
        });
      }catch(e){
        console.error("AdminApp normalize:",e);
        setStudents(snap.docs.filter(d=>d.id!==COURSES_CATALOG_DOC).map(d=>({uid:d.id,...d.data(),name:d.data().name||d.data().nome||"Aluno"})));
        setStudentsErr("");
      }
    },err=>{
      console.error("AdminApp students:",err);
      setStudents([]);
      setStudentsErr("Não foi possível carregar os alunos. Verifique a conexão e as regras do Firestore.");
    });
    return()=>unsub();
  },[]);
  useEffect(()=>db.collection("students").where("status","==","pendente_aprovacao").onSnapshot(snap=>setPendentesCount(snap.size),()=>setPendentesCount(0)),[]);

  if(selectedUid)return <StudentDetail uid={selectedUid} isAdmin initialTab={selectedInitialTab} onBack={closeStudent}/>;

  const viewTitles={dashboard:"Painel do Professor",alunos:"Alunos",cadastros:"Cadastros Pendentes",financeiro:"Financeiro",agenda:"Agenda",config:"Configurações"};

  const adminNav=[
    {id:"dashboard",icon:"layout-dashboard",label:"Painel"},
    {id:"alunos",icon:"users",label:"Alunos"},
    {id:"cadastros",icon:"clipboard-check",label:"Cadastros"},
    {id:"financeiro",icon:"wallet",label:"Financeiro"},
    {id:"agenda",icon:"calendar",label:"Agenda"},
    {id:"config",icon:"settings",label:"Configurações"},
  ];
  return(
    <div className="admin-shell" data-admin-view="true">
      {showModal&&<ModalCadastro onClose={()=>setShowModal(false)} onSaved={()=>setShowModal(false)}/>}
      <aside className="admin-sidebar" aria-label="Navegação administrativa">
        <div className="admin-sidebar-brand">
          <BrandLogo/>
          <div style={{marginTop:12,display:"flex",alignItems:"center",gap:8}}>
            <span className="role-pill role-pill-admin">Admin</span>
            <span style={{fontSize:11,color:"#CBD5E1"}}>Área restrita</span>
          </div>
        </div>
        <div className="admin-sidebar-label">Gestão da escola</div>
        {adminNav.map(n=>(
          <button key={n.id} type="button" className={"admin-nav-item"+(adminView===n.id?" active":"")} onClick={()=>goAdminView(n.id)}>
            <Icon name={n.icon} size={18}/>
            <span>{n.label}</span>
            {n.id==="cadastros"&&pendentesCount>0&&<span className="nav-badge">{pendentesCount}</span>}
          </button>
        ))}
        <div style={{marginTop:"auto",padding:"16px 20px",borderTop:"1px solid rgba(203,213,225,.12)"}}>
          <button type="button" className="admin-nav-item" style={{padding:"10px 0"}} onClick={()=>auth.signOut()}>
            <Icon name="log-out" size={18}/><span>Sair</span>
          </button>
        </div>
      </aside>
      <div className="admin-main">
        <header className="admin-main-header">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
            <div>
              <div className="view-separator" style={{marginBottom:4,border:"none",padding:0}}>Área administrativa · não visível ao aluno</div>
              <h1 style={{fontSize:22,fontWeight:800,color:"#1E1E1E",margin:0,fontFamily:"var(--ds-font)"}}>{viewTitles[adminView]||"Painel"}</h1>
              <p style={{fontSize:13,color:"#475569",margin:"4px 0 0"}}>Fluency Studio · Gestão premium</p>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              {pendentesCount>0&&(
                <button className="btn rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>goAdminView("cadastros")}
                  style={{background:"#E0F2FE",border:"1.5px solid #0f2c5c",color:"#0f2c5c"}}>
                  <Icon name="clipboard-check" size={16}/> {pendentesCount} pendente{pendentesCount>1?"s":""}
                </button>
              )}
              <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>setShowModal(true)}>
                <Icon name="user-plus" size={16}/> Novo Aluno
              </button>
            </div>
          </div>
        </header>
        <main className="admin-main-body">
          {studentsErr&&(
            <div className="err-box mb-4" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,color:"#B91C1C",background:"#FEF2F2",border:"1px solid #FECACA"}}>
              <span>{studentsErr}</span>
              <button className="btn rounded-lg px-3 py-1.5 text-xs" onClick={()=>window.location.reload()}>Recarregar</button>
            </div>
          )}
          {!students
            ?<LoadingScreen/>
            :adminView==="dashboard"
            ?<AdminDashboard students={students} pendentesCount={pendentesCount} onNavigate={id=>goAdminView(id)}/>
            :adminView==="cadastros"
            ?<AdminCadastrosPendentes onBack={()=>goAdminView("dashboard")} onLaunched={uid=>openStudent(uid,"overview")}/>
            :adminView==="financeiro"
            ?<AdminFinanceiroDashboard students={students} onBack={()=>goAdminView("dashboard")} onSelectStudent={uid=>openStudent(uid,"financeiro")}/>
            :adminView==="agenda"
            ?<AdminAgendaDashboard students={students} onBack={()=>goAdminView("dashboard")}/>
            :adminView==="config"
            ?<AdminConfig students={students}/>
            :<AdminAlunos students={students} onSelectUid={uid=>openStudent(uid,"overview")}/>
          }
        </main>
      </div>
      <IVi mode="admin"/>
    </div>
  );
}

function PendingApprovalGate({uid,userEmail}){
  const [status,setStatus]=useState(undefined);
  const [gateErr,setGateErr]=useState("");
  useEffect(()=>{
    if(!uid){setStatus(null);return;}
    const unsub=db.collection("students").doc(uid).onSnapshot(doc=>{
      // Firebase compat: doc.exists é propriedade booleana (NÃO método)
      if(doc.exists){
        const n=normalizeStudent(uid,doc.data());
        setStatus(n.status||null);
        setGateErr("");
      }else{
        setStatus(null);
        setGateErr("");
      }
    },err=>{
      console.error("PendingApprovalGate:",err);
      setStatus(null);
      setGateErr("Erro ao carregar perfil. Recarregue a página (Ctrl+Shift+R).");
    });
    return()=>unsub();
  },[uid]);
  if(status===undefined)return <LoadingScreen/>;
  if(status==="pendente_aprovacao")return <WaitingApproval email={userEmail}/>;
  if(status==="rejeitado")return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm mb-4">Seu cadastro não foi aprovado. Entre em contato com o professor Victor.</p>
        <a href={WPP_VICTOR} className="btn btn-primary rounded-xl px-4 py-2.5 text-sm" style={{textDecoration:"none",display:"inline-block"}}>WhatsApp</a>
        <button className="btn rounded-xl px-4 py-2.5 mt-3 text-sm w-full" onClick={()=>auth.signOut()}>Sair</button>
      </div>
    </div>
  );
  if(gateErr)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm mb-4" style={{color:"#f0a0a8"}}>{gateErr}</p>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 text-sm w-full" onClick={()=>window.location.reload()}>Recarregar</button>
        <button className="btn rounded-xl px-4 py-2.5 mt-3 text-sm w-full" onClick={()=>auth.signOut()}>Sair</button>
      </div>
    </div>
  );
  return <StudentDetail uid={uid} isAdmin={false}/>;
}

/** Resolve students/{uid} OU doc legado pelo email (alunos antigos). */
function StudentSession({user}){
  const [studentUid,setStudentUid]=useState(undefined);
  const [resolveErr,setResolveErr]=useState("");
  useEffect(()=>{
    let cancelled=false;
    setStudentUid(undefined);
    setResolveErr("");
    (async()=>{
      try{
        const id=await resolveStudentDocId(user.uid,user.email);
        if(!cancelled)setStudentUid(id||user.uid);
      }catch(e){
        console.error("StudentSession resolve:",e);
        if(!cancelled){
          setStudentUid(user.uid);
          setResolveErr("Não foi possível localizar seu cadastro automaticamente.");
        }
      }
    })();
    return()=>{cancelled=true;};
  },[user.uid,user.email]);
  if(studentUid===undefined)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <div className="w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
        <p className="muted text-sm">Conectando seu perfil...</p>
        {resolveErr&&<p className="text-xs mt-3" style={{color:"#f0a0a8"}}>{resolveErr}</p>}
      </div>
    </div>
  );
  return <PendingApprovalGate uid={studentUid} userEmail={user.email}/>;
}

  // Cores salvas pelo admin (config/aparencia) chegam em tempo real para todo mundo
  useGlobalAppearanceSync();
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(u=>{
      const next=u||null;
      // Logout: limpa rota da sessão para o próximo login não herdar tela errada
      if(!next){
        try{sessionStorage.removeItem(PORTAL_ROUTE_SS_KEY);}catch(e){}
      }
      setUser(next);
    },err=>{
      console.error("onAuthStateChanged:",err);
      setUser(null);
      setAuthErr("Falha na autenticação. Recarregue a página.");
    });
    const t=setTimeout(()=>{
      setAuthErr(prev=>prev||"Conexão lenta. Verifique sua internet e recarregue (Ctrl+Shift+R).");
    },10000);
    return()=>{unsub();clearTimeout(t);};
  },[]);
  useEffect(()=>{
    if(user!==undefined)setAuthErr("");
  },[user]);
  // Evita que o browser restaure scroll antigo ao voltar no histórico (SPA)
  useEffect(()=>{
    try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}
  },[]);
  if(user===undefined)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <div className="w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
        <p className="muted text-sm">Carregando portal...</p>
        {authErr&&<p className="text-xs mt-3" style={{color:"#f0a0a8"}}>{authErr}</p>}
      </div>
    </div>
  );
  if(!user)return <Login/>;
  // Paleta só no admin — salvar muda o portal de todos
  if(user.uid===ADMIN_UID)return <><AdminApp user={user}/><AppearanceFab/></>;
  return <StudentSession user={user}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
