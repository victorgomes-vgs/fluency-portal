  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;margin:0;padding:0;}

    /* ── TEMA: Dark (padrão) — bordas e textos mais visíveis ── */
    :root, [data-theme="dark"] {
      --bg: linear-gradient(160deg,#05080f 0%,#080e1c 35%,#0b1328 60%,#0d1a35 80%,#0a1528 100%);
      --font: #eef4f8;
      --font-muted: rgba(196,212,228,.82);
      --card: #1e2d45;
      --lesson: #1a2740;
      --detail: #141f33;
      --header: rgba(10,18,38,.94);
      --tabbar: rgba(255,255,255,.08);
      --badge: rgba(255,255,255,.12);
      --btn: rgba(255,255,255,.10);
      --done: rgba(30,160,110,.28);
      --done-border: rgba(30,160,110,.55);
      --done-text: #6ee7b7;
      --divider: rgba(255,255,255,.18);
      --input-bg: rgba(0,0,0,.30);
      --input-border: rgba(255,255,255,.24);
      --shadow: 0 8px 32px rgba(0,0,0,.42);
      --sd-page-bg: #0b1220;
      --sd-surface: #ffffff;
      --sd-surface-text: #0f172a;
      --sd-surface-muted: #475569;
      --sd-surface-border: rgba(15,23,42,.10);
      --sd-dark-card: #152238;
      --sd-dark-card-2: #1a2d4a;
      --sd-dark-text: #e8f0f8;
      --sd-dark-muted: rgba(200,215,230,.75);
      --sd-donut-track: #2a3f5c;
    }

    [data-theme="light"] {
      --bg: linear-gradient(152deg, #E0ECFF 0%, #f6faff 38%, #eef6ff 62%, #D4F7F2 100%);
      --font: #174082;
      --font-muted: #3566B6;
      --card: rgba(255,255,255,.94);
      --lesson: rgba(255,255,255,.88);
      --detail: rgba(224,236,255,.65);
      --header: rgba(255,255,255,.92);
      --tabbar: rgba(202,222,252,.55);
      --badge: rgba(53,102,182,.08);
      --btn: rgba(255,255,255,.85);
      --done: rgba(24,126,116,.14);
      --done-border: rgba(0,102,91,.45);
      --done-text: #00665B;
      --divider: rgba(34,82,160,.20);
      --input-bg: rgba(255,255,255,.92);
      --input-border: rgba(53,102,182,.28);
      --shadow: 0 10px 36px rgba(23,64,130,.11), 0 2px 8px rgba(53,102,182,.07);
      --sd-page-bg: transparent;
      --sd-surface: rgba(255,255,255,.96);
      --sd-surface-text: #174082;
      --sd-surface-muted: #3566B6;
      --sd-surface-border: rgba(53,102,182,.18);
      --sd-dark-card: #174082;
      --sd-dark-card-2: #2252A0;
      --sd-dark-text: #f8fbff;
      --sd-dark-muted: rgba(202,222,252,.92);
      --sd-donut-track: #CADEFC;
      --accent-primary: #2252A0;
      --accent-bright: #3566B6;
      --accent-cyan: #86CFFF;
      --accent-teal: #187E74;
      --accent-teal-deep: #00665B;
      --gradient-cta: linear-gradient(135deg, #3566B6 0%, #2252A0 45%, #187E74 100%);
      --gradient-surface: linear-gradient(145deg, rgba(255,255,255,.98), rgba(224,236,255,.72));
      --gradient-bar: linear-gradient(90deg, #3566B6, #86CFFF, #187E74);
    }

    /* Transição suave entre temas */
    *, *::before, *::after {
      transition: background-color 280ms ease, border-color 280ms ease, color 280ms ease;
    }
    .animate-spin { transition: none !important; }

    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);background-attachment:fixed;color:var(--font);min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 900px 600px at 10% 0%,rgba(32,120,150,.07),transparent 65%),
                 radial-gradient(ellipse 700px 500px at 90% 95%,rgba(20,60,110,.09),transparent 65%);}
    [data-theme="light"] body::before{
      display:block;
      background:
        radial-gradient(ellipse 720px 480px at 8% 5%, rgba(53,102,182,.22), transparent 68%),
        radial-gradient(ellipse 560px 420px at 92% 88%, rgba(24,126,116,.16), transparent 70%),
        radial-gradient(ellipse 480px 360px at 55% 42%, rgba(134,207,255,.20), transparent 72%);
      animation:lightMesh 14s ease-in-out infinite alternate;
    }
    [data-theme="light"] body::after{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle 140px at 12% 22%, rgba(53,102,182,.10), transparent),
        radial-gradient(circle 100px at 88% 18%, rgba(134,207,255,.14), transparent),
        radial-gradient(circle 120px at 78% 72%, rgba(0,102,91,.09), transparent);
      animation:lightOrbs 20s ease-in-out infinite;
    }
    @keyframes lightMesh{0%{opacity:.85;transform:scale(1);}100%{opacity:1;transform:scale(1.03);}}
    @keyframes lightOrbs{0%,100%{transform:translate(0,0);}33%{transform:translate(12px,-8px);}66%{transform:translate(-8px,10px);}}
    @keyframes lightShimmer{0%{background-position:200% center;}100%{background-position:-200% center;}}
    @keyframes lightPulse{0%,100%{box-shadow:0 4px 20px rgba(53,102,182,.18);}50%{box-shadow:0 8px 32px rgba(53,102,182,.28);}}
    #root{position:relative;z-index:1;}

    /* ── CARDS ── */
    .glass{background:var(--card);border:1.5px solid var(--divider);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);}
    .glass.rounded-2xl{transition:box-shadow .25s,border-color .25s,transform .2s;}
    .glass.rounded-2xl:hover{box-shadow:0 12px 40px rgba(0,0,0,.30);}
    [data-theme="light"] .glass{background:var(--gradient-surface);border-color:rgba(53,102,182,.18);box-shadow:0 10px 36px rgba(23,64,130,.10), inset 0 1px 0 rgba(255,255,255,.95);}
    [data-theme="light"] .glass.rounded-2xl:hover{box-shadow:0 18px 48px rgba(23,64,130,.14), 0 0 0 1px rgba(134,207,255,.35);border-color:rgba(53,102,182,.30);transform:translateY(-2px);}
    .muted{color:var(--font-muted);}
    .chip{background:var(--badge);border:1.5px solid var(--divider);}
    .btn{border:1.5px solid var(--divider);background:var(--btn);transition:transform .08s,background .12s,border-color 280ms ease,color 280ms ease;cursor:pointer;color:var(--font);}
    .btn:hover{filter:brightness(1.12);}
    .btn:active{transform:translateY(1px);}
    .btn-primary{border:1px solid rgba(44,160,180,.55);background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;}
    .btn-primary:hover{filter:brightness(1.10);}
    [data-theme="light"] .btn-primary{background:linear-gradient(135deg,#3566B6 0%,#2252A0 45%,#187E74 100%)!important;border:1px solid rgba(53,102,182,.35)!important;box-shadow:0 4px 18px rgba(34,82,160,.32);color:#fff!important;}
    [data-theme="light"] .btn-primary:hover{filter:none;background:linear-gradient(135deg,#2252A0,#174082,#00665B)!important;box-shadow:0 8px 28px rgba(23,64,130,.38);transform:translateY(-1px);color:#fff!important;}
    [data-theme="light"] .btn-primary svg{color:#fff!important;}
    [data-theme="light"] .admin-toolbar .btn:not(.btn-primary){color:var(--font);background:var(--btn);}
    .btn-danger{border:1px solid rgba(200,60,80,.35);background:rgba(200,60,80,.10);color:#e07080;}
    .btn-danger:hover{background:rgba(200,60,80,.18);}

    /* ── INPUTS ── */
    .input{background:var(--input-bg);border:1px solid var(--input-border);outline:none;color:var(--font);font-family:'Outfit',sans-serif;}
    .input:focus{border-color:rgba(44,160,180,.75);box-shadow:0 0 0 3px rgba(44,160,180,.14);}
    .input-light{background:var(--input-bg);border:1px solid var(--input-border);outline:none;color:var(--font);border-radius:8px;padding:5px 10px;font-size:13px;width:100%;font-family:'Outfit',sans-serif;}
    .input-light:focus{border-color:rgba(44,160,180,.6);box-shadow:0 0 0 3px rgba(44,160,180,.12);}
    .err-box{background:rgba(200,60,70,.12);border:1px solid rgba(200,60,70,.38);border-radius:12px;padding:10px 14px;font-size:13px;color:#f0a0a8;}

    /* ── TAB BAR ── */
    .tab-bar{display:flex;background:var(--tabbar);border:1px solid var(--divider);border-radius:14px;padding:4px;gap:3px;overflow-x:auto;}
    .tab-btn{flex:1;padding:7px 8px;min-height:48px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;border:none;background:transparent;color:var(--font-muted);transition:all .18s;white-space:nowrap;min-width:fit-content;display:flex;align-items:center;justify-content:center;}
    .tab-btn:hover{color:var(--font);background:rgba(255,255,255,.05);}
    .tab-btn-active{background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;border:1px solid rgba(44,160,180,.40)!important;box-shadow:0 2px 14px rgba(30,143,168,.25);}

    /* ── BOOK ACCORDIONS ── */
    .book-m1{background:linear-gradient(135deg,rgba(26,138,158,.18),rgba(13,82,98,.12));border:1px solid rgba(26,138,158,.32);color:#b8e8f2;}
    .book-m1:hover{background:linear-gradient(135deg,rgba(26,138,158,.26),rgba(13,82,98,.18));}
    .book-m2{background:linear-gradient(135deg,rgba(42,100,190,.18),rgba(26,58,140,.12));border:1px solid rgba(42,100,190,.32);color:#b0ccf8;}
    .book-m2:hover{background:linear-gradient(135deg,rgba(42,100,190,.26),rgba(26,58,140,.18));}
    .book-m3{background:linear-gradient(135deg,rgba(26,154,122,.18),rgba(13,90,72,.12));border:1px solid rgba(26,154,122,.32);color:#a0e8cc;}
    .book-m3:hover{background:linear-gradient(135deg,rgba(26,154,122,.26),rgba(13,90,72,.18));}
    .book-m4{background:linear-gradient(135deg,rgba(110,84,200,.18),rgba(52,26,140,.12));border:1px solid rgba(110,84,200,.32);color:#c8b8f8;}
    .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.26),rgba(52,26,140,.18));}
    .book-m5{background:linear-gradient(135deg,rgba(42,130,190,.18),rgba(26,80,140,.12));border:1px solid rgba(42,130,190,.32);color:#a8d4f8;}
    .book-m5:hover{background:linear-gradient(135deg,rgba(42,130,190,.26),rgba(26,80,140,.18));}
    .book-m6{background:linear-gradient(135deg,rgba(70,100,160,.18),rgba(30,50,100,.12));border:1px solid rgba(70,100,160,.32);color:#b0c4e8;}
    .book-m6:hover{background:linear-gradient(135deg,rgba(70,100,160,.26),rgba(30,50,100,.18));}
    /* Light mode: book accordion text deve ser escuro */
    [data-theme="light"] .book-m1{color:#00665B;background:linear-gradient(135deg,rgba(163,224,214,.45),rgba(212,247,242,.7));border-color:rgba(0,102,91,.28);}
    [data-theme="light"] .book-m1:hover{background:linear-gradient(135deg,rgba(163,224,214,.65),rgba(212,247,242,.9));box-shadow:0 6px 20px rgba(0,102,91,.12);}
    [data-theme="light"] .book-m2{color:#174082;background:linear-gradient(135deg,rgba(202,222,252,.7),rgba(224,236,255,.9));border-color:rgba(53,102,182,.28);}
    [data-theme="light"] .book-m2:hover{background:linear-gradient(135deg,rgba(134,207,255,.35),rgba(224,236,255,1));box-shadow:0 6px 20px rgba(53,102,182,.12);}
    [data-theme="light"] .book-m3{color:#187E74;background:linear-gradient(135deg,rgba(163,224,214,.35),rgba(202,222,252,.55));border-color:rgba(24,126,116,.28);}
    [data-theme="light"] .book-m3:hover{background:linear-gradient(135deg,rgba(163,224,214,.55),rgba(202,222,252,.75));box-shadow:0 6px 20px rgba(24,126,116,.12);}
    [data-theme="light"] .book-m4{color:#3d1a80;background:linear-gradient(135deg,rgba(110,84,200,.10),rgba(52,26,140,.06));border-color:rgba(110,84,200,.28);}
    [data-theme="light"] .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.16),rgba(52,26,140,.10));}
    [data-theme="light"] .book-m5{color:#1a4a7a;background:linear-gradient(135deg,rgba(42,130,190,.10),rgba(26,80,140,.06));border-color:rgba(42,130,190,.28);}
    [data-theme="light"] .book-m5:hover{background:linear-gradient(135deg,rgba(42,130,190,.16),rgba(26,80,140,.10));}
    [data-theme="light"] .book-m6{color:#1e3060;background:linear-gradient(135deg,rgba(70,100,160,.10),rgba(30,50,100,.06));border-color:rgba(70,100,160,.28);}
    [data-theme="light"] .book-m6:hover{background:linear-gradient(135deg,rgba(70,100,160,.16),rgba(30,50,100,.10));}

    /* ── LESSON CARDS ── */
    .lesson-card{background:var(--lesson);border-bottom:1px solid var(--divider);color:var(--font);transition:background 400ms ease,border-color 400ms ease;}
    .lesson-card:hover{filter:brightness(1.08);}
    .lesson-card:last-child{border-bottom:none;}
    .lesson-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;transition:background 400ms ease,border-color 400ms ease;}
    .review-card{background:rgba(30,130,155,.14);border-bottom:1px solid rgba(30,130,155,.20);color:var(--font);transition:background 400ms ease;}
    .review-card:hover{background:rgba(30,130,155,.22);}
    .review-card:last-child{border-bottom:none;}
    .review-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;}
    .lesson-detail{background:var(--detail);border-top:1px solid var(--divider);padding:14px 18px 16px;}
    .detail-label{font-size:11px;font-weight:700;color:#6ec8dc;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
    [data-theme="light"] .detail-label{color:#0a5060;}
    .num-light{background:var(--badge);border:1px solid var(--input-border);color:var(--font);min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    .num-dark{background:rgba(30,143,168,.22);border:1px solid rgba(30,143,168,.42);color:#7de0f8;min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    [data-theme="light"] .num-dark{background:rgba(30,143,168,.12);border-color:rgba(30,143,168,.35);color:#0d5260;}
    .tag-input{background:rgba(30,143,168,.18);color:#7de0f8;border:1px solid rgba(30,143,168,.38);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    .tag-output{background:rgba(180,80,120,.16);color:#f0a0c0;border:1px solid rgba(180,80,120,.36);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    [data-theme="light"] .tag-input{background:rgba(30,143,168,.12);color:#1a6070;}
    [data-theme="light"] .tag-output{background:rgba(140,50,80,.10);color:#8a3050;}
    .chevron-icon{transition:transform .2s;}
    .chevron-open{transform:rotate(180deg);}

    /* ── STATUS BADGES ── */
    .ls-pendente{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#8ab0c8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-andamento{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.36);color:#f0cc60;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-concluida{background:rgba(30,160,110,.14);border:1px solid rgba(30,160,110,.38);color:#60daa8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    [data-theme="light"] .ls-pendente{color:#4a6a80;background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);}
    [data-theme="light"] .ls-andamento{color:#8a6000;background:rgba(220,160,30,.10);}
    [data-theme="light"] .ls-concluida{color:#0a5c38;background:rgba(20,140,90,.10);}
    .att-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .att-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .att-inactive:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .att-inactive{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .att-inactive:hover{background:rgba(0,0,0,.08);}
    .att-presente{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.45);color:#60daa8;}
    .att-ausente{background:rgba(200,60,80,.16);border-color:rgba(200,60,80,.42);color:#f0909a;}
    .att-desmarcada{background:rgba(140,140,140,.12);border-color:rgba(140,140,140,.28);color:#a0b0c0;}
    [data-theme="light"] .att-presente{color:#0a5c38;}
    [data-theme="light"] .att-ausente{color:#7a1020;}
    [data-theme="light"] .att-desmarcada{color:#4a5060;}
    .eval-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .eval-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .eval-inactive:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .eval-inactive{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .eval-inactive:hover{background:rgba(0,0,0,.08);}
    .eval-revisao{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.40);color:#f0cc60;}
    .eval-atingiu{background:rgba(42,120,200,.16);border-color:rgba(42,120,200,.40);color:#88c0f8;}
    .eval-superou{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.42);color:#60daa8;}
    [data-theme="light"] .eval-revisao{color:#7a5500;}
    [data-theme="light"] .eval-atingiu{color:#1a4a80;}
    [data-theme="light"] .eval-superou{color:#0a5c38;}
    .sbtn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .sbtn-off{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .sbtn-off:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .sbtn-off{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .sbtn-off:hover{background:rgba(0,0,0,.08);}
    .sbtn-pendente{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#98bcd4;}
    [data-theme="light"] .sbtn-pendente{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.15);color:#3a5a70;}
    .sbtn-andamento{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.42);color:#f0cc60;}
    [data-theme="light"] .sbtn-andamento{color:#7a5500;}
    .sbtn-concluida{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.46);color:#60daa8;}
    [data-theme="light"] .sbtn-concluida{color:#0a5c38;}

    /* ── DIÁRIO ── */
    .ds-realizada{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .ds-andamento{background:rgba(30,143,168,.18);border:1px solid rgba(30,143,168,.36);color:#7de0f8;}
    .ds-ausente{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.38);color:#f0909a;}
    .ds-desmarcada{background:rgba(140,140,140,.11);border:1px solid rgba(140,140,140,.26);color:#a0b0c0;}
    .ds-rep-gratis{background:rgba(42,100,200,.16);border:1px solid rgba(42,100,200,.34);color:#88c0f8;}
    .ds-rep-paga{background:rgba(180,100,20,.16);border:1px solid rgba(180,100,20,.34);color:#f0b060;}
    .ds-cancelada{background:rgba(160,40,70,.16);border:1px solid rgba(160,40,70,.34);color:#f09090;}
    [data-theme="light"] .ds-realizada{color:#0a5c38;background:rgba(20,140,90,.10);}
    [data-theme="light"] .ds-andamento{color:#0d5260;background:rgba(30,143,168,.10);}
    [data-theme="light"] .ds-ausente{color:#7a1020;background:rgba(200,60,80,.08);}
    [data-theme="light"] .ds-desmarcada{color:#404050;background:rgba(140,140,140,.08);}
    [data-theme="light"] .ds-rep-gratis{color:#1a3a80;background:rgba(42,100,200,.08);}
    [data-theme="light"] .ds-rep-paga{color:#6a3800;background:rgba(180,100,20,.08);}
    [data-theme="light"] .ds-cancelada{color:#6a1030;background:rgba(160,40,70,.08);}
    .diario-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-block;}
    .num-aula{background:linear-gradient(135deg,#1e8fa8,#145f7a);border:1px solid rgba(30,143,168,.50);color:#fff;min-width:3rem;text-align:center;border-radius:9px;padding:5px 8px;font-weight:700;font-size:12px;flex-shrink:0;line-height:1.3;}
    .dtable-row{border-bottom:1px solid var(--divider);}
    .dtable-row:last-child{border-bottom:none;}
    .dtable-row:hover{background:rgba(255,255,255,.03);}
    [data-theme="light"] .dtable-row:hover{background:rgba(0,0,0,.02);}
    select.ds-select{background:var(--input-bg);border:1px solid var(--input-border);color:var(--font);border-radius:8px;padding:4px 8px;font-size:12px;outline:none;cursor:pointer;min-width:170px;font-family:'Outfit',sans-serif;}
    select.ds-select:focus{border-color:rgba(30,143,168,.7);}
    textarea.obs-input{background:var(--input-bg);border:1px solid var(--input-border);color:var(--font);border-radius:8px;padding:5px 10px;font-size:12px;outline:none;resize:vertical;min-height:36px;width:100%;font-family:'Outfit',sans-serif;}
    textarea.obs-input:focus{border-color:rgba(30,143,168,.7);}

    /* ── FINANCEIRO ── */
    .fin-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block;}
    .fin-paga{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .fin-avencer{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.38);color:#f0cc60;}
    .fin-vencida{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.40);color:#f0909a;}
    .fin-aberto{background:rgba(42,120,200,.14);border:1px solid rgba(42,120,200,.33);color:#88c0f8;}
    .fin-creditos{background:rgba(110,80,200,.14);border:1px solid rgba(110,80,200,.33);color:#c0a8f8;}
    [data-theme="light"] .fin-paga{color:#0a5c38;background:rgba(20,140,90,.10);}
    [data-theme="light"] .fin-vencida{color:#8a2030;background:rgba(200,60,80,.08);}
    [data-theme="light"] .fin-avencer{color:#7a5500;background:rgba(220,160,30,.08);}
    [data-theme="light"] .fin-aberto{color:#1a3a80;background:rgba(42,120,200,.08);}
    [data-theme="light"] .fin-creditos{color:#3d1a80;background:rgba(110,80,200,.08);}

    /* ── FINANCEIRO DASHBOARD & PAYMENT CARDS ── */
    .fin-hero{background:linear-gradient(145deg,rgba(18,36,58,.98),rgba(10,24,44,.95));border:1.5px solid rgba(30,143,168,.28);border-radius:22px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);}
    .fin-hero::before{content:'';position:absolute;top:-40%;right:-15%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(30,143,168,.18),transparent 70%);pointer-events:none;}
    .fin-hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(96,218,168,.12),transparent 70%);pointer-events:none;}
    [data-theme="light"] .fin-hero{background:linear-gradient(145deg,#fff,#f0f6fa);border-color:rgba(10,30,55,.14);box-shadow:0 10px 36px rgba(10,30,55,.12);}
    .fin-month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;}
    .fin-month-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--divider);background:var(--btn);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--font);transition:all .15s;}
    .fin-month-btn:hover{border-color:rgba(30,143,168,.5);background:rgba(30,143,168,.1);transform:translateY(-1px);}
    .fin-month-label{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;min-width:180px;text-align:center;}
    .fin-metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    @media(max-width:720px){.fin-metric-grid{grid-template-columns:1fr;}}
    .fin-metric-card{border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.10);transition:transform .18s,box-shadow .18s;}
    .fin-metric-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.22);}
    .fin-metric-previsto{background:linear-gradient(135deg,rgba(42,120,200,.22),rgba(26,80,160,.12));border-color:rgba(42,120,200,.35);}
    .fin-metric-recebido{background:linear-gradient(135deg,rgba(30,160,110,.22),rgba(13,90,72,.12));border-color:rgba(30,160,110,.35);}
    .fin-metric-despesas{background:linear-gradient(135deg,rgba(200,80,90,.18),rgba(140,40,60,.10));border-color:rgba(200,80,90,.32);}
    .fin-metric-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:rgba(255,255,255,.10);}
    .fin-metric-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:6px;}
    .fin-metric-value{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;line-height:1.1;}
    .fin-metric-sub{font-size:11px;opacity:.6;margin-top:6px;}
    .fin-saldo-bar{margin-top:18px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
    .fin-saldo-val{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;}
    .fin-saldo-pos{color:#60daa8;}
    .fin-saldo-neg{color:#f0909a;}
    .fin-pay-card{border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;border:1.5px solid var(--divider);background:var(--card);transition:transform .15s,box-shadow .2s,border-color .2s;}
    .fin-pay-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
    .fin-pay-card-paid{border-color:rgba(30,160,110,.40);background:linear-gradient(145deg,rgba(30,160,110,.08),var(--card));}
    .fin-pay-card-open{border-color:rgba(42,120,200,.30);}
    .fin-pay-card-late{border-color:rgba(200,60,80,.38);background:linear-gradient(145deg,rgba(200,60,80,.06),var(--card));}
    .fin-pay-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px;}
    .fin-pay-card-paid::before{background:linear-gradient(180deg,#60daa8,#1e8fa8);}
    .fin-pay-card-open::before{background:linear-gradient(180deg,#88c0f8,#3b82f6);}
    .fin-pay-card-late::before{background:linear-gradient(180deg,#f0909a,#dc2626);}
    .fin-pay-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
    .fin-pay-mes{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;}
    .fin-pay-val{font-size:20px;font-weight:800;color:rgba(44,122,142,1);}
    .fin-pay-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
    .fin-pay-meta-item{font-size:12px;color:var(--font-muted);}
    .fin-pay-meta-item strong{color:var(--font);font-weight:700;}
    .fin-pay-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .fin-btn-comprovante{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1px solid rgba(30,160,110,.45);background:linear-gradient(135deg,rgba(30,160,110,.18),rgba(13,90,72,.10));color:#60daa8;cursor:pointer;text-decoration:none;transition:all .15s;}
    .fin-btn-comprovante:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,160,110,.25);}
    .fin-btn-boleto{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1px solid rgba(42,120,200,.45);background:linear-gradient(135deg,rgba(42,120,200,.18),rgba(26,80,160,.10));color:#88c0f8;cursor:pointer;text-decoration:none;transition:all .15s;}
    .fin-btn-boleto:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 16px rgba(42,120,200,.25);}
    .fin-btn-disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}
    .fin-student-pick{background:var(--card);border:1px solid var(--divider);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;}
    .fin-student-pick:hover{border-color:rgba(30,143,168,.45);background:rgba(30,143,168,.06);transform:translateX(3px);}
    .fin-despesa-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--divider);background:var(--lesson);margin-bottom:8px;}
    .fin-summary-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .fin-summary-pill{padding:6px 14px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--divider);background:var(--badge);}
    @keyframes finGlow{0%,100%{box-shadow:0 0 20px rgba(30,143,168,.15);}50%{box-shadow:0 0 32px rgba(30,143,168,.28);}}
    .fin-hero-glow{animation:finGlow 4s ease-in-out infinite;}

    /* ── iVICTOR ── */
    .ivictor-btn{position:fixed;bottom:22px;right:22px;z-index:900;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid rgba(30,143,168,.65);box-shadow:0 4px 24px rgba(0,0,0,.40),0 0 0 4px rgba(30,143,168,.12);cursor:pointer;transition:transform .18s;background:#0c2030;}
    .ivictor-btn:hover{transform:scale(1.07);}
    .ivictor-panel{position:fixed;bottom:92px;right:22px;z-index:900;width:320px;border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.50);animation:slideUp .22s ease-out;}
    @keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .ivictor-header{background:linear-gradient(135deg,#1e8fa8,#145f7a);padding:12px 14px;display:flex;align-items:center;gap:10px;color:#fff;}
    .ivictor-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.3);flex-shrink:0;background:#0c2030;}
    .ivictor-body{background:var(--card);border:1px solid rgba(30,143,168,.22);border-top:none;backdrop-filter:blur(16px);}
    .ivictor-msg-ai{background:rgba(30,143,168,.12);border:1px solid rgba(30,143,168,.22);border-radius:12px 12px 12px 3px;padding:9px 13px;font-size:13px;line-height:1.5;color:var(--font);}
    .ivictor-footer{padding:10px 12px;border-top:1px solid rgba(30,143,168,.18);background:var(--detail);display:flex;gap:8px;}
    .ivi-quick-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px;}
    .ivi-chip{font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;cursor:pointer;border:1px solid rgba(30,143,168,.28);background:rgba(30,143,168,.08);color:var(--font);transition:background .15s;}
    .ivi-chip:hover{background:rgba(30,143,168,.16);}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

    /* ── STUDENT CARDS ── */
    .student-card{background:var(--card);border:1px solid var(--divider);border-radius:16px;padding:16px;cursor:pointer;transition:all .15s;}
    .student-card:hover{filter:brightness(1.10);box-shadow:var(--shadow);transform:translateY(-1px);}

    /* ── MISC ── */
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(30,143,168,.28);border-radius:99px;}
    .progress-fill{transition:width .6s ease;}
    .space-y-4>*+*{margin-top:1rem;}
    .space-y-3>*+*{margin-top:.75rem;}
    .space-y-2>*+*{margin-top:.5rem;}
    .grid{display:grid;}
    .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
    .gap-3{gap:.75rem;}
    .gap-2{gap:.5rem;}

    /* ── LOGO BAR ── */
    .logo-bar{background:linear-gradient(135deg,#000000 0%,#071020 100%);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:50;}
    [data-theme="light"] .logo-bar{background:linear-gradient(135deg,#174082 0%,#2252A0 42%,#187E74 100%);border-bottom:1px solid rgba(134,207,255,.28);box-shadow:0 4px 24px rgba(23,64,130,.18);}

    /* ── BRAND LOGO ── */
    .brand-logo{display:flex;align-items:center;gap:8px;}
    .brand-logo-mark{height:32px;width:auto;object-fit:contain;}
    .brand-logo-name{height:17px;width:auto;object-fit:contain;display:block;}
    .brand-logo-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
    .brand-byline{font-size:9px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.75);margin-top:2px;font-family:'Outfit',sans-serif;}
    .brand-logo-lg .brand-logo-mark{height:44px;}
    .brand-logo-lg .brand-logo-name{height:24px;}
    .brand-logo-lg .brand-byline{font-size:10px;margin-top:3px;}
    .logo-bar .btn-bar{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.24)!important;color:#fff!important;}
    .logo-bar .btn-bar:hover{background:rgba(255,255,255,.22)!important;}
    .logo-bar .btn-bar svg{color:#fff!important;}
    .logo-bar .btn-bar-label{font-size:12px;color:#fff;}

    /* ── THEME SWITCHER ── */
    .theme-switcher{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:10px;padding:2px;border:1px solid rgba(255,255,255,.14);}
    .theme-btn{padding:5px 8px;border-radius:8px;border:none;background:transparent;cursor:pointer;transition:all 180ms ease;color:rgba(255,255,255,.50);}
    .theme-btn:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);}
    .theme-btn-active{background:rgba(255,255,255,.18);box-shadow:0 1px 4px rgba(0,0,0,.3);color:#fff;}

    /* ── STUDENT DASHBOARD (referência visual) ── */
    .student-dash-wrap{background:var(--sd-page-bg);min-height:calc(100vh - 52px);padding-bottom:28px;margin:0 -16px;padding-left:16px;padding-right:16px;}
    .student-dash{display:flex;flex-direction:column;gap:14px;max-width:480px;margin:0 auto;padding-top:8px;}
    .sd-card-light{background:var(--sd-surface);border:1.5px solid var(--sd-surface-border);border-radius:20px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.18);color:var(--sd-surface-text);}
    [data-theme="light"] .sd-card-light{
      background:linear-gradient(145deg,#fff 0%,#f2f8ff 55%,#e8f4fc 100%);
      border-color:rgba(53,102,182,.16);
      box-shadow:0 10px 32px rgba(23,64,130,.10), inset 0 1px 0 rgba(255,255,255,1);
      position:relative;overflow:hidden;
    }
    [data-theme="light"] .sd-card-light::before{
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:var(--gradient-bar);opacity:.85;
    }
    .sd-card-dark{background:linear-gradient(145deg,var(--sd-dark-card-2),var(--sd-dark-card));border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.28);color:var(--sd-dark-text);}
    [data-theme="light"] .sd-card-dark{
      background:linear-gradient(145deg,#2252A0 0%,#174082 55%,#0f3060 100%);
      border-color:rgba(134,207,255,.22);
      box-shadow:0 14px 40px rgba(23,64,130,.22), inset 0 1px 0 rgba(134,207,255,.15);
    }
    .sd-greeting{display:flex;align-items:center;gap:14px;}
    .sd-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2.5px solid rgba(20,184,166,.35);flex-shrink:0;}
    .sd-avatar-ph{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
    .sd-hello{font-size:14px;color:var(--sd-surface-muted);font-weight:500;}
    .sd-name{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;line-height:1.15;color:var(--sd-surface-text);margin-top:2px;}
    .sd-bday{font-size:13px;font-weight:600;color:var(--sd-surface-muted);margin-top:6px;}
    .sd-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -4px;padding-left:4px;padding-right:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .sd-scroll::-webkit-scrollbar{display:none;}
    .sd-nav-carousel{flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:transparent;padding:0;color:inherit;}
    .sd-nav-carousel:active .sd-nav-icon{transform:scale(.96);}
    .sd-chip{flex-shrink:0;width:64px;padding:10px 8px;border-radius:12px;text-align:center;border:1.5px solid rgba(255,255,255,.14);cursor:pointer;background:rgba(255,255,255,.06);transition:filter .12s,box-shadow .12s;font-family:inherit;color:inherit;}
    .sd-chip:hover{filter:brightness(1.1);}
    .sd-chip-num{font-weight:800;font-size:14px;color:var(--sd-dark-text);}
    .sd-chip-lbl{font-size:8px;color:var(--sd-dark-muted);margin-top:3px;text-transform:uppercase;letter-spacing:.03em;}
    .sd-chip-current{box-shadow:0 0 0 2px #e8a94c;}
    .sd-card-fin{padding:12px 16px;}
    .sd-fin-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;}
    .sd-fin-link{background:none;border:none;color:#5eead4;font-size:11px;font-weight:700;cursor:pointer;padding:0;letter-spacing:.02em;}
    .sd-fin-link:hover{text-decoration:underline;}
    .sd-fin-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:10px;}
    .sd-fin-month{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;line-height:1.1;color:var(--sd-dark-text);}
    .sd-fin-due-line{font-size:11px;color:var(--sd-dark-muted);margin-top:4px;}
    .sd-fin-due-line strong{color:var(--sd-dark-text);font-weight:700;}
    .sd-fin-badge-sm{display:inline-block;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.06em;flex-shrink:0;}
    .sd-fin-badge-ok{background:rgba(52,211,153,.2);color:#34d399;border:1px solid rgba(52,211,153,.4);}
    .sd-fin-badge-late{background:rgba(248,113,113,.2);color:#f87171;border:1px solid rgba(248,113,113,.4);}
    .sd-fin-next{font-size:11px;color:var(--sd-dark-muted);margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.10);}
    .sd-fin-next strong{color:var(--sd-dark-text);font-weight:700;}
    .sd-fin-empty{font-size:12px;color:var(--sd-dark-muted);margin-top:8px;}
    .sd-metric{display:flex;align-items:center;gap:14px;}
    .sd-metric-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .sd-metric-body{flex:1;min-width:0;}
    .sd-metric-num{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;line-height:1;color:var(--sd-surface-text);}
    .sd-metric-lbl{font-size:13px;font-weight:600;color:var(--sd-surface-muted);margin-top:3px;}
    .sd-metrics-combined{display:flex;flex-direction:column;gap:0;}
    .sd-metric-divider{height:1px;background:var(--sd-surface-border);margin:14px 0;}
    .sd-fin-head{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--sd-dark-muted);margin-bottom:14px;}
    .sd-fin-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .sd-fin-col-label{font-size:12px;font-weight:700;text-transform:lowercase;margin-bottom:4px;}
    .sd-fin-col-val{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;}
    .sd-fin-ok .sd-fin-col-label{color:#34d399;}
    .sd-fin-ok .sd-fin-col-val{color:#34d399;}
    .sd-fin-late .sd-fin-col-label{color:#f87171;}
    .sd-fin-late .sd-fin-col-val{color:#f87171;}
    .sd-fin-due{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sd-dark-muted);}
    .sd-fin-pill{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 14px;font-weight:700;color:var(--sd-dark-text);font-size:13px;}
    .sd-fin-tag{font-size:10px;opacity:.65;}
    .sd-nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;padding:4px 0;}
    .sd-nav-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;border:none;background:transparent;padding:4px;color:inherit;}
    .sd-nav-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(0,0,0,.14);}
    [data-theme="light"] .sd-nav-icon{box-shadow:0 4px 14px rgba(53,102,182,.18);border:1px solid rgba(255,255,255,.5);}
    [data-theme="light"] .sd-nav-carousel:hover .sd-nav-icon{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 24px rgba(53,102,182,.28);}
    [data-theme="light"] .sd-nav-label{color:#174082;font-weight:800;}
    [data-theme="light"] .sd-metric-num{color:#174082;}
    [data-theme="light"] .sd-name{color:#174082;}
    .sd-nav-label{font-size:10px;font-weight:700;color:var(--sd-surface-text);letter-spacing:.01em;line-height:1.2;}
    .sd-nav-sub{font-size:10px;color:var(--sd-surface-muted);line-height:1.35;max-width:120px;}
    .sd-journey-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
    .sd-journey-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .sd-journey-mod{font-size:11px;font-weight:800;letter-spacing:.08em;color:#5eead4;}
    .sd-steps{display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 4px;}
    .sd-steps::before{content:'';position:absolute;top:18px;left:28px;right:28px;height:3px;background:rgba(255,255,255,.12);z-index:0;}
    .sd-step{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;position:relative;z-index:1;flex-shrink:0;}
    .sd-step-done{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;border:2px solid #5eead4;}
    .sd-step-current{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;border:2.5px solid #7dd3fc;box-shadow:0 0 0 4px rgba(56,189,248,.25);}
    .sd-step-pending{background:transparent;border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.35);}
    .sd-steps-sm{display:flex;justify-content:space-between;padding:10px 18px 0;margin-top:4px;}
    .sd-step-sm{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.30);}
    .sd-step-sm-done{background:rgba(20,184,166,.25);border-color:rgba(20,184,166,.45);color:#5eead4;}
    .sd-step-sm-current{background:rgba(56,189,248,.3);border-color:#38bdf8;color:#fff;}
    .sd-progress-lbl{display:flex;justify-content:space-between;font-size:12px;margin-top:16px;color:var(--sd-dark-muted);}
    .sd-progress-lbl strong{color:var(--sd-dark-text);}
    .sd-progress-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:8px;}
    .sd-progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#14b8a6,#0ea5e9);transition:width .6s ease;}
    .login-logo-wrap{display:flex;justify-content:center;padding:24px 0 20px;}
    .login-logo{max-height:56px;max-width:160px;object-fit:contain;}
    .page-back{display:flex;align-items:center;gap:8px;padding:8px 0 16px;cursor:pointer;border:none;background:transparent;color:var(--font-muted);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;}
    .page-back:hover{color:var(--font);}

    /* ── TRILHA TIMELINE ── */
    .tl-wrap{background:linear-gradient(165deg,#0c1a2e 0%,#0a1628 55%,#081220 100%);border:1.5px solid rgba(255,255,255,.09);border-radius:22px;padding:22px 14px 26px;position:relative;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);}
    .tl-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,191,165,.12),transparent 60%);pointer-events:none;}
    .tl-wrap::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:tlShine 6s ease-in-out infinite;pointer-events:none;}
    @keyframes tlShine{0%,100%{left:-100%;}50%{left:140%;}}
    .tl-module-block{display:flex;gap:0;position:relative;}
    .tl-rail{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative;}
    .tl-node{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#00d9c0,#00BFA5);border:2px solid rgba(255,255,255,.35);box-shadow:0 0 12px rgba(0,191,165,.55);flex-shrink:0;z-index:2;animation:tlPulse 2.5s ease-in-out infinite;}
    .tl-node-mod{width:16px;height:16px;}
    .tl-node-lesson{width:8px;height:8px;background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.15);box-shadow:none;animation:none;}
    .tl-node-lesson.tl-node-done{background:linear-gradient(135deg,#00BFA5,#00a88e);border-color:rgba(0,191,165,.5);box-shadow:0 0 8px rgba(0,191,165,.4);}
    .tl-node-lesson.tl-node-active{background:linear-gradient(135deg,#38bdf8,#0ea5e9);border-color:rgba(56,189,248,.6);box-shadow:0 0 10px rgba(56,189,248,.45);animation:tlPulse 2s ease-in-out infinite;}
    @keyframes tlPulse{0%,100%{box-shadow:0 0 8px rgba(0,191,165,.4);}50%{box-shadow:0 0 18px rgba(0,191,165,.75);}}
    .tl-segment{width:2px;flex:1;min-height:28px;position:relative;margin:4px 0;}
    .tl-segment-svg{width:2px;height:100%;display:block;overflow:visible;}
    .tl-line-track{stroke:rgba(255,255,255,.12);stroke-width:2;fill:none;}
    .tl-line-flow{stroke:url(#tlGrad);stroke-width:2;fill:none;stroke-dasharray:6 10;animation:tlDash 1.2s linear infinite;}
    .tl-line-flow-mod{stroke-dasharray:8 14;animation:tlDash 1.8s linear infinite;}
    @keyframes tlDash{to{stroke-dashoffset:-32;}}
    .tl-arrow{fill:#00d9c0;opacity:.9;animation:tlArrowMove 2s ease-in-out infinite;}
    @keyframes tlArrowMove{0%,100%{opacity:.4;transform:translateY(0);}50%{opacity:1;transform:translateY(4px);}}
    .tl-content{flex:1;min-width:0;padding-bottom:8px;}
    .tl-mod-row{display:flex;align-items:stretch;gap:8px;margin-bottom:6px;}
    .tl-mod-header{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(18,36,61,.95),rgba(12,26,46,.9));border:1px solid rgba(255,255,255,.12);cursor:pointer;text-align:left;color:#fff;transition:filter .15s,border-color .15s;font-family:inherit;}
    .tl-mod-header:hover{filter:brightness(1.08);border-color:rgba(0,191,165,.35);}
    .tl-mod-num{display:flex;flex-direction:column;align-items:center;min-width:44px;}
    .tl-mod-lbl{font-size:8px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.55);text-transform:uppercase;}
    .tl-mod-id{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;line-height:1;color:#fff;}
    .tl-mod-sep{width:1px;height:36px;background:rgba(255,255,255,.18);flex-shrink:0;}
    .tl-mod-title{flex:1;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;color:rgba(255,255,255,.92);}
    .tl-mod-chevron{color:rgba(255,255,255,.45);flex-shrink:0;transition:transform .2s;}
    .tl-mod-chevron-open{transform:rotate(180deg);}
    .tl-hide-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer;color:rgba(255,255,255,.7);font-size:9px;font-weight:700;letter-spacing:.04em;transition:all .15s;flex-shrink:0;min-width:52px;font-family:inherit;}
    .tl-hide-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
    .tl-hide-btn.tl-hidden-active{background:rgba(229,99,107,.18);border-color:rgba(229,99,107,.4);color:#f87171;}
    .tl-lesson-row{display:flex;gap:0;margin-bottom:4px;}
    .tl-lesson-rail{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:14px;}
    .tl-segment-sm{min-height:20px;}
    .tl-lesson-body{flex:1;min-width:0;}
    .tl-lesson-pill{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-align:left;font-family:inherit;transition:all .18s;position:relative;overflow:hidden;}
    .tl-lesson-pill::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-100%);transition:none;}
    .tl-pill-done{background:linear-gradient(135deg,#00BFA5,#00a88e);border-color:rgba(0,191,165,.45);color:#fff;box-shadow:0 4px 16px rgba(0,191,165,.25);}
    .tl-pill-done:hover::after{animation:tlPillShine .6s ease;}
    .tl-pill-active{background:linear-gradient(135deg,rgba(56,189,248,.35),rgba(14,165,233,.2));border-color:rgba(56,189,248,.45);color:#fff;}
    .tl-pill-pending{background:rgba(120,130,150,.18);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.38);}
    .tl-pill-pending:hover{background:rgba(120,130,150,.26);color:rgba(255,255,255,.5);}
    @keyframes tlPillShine{to{transform:translateX(100%);}}
    .tl-lesson-title{font-size:13px;font-weight:700;}
    .tl-lesson-meta{font-size:10px;opacity:.75;margin-top:2px;}
    .tl-previsao{font-size:9px;opacity:.65;letter-spacing:.02em;}
    .tl-badge-done{font-size:9px;font-weight:800;padding:3px 8px;border-radius:99px;background:#4CAF50;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0;box-shadow:0 2px 8px rgba(76,175,80,.35);}
    .tl-badge-current{font-size:9px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(56,189,248,.35);color:#7dd3fc;border:1px solid rgba(56,189,248,.5);flex-shrink:0;}
    .tl-lesson-expand{margin-top:6px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(8,18,32,.6);animation:tlExpand .25s ease;}
    @keyframes tlExpand{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
    .tl-mod-hidden-badge{font-size:9px;padding:2px 8px;border-radius:99px;background:rgba(229,99,107,.2);color:#f87171;border:1px solid rgba(229,99,107,.35);margin-left:6px;}
    .diario-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .pending-page{text-align:center;padding:48px 24px;}
    .pending-page-icon{font-size:40px;margin-bottom:12px;opacity:.6;}
    .tag-review{background:rgba(0,217,192,.16);color:#00d9c0;border:1px solid rgba(0,217,192,.36);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    [data-theme="light"] .tag-review{color:#0a6a5c;}

    /* ── RESPONSIVO MOBILE ── */
    @media (max-width:640px){
      .tab-bar{border-radius:12px;}
      .tab-btn{padding:5px 3px;font-size:10px;min-width:0;}
      .glass.rounded-2xl{border-radius:16px;}
      .fin-despesa-row{flex-direction:column;align-items:stretch;}
      .fin-despesa-row>div{grid-template-columns:1fr!important;}
      .fin-month-label{font-size:15px;min-width:140px;}
    }
    @media (max-width:400px){
      .ivictor-panel{width:calc(100vw - 32px)!important;right:16px!important;}
    }
[data-theme="light"] .muted { color: var(--font-muted) !important; }
[data-theme="light"] .num-light { color: #174082; border-color: rgba(53,102,182,.28); background: rgba(202,222,252,.55); }
[data-theme="light"] .student-card .muted { color: var(--font-muted) !important; }
[data-theme="light"] .detail-label { color: #2252A0; font-weight: 700; }

/* ── STATUS FILTER PILLS ── */
.status-pill {
  padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 700;
  cursor: pointer; border: 1px solid transparent; transition: all .15s;
  white-space: nowrap; letter-spacing: .02em;
}
.status-pill-all     { background: linear-gradient(135deg,#1e8fa8,#145f7a); color:#fff; border-color: rgba(44,160,180,.4); }
.status-pill-ativo   { background: rgba(30,160,110,.14); border-color: rgba(30,160,110,.38); color:#60daa8; }
.status-pill-lead    { background: rgba(42,120,200,.14); border-color: rgba(42,120,200,.35); color:#88c0f8; }
.status-pill-interesse { background: rgba(220,160,30,.14); border-color: rgba(220,160,30,.38); color:#f0cc60; }
.status-pill-trancado { background: rgba(140,100,200,.14); border-color: rgba(140,100,200,.35); color:#c0a0f8; }
.status-pill-evadido { background: rgba(200,60,80,.14); border-color: rgba(200,60,80,.38); color:#f09090; }
.status-pill-inactive { background: var(--badge); border-color: var(--divider); color: var(--font-muted); }
.status-pill-inactive:hover { filter: brightness(1.12); }
[data-theme="light"] .status-pill-ativo   { color:#0a5c38; }
[data-theme="light"] .status-pill-lead    { color:#1a3a80; }
[data-theme="light"] .status-pill-interesse { color:#7a5500; }
[data-theme="light"] .status-pill-trancado { color:#3d1a80; }
[data-theme="light"] .status-pill-evadido { color:#8a2030; }
[data-theme="light"] .status-pill-inactive { color:#1a3a52; }

/* ── MODAL CADASTRO ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
}
.modal-box {
  width: 100%; max-width: 760px;
  background: var(--card); border: 1px solid var(--divider);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 16px 60px rgba(0,0,0,.50);
  animation: slideUp .22s ease-out;
}
.modal-header {
  background: linear-gradient(135deg,#1e8fa8,#145f7a);
  padding: 16px 20px; display: flex; align-items: center;
  justify-content: space-between; color: #fff;
}
.modal-tab-bar {
  display: flex; background: var(--tabbar);
  border-bottom: 1px solid var(--divider); overflow-x: auto;
}
.modal-tab {
  flex: 1; padding: 11px 8px; font-size: 12px; font-weight: 700;
  letter-spacing: .03em; border: none; background: transparent;
  color: var(--font-muted); cursor: pointer; transition: all .15s;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.modal-tab:hover { color: var(--font); }
.modal-tab-active {
  color: #1e8fa8; border-bottom-color: #1e8fa8;
  background: rgba(30,143,168,.06);
}
[data-theme="light"] .modal-tab-active { color: #0d5260; border-bottom-color: #0d5260; }
.modal-body { padding: 20px; max-height: 65vh; overflow-y: auto; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--divider);
  display: flex; gap: 10px; justify-content: flex-end;
  background: var(--detail);
}
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: #5ab4cc; margin-bottom: 5px;
}
[data-theme="light"] .form-label { color: #0d5260; }
.form-section-title {
  font-size: 12px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: #1e8fa8;
  border-bottom: 1px solid var(--divider);
  padding-bottom: 6px; margin-bottom: 12px; margin-top: 18px;
}
.form-section-title:first-child { margin-top: 0; }
[data-theme="light"] .form-section-title { color: #0a4a5c; }

/* ── TRIAGEM: checkboxes estilizados ── */
.triagem-group { display: flex; flex-direction: column; gap: 6px; }
.triagem-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--divider); background: var(--input-bg);
  font-size: 13px; transition: all .13s;
}
.triagem-option:hover { border-color: rgba(30,143,168,.45); background: rgba(30,143,168,.06); }
.triagem-option.selected { border-color: rgba(30,143,168,.55); background: rgba(30,143,168,.12); color: #1e8fa8; }
[data-theme="light"] .triagem-option.selected { color: #0a5060; }
.triagem-check {
  width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--input-border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: var(--input-bg); transition: all .13s;
}
.triagem-option.selected .triagem-check {
  background: #1e8fa8; border-color: #1e8fa8;
}
.rating-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rating-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--divider);
  background: var(--input-bg); color: var(--font-muted); font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .13s;
}
.rating-btn:hover { border-color: rgba(30,143,168,.5); }
.rating-btn.selected { background: #1e8fa8; border-color: #1e8fa8; color: #fff; }

  (function(){
    function applyTheme(t){
      if(!t)return;
      const r=document.documentElement.style;
      if(t.bg)r.setProperty('--bg',t.bg);
      if(t.font)r.setProperty('--font',t.font);
      if(t.card)r.setProperty('--card',t.card);
      if(t.lesson)r.setProperty('--lesson',t.lesson);
      if(t.detail)r.setProperty('--detail',t.detail);
      if(t.header)r.setProperty('--header',t.header);
      if(t.tabbar)r.setProperty('--tabbar',t.tabbar);
      if(t.badge)r.setProperty('--badge',t.badge);
      if(t.btn)r.setProperty('--btn',t.btn);
      if(t.done)r.setProperty('--done',t.done);
      if(t.doneBorder)r.setProperty('--done-border',t.doneBorder);
      if(t.doneText)r.setProperty('--done-text',t.doneText);
    }
    window.__applyTheme=applyTheme;
    // Aplicar tema salvo localmente
    const saved=localStorage.getItem('fs-theme')||'system';
    const isDark=saved==='dark'||(saved==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
    // Tenta carregar do Firebase para retrocompatibilidade
    try{
      firebase.firestore().collection('config').doc('aparencia').get().then(doc=>{
        if(doc.exists)applyTheme(doc.data());
      }).catch(()=>{});
    }catch(e){}
  })();
  </script>

const FOTO_ACCEPT = "image/jpeg,image/png,image/webp,image/gif";

/** Redimensiona/comprime imagem no browser antes do upload (JPEG). */
function compressImageFile(file, maxSide, quality){
  maxSide=maxSide||900; quality=quality==null?0.85:quality;
  return new Promise((resolve,reject)=>{
    if(!file||!String(file.type||"").startsWith("image/")){
      reject(new Error("Selecione um arquivo de imagem (JPG, PNG ou WEBP)."));
      return;
    }
    if(file.size>FOTO_MAX_MB*1024*1024){
      reject(new Error("Foto muito grande (máximo "+FOTO_MAX_MB+" MB)."));
      return;
    }
    const objUrl=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(objUrl);
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h){reject(new Error("Imagem inválida."));return;}
      if(w>maxSide||h>maxSide){
        if(w>=h){h=Math.round(h*maxSide/w);w=maxSide;}
        else{w=Math.round(w*maxSide/h);h=maxSide;}
      }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob)reject(new Error("Falha ao processar a imagem."));
        else resolve(blob);
      },"image/jpeg",quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(objUrl);reject(new Error("Não foi possível ler a imagem."));};
    img.src=objUrl;
  });
}

/** Envia foto do aluno para Firebase Storage e retorna URL pública de download. */
async function uploadStudentFoto(file, studentUid){
  if(!studentUid)throw new Error("ID do aluno ausente para salvar a foto.");
  if(!file)throw new Error("Nenhuma foto selecionada.");
  const blob=await compressImageFile(file);
  const path="students/"+studentUid+"/foto.jpg";
  const ref=storage.ref(path);
  await ref.put(blob,{contentType:"image/jpeg",cacheControl:"public,max-age=3600"});
  const url=await ref.getDownloadURL();
  return url+(url.indexOf("?")>=0?"&":"?")+"v="+Date.now();
}

}

const MESES_LONGOS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function getParcelValor(p){const v=p?.valorDesconto>0?p.valorDesconto:p?.valor;return v>0?v:0;}

function shiftMonthKey(monthKey,delta){const[y,m]=monthKey.split("-").map(Number);const d=new Date(y,m-1+delta,1);return getMonthKey(d);}
function computeStudioFinanceMonth(students,monthKey){
  let previsto=0,recebido=0;
  (students||[]).forEach(s=>(s.financeiro?.parcelas||[]).forEach(p=>{
    const vencMonth=p.dataVencimento?p.dataVencimento.slice(0,7):null;
    if(vencMonth===monthKey)previsto+=getParcelValor(p);
    if(p.status==="paga"){
      const payMonth=p.dataPagamento?p.dataPagamento.slice(0,7):vencMonth;
      if(payMonth===monthKey)recebido+=getParcelValor(p);
    }
  }));
  return{previsto,recebido};
}

function getTodayISO(){const t=new Date();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;}
function getEffectiveParcelStatus(parcela,todayStr){
  if(parcela.status==="paga")return"paga";
  if(parcela.dataVencimento&&parcela.dataVencimento<todayStr)return"vencida";
  return parcela.status||"em_aberto";
}

function resolveFinanceSnapshot(parcelas){
  const todayStr=getTodayISO();
  const sorted=[...(parcelas||[])].filter(p=>p.dataVencimento).sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const unpaid=sorted.filter(p=>getEffectiveParcelStatus(p,todayStr)!=="paga");
  const current=unpaid[0]||null;
  let next=null;
  if(current)next=unpaid.find(p=>p.dataVencimento>current.dataVencimento)||null;
  const isLate=current?getEffectiveParcelStatus(current,todayStr)==="vencida":false;
  const allPaid=sorted.length>0&&unpaid.length===0;
  return{todayStr,current,next,isLate,isOk:allPaid||(!current?null:!isLate),allPaid,sorted};
}

function playLessonSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
  [[440,0],[660,.07],[880,.13]].forEach(([freq,delay])=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';
    osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);osc.frequency.exponentialRampToValueAtTime(freq*1.5,ctx.currentTime+delay+.1);
    gain.gain.setValueAtTime(.07,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.28);
    osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+.3);});}catch(e){}
}

const STATUS_LEGACY_MAP={
  active:"ativo",ativo:"ativo",Active:"ativo",ACTIVE:"ativo",
  lead:"lead",Lead:"lead",
  interessado:"interessado",interesse:"interessado",
  trancado:"trancado",trancada:"trancado",

  pendente_aprovacao:"pendente_aprovacao",pendente:"pendente_aprovacao",
  rejeitado:"rejeitado",

function normalizeStatus(raw,data){
  if(raw!=null&&raw!==""){
    const mapped=STATUS_LEGACY_MAP[raw]||STATUS_LEGACY_MAP[String(raw).toLowerCase()]||String(raw).toLowerCase();
    return mapped;
  }
  // Documentos antigos sem status: se parece matriculado → ativo
  if(data&&(data.financeiro||data.trilha||data.program||data.contrato||data.dataInicio||data.diasAulas?.length))return"ativo";
  return"lead";
}
function normalizeFinanceiro(fin){
  if(!fin||typeof fin!=="object")return{...FINANCEIRO_DEFAULT,parcelas:[]};
  return{
    tipo:fin.tipo||"mensalidade",
    creditosTotal:Number(fin.creditosTotal)||0,
    creditosUsados:Number(fin.creditosUsados)||0,
    parcelas:Array.isArray(fin.parcelas)?fin.parcelas:[],
  };
}
function normalizeTrilha(trilha){
  if(!trilha||typeof trilha!=="object"||Array.isArray(trilha))return{};

function emailVariants(email){
  const raw=(email||"").toString().trim();
  if(!raw)return[];
  const low=raw.toLowerCase();

/**
 * Resolve o ID do documento do aluno:
 * 1) students/{authUid}
 * 2) users/{authUid}.studentId
 * 3) students where email == email do login (várias capitalizações)
 */
async function resolveStudentDocId(authUid,email){
  if(!authUid)return null;
  try{
    const byUid=await db.collection("students").doc(authUid).get();
    if(byUid.exists)return authUid;
  }catch(e){console.warn("resolveStudentDocId byUid:",e);}
  try{
    const userMap=await db.collection("users").doc(authUid).get();
    if(userMap.exists){
      const sid=userMap.data().studentId;
      if(sid){
        const chk=await db.collection("students").doc(sid).get();
        if(chk.exists)return sid;
      }
    }
  }catch(e){console.warn("resolveStudentDocId users map:",e);}
  const variants=emailVariants(email);
  for(const em of variants){
    try{
      const q=await db.collection("students").where("email","==",em).limit(5).get();
      if(q.empty)continue;
      const docs=q.docs;
      const preferred=docs.find(x=>{
        const st=normalizeStatus(x.data().status,x.data());
        return st==="ativo"||st==="lead"||st==="interessado"||st==="trancado";
      })||docs[0];
      const sid=preferred.id;
      const emailNorm=em.toLowerCase();
      try{
        await db.collection("users").doc(authUid).set({
          email:emailNorm,role:"student",studentId:sid,authUid,
          linkedAt:firebase.firestore.FieldValue.serverTimestamp(),
        },{merge:true});
        await db.collection("students").doc(sid).set({authUid,email:emailNorm,hasPortalLogin:true},{merge:true});
      }catch(linkErr){console.warn("link student map:",linkErr);}
      return sid;
    }catch(e){console.warn("resolveStudentDocId email:",em,e);}
  }
  return authUid;
}

/** Admin: cria/vincula login Firebase a um doc de aluno já existente. */
async function linkStudentPortalLogin(studentUid,email,password){
  const em=(email||"").toString().trim().toLowerCase();
  const pass=(password||"").toString();
  if(!studentUid)throw new Error("UID do aluno ausente.");
  if(!em)throw new Error("Email obrigatório.");
  if(pass.length<6)throw new Error("Senha com no mínimo 6 caracteres.");
  const secondary=getSecondaryAuth();
  let authUid=null;
  let created=false;
  try{
    try{
      const cred=await secondary.createUserWithEmailAndPassword(em,pass);
      authUid=cred.user.uid;
      created=true;
    }catch(authErr){
      if(authErr.code==="auth/email-already-in-use"){
        // Conta Auth já existe: só normaliza email e marca login (aluno entra com senha atual)
        await db.collection("students").doc(studentUid).set({
          email:em,hasPortalLogin:true,loginNote:"email-already-in-use",
        },{merge:true});
        return{created:false,alreadyExists:true,studentUid,email:em};
      }
      throw authErr;
    }
  }finally{
    try{await secondary.signOut();}catch(e){}
  }
  await db.collection("students").doc(studentUid).set({
    email:em,authUid,hasPortalLogin:true,
  },{merge:true});
  await db.collection("users").doc(authUid).set({
    email:em,role:"student",studentId:studentUid,authUid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  },{merge:true});
  return{created,alreadyExists:false,studentUid,authUid,email:em};
}

function ThemeSwitcher() {
  const [mode, setMode] = useState(() => localStorage.getItem('fs-theme') || 'system');

  useEffect(() => {
    function apply(m) {
      const isDark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }
    apply(mode);
    localStorage.setItem('fs-theme', mode);
    if (mode === 'system') {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const handler = () => apply('system');
      mq.addEventListener('change', handler);
      return () => mq.removeEventListener('change', handler);
    }
  }, [mode]);

  const opts = [
    { id: 'dark',   icon: 'moon',    label: 'Dark' },
    { id: 'light',  icon: 'sun',     label: 'Light' },
    { id: 'system', icon: 'monitor', label: 'Auto' },
  ];

  return (
    <div className="theme-switcher">
      {opts.map(o => (
        <button
          key={o.id}
          title={o.label}
          onClick={() => setMode(o.id)}
          className={"theme-btn" + (mode === o.id ? " theme-btn-active" : "")}
        >
          <Icon name={o.icon} size={14}/>
        </button>
      ))}
    </div>
  );
}

  return(
    <div className="min-h-screen flex flex-col items-center justify-center px-5">

// ── MODIFICAÇÃO 3: LessonItem com botão Tarefa Feita ───────────────────────
function LessonItem({item,uid,isAdmin,defaultOpen=false,onFocused,embedMode=false}){
  const [open,setOpen]=useState(embedMode||defaultOpen);
  const rootRef=useRef(null);
  const isReview=item.type==="review";
  useEffect(()=>{
    if(embedMode||!defaultOpen)return;
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{
      rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});
      onFocused?.();
    },120);
    return()=>clearTimeout(t);
  },[defaultOpen,embedMode]);
  function handleToggle(){if(!open)playLessonSound();setOpen(o=>!o);}
  async function updateField(field,val){const patch={};patch[`trilha.${item.id}.${field}`]=val;await db.collection("students").doc(uid).update(patch);}
  async function setStatus(s){await updateField("status",s);}
  async function toggleTarefa(e){
    e.stopPropagation();
    const newVal=!item.tarefaFeita;
    const patch={};
    patch[`trilha.${item.id}.tarefaFeita`]=newVal;
    await db.collection("students").doc(uid).update(patch);
  }
  const borderColor=getLessonBorderColor(item);
  const typeTag=isReview?"tag-review":item.lessonType==="output"?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":item.lessonType==="output"?"Output":"Input";
  if(embedMode)return(
    <div ref={rootRef} className="lesson-detail" style={{padding:"12px 14px"}}>
      <div className="flex items-center gap-2 flex-wrap mb-3 pb-3" style={{borderBottom:"1px solid rgba(255,255,255,.08)"}}>
        <span className={typeTag} style={{fontSize:10}}>{typeLabel}</span>
        <LessonBadge status={item.status}/>
        {!isReview&&<button title={item.tarefaFeita?"Tarefa entregue":"Marcar tarefa"} onClick={toggleTarefa} style={{width:28,height:28,borderRadius:8,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",background:item.tarefaFeita?"rgba(34,197,94,.18)":"var(--badge)",color:item.tarefaFeita?"#22c55e":"var(--font-muted)",marginLeft:"auto"}}><Icon name={item.tarefaFeita?"check-square":"square"} size={14}/></button>}
      </div>
      {isAdmin?<AdminLessonPanel item={item} updateField={updateField} setStatus={setStatus}/>:<StudentLessonView item={item}/>}
    </div>
  );
  return(
    <div ref={rootRef} className={(isReview?"review-card":"lesson-card")+(item.status==="concluida"||item.status==="realizada"?" done-card":"")} style={{borderLeft:`3px solid ${borderColor}`}}>
      <div className="flex items-center gap-3 px-4 py-3 cursor-pointer" onClick={handleToggle}>
        <span className={isReview?"num-dark":"num-light"}>{item.pos}</span>
        <div className="flex-1 min-w-0">
          <div className="font-semibold text-sm flex items-center gap-2 flex-wrap">
            {item.title}
            <span className={typeTag}>{typeLabel}</span>
          </div>
          <div className="text-xs mt-0.5 flex items-center gap-2 flex-wrap muted">
            <span>{`Lesson ${item.num}`}</span>
            {item.date&&<span className="flex items-center gap-1"><Icon name="calendar" size={10}/>{formatDateBR(item.date)}</span>}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {!isReview && (
            <button
              title={item.tarefaFeita ? "Tarefa entregue ✓" : "Marcar tarefa como entregue"}
              onClick={toggleTarefa}
              style={{
                width:28,height:28,borderRadius:8,border:'none',cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',
                background:item.tarefaFeita?'rgba(34,197,94,.18)':'var(--badge)',
                color:item.tarefaFeita?'#22c55e':'var(--font-muted)',
                transition:'all 180ms ease',
                flexShrink:0,
              }}
            >
              <Icon name={item.tarefaFeita?"check-square":"square"} size={14}/>
            </button>
          )}
          <LessonBadge status={item.status}/>
          <Icon name="chevron-down" size={14} className={"chevron-icon muted"+(open?" chevron-open":"")}/>
        </div>
      </div>
      {open&&<div className="lesson-detail">{isAdmin?<AdminLessonPanel item={item} updateField={updateField} setStatus={setStatus}/>:<StudentLessonView item={item}/>}</div>}
    </div>
  );
}

function TimelineSegment({height,variant}){
  const h=height||32;
  return(
    <div className="tl-segment" style={{minHeight:h}}>
      <svg className="tl-segment-svg" width="2" height={h} viewBox={`0 0 2 ${h}`} preserveAspectRatio="none">
        <line x1="1" y1="0" x2="1" y2={h} className="tl-line-track"/>
        <line x1="1" y1="0" x2="1" y2={h} className={"tl-line-flow"+(variant==="mod"?" tl-line-flow-mod":"")}/>
        <polygon className="tl-arrow" points={`1,${h-2} -2,${h-8} 4,${h-8}`}/>
      </svg>
    </div>
  );
}

function TimelineLesson({item,uid,isAdmin,defaultOpen,onFocused,isLast}){
  const [open,setOpen]=useState(defaultOpen);
  const rootRef=useRef(null);
  const concluida=item.status==="concluida"||item.status==="realizada";
  const andamento=item.status==="andamento";
  useEffect(()=>{
    if(!defaultOpen)return;
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});onFocused?.();},120);
    return()=>clearTimeout(t);
  },[defaultOpen]);
  function toggle(){if(!open)playLessonSound();setOpen(o=>!o);}
  const pillCls=concluida?"tl-pill-done":andamento?"tl-pill-active":"tl-pill-pending";
  const nodeCls="tl-node-lesson"+(concluida?" tl-node-done":andamento?" tl-node-active":"");
  const tema=item.objetivos?item.objetivos.split(/[.!?\n]/)[0].slice(0,28)+(item.objetivos.length>28?"…":""):"(Tema)";
  return(
    <div ref={rootRef} className="tl-lesson-row">
      <div className="tl-lesson-rail">
        <div className={"tl-node "+nodeCls}/>
        {!isLast&&<div className="tl-segment-sm"><TimelineSegment height={20}/></div>}
      </div>
      <div className="tl-lesson-body">
        <button type="button" className={"tl-lesson-pill "+pillCls} onClick={toggle}>
          <div>
            <div className="tl-lesson-title">Lesson {item.num} <span style={{fontWeight:500,opacity:.85}}>({tema})</span></div>
            {item.dataPrevista&&<div className="tl-lesson-meta"><span className="tl-previsao">previsão</span> · {formatDateBR(item.dataPrevista).slice(0,5)}</div>}
          </div>
          {concluida&&<span className="tl-badge-done">concluída</span>}
          {andamento&&!concluida&&<span className="tl-badge-current">atual</span>}
          <Icon name="chevron-down" size={14} className={"tl-mod-chevron muted"+(open?" tl-mod-chevron-open":"")} style={{opacity:.6}}/>
        </button>
        {open&&<div className="tl-lesson-expand"><LessonItem item={item} uid={uid} isAdmin={isAdmin} embedMode={true}/></div>}
      </div>
    </div>
  );
}

function TrilhaTimelineModule({bookIdx,items,uid,isAdmin,hidden,onToggleHidden,focusLessonId,onLessonFocused,isLast,defaultOpen}){
  const hasFocus=focusLessonId&&items.some(i=>i.id===focusLessonId);

            <div className="tl-mod-sep"/>

function TrilhaSection({uid,isAdmin,focusLessonId,onLessonFocused}){
  const [trilhaData,setTrilhaData]=useState(null);
  const [modulosOcultos,setModulosOcultos]=useState([]);
  useEffect(()=>db.collection("students").doc(uid).onSnapshot(doc=>{
    if(!doc.exists){setTrilhaData({});setModulosOcultos([]);return;}
    const d=doc.data();
    setTrilhaData(d.trilha||{});
    setModulosOcultos(d.modulosOcultos||[]);
  }),[uid]);
  const books=useMemo(()=>trilhaData?mergeBooks(trilhaData):[],[trilhaData]);
  const visibleModules=getVisibleModules(modulosOcultos,isAdmin);
  const {totalDone,totalItems}=useMemo(()=>{
    let done=0,total=0;
    books.filter(b=>isAdmin||!isModuleHidden(modulosOcultos,b.bookIdx)).forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida"||i.status==="realizada")done++;}));
    return{totalDone:done,totalItems:total};
  },[books,modulosOcultos,isAdmin]);
  const progress=totalItems?Math.round((totalDone/totalItems)*100):0;
  async function toggleModuleHidden(modId){
    const next=modulosOcultos.includes(modId)?modulosOcultos.filter(id=>id!==modId):[...modulosOcultos,modId];
    await db.collection("students").doc(uid).update({modulosOcultos:next});
  }
  useEffect(()=>{
    if(isAdmin||!focusLessonId)return;
    const modId=parseInt((focusLessonId.split("-")[0]||"").slice(1),10);
    if(isModuleHidden(modulosOcultos,modId))onLessonFocused?.();
  },[focusLessonId,modulosOcultos,isAdmin]);
  if(!trilhaData)return <LoadingScreen/>;
  return(
    <div>
      {isAdmin&&<div className="glass rounded-2xl p-5 mb-5 text-center">
        <h2 className="text-xl font-bold mb-1 flex items-center justify-center gap-2" style={{fontFamily:"'Sora',sans-serif"}}>
          <Icon name="route" size={18} style={{color:'rgba(44,122,142,1)'}}/>Trilha
        </h2>
        <div className="max-w-sm mx-auto mt-3">
          <div className="flex justify-between text-xs muted mb-1"><span>Progresso</span><span className="font-semibold">{progress}%</span></div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{background:"var(--badge)"}}><div className="h-full rounded-full progress-fill" style={{width:progress+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/></div>
        </div>
        <p className="text-xs muted mt-3">Use o botão ao lado de cada módulo para ocultá-lo do aluno.</p>
      </div>}
      <div className="tl-wrap">
        <svg width="0" height="0" style={{position:"absolute"}}><defs><linearGradient id="tlGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="rgba(255,255,255,.15)"/><stop offset="50%" stopColor="#00d9c0"/><stop offset="100%" stopColor="rgba(255,255,255,.15)"/></linearGradient></defs></svg>
        {visibleModules.map((mod,idx)=><TrilhaTimelineModule key={mod.id} bookIdx={mod.id} items={books.find(b=>b.bookIdx===mod.id)?.items||[]} uid={uid} isAdmin={isAdmin} hidden={isModuleHidden(modulosOcultos,mod.id)} onToggleHidden={()=>toggleModuleHidden(mod.id)} focusLessonId={focusLessonId} onLessonFocused={onLessonFocused} isLast={idx===visibleModules.length-1} defaultOpen={mod.id===1}/>)}
        {visibleModules.length===0&&<div className="text-center py-10" style={{color:"rgba(255,255,255,.45)"}}><Icon name="eye-off" size={28} className="mx-auto mb-2 opacity-40"/><p className="text-sm">Nenhum módulo visível para o aluno.</p></div>}
      </div>
    </div>
  );
}

function RecursosSection({uid,isAdmin,links}){
  const [editLinks,setEditLinks]=useState(false);const [localLinks,setLocalLinks]=useState(links);
  useEffect(()=>setLocalLinks(links),[links]);
  function updateLink(idx,field,val){setLocalLinks(prev=>prev.map((l,i)=>i===idx?{...l,[field]:val}:l));}
  function addLink(){setLocalLinks(prev=>[...prev,{id:Date.now(),label:"Novo link",url:""}]);}
  function removeLink(idx){setLocalLinks(prev=>prev.filter((_,i)=>i!==idx));}
  async function saveLinks(){await db.collection("students").doc(uid).update({links:localLinks});setEditLinks(false);}
  return(
    <div className="max-w-lg mx-auto"><div className="glass rounded-2xl p-5">
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-bold text-lg flex items-center gap-2">
          <Icon name="link" size={18} style={{color:'rgba(44,122,142,1)'}}/>
          Recursos
        </h3>
        {isAdmin&&!editLinks&&<button className="btn rounded-lg px-3 py-1.5 text-xs inline-flex items-center gap-1.5" onClick={()=>setEditLinks(true)}><Icon name="pencil" size={12}/> Editar</button>}
      </div>
      {editLinks?(
        <div className="space-y-2">
