function FinanceiroSection({uid,isAdmin,financeiro}){
  if(!isAdmin)return <StudentFinanceView financeiro={financeiro}/>;
  const [tipo,setTipoLocal]=useState(financeiro?.tipo||"mensalidade");
  const [creditosTotal,setCredTotal]=useState(financeiro?.creditosTotal||0);
  const [creditosUsados,setCredUsados]=useState(financeiro?.creditosUsados||0);
  const [parcelas,setParcelas]=useState(()=>Array.isArray(financeiro?.parcelas)?financeiro.parcelas.map(p=>({...p})):[]);
  const [savingKey,setSavingKey]=useState("");
  useEffect(()=>{
    setTipoLocal(financeiro?.tipo||"mensalidade");
    setCredTotal(financeiro?.creditosTotal||0);
    setCredUsados(financeiro?.creditosUsados||0);
    setParcelas(Array.isArray(financeiro?.parcelas)?financeiro.parcelas.map(p=>({...p})):[]);
  },[financeiro]);
  const creditosRestantes=creditosTotal-creditosUsados;
  const sorted=[...parcelas].sort((a,b)=>(a.dataVencimento||"").localeCompare(b.dataVencimento||""));
  function patchLocal(id,field,val){
    setParcelas(prev=>prev.map(p=>{
      if(p.id!==id)return p;
      const u={...p,[field]:val};
      if(field==="status"&&val==="paga"&&!u.dataPagamento)u.dataPagamento=getTodayISO();
      return u;
    }));
  }
  async function saveContratoTipo(){
    setSavingKey("tipo");
    try{
      await db.collection("students").doc(uid).update({
        "financeiro.tipo":tipo,
        "financeiro.creditosTotal":parseInt(creditosTotal)||0,
        "financeiro.creditosUsados":parseInt(creditosUsados)||0,
      });
      notifySaveSuccess("Tipo de contrato / créditos salvos!");
    }catch(e){notifySaveError(e.message||"Erro ao salvar");}
    finally{setSavingKey("");}
  }
  async function addParcela(){
    const nova={id:Date.now().toString(),mes:"",valor:0,valorDesconto:0,status:"em_aberto",dataVencimento:"",comprovante:"",boletoPix:"",dataPagamento:""};
    setParcelas(prev=>[...prev,nova]);
  }
  async function saveParcela(id){
    const p=parcelas.find(x=>x.id===id);
    if(!p)return;
    setSavingKey("p_"+id);
    try{
      const next=parcelas.map(x=>x.id===id?p:x);
      await db.collection("students").doc(uid).update({"financeiro.parcelas":next});
      await upsertInvoiceFromParcela(uid,p);
      notifySaveSuccess("Parcela salva!");
    }catch(e){notifySaveError(e.message||"Erro ao salvar parcela");}
    finally{setSavingKey("");}
  }
  async function deleteParcela(id){
    if(!confirm("Remover esta parcela do contrato do aluno?"))return;
    setSavingKey("del_"+id);
    try{
      const next=parcelas.filter(p=>p.id!==id);
      setParcelas(next);
      await db.collection("students").doc(uid).update({"financeiro.parcelas":next});
      notifySaveSuccess("Parcela removida.");
    }catch(e){notifySaveError(e.message||"Erro ao remover");}
    finally{setSavingKey("");}
  }
  return(
    <div className="space-y-4">
      <div className="glass rounded-2xl p-5">
        <h3 className="font-bold text-base mb-3 flex items-center gap-2">
          <Icon name="dollar-sign" size={16} style={{color:'rgba(44,122,142,1)'}}/>
          Tipo de Contrato
        </h3>
        <div className="flex gap-2 mb-4">
          <button type="button" onClick={()=>setTipoLocal("mensalidade")} className={"sbtn "+(tipo==="mensalidade"?"sbtn-concluida":"sbtn-off")}>Mensalidade</button>
          <button type="button" onClick={()=>setTipoLocal("creditos")} className={"sbtn "+(tipo==="creditos"?"sbtn-andamento":"sbtn-off")}>Créditos</button>
        </div>
        {tipo==="creditos"&&<div className="grid grid-cols-2 gap-4 mb-3">
          <div><div className="detail-label">Total de Créditos</div><input type="number" min={0} className="input-light mt-1" value={creditosTotal} onChange={e=>setCredTotal(parseInt(e.target.value)||0)}/></div>
          <div><div className="detail-label">Créditos Usados</div><input type="number" min={0} className="input-light mt-1" value={creditosUsados} onChange={e=>setCredUsados(parseInt(e.target.value)||0)}/></div>
        </div>}
        <div className="save-bar">
          <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={saveContratoTipo} disabled={savingKey==="tipo"}>
            <Icon name="save" size={14}/>{savingKey==="tipo"?"Salvando…":"Salvar tipo / créditos"}
          </button>
        </div>
      </div>
      {tipo==="creditos"&&creditosTotal>0&&<div className="chip rounded-2xl p-4 flex items-center justify-between"><span className="text-sm font-semibold">Créditos Restantes</span><span className="fin-badge fin-creditos" style={{fontSize:13}}>{creditosRestantes} de {creditosTotal}</span></div>}
      <div className="glass rounded-2xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-base flex items-center gap-2">
            <Icon name="credit-card" size={16} style={{color:'rgba(44,122,142,1)'}}/>
            {tipo==="creditos"?"Lançamentos":"Parcelas do Contrato"}
          </h3>
          <button type="button" className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={addParcela}><Icon name="plus" size={14}/> Adicionar</button>
        </div>
        {sorted.length===0?<div className="text-center py-8 muted"><Icon name="credit-card" size={28} className="mx-auto mb-2 opacity-30"/><p className="text-sm">Nenhum lançamento cadastrado ainda.</p></div>:(
          <div className="space-y-3">{sorted.map(p=>{const fs=finStatusMap[p.status]||FIN_STATUS[3];return(
            <div key={p.id} className="chip rounded-2xl p-4" style={{borderColor:fs.cls.includes("fin-")?"":undefined}}>
              <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                <span className={"fin-badge "+fs.cls}>{fs.label}</span>
                <div style={{display:"flex",gap:8}}>
                  <button type="button" className="btn btn-primary rounded-lg px-3 py-1.5 text-xs font-semibold inline-flex items-center gap-1.5" onClick={()=>saveParcela(p.id)} disabled={savingKey==="p_"+p.id}>
                    <Icon name="save" size={12}/>{savingKey==="p_"+p.id?"Salvando…":"Salvar"}
                  </button>
                  <button type="button" className="btn btn-danger rounded-lg px-3 py-1.5 text-xs inline-flex items-center gap-1.5" onClick={()=>deleteParcela(p.id)}><Icon name="trash-2" size={12}/> Remover</button>
                </div>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div><div className="detail-label">Mês / Referência</div><input className="input-light mt-1" placeholder="Ex: Abril 2026" value={p.mes||""} onChange={e=>patchLocal(p.id,"mes",e.target.value)}/></div>
                <div><div className="detail-label">Vencimento</div><input type="date" className="input-light mt-1" value={p.dataVencimento||""} onChange={e=>patchLocal(p.id,"dataVencimento",e.target.value)}/></div>
                <div><div className="detail-label">Status</div><select className="ds-select mt-1" value={p.status||"em_aberto"} onChange={e=>patchLocal(p.id,"status",e.target.value)}>{FIN_STATUS.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select></div>
                <div><div className="detail-label">Valor (R$)</div><input type="number" step="0.01" min="0" className="input-light mt-1" value={p.valor||0} onChange={e=>patchLocal(p.id,"valor",parseFloat(e.target.value)||0)}/></div>
                <div><div className="detail-label">Com Desconto (R$)</div><input type="number" step="0.01" min="0" className="input-light mt-1" value={p.valorDesconto||0} onChange={e=>patchLocal(p.id,"valorDesconto",parseFloat(e.target.value)||0)}/></div>
                <div><div className="detail-label">Data Pagamento</div><input type="date" className="input-light mt-1" value={p.dataPagamento||""} onChange={e=>patchLocal(p.id,"dataPagamento",e.target.value)}/></div>
                <div className="sm:col-span-2"><div className="detail-label">Boleto ou Pix (Link)</div><input type="url" className="input-light mt-1" placeholder="https://..." value={p.boletoPix||""} onChange={e=>patchLocal(p.id,"boletoPix",e.target.value)}/></div>
                <div className="sm:col-span-2"><div className="detail-label">Comprovante (Link)</div><input type="url" className="input-light mt-1" placeholder="https://drive.google.com/..." value={p.comprovante||""} onChange={e=>patchLocal(p.id,"comprovante",e.target.value)}/></div>
              </div>
            </div>);
          })}</div>
        )}
      </div>
    </div>
  );
}

function AdminFinanceiroDashboard({students,onBack,onSelectStudent}){
  const [monthKey,setMonthKey]=useState(()=>getMonthKey(new Date()));
  const [filtroStatus,setFiltroStatus]=useState("ativo");
  const [busca,setBusca]=useState("");
  const [kpiDetail,setKpiDetail]=useState(null); // null | 'revenue' | 'outstanding' | 'overdue'
  const [despesasPorMes,setDespesasPorMes]=useState({});
  const [despesasFixas,setDespesasFixas]=useState([]);
  const [fixasPagasPorMes,setFixasPagasPorMes]=useState({});
  const chartRef=useRef(null);
  const chartInstance=useRef(null);

  const DESPESAS_LS_KEY="fluency_studio_despesasPorMes";
  const FIXAS_LS_KEY="fluency_studio_despesasFixas";
  const FIXAS_PAGAS_LS_KEY="fluency_studio_despesasFixasPagas";
  function readLocalPorMes(){try{return JSON.parse(localStorage.getItem(DESPESAS_LS_KEY)||"{}")||{};}catch(e){return{};}}
  function readLocalFixas(){try{const v=JSON.parse(localStorage.getItem(FIXAS_LS_KEY)||"[]");return Array.isArray(v)?v:[];}catch(e){return[];}}
  function normalizeFixasPagas(raw){
    if(!raw||typeof raw!=="object")return{};
    const out={};
    Object.keys(raw).forEach(mk=>{
      const v=raw[mk];
      if(Array.isArray(v)){const map={};v.forEach(id=>{if(id)map[id]=true;});out[mk]=map;}
      else if(v&&typeof v==="object")out[mk]={...v};
    });
    return out;
  }
  function readLocalFixasPagas(){try{return normalizeFixasPagas(JSON.parse(localStorage.getItem(FIXAS_PAGAS_LS_KEY)||"{}"));}catch(e){return{};}}

  useEffect(()=>{
    setDespesasPorMes(readLocalPorMes());
    setDespesasFixas(readLocalFixas());
    setFixasPagasPorMes(readLocalFixasPagas());
    (async()=>{
      try{
        const snap=await db.collection("users").doc(ADMIN_UID).get();
        if(snap.exists){
          const data=snap.data()||{};
          if(data.despesasPorMes)setDespesasPorMes(prev=>({...prev,...data.despesasPorMes}));
          if(Array.isArray(data.despesasFixas))setDespesasFixas(data.despesasFixas);
          if(data.despesasFixasPagasPorMes)setFixasPagasPorMes(normalizeFixasPagas(data.despesasFixasPagasPorMes));
        }
      }catch(e){}
    })();
  },[]);

  // Fonte única: parcelas reais dos alunos (evita cobranças fantasma da coleção invoices)
  const built=useMemo(()=>buildFinanceFromStudents(students),[students]);
  const effectiveInvoices=built.invoices;
  const effectiveTransactions=built.transactions;

  const kpis=useMemo(()=>computeFinanceKpis(effectiveInvoices,effectiveTransactions,monthKey),[effectiveInvoices,effectiveTransactions,monthKey]);
  const isCurrentMonth=monthKey===getMonthKey(new Date());

  const expensesByMonth=useMemo(()=>{
    const out={};
    Object.keys(despesasPorMes||{}).forEach(mk=>{
      const arr=despesasPorMes[mk]||[];
      out[mk]=(out[mk]||0)+arr.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
    });
    Object.keys(fixasPagasPorMes||{}).forEach(mk=>{
      const map=fixasPagasPorMes[mk]||{};
      const sum=(despesasFixas||[]).reduce((s,d)=>s+(map[d.id]?parseFloat(d.valor)||0:0),0);
      out[mk]=(out[mk]||0)+sum;
    });
    return out;
  },[despesasPorMes,despesasFixas,fixasPagasPorMes]);

  const cashFlow=useMemo(()=>computeCashFlowSeries(effectiveTransactions,expensesByMonth),[effectiveTransactions,expensesByMonth]);

  useEffect(()=>{
    if(!chartRef.current||typeof Chart==="undefined")return;
    if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}
    const labels=cashFlow.months.map(mk=>{
      const[y,m]=mk.split("-");
      return MESES_CURTOS[parseInt(m,10)-1]+"/"+String(y).slice(2);
    });
    chartInstance.current=new Chart(chartRef.current,{
      type:"bar",
      data:{
        labels,
        datasets:[
          {label:"Recebido no mês",data:cashFlow.revenue,backgroundColor:"rgba(21,128,61,0.75)",borderRadius:6},
          {label:"Despesas",data:cashFlow.expenses,backgroundColor:"rgba(185,28,28,0.65)",borderRadius:6},
        ],
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{labels:{color:"#1E1E1E",font:{family:"Inter, sans-serif",size:12}}},
          tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+": "+formatCurrency(ctx.parsed.y)}},
        },
        scales:{
          x:{ticks:{color:"#475569"},grid:{color:"#E2E8F0"}},
          y:{ticks:{color:"#475569",callback:(v)=>"R$ "+v},grid:{color:"#E2E8F0"}},
        },
      },
    });
    return()=>{if(chartInstance.current){chartInstance.current.destroy();chartInstance.current=null;}};
  },[cashFlow]);

  const recentTx=useMemo(()=>{
    return[...effectiveTransactions].sort((a,b)=>{
      const da=toJsDate(a.date)?.getTime()||0;
      const db=toJsDate(b.date)?.getTime()||0;
      return db-da;
    }).slice(0,10);
  },[effectiveTransactions]);

  const studentsByStatus=useMemo(()=>filterStudentsByStatus(students,filtroStatus),[students,filtroStatus]);
  const contadores=useMemo(()=>getAdminStatusCounts(students),[students]);
  const alunosFiltrados=useMemo(()=>{
    let list=studentsByStatus;
    if(!busca.trim())return list;
    const q=busca.toLowerCase();
    return list.filter(s=>(s.name||"").toLowerCase().includes(q)||(s.email||"").toLowerCase().includes(q));
  },[studentsByStatus,busca]);

  const detailTitle=kpiDetail==="revenue"
    ?"Recebido em "+formatMonthYear(monthKey)
    :kpiDetail==="outstanding"?"Saldos em aberto (por quê)"
    :kpiDetail==="overdue"?"Valores em atraso (por quê)"
    :"";
  const detailRows=kpiDetail==="revenue"?kpis.revenueItems
    :kpiDetail==="outstanding"?kpis.outstandingItems
    :kpiDetail==="overdue"?kpis.overdueItems
    :[];
  const detailTotal=kpiDetail==="revenue"?kpis.revenueMonth
    :kpiDetail==="outstanding"?kpis.outstanding
    :kpiDetail==="overdue"?kpis.overdue
    :0;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:20}}>
        <div>
          <button className="btn rounded-xl px-4 py-2 text-sm inline-flex items-center gap-2 mb-3" onClick={onBack}>
            <Icon name="arrow-left" size={14}/> Voltar ao Painel
          </button>
          <h2 style={{fontSize:22,fontWeight:800,color:"#1E1E1E",margin:0,fontFamily:"var(--ds-font)"}}>Financeiro da Escola</h2>
          <p style={{fontSize:13,color:"#475569",marginTop:4}}>
            Fonte: <strong>parcelas cadastradas em cada aluno</strong> (valor &gt; 0). Sem cobranças fantasma.
          </p>
        </div>
        <div className="fin-month-nav" style={{margin:0}}>
          <button type="button" className="fin-month-btn" onClick={()=>setMonthKey(shiftMonthKey(monthKey,-1))} aria-label="Mês anterior"><Icon name="chevron-left" size={18}/></button>
          <div className="fin-month-label" style={{minWidth:160}}>{formatMonthYear(monthKey)}{!isCurrentMonth&&<div style={{fontSize:11,fontWeight:600,opacity:.55}}>outro mês</div>}</div>
          <button type="button" className="fin-month-btn" onClick={()=>setMonthKey(shiftMonthKey(monthKey,1))} disabled={isCurrentMonth} style={{opacity:isCurrentMonth?0.4:1}} aria-label="Próximo mês"><Icon name="chevron-right" size={18}/></button>

function computeDiarioStats(entries){
  const now=new Date();
  let realizadas=0,ausentes=0,paraRepor=0,semRepor=0,repFeitas=0,repVencidas=0;
  entries.forEach(e=>{
    const s=e.status;
    if(s==="realizada")realizadas++;
    else if(s==="ausente"){
      ausentes++;
      if(e.reposicaoTipo==="com")paraRepor++;
      else if(e.reposicaoTipo==="sem")semRepor++;
    }
    else if(s==="rep_feita")repFeitas++;
    else if(s==="rep_vencida")repVencidas++;
    else if(s==="a_repor"){
      const due=e.reposicaoVence?new Date(e.reposicaoVence):null;
      if(due&&due<now)repVencidas++;else paraRepor++;
    }
  });
  return{realizadas,ausentes,paraRepor,semRepor,repFeitas,repVencidas};
}

function MiniDonut({pct,color,size=48}){
  const r=17,circ=2*Math.PI*r,offset=circ-(Math.min(Math.max(pct,0),100)/100)*circ;
  return(
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",flexShrink:0}} aria-hidden="true">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--sd-donut-track)" strokeWidth={5}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={5} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"/>
    </svg>
  );
}

                const urlTarefa=item.linkTarefa||"";

                      </span>
                      <span className="muted text-xs">{isExp?"▾":"›"}</span>
                    </button>
                    {isExp&&<div className="grid grid-cols-2 gap-2 py-2 pl-3">
                      {urlLicao&&<a href={urlLicao} target="_blank" rel="noreferrer" className="btn rounded-lg py-2 text-xs text-center">📄 Lição Online</a>}
                      {urlTarefa&&<a href={urlTarefa} target="_blank" rel="noreferrer" className="btn rounded-lg py-2 text-xs text-center">📝 Tarefa Online</a>}
                      {urlExtra&&<a href={urlExtra} target="_blank" rel="noreferrer" className="btn rounded-lg py-2 text-xs text-center">✨ Extra</a>}
                      {urlPdf&&<a href={urlPdf} target="_blank" rel="noreferrer" className="btn rounded-lg py-2 text-xs text-center">📕 PDF Lição</a>}
                      {urlGravacao&&<a href={urlGravacao} target="_blank" rel="noreferrer" className="lesson-link-btn lesson-link-btn-gravacao col-span-2">🎥 Aulas Gravadas</a>}
                      {urlRelatorio&&<a href={urlRelatorio} target="_blank" rel="noreferrer" className="lesson-link-btn lesson-link-btn-relatorio col-span-2">📋 Relatório da Reunião</a>}
                      {isAdmin&&!hasAny&&<span className="text-xs muted col-span-2">Cadastre os links na Trilha (inclui Aulas Gravadas e Relatório da Reunião).</span>}
                    </div>}
                  </div>
                );
              })}
            </div>}
          </div>
        );
      })}
    </div>
  );
}

function RingChart({ label, value, max, pct, color, icon, onClick }) {
  const r = 32, circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <button className="glass rounded-2xl p-4 text-center w-full btn" onClick={onClick} style={{cursor:'pointer'}}>
      <div style={{position:'relative',width:80,height:80,margin:'0 auto 8px'}}>
        <svg width={80} height={80} style={{transform:'rotate(-90deg)'}}>
          <circle cx={40} cy={40} r={r} fill="none" stroke="var(--badge)" strokeWidth={6}/>
          <circle cx={40} cy={40} r={r} fill="none" stroke={color} strokeWidth={6}
            strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="round" style={{transition:'stroke-dashoffset 600ms ease'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontSize:16,fontWeight:800,color:'var(--font)'}}>{pct}%</span>
        </div>
      </div>
      <div className="font-semibold text-xs" style={{color:'var(--font)'}}>{label}</div>
      <div className="muted text-xs mt-0.5">{value} de {max}</div>
    </button>
  );
}

function StatCard({ icon, iconColor, label, value, onClick }) {
  return (
    <button className="glass rounded-2xl p-4 text-left w-full btn" onClick={onClick} style={{cursor:'pointer'}}>
      <div style={{
        width:36,height:36,borderRadius:10,display:'flex',alignItems:'center',
        justifyContent:'center',background:iconColor+'22',marginBottom:8
      }}>
        <Icon name={icon} size={18} style={{color:iconColor}}/>
      </div>
      <div style={{fontSize:22,fontWeight:800,color:'var(--font)'}}>{value}</div>
      <div className="muted text-xs mt-0.5">{label}</div>
    </button>
  );
}

// ── MODIFICAÇÃO 2: OverviewSection ─────────────────────────────────────────
function OverviewSection({ uid, profile, trilhaData, financeiro, onGoToTab, hideGreeting=false }) {
  const courses = useCourses();
  const course = useMemo(() => getCourseById(profile?.contrato), [courses, profile?.contrato]);
  const books = useMemo(() => mergeBooks(trilhaData, course), [trilhaData, course]);

  const licoesConcluidas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (i.status === "concluida" || i.status === "realizada") count++;
    }));
    return count;
  }, [books]);

  const totalLicoes = getTotalLicoes(course) || books.reduce((s,b)=>s+b.items.length,0) || 1;

  const tarefasFeitas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (!i.isReview && i.tarefaFeita) count++;
    }));
    return count;
  }, [books]);

  const [diarioStats, setDiarioStats] = useState({ realizadas: 0, paraRepor: 0 });
  useEffect(() => {
    return db.collection("students").doc(uid).collection("diario")
      .onSnapshot(snap => {
        const stats = computeDiarioStats(snap.docs.map(d => d.data()));
        setDiarioStats({ realizadas: stats.realizadas, paraRepor: stats.paraRepor });
      });
  }, [uid]);

  const progressGeral = Math.round((licoesConcluidas / totalLicoes) * 100);
  const progressTarefas = licoesConcluidas > 0
    ? Math.round((tarefasFeitas / licoesConcluidas) * 100)
    : 0;

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
  const hoje = getTodayPT();
  const hojeDisplay = hoje.charAt(0).toUpperCase() + hoje.slice(1);

  return (
    <div className="space-y-4">
      {/* Saudação só para o aluno (admin não vê) */}
      {!hideGreeting&&(
        <div className="glass rounded-2xl p-5">
          <p className="muted text-sm">{saudacao} 👋</p>
          <h2 className="text-2xl font-extrabold mt-1" style={{fontFamily:"'Sora',sans-serif"}}>
            {getFirstName(profile?.name)}
          </h2>
          {getFullName(profile?.name)!==getFirstName(profile?.name)&&(
            <p className="muted text-sm mt-1" style={{wordBreak:"break-word"}}>{getFullName(profile?.name)}</p>
          )}
          <p className="muted text-xs mt-1">{hojeDisplay}</p>
        </div>
      )}

      {/* Ring charts de progresso */}
      <div className="grid grid-cols-2 gap-3">
        <RingChart
          label="Lições Concluídas"
          value={licoesConcluidas}
          max={totalLicoes}
          pct={progressGeral}
          color="#1e8fa8"
          icon="check-circle"
          onClick={() => onGoToTab("trilha")}
        />
        <RingChart
          label="Tarefas Entregues"
          value={tarefasFeitas}
          max={licoesConcluidas || 1}
          pct={progressTarefas}
          color="#7c5cbf"
          icon="file-check"
          onClick={() => onGoToTab("trilha")}
        />
      </div>

      {/* Cards de estatística */}
      <div className="grid grid-cols-2 gap-3">
        <StatCard
          icon="calendar-check"
          iconColor="#22c55e"
          label="Aulas Realizadas"
          value={diarioStats.realizadas}
          onClick={() => onGoToTab("diario")}
        />
        <StatCard
          icon="user-x"
          iconColor="#f59e0b"
          label="Reposições a Fazer"
          value={diarioStats.paraRepor}
          onClick={() => onGoToTab("diario")}
        />
      </div>

      {/* Banner Financeiro no Overview */}
      {financeiro && (
        <div style={{marginTop:4}}>
          <FinanceiroStrip financeiro={financeiro} onGoToFinanceiro={()=>onGoToTab("financeiro")}/>
        </div>
      )}

      {/* Barra de progresso geral */}
      <div className="glass rounded-2xl p-5">
        <div className="flex justify-between text-sm mb-2">
          <span className="font-semibold">Progresso Geral</span>
          <span className="muted">{licoesConcluidas} / {totalLicoes} lições</span>
        </div>
        <div style={{height:8,borderRadius:99,background:'var(--badge)',overflow:'hidden'}}>
          <div style={{
            height:'100%',
            borderRadius:99,
            width: progressGeral + '%',
            background:'linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))',
            transition:'width 600ms ease'
          }}/>
        </div>
        <p className="muted text-xs mt-2 text-right">{progressGeral}% concluído</p>
      </div>

      {/* Atalhos rápidos */}
      <div className="glass rounded-2xl p-5">
        <h3 className="font-bold mb-3 flex items-center gap-2">
          <Icon name="zap" size={15} style={{color:'rgba(44,122,142,1)'}}/>
          Acesso Rápido
        </h3>
        <div className="grid grid-cols-2 gap-2">
          {[
            { id:"trilha",     icon:"map",        label:"Trilha",     color:"#1e8fa8" },
            { id:"materiais",  icon:"file-text",  label:"Materiais",  color:"#5b9be8" },
            { id:"diario",     icon:"book-open",  label:"Diário",     color:"#7c5cbf" },
            { id:"financeiro", icon:"dollar-sign",label:"Financeiro", color:"#22c55e" },
          ].map(a => (
            <button
              key={a.id}
              className="btn rounded-2xl p-4 text-left"
              onClick={() => onGoToTab(a.id)}
              style={{display:'flex',flexDirection:'column'}}
            >
              <Icon name={a.icon} size={20} style={{color:a.color,marginBottom:6}}/>
              <div className="font-semibold text-sm">{a.label}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function iviWelcome(mode){
  if(mode==="visitor")return "Olá! Sou a **iVi** 👋 Assistente virtual da Fluency Studio. Posso explicar nossos cursos, o método PEH 5.0, como se matricular ou agendar aula demonstrativa gratuita. Também tiro dúvidas gerais de inglês. Como posso ajudar?";
  if(mode==="admin")return "Olá, Victor! Sou a **iVi** — sua assistente no painel admin. Posso ajudar com cadastro de alunos, agenda, financeiro e uso do portal. O que precisa?";
  return "Olá! Sou a **iVi** 👋 Sua assistente no portal. Posso ensinar a usar o site, tirar dúvidas sobre trilha, financeiro, materiais e inglês. Quer um **tutorial rápido**? É só pedir!";
}

function iviQuickChips(mode){
  if(mode==="visitor")return["Como me matricular?","Aula demonstrativa","Quais os cursos?","Falar com Victor"];
  if(mode==="admin")return["Cadastros pendentes","Cadastrar aluno","Usar a agenda"];
  return["Tutorial do portal","Minha trilha","Financeiro","Falar com Victor"];
}

function iviRespond(question,mode){
  const q=question.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let best=null,bestScore=0;
  IVI_KB.forEach(entry=>{
    if(!entry.audience.includes(mode)&&!entry.audience.includes("all"))return;
    let score=0;
    entry.keys.forEach(k=>{
      const kn=k.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(q.includes(kn))score+=kn.length;
    });
    if(score>bestScore){bestScore=score;best=entry;}
  });
  if(best&&bestScore>0)return best.answer;
  if(/^(oi|olá|ola|hey|bom dia|boa tarde|boa noite|hi)$/i.test(q.trim()))return iviWelcome(mode);
  if(mode==="visitor")return `Boa pergunta! Para informações personalizadas sobre matrícula, valores e programas, o Victor atende pelo WhatsApp: ${WPP_SITE}. Posso ajudar com mais alguma coisa sobre a escola?`;
  if(mode==="student")return `Não tenho essa resposta específica — e não tenho acesso aos seus dados individuais (notas, valores, datas). Para isso, fale com o Victor: ${WPP_VICTOR}. Ou pergunte sobre **trilha**, **financeiro**, **materiais** ou peça o **tutorial do portal**!`;
  return "Entendi! Não tenho essa resposta específica ainda. Pergunte sobre **trilha**, **financeiro**, **materiais** ou peça o **tutorial do portal** — sei bastante sobre isso!";
}

function IVi({mode="student"}){
  const [open,setOpen]=useState(false);
  const [imgOk,setImgOk]=useState(true);
  const [messages,setMessages]=useState([{role:"assistant",content:iviWelcome(mode)}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const messagesEndRef=useRef(null);
  const chips=iviQuickChips(mode);

  useEffect(()=>{
    if(open&&messagesEndRef.current)messagesEndRef.current.scrollIntoView({behavior:"smooth"});
  },[messages,open]);

  useEffect(()=>{
    if(mode==="student"&&!localStorage.getItem("fs-ivi-hint")){
      localStorage.setItem("fs-ivi-hint","1");
    }
  },[mode]);

  function reply(text){
    setLoading(true);
    setTimeout(()=>{
      setMessages(prev=>[...prev,{role:"assistant",content:iviRespond(text,mode)}]);
      setLoading(false);
    },350+Math.random()*300);
  }

  function sendMessage(textOverride){
    const text=(textOverride||input).trim();
    if(!text||loading)return;
    setMessages(prev=>[...prev,{role:"user",content:text}]);
    setInput("");
    reply(text);
  }

  function handleKey(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
  }

  return(
    <>
      {open&&(
        <div className="ivictor-panel" style={{width:320,maxHeight:"70vh",display:"flex",flexDirection:"column"}}>
          <div className="ivictor-header">
            <div className="ivictor-avatar">
              {imgOk
                ?<img src={IVI_PHOTO} alt="iVi" className="w-full h-full object-cover" loading="lazy" decoding="async" onError={()=>setImgOk(false)}/>
                :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff"}}>iVi</div>
              }
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>iVi</div>
              <div style={{fontSize:11,color:"rgba(234,242,247,.75)"}}>Assistente · Fluency Studio</div>
            </div>
            <button className="btn btn-bar" style={{marginLeft:"auto",padding:"6px",borderRadius:8}} onClick={()=>setOpen(false)}>
              <Icon name="x" size={14}/>
            </button>
          </div>
          <div className="ivi-quick-chips">
            {chips.map(c=><button key={c} type="button" className="ivi-chip" onClick={()=>sendMessage(c)}>{c}</button>)}
          </div>
          <div className="ivictor-body" style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:8,minHeight:0}}>
            {messages.map((msg,i)=>(
              <div key={i} style={{display:"flex",justifyContent:msg.role==="user"?"flex-end":"flex-start"}}>
                <div style={{
                  maxWidth:"82%",padding:"9px 13px",fontSize:13,lineHeight:1.55,whiteSpace:"pre-wrap",
                  borderRadius:msg.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",
                  background:msg.role==="user"?"linear-gradient(135deg,#1e8fa8,#145f7a)":"rgba(30,143,168,.12)",
                  border:msg.role==="user"?"none":"1px solid rgba(30,143,168,.22)",
                  color:msg.role==="user"?"#fff":"var(--font)",
                }}>{msg.content}</div>
              </div>
            ))}
            {loading&&(
              <div style={{display:"flex",justifyContent:"flex-start"}}>
                <div style={{padding:"9px 16px",borderRadius:"12px 12px 12px 3px",background:"rgba(30,143,168,.12)",border:"1px solid rgba(30,143,168,.22)",display:"flex",gap:4}}>
                  {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"rgba(44,122,142,.7)",animation:`bounce 1.2s ease infinite ${i*0.2}s`}}/>)}
                </div>
              </div>
            )}
            <div ref={messagesEndRef}/>
          </div>
          <div className="ivictor-footer">
            <input className="input" style={{flex:1,borderRadius:10,padding:"8px 12px",fontSize:13}} placeholder="Pergunte à iVi..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey} disabled={loading}/>
            <button className="btn btn-primary" style={{padding:"8px 12px",borderRadius:10,flexShrink:0}} onClick={()=>sendMessage()} disabled={loading||!input.trim()}>
              <Icon name="send" size={14}/>
            </button>
          </div>
        </div>
      )}
      <button className="ivictor-btn" onClick={()=>setOpen(o=>!o)} title="iVi — Assistente">
        {imgOk
          ?<img src={IVI_PHOTO} alt="iVi" className="w-full h-full object-cover" loading="lazy" decoding="async" onError={()=>setImgOk(false)}/>
          :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:"#fff",fontFamily:"'Sora',sans-serif"}}>iVi</div>
        }
      </button>
    </>
  );
}

function StudentDetail({uid,isAdmin,onBack,initialTab}){
  const courses=useCourses();
  const [profile,setProfile]=useState(null);
  const [links,setLinks]=useState([]);
  const [trilhaData,setTrilhaData]=useState({});
  const [materiaisData,setMateriaisData]=useState({});
  const [financeiro,setFinanceiro]=useState(null);
  const [modulosOcultos,setModulosOcultos]=useState([]);
  const [studentSchedule,setStudentSchedule]=useState(null);
  // Estado inicial a partir da URL (refresh / deep link / botão voltar)
  const [activeTab,setActiveTab]=useState(()=>{
    if(isAdmin){
      const r=parsePortalRoute();
      if(r.role==="admin"&&r.view==="student"&&r.studentUid===uid&&r.tab)return r.tab;
      return initialTab||"overview";
    }
    return initialTab||"overview";
  });
  const [studentPage,setStudentPage]=useState(()=>{
    if(isAdmin)return"dashboard";
    const r=parsePortalRoute();
    if(r.role==="student"&&STUDENT_PAGES.includes(r.page))return r.page;
    return"dashboard";
  });
  const [focusLessonId,setFocusLessonId]=useState(()=>{
    if(isAdmin)return null;
    const r=parsePortalRoute();
    return(r.role==="student"&&r.page==="trilha"&&r.lessonId)?r.lessonId:null;
  });

  const navigateStudent=useCallback((page,lessonId,opts)=>{
    const p=STUDENT_PAGES.includes(page)?page:"dashboard";
    const lid=(p==="trilha"&&lessonId)?lessonId:null;
    setStudentPage(p);
    setFocusLessonId(lid);
    if(!isAdmin){
      portalGo({role:"student",page:p,view:null,studentUid:null,tab:null,lessonId:lid},opts||{});
    }
  },[isAdmin]);

  const goStudentBack=useCallback(()=>{
    // Mesmo comportamento do botão voltar do browser/SO: usa a pilha de histórico
    if(studentPage==="dashboard"&&!focusLessonId)return;
    try{
      if(window.history.state&&window.history.state.portal){
        history.back();
        return;
      }
    }catch(e){}
    // Fallback (refresh mid-navegação sem state): sobe na hierarquia
    if(studentPage==="trilha"&&focusLessonId){
      navigateStudent("trilha",null,{replace:true});
      return;
    }
    navigateStudent("dashboard",null,{replace:true});
  },[studentPage,focusLessonId,navigateStudent]);

  // Sync com botão voltar do browser / refresh / bfcache
  const onPortalRoute=useCallback((route)=>{
    if(isAdmin){
      if(route.role==="admin"&&route.view==="student"){
        if(route.studentUid&&route.studentUid!==uid){
          // Outro aluno no histórico — devolve ao admin shell
          if(onBack)onBack(route);
          return;
        }
        if(route.tab&&ADMIN_STUDENT_TABS.includes(route.tab))setActiveTab(route.tab);
      }else if(route.role==="admin"&&route.view!=="student"){
        if(onBack)onBack(route);
      }
      return;
    }
    // aluno
    if(route.role==="admin")return; // ignora rotas admin no portal do aluno
    const page=STUDENT_PAGES.includes(route.page)?route.page:"dashboard";
    setStudentPage(page);
    setFocusLessonId((page==="trilha"&&route.lessonId)?route.lessonId:null);
  },[isAdmin,uid,onBack]);
  usePortalRouteListener(onPortalRoute);

  // Garante URL base ao montar (aluno) e restaura se vazio
  useEffect(()=>{
    if(isAdmin){
      // Admin ficha do aluno: sincroniza URL se ainda não estiver nela
      const r=parsePortalRoute();
      if(!(r.role==="admin"&&r.view==="student"&&r.studentUid===uid)){
        portalGo({role:"admin",view:"student",studentUid:uid,tab:activeTab||initialTab||"overview",page:null,lessonId:null},{replace:true});
      }
      return;
    }
    const r=parsePortalRoute();
    if(!location.hash||location.hash==="#"||r.role==="admin"){
      portalEnsureBase({role:"student",page:studentPage||"dashboard",view:null,studentUid:null,tab:null,lessonId:focusLessonId});
    }else if(r.role==="student"||!r.role){
      // alinha sessionStorage
      persistPortalRoute({role:"student",page:studentPage,view:null,studentUid:null,tab:null,lessonId:focusLessonId});
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[uid,isAdmin]);

  const setActiveTabNav=useCallback((tab)=>{
    setActiveTab(tab);
    if(isAdmin){
      portalGo({role:"admin",view:"student",studentUid:uid,tab:tab||"overview",page:null,lessonId:null},{});
    }
  },[isAdmin,uid]);

  const [showFullProfile,setShowFullProfile]=useState(false);
  const [profileErr,setProfileErr]=useState("");
  const [fullStudent,setFullStudent]=useState(null);

  useEffect(()=>{
    if(!uid){setProfileErr("ID do aluno inválido.");return;}
    const ref=db.collection("students").doc(uid);
    let cancelled=false;
    const t=setTimeout(()=>{
      if(!cancelled)setProfileErr(prev=>prev||"Conexão lenta. Aguarde ou recarregue com Ctrl+Shift+R.");
    },12000);
    if(isAdmin){
      ref.get().then(doc=>{
        if(!doc.exists)ref.set({
          name:"Aluno",level:"A1",program:"Fluency Studio",coach:"Victor Gomes",
          profession:"",birthday:"",foto:"",email:"",phone:"",status:"lead",
          contrato:"foundation_general",
          links:[],trilha:{},materiais:{},financeiro:FINANCEIRO_DEFAULT,modulosOcultos:[],
        });
      }).catch(()=>{});
    }
    const unsub=ref.onSnapshot(doc=>{
      if(cancelled)return;
      if(doc.exists){
        const n=normalizeStudent(uid,doc.data());
        setFullStudent(n);
        setProfile({
          uid:n.uid,name:n.name,level:n.level,program:n.program,coach:n.coach,
          profession:n.profession,birthday:n.birthday,foto:n.foto,email:n.email,phone:n.phone,status:n.status,
          contrato:n.contrato||"",
        });
        setLinks(n.links);
        setTrilhaData(n.trilha);
        setMateriaisData(n.materiais);
        setFinanceiro(n.financeiro);
        setModulosOcultos(n.modulosOcultos);
        setStudentSchedule({
          dataInicio:n.dataInicio||"",diasAulas:n.diasAulas||[],horarioAulas:n.horarioAulas||"",
          calendarioCompleto:n.calendarioCompleto||[],calendarioResumo:n.calendarioResumo||null,
          program:n.program||"",licaoInicio:n.licaoInicio||1,contrato:n.contrato||"",
        });
        setProfileErr("");
      }else{
        if(isAdmin){
          setProfile(null);
          setFullStudent(null);
          setProfileErr("Cadastro removido ou não encontrado.");
          if(onBack)setTimeout(()=>onBack(),400);
        }else{
          setProfileErr("Seu perfil ainda não foi encontrado. Se você já é aluno, fale com o Victor no WhatsApp para vincular sua conta.");
        }
      }
    },err=>{
      console.error("StudentDetail snapshot:",err);
      if(!cancelled)setProfileErr("Erro ao carregar perfil. Recarregue a página ou fale com o professor.");
    });
    return()=>{cancelled=true;clearTimeout(t);unsub();};
  },[uid,isAdmin,onBack]);

  const course=useMemo(()=>getCourseById(profile?.contrato),[courses,profile?.contrato]);
  const modMeta=useMemo(()=>buildModuleMeta(course),[course]);
  const books=useMemo(()=>mergeBooks(trilhaData,course),[trilhaData,course]);

  const currentModMeta=modMeta.find(m=>m.id===currentMod)||modMeta[0];
  function calcAge(bday){if(!bday)return null;const[y,m,d]=bday.split("-").map(Number);const today=new Date();let age=today.getFullYear()-y;if(today.getMonth()+1<m||(today.getMonth()+1===m&&today.getDate()<d))age--;return age;}
  if(profileErr&&!profile)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm" style={{color:"#f0a0a8"}}>{profileErr}</p>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 mt-4 text-sm font-semibold" onClick={()=>window.location.reload()}>Recarregar</button>
      </div>
    </div>
  );
  if(!profile)return <LoadingScreen/>;
  const age=calcAge(profile.birthday);
  const courseName=getCourseLabel(profile.contrato);

  const adminTabs=[
    {id:"overview",   label:"Início",     icon:"home"},
    {id:"trilha",     label:"Trilha",     icon:"map"},
    {id:"materiais",  label:"Materiais",  icon:"file-text"},
    {id:"diario",     label:"Diário",     icon:"book-open"},
    {id:"financeiro", label:"Financeiro", icon:"dollar-sign"},
    {id:"recursos",   label:"Recursos",   icon:"link"},
  ];

  const pageTitles={trilha:"Trilha",materiais:"Materiais",diario:"Diário",calendario:"Calendário",contato:"Contato",agendamento:"Agendamento",financeiro:"Financeiro"};

  function renderStudentPage(){
    if(studentPage==="dashboard")return <StudentDashboard uid={uid} profile={profile} trilhaData={trilhaData} financeiro={financeiro} onNavigate={navigateStudent} modulosOcultos={modulosOcultos}/>;

        <div style={{background:"#1E293B",color:"#CBD5E1",padding:"10px 16px",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:10,justifyContent:"center"}}>
          <span className="role-pill role-pill-admin">Admin</span>
          <span>Você está na visão de ficha do aluno — não é o portal do estudante</span>
        </div>
      )}
      {isAdmin&&showFullProfile&&fullStudent&&(
        <ModalEdicao
          student={fullStudent}
          onClose={()=>setShowFullProfile(false)}
          onSaved={()=>setShowFullProfile(false)}
        />
      )}

      <main className={"max-w-3xl mx-auto "+(isAdmin?"px-4 pt-6":"student-dash-wrap")}>
        {!isAdmin&&(
          <div style={{maxWidth:480,margin:"0 auto 12px",padding:"0 4px"}}>
            <span className="role-pill role-pill-student">Portal do aluno</span>
          </div>

        {isAdmin?(
          <>
            <div className="glass rounded-2xl p-5 mb-5">
              <div className="flex items-start gap-4 flex-wrap">
                {profile.foto
                  ?<img src={profile.foto} alt="" style={{width:64,height:64,borderRadius:"50%",objectFit:"cover",border:"2.5px solid var(--divider)",flexShrink:0}} onError={e=>{e.target.style.display="none";}}/>
                  :<div style={{width:64,height:64,borderRadius:"50%",background:"var(--badge)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"2px solid var(--divider)"}}><Icon name="user" size={28}/></div>

                  <div className="sd-hello" style={{marginBottom:2}}>Visão do aluno</div>
                  <h1 className="text-2xl font-extrabold tracking-tight" style={{fontFamily:"'Sora',sans-serif",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--font,#1E1E1E)",lineHeight:1.25}} title="Nome completo só no cadastro (Perfil completo)">
                    {getFirstName(profile.name)}

                  <p style={{fontSize:11,color:"#475569",marginTop:4}}>Nome completo: abra <strong>Perfil completo</strong></p>

                    <div><span className="meta-label">Curso</span><span className="meta-val">{courseName||"—"}</span></div>

            </div>
            {activeTab==="overview"&&<OverviewSection uid={uid} profile={profile} trilhaData={trilhaData} financeiro={financeiro} onGoToTab={setActiveTabNav} hideGreeting/>}
            {activeTab==="financeiro"&&<FinanceiroSection uid={uid} isAdmin={true} financeiro={financeiro||FINANCEIRO_DEFAULT}/>}
            {activeTab==="trilha"&&<TrilhaSection uid={uid} isAdmin={true} contrato={profile.contrato}/>}
            {activeTab==="materiais"&&<MateriaisSection uid={uid} isAdmin={true} trilhaData={trilhaData} materiaisData={materiaisData} modulosOcultos={modulosOcultos} contrato={profile.contrato}/>}
            {activeTab==="recursos"&&<RecursosSection uid={uid} isAdmin={true} links={links}/>}
            {activeTab==="diario"&&<DiarioSection uid={uid} isAdmin={true} contrato={profile.contrato}/>}
          </>
        ):renderStudentPage()}
      </main>
      {!isAdmin&&<WhatsAppFloat/>}
      {!isAdmin&&<IVi mode="student"/>}
    </div>
  );
}

function StatusBadge({status}){
  const map={
    ativo:    {cls:"status-pill-ativo",    label:"Ativo"},
    lead:     {cls:"status-pill-lead",     label:"Lead"},
    interessado:{cls:"status-pill-interesse",label:"Interessado"},
    trancado: {cls:"status-pill-trancado", label:"Trancado"},
    evadido:  {cls:"status-pill-evadido",  label:"Evadido"},
    pendente_aprovacao:{cls:"status-pill-interesse",label:"Pendente"},
    rejeitado:{cls:"status-pill-evadido",label:"Rejeitado"},
  };
  const s=map[status]||{cls:"status-pill-inactive",label:status||"—"};
  return <span className={"status-pill "+s.cls} style={{fontSize:10,padding:"2px 8px"}}>{s.label}</span>;
}

  dataNasc:"",estadoCivil:"",profissao:"",nacionalidade:"",endereco:"",
  foto:"",dataCadastro:new Date().toISOString().slice(0,10),
  contrato:"foundation_general",duracao:"",
  diasAulas:[],horarioAulas:"",
  valorCheio:"",descontos:"",valorFinal:"",diaVencimento:"",
  dataInicio:"",licaoInicio:"1",numParcelas:18,

};

  idadeFaixa:"",
  estadoCivilT:"",formacao:"",
  ocupacao:"",areaInteresse:"",
  estudouIngles:"",ondeComo:[],qualidadeMaterial:0,qualidadeProfessores:0,qualidadeMetodologia:0,

function ModalCadastro({onClose,onSaved}){
  const courses=useCourses();
  const contratosAtivos=useMemo(()=>getActiveContratos(),[courses]);
  const [tab,setTab]=useState(0);
  const [dados,setDados]=useState({...BLANK_DADOS,contrato:(getActiveContratos()[0]&&getActiveContratos()[0].v)||"foundation_general"});
  const courseSel=useMemo(()=>getCourseById(dados.contrato),[courses,dados.contrato]);
  const totalLicoesCurso=getTotalLicoes(courseSel)||150;
  const [triagem,setTriagem]=useState(BLANK_TRIAGEM);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const [senha,setSenha]=useState("");
  const [fotoFile,setFotoFile]=useState(null);
  const [fotoPreview,setFotoPreview]=useState("");

  function setD(k,v){setDados(p=>({...p,[k]:v}));}
  function setT(k,v){setTriagem(p=>({...p,[k]:v}));}
  function handleFotoSelect(file){
    if(fotoPreview&&fotoPreview.indexOf("blob:")===0)try{URL.revokeObjectURL(fotoPreview);}catch(e){}
    setFotoFile(file);
    setFotoPreview(URL.createObjectURL(file));
    setErr("");
  }
  function handleFotoClear(){
    if(fotoPreview&&fotoPreview.indexOf("blob:")===0)try{URL.revokeObjectURL(fotoPreview);}catch(e){}
    setFotoFile(null);
    setFotoPreview("");
    setD("foto","");
  }

  function toggleDia(d){setDados(p=>({...p,diasAulas:p.diasAulas.includes(d)?p.diasAulas.filter(x=>x!==d):[...p.diasAulas,d]}));}

  function TriagemOption({label,field,value}){
    const sel=triagem[field]===value;
    return(
      <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,value)}>
        <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
        {label}
      </div>
    );
  }
  function TriagemMulti({label,field,value}){
    const arr=triagem[field]||[];const sel=arr.includes(value);
    function toggle(){setT(field,sel?arr.filter(x=>x!==value):[...arr,value]);}
    return(
      <div className={"triagem-option"+(sel?" selected":"")} onClick={toggle}>
        <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
        {label}
      </div>
    );
  }
  function Rating({field,label}){
    return(
      <div style={{marginBottom:10}}>
        <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:4}}>{label}</div>
        <div className="rating-row">
          {[1,2,3,4,5].map(n=>(
            <button key={n} className={"rating-btn"+(triagem[field]===n?" selected":"")} onClick={()=>setT(field,n)}>{n}</button>
          ))}
        </div>
      </div>
    );
  }

  async function handleSave(){
    if(!dados.nome.trim()){setErr("Nome completo é obrigatório.");return;}
    if(!dados.email.trim()){setErr("Email é obrigatório.");return;}
    const email=dados.email.trim().toLowerCase();
    const pass=(senha||"").trim();
    if(pass&&pass.length<6){setErr("A senha do portal deve ter pelo menos 6 caracteres.");return;}
    setSaving(true);setErr("");
    try{
      let uid=null;
      if(pass){
        const secondary=getSecondaryAuth();
        try{
          const cred=await secondary.createUserWithEmailAndPassword(email,pass);
          uid=cred.user.uid;
        }catch(authErr){
          if(authErr.code==="auth/email-already-in-use"){
            setErr("Este email já tem login no Firebase. Cadastre sem senha e vincule depois, ou use outro email.");
            setSaving(false);return;
          }
          throw authErr;
        }finally{
          try{await secondary.signOut();}catch(e){}
        }
      }
      const docRef=uid?db.collection("students").doc(uid):db.collection("students").doc();
      const studentUid=docRef.id;
      const programName=getCourseLabel(dados.contrato)||"Fluency Foundation General";
      await docRef.set({
        name:dados.nome.trim(),
        email,
        phone:dados.telefone.trim()||dados.whatsapp.trim(),
        telefone2:dados.telefone2.trim(),
        cpf:dados.cpf.trim(),rg:dados.rg.trim(),
        dataNasc:dados.dataNasc,
        estadoCivil:dados.estadoCivil,
        profissao:dados.profissao.trim(),
        nacionalidade:dados.nacionalidade.trim(),
        endereco:dados.endereco.trim(),
        foto:(dados.foto||"").trim(),
        dataCadastro:dados.dataCadastro,
        contrato:dados.contrato,
        duracao:dados.duracao.trim(),
        diasAulas:dados.diasAulas,
        horarioAulas:dados.horarioAulas.trim(),
        valorCheio:parseFloat(dados.valorCheio)||0,
        descontos:parseFloat(dados.descontos)||0,
        valorFinal:parseFloat(dados.valorFinal)||0,
        diaVencimento:parseInt(dados.diaVencimento)||1,
        dataInicio:dados.dataInicio||"",
        licaoInicio:parseInt(dados.licaoInicio,10)||1,
        status:dados.status||"lead",
        triagem,
        level:"A1",
        program:programName,
        coach:"Victor Gomes",
        birthday:dados.dataNasc||"",
        profession:dados.profissao.trim(),
        links:[{id:1,label:"Materiais (Drive)",url:"https://drive.google.com/"},{id:2,label:"Tarefas (Classroom)",url:"https://classroom.google.com/"}],
        trilha:{},financeiro:{...FINANCEIRO_DEFAULT,parcelas:[]},modulosOcultos:[],
        authUid:uid||null,
        hasPortalLogin:!!uid,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
      if(fotoFile){
        try{
          const fotoUrl=await uploadStudentFoto(fotoFile,studentUid);
          await docRef.update({foto:fotoUrl});
          setD("foto",fotoUrl);
        }catch(fotoErr){
          console.error("Upload foto cadastro:",fotoErr);
          // Cadastro já existe — não bloquear; avisar e fechar se o resto ok
          setErr("Aluno salvo, mas a foto falhou: "+(fotoErr.message||fotoErr.code||"erro ao processar imagem"));
          setSaving(false);
          return;
        }
      }
      if(uid){
        await db.collection("users").doc(uid).set({
          name:dados.nome.trim(),email,role:"student",studentId:studentUid,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        },{merge:true});
      }
      onSaved();onClose();
    }catch(e){
      console.error("ModalCadastro save:",e);
      setErr("Erro ao salvar: "+(e.message||e.code||"desconhecido"));
      setSaving(false);
    }
  }

  const tabLabels=["Dados Pessoais","Perfil do Aluno"];
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box">
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="user-plus" size={18}/>
            <div>
              <div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Cadastrar Aluno</div>
              <div style={{fontSize:11,opacity:.75}}>Fluency Studio · Novo Cadastro</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff",display:"flex",alignItems:"center"}}>
            <Icon name="x" size={16}/>
          </button>
        </div>
        <div className="modal-tab-bar">
          {tabLabels.map((l,i)=>(
            <button key={i} className={"modal-tab"+(tab===i?" modal-tab-active":"")} onClick={()=>setTab(i)}>{l}</button>
          ))}
        </div>

        <div className="modal-body">
          {/* ─── ABA 0: DADOS PESSOAIS ─── */}
          {tab===0&&(
            <div>
              <div className="form-section-title">Identificação</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1",marginBottom:4}}>
                  <FotoUploadField
                    previewUrl={fotoPreview||dados.foto||""}
                    onSelectFile={handleFotoSelect}
                    onClear={handleFotoClear}
                    disabled={saving}
                    busy={saving&&!!fotoFile}
                  />
                </div>
                <div style={{gridColumn:"1/-1"}}>
                  <label className="form-label">Nome Completo *</label>
                  <input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Nome completo do aluno" value={dados.nome} onChange={e=>setD("nome",e.target.value)}/>
                </div>
                <div><label className="form-label">Nacionalidade</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Brasileira" value={dados.nacionalidade} onChange={e=>setD("nacionalidade",e.target.value)}/></div>
                <div><label className="form-label">Estado Civil</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.estadoCivil} onChange={e=>setD("estadoCivil",e.target.value)}>
                    <option value="">Selecione...</option>
                    {["Solteiro(a)","Casado(a)","Divorciado(a)","Viúvo(a)","União Estável","Outro"].map(o=><option key={o}>{o}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Profissão</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Ex: Médica, Engenheiro..." value={dados.profissao} onChange={e=>setD("profissao",e.target.value)}/></div>

                <div><label className="form-label">CPF</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="000.000.000-00" value={dados.cpf} onChange={e=>setD("cpf",e.target.value)}/></div>
                <div><label className="form-label">RG</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="00.000.000-0" value={dados.rg} onChange={e=>setD("rg",e.target.value)}/></div>
              </div>

              <div className="form-section-title" style={{marginTop:20}}>Contato & Acesso ao Portal</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                  <label className="form-label">Email *</label>

                  <label className="form-label">Senha do portal (opcional)</label>
                  <input type="text" className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Mín. 6 caracteres — cria login Firebase" value={senha} onChange={e=>setSenha(e.target.value)} autoComplete="new-password"/>

                </div>
                <div><label className="form-label">Telefone / WhatsApp</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="+55 11 9..." value={dados.telefone} onChange={e=>setD("telefone",e.target.value)}/></div>
                <div><label className="form-label">Telefone 2</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="+55 11 9..." value={dados.telefone2} onChange={e=>setD("telefone2",e.target.value)}/></div>
                <div style={{gridColumn:"1/-1"}}>
                  <label className="form-label">Endereço</label>
                  <input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Rua, número, bairro, cidade — UF" value={dados.endereco} onChange={e=>setD("endereco",e.target.value)}/>

              </div>

              <div className="form-section-title" style={{marginTop:20}}>Contrato / Curso</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Tipo de Contrato (Curso)</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.contrato} onChange={e=>setD("contrato",e.target.value)}>

              <div className="form-section-title" style={{marginTop:20}}>Status</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>

                  const cls={lead:"status-pill-lead",interessado:"status-pill-interesse",ativo:"status-pill-ativo",trancado:"status-pill-trancado",evadido:"status-pill-evadido"}[s]||"status-pill-inactive";
