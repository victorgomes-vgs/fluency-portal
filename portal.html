<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyARQfoifySDycd37gXw4sofwPu7tHkiip0",
      authDomain: "fluency-studio-portal.firebaseapp.com",
      projectId: "fluency-studio-portal",
      storageBucket: "fluency-studio-portal.firebasestorage.app",
      messagingSenderId: "568224359300",
      appId: "1:568224359300:web:6f4e283315deb93224b3d1",
    });

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;margin:0;padding:0;}

    /* ── TEMA: Dark (padrão) ── */
    :root, [data-theme="dark"] {
      --bg: linear-gradient(160deg,#05080f 0%,#080e1c 35%,#0b1328 60%,#0d1a35 80%,#0a1528 100%);
      --font: #dde6f0;
      --font-muted: rgba(180,200,220,.55);
      --card: #1c2438;
      --lesson: #1a2236;
      --detail: #111927;
      --header: rgba(10,18,38,.94);
      --tabbar: rgba(255,255,255,.04);
      --badge: rgba(255,255,255,.07);
      --btn: rgba(255,255,255,.07);
      --done: rgba(30,160,110,.28);
      --done-border: rgba(30,160,110,.55);
      --done-text: #60daa8;
      --divider: rgba(255,255,255,.08);
      --input-bg: rgba(0,0,0,.25);
      --input-border: rgba(255,255,255,.13);
      --shadow: 0 4px 24px rgba(0,0,0,.35);
    }

    [data-theme="light"] {
      --bg: #f4f6f9;
      --font: #0f1923;
      --font-muted: rgba(20,40,60,.55);
      --card: #ffffff;
      --lesson: #f8fafc;
      --detail: #f0f4f8;
      --header: rgba(255,255,255,.95);
      --tabbar: rgba(0,0,0,.04);
      --badge: rgba(0,0,0,.06);
      --btn: rgba(0,0,0,.05);
      --done: rgba(20,140,90,.12);
      --done-border: rgba(20,140,90,.40);
      --done-text: #0a5c38;
      --divider: rgba(0,0,0,.08);
      --input-bg: rgba(0,0,0,.04);
      --input-border: rgba(0,0,0,.15);
      --shadow: 0 2px 12px rgba(0,0,0,.10);
    }

    /* Transição suave entre temas */
    *, *::before, *::after {
      transition: background-color 280ms ease, border-color 280ms ease, color 280ms ease;
    }
    .animate-spin { transition: none !important; }

    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--font);min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 900px 600px at 10% 0%,rgba(32,120,150,.07),transparent 65%),
                 radial-gradient(ellipse 700px 500px at 90% 95%,rgba(20,60,110,.09),transparent 65%);}
    [data-theme="light"] body::before{display:none;}
    #root{position:relative;z-index:1;}

    /* ── CARDS ── */
    .glass{background:var(--card);border:1px solid var(--divider);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
    .muted{color:var(--font-muted);}
    .chip{background:var(--badge);border:1px solid var(--divider);}
    .btn{border:1px solid var(--divider);background:var(--btn);transition:transform .08s,background .12s,border-color 280ms ease,color 280ms ease;cursor:pointer;color:var(--font);}
    .btn:hover{filter:brightness(1.12);}
    .btn:active{transform:translateY(1px);}
    .btn-primary{border:1px solid rgba(44,160,180,.55);background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;}
    .btn-primary:hover{filter:brightness(1.10);}
    .btn-danger{border:1px solid rgba(200,60,80,.35);background:rgba(200,60,80,.10);color:#e07080;}
    .btn-danger:hover{background:rgba(200,60,80,.18);}

    /* ── INPUTS ── */
    .input{background:var(--input-bg);border:1px solid var(--input-border);outline:none;color:var(--font);font-family:'Outfit',sans-serif;}
    .input:focus{border-color:rgba(44,160,180,.75);box-shadow:0 0 0 3px rgba(44,160,180,.14);}
    .input-light{background:var(--input-bg);border:1px solid var(--input-border);outline:none;color:var(--font);border-radius:8px;padding:5px 10px;font-size:13px;width:100%;font-family:'Outfit',sans-serif;}
    .input-light:focus{border-color:rgba(44,160,180,.6);box-shadow:0 0 0 3px rgba(44,160,180,.12);}
    .err-box{background:rgba(200,60,70,.12);border:1px solid rgba(200,60,70,.38);border-radius:12px;padding:10px 14px;font-size:13px;color:#f0a0a8;}

    /* ── TAB BAR ── */
    .tab-bar{display:flex;background:var(--tabbar);border:1px solid var(--divider);border-radius:14px;padding:4px;gap:3px;overflow-x:auto;}
    .tab-btn{flex:1;padding:7px 8px;min-height:48px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;border:none;background:transparent;color:var(--font-muted);transition:all .18s;white-space:nowrap;min-width:fit-content;display:flex;align-items:center;justify-content:center;}
    .tab-btn:hover{color:var(--font);background:rgba(255,255,255,.05);}
    .tab-btn-active{background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;border:1px solid rgba(44,160,180,.40)!important;box-shadow:0 2px 14px rgba(30,143,168,.25);}

    /* ── BOOK ACCORDIONS ── */
    .book-m1{background:linear-gradient(135deg,rgba(26,138,158,.18),rgba(13,82,98,.12));border:1px solid rgba(26,138,158,.32);color:#b8e8f2;}
    .book-m1:hover{background:linear-gradient(135deg,rgba(26,138,158,.26),rgba(13,82,98,.18));}
    .book-m2{background:linear-gradient(135deg,rgba(42,100,190,.18),rgba(26,58,140,.12));border:1px solid rgba(42,100,190,.32);color:#b0ccf8;}
    .book-m2:hover{background:linear-gradient(135deg,rgba(42,100,190,.26),rgba(26,58,140,.18));}
    .book-m3{background:linear-gradient(135deg,rgba(26,154,122,.18),rgba(13,90,72,.12));border:1px solid rgba(26,154,122,.32);color:#a0e8cc;}
    .book-m3:hover{background:linear-gradient(135deg,rgba(26,154,122,.26),rgba(13,90,72,.18));}
    .book-m4{background:linear-gradient(135deg,rgba(110,84,200,.18),rgba(52,26,140,.12));border:1px solid rgba(110,84,200,.32);color:#c8b8f8;}
    .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.26),rgba(52,26,140,.18));}
    .book-m5{background:linear-gradient(135deg,rgba(42,130,190,.18),rgba(26,80,140,.12));border:1px solid rgba(42,130,190,.32);color:#a8d4f8;}
    .book-m5:hover{background:linear-gradient(135deg,rgba(42,130,190,.26),rgba(26,80,140,.18));}
    .book-m6{background:linear-gradient(135deg,rgba(70,100,160,.18),rgba(30,50,100,.12));border:1px solid rgba(70,100,160,.32);color:#b0c4e8;}
    .book-m6:hover{background:linear-gradient(135deg,rgba(70,100,160,.26),rgba(30,50,100,.18));}
    /* Light mode: book accordion text deve ser escuro */
    [data-theme="light"] .book-m1{color:#0d5260;background:linear-gradient(135deg,rgba(26,138,158,.10),rgba(13,82,98,.06));border-color:rgba(26,138,158,.28);}
    [data-theme="light"] .book-m1:hover{background:linear-gradient(135deg,rgba(26,138,158,.16),rgba(13,82,98,.10));}
    [data-theme="light"] .book-m2{color:#1a3a80;background:linear-gradient(135deg,rgba(42,100,190,.10),rgba(26,58,140,.06));border-color:rgba(42,100,190,.28);}
    [data-theme="light"] .book-m2:hover{background:linear-gradient(135deg,rgba(42,100,190,.16),rgba(26,58,140,.10));}
    [data-theme="light"] .book-m3{color:#0d5c3a;background:linear-gradient(135deg,rgba(26,154,122,.10),rgba(13,90,72,.06));border-color:rgba(26,154,122,.28);}
    [data-theme="light"] .book-m3:hover{background:linear-gradient(135deg,rgba(26,154,122,.16),rgba(13,90,72,.10));}
    [data-theme="light"] .book-m4{color:#3d1a80;background:linear-gradient(135deg,rgba(110,84,200,.10),rgba(52,26,140,.06));border-color:rgba(110,84,200,.28);}
    [data-theme="light"] .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.16),rgba(52,26,140,.10));}
    [data-theme="light"] .book-m5{color:#1a4a7a;background:linear-gradient(135deg,rgba(42,130,190,.10),rgba(26,80,140,.06));border-color:rgba(42,130,190,.28);}
    [data-theme="light"] .book-m5:hover{background:linear-gradient(135deg,rgba(42,130,190,.16),rgba(26,80,140,.10));}
    [data-theme="light"] .book-m6{color:#1e3060;background:linear-gradient(135deg,rgba(70,100,160,.10),rgba(30,50,100,.06));border-color:rgba(70,100,160,.28);}
    [data-theme="light"] .book-m6:hover{background:linear-gradient(135deg,rgba(70,100,160,.16),rgba(30,50,100,.10));}

    /* ── LESSON CARDS ── */
    .lesson-card{background:var(--lesson);border-bottom:1px solid var(--divider);color:var(--font);transition:background 400ms ease,border-color 400ms ease;}
    .lesson-card:hover{filter:brightness(1.08);}
    .lesson-card:last-child{border-bottom:none;}
    .lesson-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;transition:background 400ms ease,border-color 400ms ease;}
    .review-card{background:rgba(30,130,155,.14);border-bottom:1px solid rgba(30,130,155,.20);color:var(--font);transition:background 400ms ease;}
    .review-card:hover{background:rgba(30,130,155,.22);}
    .review-card:last-child{border-bottom:none;}
    .review-card.done-card{background:var(--done)!important;border-left:3px solid var(--done-border)!important;color:var(--done-text)!important;}
    .lesson-detail{background:var(--detail);border-top:1px solid var(--divider);padding:14px 18px 16px;}
    .detail-label{font-size:11px;font-weight:700;color:#5ab4cc;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
    [data-theme="light"] .detail-label{color:#2a7a8a;}
    .num-light{background:var(--badge);border:1px solid var(--input-border);color:var(--font);min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    .num-dark{background:rgba(30,143,168,.22);border:1px solid rgba(30,143,168,.42);color:#7de0f8;min-width:2.6rem;text-align:center;border-radius:9px;padding:5px 7px;font-weight:700;font-size:13px;flex-shrink:0;}
    [data-theme="light"] .num-dark{background:rgba(30,143,168,.12);border-color:rgba(30,143,168,.35);color:#0d5260;}
    .tag-input{background:rgba(30,143,168,.18);color:#7de0f8;border:1px solid rgba(30,143,168,.38);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    .tag-output{background:rgba(180,80,120,.16);color:#f0a0c0;border:1px solid rgba(180,80,120,.36);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;text-transform:uppercase;white-space:nowrap;}
    [data-theme="light"] .tag-input{background:rgba(30,143,168,.12);color:#1a6070;}
    [data-theme="light"] .tag-output{background:rgba(140,50,80,.10);color:#8a3050;}
    .chevron-icon{transition:transform .2s;}
    .chevron-open{transform:rotate(180deg);}

    /* ── STATUS BADGES ── */
    .ls-pendente{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#8ab0c8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-andamento{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.36);color:#f0cc60;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    .ls-concluida{background:rgba(30,160,110,.14);border:1px solid rgba(30,160,110,.38);color:#60daa8;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;}
    [data-theme="light"] .ls-pendente{color:#4a6a80;background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);}
    [data-theme="light"] .ls-andamento{color:#8a6000;background:rgba(220,160,30,.10);}
    [data-theme="light"] .ls-concluida{color:#0a5c38;background:rgba(20,140,90,.10);}
    .att-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .att-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .att-inactive:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .att-inactive{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .att-inactive:hover{background:rgba(0,0,0,.08);}
    .att-presente{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.45);color:#60daa8;}
    .att-ausente{background:rgba(200,60,80,.16);border-color:rgba(200,60,80,.42);color:#f0909a;}
    .att-desmarcada{background:rgba(140,140,140,.12);border-color:rgba(140,140,140,.28);color:#a0b0c0;}
    [data-theme="light"] .att-presente{color:#0a5c38;}
    [data-theme="light"] .att-ausente{color:#7a1020;}
    [data-theme="light"] .att-desmarcada{color:#4a5060;}
    .eval-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .eval-inactive{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .eval-inactive:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .eval-inactive{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .eval-inactive:hover{background:rgba(0,0,0,.08);}
    .eval-revisao{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.40);color:#f0cc60;}
    .eval-atingiu{background:rgba(42,120,200,.16);border-color:rgba(42,120,200,.40);color:#88c0f8;}
    .eval-superou{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.42);color:#60daa8;}
    [data-theme="light"] .eval-revisao{color:#7a5500;}
    [data-theme="light"] .eval-atingiu{color:#1a4a80;}
    [data-theme="light"] .eval-superou{color:#0a5c38;}
    .sbtn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;border:1px solid transparent;}
    .sbtn-off{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);color:#7a9aaa;}
    .sbtn-off:hover{background:rgba(255,255,255,.09);}
    [data-theme="light"] .sbtn-off{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#4a6070;}
    [data-theme="light"] .sbtn-off:hover{background:rgba(0,0,0,.08);}
    .sbtn-pendente{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#98bcd4;}
    [data-theme="light"] .sbtn-pendente{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.15);color:#3a5a70;}
    .sbtn-andamento{background:rgba(220,160,30,.16);border-color:rgba(220,160,30,.42);color:#f0cc60;}
    [data-theme="light"] .sbtn-andamento{color:#7a5500;}
    .sbtn-concluida{background:rgba(30,160,110,.18);border-color:rgba(30,160,110,.46);color:#60daa8;}
    [data-theme="light"] .sbtn-concluida{color:#0a5c38;}

    /* ── DIÁRIO ── */
    .ds-realizada{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .ds-andamento{background:rgba(30,143,168,.18);border:1px solid rgba(30,143,168,.36);color:#7de0f8;}
    .ds-ausente{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.38);color:#f0909a;}
    .ds-desmarcada{background:rgba(140,140,140,.11);border:1px solid rgba(140,140,140,.26);color:#a0b0c0;}
    .ds-rep-gratis{background:rgba(42,100,200,.16);border:1px solid rgba(42,100,200,.34);color:#88c0f8;}
    .ds-rep-paga{background:rgba(180,100,20,.16);border:1px solid rgba(180,100,20,.34);color:#f0b060;}
    .ds-cancelada{background:rgba(160,40,70,.16);border:1px solid rgba(160,40,70,.34);color:#f09090;}
    [data-theme="light"] .ds-realizada{color:#0a5c38;background:rgba(20,140,90,.10);}
    [data-theme="light"] .ds-andamento{color:#0d5260;background:rgba(30,143,168,.10);}
    [data-theme="light"] .ds-ausente{color:#7a1020;background:rgba(200,60,80,.08);}
    [data-theme="light"] .ds-desmarcada{color:#404050;background:rgba(140,140,140,.08);}
    [data-theme="light"] .ds-rep-gratis{color:#1a3a80;background:rgba(42,100,200,.08);}
    [data-theme="light"] .ds-rep-paga{color:#6a3800;background:rgba(180,100,20,.08);}
    [data-theme="light"] .ds-cancelada{color:#6a1030;background:rgba(160,40,70,.08);}
    .diario-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-block;}
    .num-aula{background:linear-gradient(135deg,#1e8fa8,#145f7a);border:1px solid rgba(30,143,168,.50);color:#fff;min-width:3rem;text-align:center;border-radius:9px;padding:5px 8px;font-weight:700;font-size:12px;flex-shrink:0;line-height:1.3;}
    .dtable-row{border-bottom:1px solid var(--divider);}
    .dtable-row:last-child{border-bottom:none;}
    .dtable-row:hover{background:rgba(255,255,255,.03);}
    [data-theme="light"] .dtable-row:hover{background:rgba(0,0,0,.02);}
    select.ds-select{background:var(--input-bg);border:1px solid var(--input-border);color:var(--font);border-radius:8px;padding:4px 8px;font-size:12px;outline:none;cursor:pointer;min-width:170px;font-family:'Outfit',sans-serif;}
    select.ds-select:focus{border-color:rgba(30,143,168,.7);}
    textarea.obs-input{background:var(--input-bg);border:1px solid var(--input-border);color:var(--font);border-radius:8px;padding:5px 10px;font-size:12px;outline:none;resize:vertical;min-height:36px;width:100%;font-family:'Outfit',sans-serif;}
    textarea.obs-input:focus{border-color:rgba(30,143,168,.7);}

    /* ── FINANCEIRO ── */
    .fin-badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block;}
    .fin-paga{background:rgba(30,160,110,.18);border:1px solid rgba(30,160,110,.40);color:#60daa8;}
    .fin-avencer{background:rgba(220,160,30,.14);border:1px solid rgba(220,160,30,.38);color:#f0cc60;}
    .fin-vencida{background:rgba(200,60,80,.16);border:1px solid rgba(200,60,80,.40);color:#f0909a;}
    .fin-aberto{background:rgba(42,120,200,.14);border:1px solid rgba(42,120,200,.33);color:#88c0f8;}
    .fin-creditos{background:rgba(110,80,200,.14);border:1px solid rgba(110,80,200,.33);color:#c0a8f8;}
    [data-theme="light"] .fin-paga{color:#0a5c38;background:rgba(20,140,90,.10);}
    [data-theme="light"] .fin-vencida{color:#8a2030;background:rgba(200,60,80,.08);}
    [data-theme="light"] .fin-avencer{color:#7a5500;background:rgba(220,160,30,.08);}
    [data-theme="light"] .fin-aberto{color:#1a3a80;background:rgba(42,120,200,.08);}
    [data-theme="light"] .fin-creditos{color:#3d1a80;background:rgba(110,80,200,.08);}

    /* ── iVICTOR ── */
    .ivictor-btn{position:fixed;bottom:22px;right:22px;z-index:900;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid rgba(30,143,168,.65);box-shadow:0 4px 24px rgba(0,0,0,.40),0 0 0 4px rgba(30,143,168,.12);cursor:pointer;transition:transform .18s;background:#0c2030;}
    .ivictor-btn:hover{transform:scale(1.07);}

  <script>
  // Carrega tema do Firebase assim que possível e aplica CSS variables (retrocompatibilidade)
  (function(){
    function applyTheme(t){
      if(!t)return;
      const r=document.documentElement.style;
      if(t.bg)r.setProperty('--bg',t.bg);
      if(t.font)r.setProperty('--font',t.font);
      if(t.card)r.setProperty('--card',t.card);
      if(t.lesson)r.setProperty('--lesson',t.lesson);
      if(t.detail)r.setProperty('--detail',t.detail);
      if(t.header)r.setProperty('--header',t.header);
      if(t.tabbar)r.setProperty('--tabbar',t.tabbar);
      if(t.badge)r.setProperty('--badge',t.badge);
      if(t.btn)r.setProperty('--btn',t.btn);
      if(t.done)r.setProperty('--done',t.done);
      if(t.doneBorder)r.setProperty('--done-border',t.doneBorder);
      if(t.doneText)r.setProperty('--done-text',t.doneText);
    }
    window.__applyTheme=applyTheme;
    // Aplicar tema salvo localmente
    const saved=localStorage.getItem('fs-theme')||'system';
    const isDark=saved==='dark'||(saved==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
    // Tenta carregar do Firebase para retrocompatibilidade
    try{
      firebase.firestore().collection('config').doc('aparencia').get().then(doc=>{
        if(doc.exists)applyTheme(doc.data());
      });
    }catch(e){}
  })();
  </script>

  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();

// ── MODIFICAÇÃO 1c: ThemeSwitcher ──────────────────────────────────────────
function ThemeSwitcher() {
  const [mode, setMode] = useState(() => localStorage.getItem('fs-theme') || 'system');

  useEffect(() => {
    function apply(m) {
      const isDark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }
    apply(mode);
    localStorage.setItem('fs-theme', mode);
    if (mode === 'system') {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const handler = () => apply('system');
      mq.addEventListener('change', handler);
      return () => mq.removeEventListener('change', handler);
    }
  }, [mode]);

  const opts = [
    { id: 'dark',   icon: 'moon',    label: 'Dark' },
    { id: 'light',  icon: 'sun',     label: 'Light' },
    { id: 'system', icon: 'monitor', label: 'Auto' },
  ];

  return (
    <div className="theme-switcher">
      {opts.map(o => (
        <button
          key={o.id}
          title={o.label}
          onClick={() => setMode(o.id)}
          className={"theme-btn" + (mode === o.id ? " theme-btn-active" : "")}
        >
          <Icon name={o.icon} size={14}/>
        </button>
      ))}
    </div>
  );
}

function DiarioSection({uid,isAdmin}){

  async function addEntry(){const nextNum=entries&&entries.length>0?Math.max(...entries.map(e=>e.num))+1:1;await db.collection("students").doc(uid).collection("diario").add({num:nextNum,date:new Date().toISOString().slice(0,10),licaoNum:1,status:"andamento",obs:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
  async function updateEntry(id,patch){
    await db.collection("students").doc(uid).collection("diario").doc(id).update(patch);
    // Sincronizar com Trilha: quando status → realizada, marcar lição como concluída
    if(patch.status==="realizada"&&patch.licaoNum){

      if(licaoNum>=1&&licaoNum<=150){
        const modIdx=Math.ceil(licaoNum/25);
        const trilhaItemId=`b${modIdx}-l${licaoNum}`;
        const trilhaPatch={};
        trilhaPatch[`trilha.${trilhaItemId}.status`]="concluida";
        if(patch.date) trilhaPatch[`trilha.${trilhaItemId}.date`]=patch.date;
        try{ await db.collection("students").doc(uid).update(trilhaPatch); }catch(e){}
      }
    }

      </div>
      {entries.length===0?<div className="text-center py-12 muted"><Icon name="book-open" size={32} className="mx-auto mb-3 opacity-30"/><p>Nenhuma aula lançada ainda.</p></div>:(
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead><tr className="text-left muted text-xs"><th className="py-3 pr-3">Aula</th><th className="py-3 pr-3">Data</th><th className="py-3 pr-3">Lição</th><th className="py-3 pr-3">Status</th><th className="py-3 pr-3">Observações</th>{isAdmin&&<th className="py-3"/>}</tr></thead>

function FinanceiroStrip({financeiro,onGoToFinanceiro}){
  const tipo=financeiro?.tipo||"mensalidade";const parcelas=financeiro?.parcelas||[];const creditosTotal=financeiro?.creditosTotal||0;
  const hasData=parcelas.length>0||(tipo==="creditos"&&creditosTotal>0);
  if(!hasData)return null;
  const sorted=[...parcelas].sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const lastPaid=[...sorted].reverse().find(p=>p.status==="paga");
  const next=sorted.find(p=>p.status!=="paga");
  const isVencida=sorted.some(p=>p.status==="vencida");
  let statusLabel="",statusCls="";
  if(tipo==="creditos"){const r=creditosTotal-(financeiro?.creditosUsados||0);statusLabel=`${r} Crédito${r!==1?"s":""} Restante${r!==1?"s":""}`;statusCls="fin-creditos";}
  else if(isVencida){statusLabel="Atrasado";statusCls="fin-vencida";}
  else if(sorted.some(p=>p.status==="paga")){statusLabel="Em Dia";statusCls="fin-paga";}
  const bannerBg=isVencida?"rgba(200,60,80,.12)":"rgba(30,160,110,.07)";
  const bannerBorder=isVencida?"rgba(200,60,80,.35)":"rgba(30,160,110,.28)";
  const iconColor=isVencida?"#e07080":"#60daa8";
  return(
    <div onClick={onGoToFinanceiro} style={{
      background:bannerBg,border:`1px solid ${bannerBorder}`,borderRadius:12,
      padding:"12px 16px",cursor:"pointer",display:"flex",alignItems:"center",
      gap:10,marginTop:12,flexWrap:"wrap",transition:"filter .15s"
    }}
    onMouseEnter={e=>e.currentTarget.style.filter="brightness(1.08)"}
    onMouseLeave={e=>e.currentTarget.style.filter=""}>
      <div style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}>
        <Icon name="dollar-sign" size={14} style={{color:iconColor}}/>
        <span style={{color:"var(--font)",fontWeight:700,fontSize:11,letterSpacing:"0.07em",textTransform:"uppercase"}}>Financeiro</span>
      </div>
      <div style={{width:1,height:14,background:"var(--divider)",flexShrink:0}}/>
      {lastPaid&&<span style={{color:"var(--font-muted)",fontSize:12}}>Última: <strong style={{color:"var(--font)"}}>{lastPaid.mes}</strong> <span className="fin-badge fin-paga" style={{fontSize:10}}>Paga</span></span>}
      {next&&<><div style={{width:1,height:14,background:"var(--divider)",flexShrink:0}}/><span style={{color:"var(--font-muted)",fontSize:12}}>Próx: <strong style={{color:"var(--font)"}}>{next.mes}</strong>{next.dataVencimento&&<span> · {formatDateBR(next.dataVencimento)}</span>}</span></>}
      {statusLabel&&<span className={"fin-badge "+statusCls} style={{marginLeft:"auto",fontSize:10,fontWeight:700}}>{statusLabel}</span>}
    </div>
  );
}

function RingChart({ label, value, max, pct, color, icon, onClick }) {
  const r = 32, circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <button className="glass rounded-2xl p-4 text-center w-full btn" onClick={onClick} style={{cursor:'pointer'}}>
      <div style={{position:'relative',width:80,height:80,margin:'0 auto 8px'}}>
        <svg width={80} height={80} style={{transform:'rotate(-90deg)'}}>
          <circle cx={40} cy={40} r={r} fill="none" stroke="var(--badge)" strokeWidth={6}/>
          <circle cx={40} cy={40} r={r} fill="none" stroke={color} strokeWidth={6}
            strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="round" style={{transition:'stroke-dashoffset 600ms ease'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontSize:16,fontWeight:800,color:'var(--font)'}}>{pct}%</span>
        </div>
      </div>
      <div className="font-semibold text-xs" style={{color:'var(--font)'}}>{label}</div>
      <div className="muted text-xs mt-0.5">{value} de {max}</div>
    </button>
  );
}

      <div className="muted text-xs mt-0.5">{label}</div>

}

function OverviewSection({ uid, profile, trilhaData, financeiro, onGoToTab }) {
  const books = useMemo(() => mergeBooks(trilhaData), [trilhaData]);

  const licoesConcluidas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (!i.isReview && (i.status === "concluida" || i.status === "realizada")) count++;
    }));
    return count;
  }, [books]);

  const totalLicoes = 150;

  const tarefasFeitas = useMemo(() => {
    let count = 0;
    books.forEach(b => b.items.forEach(i => {
      if (!i.isReview && i.tarefaFeita) count++;
    }));
    return count;
  }, [books]);

  const [diarioStats, setDiarioStats] = useState({ realizadas: 0, ausentes: 0 });
  useEffect(() => {
    return db.collection("students").doc(uid).collection("diario")
      .onSnapshot(snap => {
        let realizadas = 0, ausentes = 0;
        snap.docs.forEach(d => {
          const s = d.data().status;
          if (s === "realizada" || s === "concluida") realizadas++;
          if (s === "ausente") ausentes++;
        });
        setDiarioStats({ realizadas, ausentes });
      });
  }, [uid]);

  const progressGeral = Math.round((licoesConcluidas / totalLicoes) * 100);
  const progressTarefas = licoesConcluidas > 0
    ? Math.round((tarefasFeitas / licoesConcluidas) * 100)
    : 0;

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
  const hoje = getTodayPT();
  const hojeDisplay = hoje.charAt(0).toUpperCase() + hoje.slice(1);

  return (
    <div className="space-y-4">
      {/* Cabeçalho de saudação */}
      <div className="glass rounded-2xl p-5">
        <p className="muted text-sm">{saudacao} 👋</p>
        <h2 className="text-2xl font-extrabold mt-1" style={{fontFamily:"'Sora',sans-serif"}}>
          {profile?.name?.split(" ")[0] || "Aluno"}
        </h2>
        <p className="muted text-xs mt-1">{hojeDisplay}</p>
      </div>

      {/* Ring charts de progresso */}
      <div className="grid grid-cols-2 gap-3">
        <RingChart
          label="Lições Concluídas"
          value={licoesConcluidas}
          max={totalLicoes}
          pct={progressGeral}
          color="#1e8fa8"
          icon="check-circle"
          onClick={() => onGoToTab("trilha")}
        />
        <RingChart
          label="Tarefas Entregues"
          value={tarefasFeitas}
          max={licoesConcluidas || 1}
          pct={progressTarefas}
          color="#7c5cbf"
          icon="file-check"
          onClick={() => onGoToTab("trilha")}
        />
      </div>

      {/* Cards de estatística */}
      <div className="grid grid-cols-2 gap-3">

// ── MODIFICAÇÃO 4: iVi com histórico de conversa ────────────────────────────
function ivisFallback(question) {
  const q = question.toLowerCase();
  if (q.includes('tarefa') || q.includes('homework')) return 'Para suas tarefas, acesse a Trilha e clique na lição correspondente. O botão de tarefa fica disponível no card da aula! 📝';
  if (q.includes('material') || q.includes('pdf') || q.includes('drive')) return 'Seus materiais estão disponíveis na aba Recursos ou diretamente na Trilha, clicando em cada lição. 📚';
  if (q.includes('professor') || q.includes('victor') || q.includes('dúvida')) return 'Para falar diretamente com o professor Victor, use o WhatsApp disponível na aba Recursos. Ele responde rapidinho! 😊';
  if (q.includes('financeiro') || q.includes('pagamento') || q.includes('mensalidade')) return 'Suas informações financeiras estão na aba Financeiro. Se tiver dúvidas sobre pagamentos, fale com o Victor pelo WhatsApp em Recursos.';
  if (q.includes('trilha') || q.includes('progresso') || q.includes('módulo')) return 'Sua trilha mostra toda a sua jornada até a fluência. As lições concluídas ficam destacadas, e a próxima disponível aparece em andamento. Continue assim! 🚀';
  return 'Boa pergunta! Para uma resposta mais completa, você pode falar diretamente com o professor Victor pelo WhatsApp na aba Recursos. Estou aqui para ajudar no que puder! 😊';
}

function IVictor(){
  const [open,setOpen]=useState(false);
  const [imgOk,setImgOk]=useState(!!VICTOR_PHOTO);
  const [messages,setMessages]=useState([
    { role: 'assistant', content: 'Olá! Sou o iVi 👋 Posso ajudar com dúvidas sobre inglês, a plataforma, metodologia ou sua jornada de estudos. O que você precisa?' }
  ]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const messagesEndRef=useRef(null);

  useEffect(()=>{
    if(open&&messagesEndRef.current){
      messagesEndRef.current.scrollIntoView({behavior:'smooth'});
    }
  },[messages,open]);

  async function sendMessage(){
    const text=input.trim();
    if(!text||loading)return;
    const userMsg={role:'user',content:text};
    const newMessages=[...messages,userMsg];
    setMessages(newMessages);
    setInput('');
    setLoading(true);

    try{
      const response=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":"",
          "anthropic-version":"2023-06-01"
        },
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:500,
          system:`Você é o iVi, assistente virtual do Fluency Studio — uma escola de inglês premium. 
Sua personalidade: amigável, direto, encorajador e especialista em inglês e aprendizado de idiomas.
Você ajuda com: dúvidas de inglês (gramática, vocabulário, pronúncia), metodologia da escola, 
como usar a plataforma, organização dos estudos, motivação.
Quando o aluno precisar falar com o professor Victor, diga que ele pode usar o WhatsApp disponível em Recursos.
Responda sempre em português, de forma concisa (máximo 3 parágrafos curtos). 
Seja caloroso mas objetivo. Use emojis com moderação.`,
          messages:newMessages.map(m=>({role:m.role,content:m.content})),
        })
      });
      if(!response.ok)throw new Error('API error');
      const data=await response.json();
      const reply=data.content?.[0]?.text||ivisFallback(text);
      setMessages(prev=>[...prev,{role:'assistant',content:reply}]);
    }catch(err){
      // Fallback local quando API não disponível
      const fallback=ivisFallback(text);
      setMessages(prev=>[...prev,{role:'assistant',content:fallback}]);
    }finally{
      setLoading(false);
    }
  }

  function handleKey(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  }

  return(
    <>
      {open&&(
        <div className="ivictor-panel" style={{width:320,maxHeight:'70vh',display:'flex',flexDirection:'column'}}>
          {/* Header */}
          <div className="ivictor-header">
            <div className="ivictor-avatar">
              {imgOk&&VICTOR_PHOTO
                ?<img src={VICTOR_PHOTO} alt="iVi" className="w-full h-full object-cover" onError={()=>setImgOk(false)}/>
                :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:'rgba(44,122,142,1)'}}>iVi</div>
              }
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>iVi</div>
              <div style={{fontSize:11,color:'rgba(234,242,247,.65)'}}>Assistente do Fluency Studio</div>
            </div>
            <button className="btn rounded-lg" style={{marginLeft:'auto',padding:'6px',border:'1px solid rgba(255,255,255,.20)',color:'rgba(255,255,255,.8)'}} onClick={()=>setOpen(false)}>
              <Icon name="x" size={14} style={{color:'#fff'}}/>
            </button>
          </div>

          {/* Mensagens */}
          <div className="ivictor-body" style={{flex:1,overflowY:'auto',padding:12,display:'flex',flexDirection:'column',gap:8,minHeight:0}}>
            {messages.map((msg,i)=>(
              <div key={i} style={{display:'flex',justifyContent:msg.role==='user'?'flex-end':'flex-start'}}>
                <div style={{
                  maxWidth:'82%',
                  padding:'9px 13px',
                  borderRadius:msg.role==='user'?'12px 12px 3px 12px':'12px 12px 12px 3px',
                  fontSize:13,
                  lineHeight:1.5,
                  background:msg.role==='user'
                    ?'linear-gradient(135deg,#1e8fa8,#145f7a)'
                    :'rgba(30,143,168,.12)',
                  border:msg.role==='user'?'none':'1px solid rgba(30,143,168,.22)',
                  color:msg.role==='user'?'#fff':'var(--font)',
                }}>
                  {msg.content}
                </div>
              </div>
            ))}
            {loading&&(
              <div style={{display:'flex',justifyContent:'flex-start'}}>
                <div style={{
                  padding:'9px 16px',
                  borderRadius:'12px 12px 12px 3px',
                  background:'rgba(30,143,168,.12)',
                  border:'1px solid rgba(30,143,168,.22)',
                  display:'flex',gap:4,alignItems:'center'
                }}>
                  {[0,1,2].map(i=>(
                    <div key={i} style={{
                      width:6,height:6,borderRadius:'50%',
                      background:'rgba(44,122,142,.7)',
                      animation:`bounce 1.2s ease infinite ${i*0.2}s`
                    }}/>
                  ))}
                </div>
              </div>
            )}
            <div ref={messagesEndRef}/>
          </div>

          {/* Input */}
          <div className="ivictor-footer">
            <input
              className="input"
              style={{flex:1,borderRadius:10,padding:'8px 12px',fontSize:13}}
              placeholder="Pergunte ao iVi..."
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={handleKey}
              disabled={loading}
            />
            <button
              className="btn btn-primary"
              style={{padding:'8px 12px',borderRadius:10,flexShrink:0}}
              onClick={sendMessage}
              disabled={loading||!input.trim()}
            >
              <Icon name="send" size={14}/>
            </button>
          </div>
        </div>
      )}
      <button
        className="ivictor-btn"
        onClick={()=>setOpen(o=>!o)}
        title="iVi — Assistente"
      >
        {imgOk&&VICTOR_PHOTO
          ?<img src={VICTOR_PHOTO} alt="iVi" className="w-full h-full object-cover" onError={()=>setImgOk(false)}/>
          :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,color:'rgba(44,122,142,1)',fontFamily:"'Sora',sans-serif"}}>iVi</div>
        }
      </button>
    </>
  );
}

              </div>}
              {!editProfile&&financeiro&&<FinanceiroStrip financeiro={financeiro} onGoToFinanceiro={()=>setActiveTab("financeiro")}/>}

function ModalCadastro({onClose,onSaved}){
  const [tab,setTab]=useState(0);
  const [dados,setDados]=useState(BLANK_DADOS);
  const [triagem,setTriagem]=useState(BLANK_TRIAGEM);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  function setD(k,v){setDados(p=>({...p,[k]:v}));}
  function setT(k,v){setTriagem(p=>({...p,[k]:v}));}

  function toggleDia(d){setDados(p=>({...p,diasAulas:p.diasAulas.includes(d)?p.diasAulas.filter(x=>x!==d):[...p.diasAulas,d]}));}

  function TriagemOption({label,field,value}){
    const sel=triagem[field]===value;
    return(
      <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,value)}>

        {label}
      </div>
    );
  }
  function TriagemMulti({label,field,value}){
    const arr=triagem[field]||[];const sel=arr.includes(value);
    function toggle(){setT(field,sel?arr.filter(x=>x!==value):[...arr,value]);}
    return(
      <div className={"triagem-option"+(sel?" selected":"")} onClick={toggle}>
        <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
        {label}
      </div>
    );
  }
  function Rating({field,label}){
    return(
      <div style={{marginBottom:10}}>
        <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:4}}>{label}</div>
        <div className="rating-row">
          {[1,2,3,4,5].map(n=>(
            <button key={n} className={"rating-btn"+(triagem[field]===n?" selected":"")} onClick={()=>setT(field,n)}>{n}</button>
          ))}
        </div>
      </div>
    );

  async function handleSave(){
    if(!dados.nome.trim()){setErr("Nome completo é obrigatório.");return;}
    if(!dados.email.trim()){setErr("Email é obrigatório.");return;}
    setSaving(true);setErr("");

      await docRef.set({
        name:dados.nome.trim(),
        email:dados.email.trim(),
        phone:dados.telefone.trim()||dados.whatsapp.trim(),
        telefone2:dados.telefone2.trim(),
        cpf:dados.cpf.trim(),rg:dados.rg.trim(),
        dataNasc:dados.dataNasc,
        estadoCivil:dados.estadoCivil,
        profissao:dados.profissao.trim(),
        nacionalidade:dados.nacionalidade.trim(),
        endereco:dados.endereco.trim(),
        foto:dados.foto.trim(),
        dataCadastro:dados.dataCadastro,

const DIAS_SEMANA_JS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MESES_CURTOS=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function gerarParcelas(dataInicio,diaVenc,valorFinal,numParcelas,parcelasExistentes){
  if(!dataInicio||!diaVenc||!valorFinal||!numParcelas)return null;
  const pagas=(parcelasExistentes||[]).filter(p=>p.status==="paga");
  const base=new Date(dataInicio+"T12:00:00");
  const parcelas=[];
  for(let i=0;i<numParcelas;i++){
    const d=new Date(base.getFullYear(),base.getMonth()+i,parseInt(diaVenc));
    const mesStr=MESES_CURTOS[d.getMonth()]+"/"+String(d.getFullYear()).slice(2);
    const dataVenc=d.toISOString().slice(0,10);
    const jaFoi=pagas.find(p=>p.mes===mesStr||p.dataVencimento===dataVenc);
    parcelas.push(jaFoi||{
      id:Date.now().toString()+i,
      mes:mesStr,
      dataVencimento:dataVenc,
      valor:parseFloat(valorFinal)||0,
      valorDesconto:0,
      status:"a_vencer",
      comprovante:"",
    });
  }
  return parcelas;
}
/* ── MODAL DE EDIÇÃO ── */
function ModalEdicao({student,onClose,onSaved}){
  const [tab,setTab]=useState(0);
  const [dados,setDados]=useState({
    nome:student.name||"",cpf:student.cpf||"",rg:student.rg||"",
    email:student.email||"",telefone:student.phone||"",telefone2:student.telefone2||"",
    dataNasc:student.dataNasc||"",estadoCivil:student.estadoCivil||"",
    profissao:student.profissao||"",nacionalidade:student.nacionalidade||"",
    endereco:student.endereco||"",foto:student.foto||"",
    dataCadastro:student.dataCadastro||new Date().toISOString().slice(0,10),
    contrato:student.contrato||"fluency_foundation",duracao:student.duracao||"",
    diasAulas:student.diasAulas||[],horarioAulas:student.horarioAulas||"",
    valorCheio:student.valorCheio||"",descontos:student.descontos||"",
    valorFinal:student.valorFinal||"",diaVencimento:student.diaVencimento||"",
    status:student.status||"lead",
    dataInicio:student.dataInicio||"",licaoInicio:student.licaoInicio||"1",
  });
  const [triagem,setTriagem]=useState(student.triagem||BLANK_TRIAGEM);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  function setD(k,v){setDados(p=>({...p,[k]:v}));}
  function setT(k,v){setTriagem(p=>({...p,[k]:v}));}
  function toggleDia(d){setDados(p=>({...p,diasAulas:p.diasAulas.includes(d)?p.diasAulas.filter(x=>x!==d):[...p.diasAulas,d]}));}

  function TriOpt({label,field,value}){
    const sel=triagem[field]===value;
    return <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,value)}>
      <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>{label}</div>;
  }
  function TriMulti({label,field,value}){
    const arr=triagem[field]||[];const sel=arr.includes(value);
    return <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,sel?arr.filter(x=>x!==value):[...arr,value])}>
      <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>{label}</div>;
  }
  function Rating({field,label}){
    return <div style={{marginBottom:10}}>
      <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:4}}>{label}</div>
      <div className="rating-row">{[1,2,3,4,5].map(n=><button key={n} className={"rating-btn"+(triagem[field]===n?" selected":"")} onClick={()=>setT(field,n)}>{n}</button>)}</div>
    </div>;
  }

  async function handleSave(){
    if(!dados.nome.trim()){setErr("Nome é obrigatório.");return;}
    setSaving(true);setErr("");
    try{
      await db.collection("students").doc(student.uid).update({
        name:dados.nome.trim(),email:dados.email.trim(),
        phone:dados.telefone.trim(),telefone2:dados.telefone2.trim(),
        cpf:dados.cpf.trim(),rg:dados.rg.trim(),
        dataNasc:dados.dataNasc,estadoCivil:dados.estadoCivil,
        profissao:dados.profissao.trim(),nacionalidade:dados.nacionalidade.trim(),
        endereco:dados.endereco.trim(),foto:dados.foto.trim(),
        dataCadastro:dados.dataCadastro,contrato:dados.contrato,
        duracao:dados.duracao.trim(),diasAulas:dados.diasAulas,
        horarioAulas:dados.horarioAulas.trim(),
        valorCheio:parseFloat(dados.valorCheio)||0,
        descontos:parseFloat(dados.descontos)||0,
        valorFinal:parseFloat(dados.valorFinal)||0,
        diaVencimento:parseInt(dados.diaVencimento)||1,
        status:dados.status,
        dataInicio:dados.dataInicio,
        licaoInicio:parseInt(dados.licaoInicio)||1,
        program:CONTRATOS.find(c=>c.v===dados.contrato)?.l||"Fluency Foundation",
        triagem,
      });
      onSaved();onClose();
    }catch(e){setErr("Erro: "+e.message);setSaving(false);}
  }

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box">
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="pencil" size={18}/>
            <div><div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Editar Aluno</div>
            <div style={{fontSize:11,opacity:.75}}>{student.name}</div></div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff",display:"flex",alignItems:"center"}}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-tab-bar">
          {["Dados Pessoais","Perfil do Aluno"].map((l,i)=><button key={i} className={"modal-tab"+(tab===i?" modal-tab-active":"")} onClick={()=>setTab(i)}>{l}</button>)}
        </div>
        <div className="modal-body">

                  <button

                      if(!novas){alert("Preencha: Data de Início, Dia de Vencimento e Valor Final.");return;}
                      if(!confirm(`Gerar ${novas.length} parcelas para ${student.name}?`))return;
                      try{
                        await db.collection("students").doc(student.uid).update({"financeiro.parcelas":novas});
                        alert("Parcelas geradas com sucesso!");
                      }catch(e){alert("Erro: "+e.message);}
                    }}
                    className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2">
                    <Icon name="refresh-cw" size={14}/>Gerar {dados.numParcelas||18} Parcelas

              <div className="form-section-title">Status</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>

          {tab===1&&(

              <div className="form-section-title">2. Formação</div>
              <div className="triagem-group">{["Ensino Fundamental Incompleto","Ensino Fundamental Completo","Ensino Médio Incompleto","Ensino Médio Completo","Ensino Superior Incompleto","Ensino Superior Completo","Pós-graduação ou mais"].map(v=><TriOpt key={v} label={v} field="formacao" value={v}/>)}</div>
              <div className="form-section-title">3. Situação Profissional</div>
              <div className="triagem-group">{["Estudante","Autônomo","Funcionário público","CLT","Empreendedor","Outro"].map(v=><TriOpt key={v} label={v} field="ocupacao" value={v}/>)}</div>
              <div style={{marginTop:8}}><label className="form-label">Área de interesse</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={triagem.areaInteresse||""} onChange={e=>setT("areaInteresse",e.target.value)}/></div>
              <div className="form-section-title">4. Experiência com Inglês</div>
              <div style={{marginBottom:10}}><label className="form-label">Já estudou inglês antes?</label>

              </div>
              {triagem.estudouIngles==="Sim"&&(<>
                <div style={{marginBottom:8}}><label className="form-label">Onde estudou</label><div className="triagem-group" style={{marginTop:4}}>{["Escola regular","Curso de idiomas","Online","Outro"].map(v=><TriMulti key={v} label={v} field="ondeComo" value={v}/>)}</div></div>
                <div style={{marginBottom:8}}><label className="form-label">Avaliação</label><div style={{marginTop:8}}><Rating field="qualidadeMaterial" label="Material"/><Rating field="qualidadeProfessores" label="Professores"/><Rating field="qualidadeMetodologia" label="Metodologia"/></div></div>
                <div style={{marginBottom:8}}><label className="form-label">Pontos positivos</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.pontosPositivos||""} onChange={e=>setT("pontosPositivos",e.target.value)}/></div>
                <div style={{marginBottom:8}}><label className="form-label">O que poderia melhorar</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.melhorias||""} onChange={e=>setT("melhorias",e.target.value)}/></div>
              </>)}
              <div className="form-section-title">5. Interesses</div>
              <div style={{marginBottom:10}}><label className="form-label">Tópicos</label><div className="triagem-group" style={{marginTop:4}}>{["Cultura (artes, história, tradições)","Tecnologia","Esportes","Moda e tendências","Negócios e economia","Sustentabilidade e meio ambiente"].map(v=><TriMulti key={v} label={v} field="topicos" value={v}/>)}</div></div>
              <div style={{marginBottom:8}}><label className="form-label">Temas que não gosta</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.temasSemInteresse||""} onChange={e=>setT("temasSemInteresse",e.target.value)}/></div>
              <div className="form-section-title">6. Expectativas</div>
              <div style={{marginBottom:10}}><label className="form-label">Objetivo</label><div className="triagem-group" style={{marginTop:4}}>{["Conseguir um emprego","Falar fluentemente em viagens","Passar em testes de proficiência","Melhorar minha confiança na comunicação","Outro"].map(v=><TriOpt key={v} label={v} field="objetivo" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Horas por semana</label><div className="triagem-group" style={{marginTop:4}}>{["Menos de 1 hora","1–2 horas","3–4 horas","Mais de 4 horas"].map(v=><TriOpt key={v} label={v} field="horasSemana" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Prazo esperado</label><div className="triagem-group" style={{marginTop:4}}>{["3 meses","6 meses","1 ano","Mais de 1 ano"].map(v=><TriOpt key={v} label={v} field="prazo" value={v}/>)}</div></div>
              <div><label className="form-label">Observações</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={3} style={{resize:"vertical"}} value={triagem.observacoes||""} onChange={e=>setT("observacoes",e.target.value)}/></div>
            </div>
          )}
        </div>
        {err&&<div className="err-box" style={{margin:"0 20px 12px"}}>{err}</div>}
        <div className="modal-footer">
          {tab===1&&<button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setTab(0)}>← Dados Pessoais</button>}

        </div>
      </div>
    </div>
  );
}

.dash-nav-btn:hover{border-color:rgba(30,143,168,.55);background:rgba(30,143,168,.07);transform:translateY(-2px);box-shadow:var(--shadow);}
.dash-stat-card{background:var(--card);border:1px solid var(--divider);border-radius:16px;padding:16px 20px;}
.dash-stat-num{font-size:28px;font-weight:800;font-family:'Sora',sans-serif;line-height:1;}

.aula-hoje-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:1px solid var(--divider);background:var(--lesson);margin-bottom:6px;}

/* ── DASHBOARD ── */
function AdminDashboard({students,onNavigate}){
  const hoje=new Date();
  const diaSemanaHoje=DIAS_SEMANA_JS[hoje.getDay()];

  const ativos=useMemo(()=>(students||[]).filter(s=>(s.status||"lead")==="ativo"),[students]);

  const totalRecebidoMes=useMemo(()=>{
    const mes=hoje.getMonth(),ano=hoje.getFullYear();let total=0;
    (students||[]).forEach(s=>(s.financeiro?.parcelas||[]).forEach(p=>{
      if(p.status==="paga"&&p.data){const d=new Date(p.data);if(d.getMonth()===mes&&d.getFullYear()===ano)total+=p.valor||0;}
    }));
    return total;
  },[students]);

  const aulasHoje=useMemo(()=>(students||[])
    .filter(s=>(s.diasAulas||[]).includes(diaSemanaHoje)&&(s.status||"lead")==="ativo")
    .sort((a,b)=>(a.horarioAulas||"").localeCompare(b.horarioAulas||""))
  ,[students,diaSemanaHoje]);

  const contadores={
    todos:(students||[]).length,
    ativo:ativos.length,
    lead:(students||[]).filter(s=>(s.status||"lead")==="lead").length,
    interessado:(students||[]).filter(s=>s.status==="interessado").length,
    trancado:(students||[]).filter(s=>s.status==="trancado").length,
    evadido:(students||[]).filter(s=>s.status==="evadido").length,
  };

  const navBtns=[
    {id:"alunos",    icon:"users",        label:"Alunos",      cor:"#1e8fa8", ativo:true},
    {id:"financeiro",icon:"dollar-sign",  label:"Financeiro",  cor:"#60daa8", ativo:false},
    {id:"agenda",    icon:"calendar",     label:"Agenda",      cor:"#f0cc60", ativo:false},
    {id:"relatorios",icon:"file-text",    label:"Relatórios",  cor:"#c0a0f8", ativo:false},
    {id:"config",    icon:"settings",     label:"Config.",     cor:"#f09090", ativo:false},
  ];

  return(
    <div>
      {/* STATS */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#1e8fa8"}}>{ativos.length}</div><div className="dash-stat-label">Alunos Ativos</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#60daa8",fontSize:20}}>{formatCurrency(totalRecebidoMes)}</div><div className="dash-stat-label">Recebido no Mês</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#f0cc60"}}>{aulasHoje.length}</div><div className="dash-stat-label">Aulas Hoje</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#c0a0f8"}}>{(students||[]).length}</div><div className="dash-stat-label">Total Alunos</div></div>
      </div>

      {/* AULAS DO DIA */}
      <div className="glass rounded-2xl p-5 mb-5">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <Icon name="calendar-check" size={16} style={{color:"#1e8fa8"}}/>
          <span style={{fontWeight:700,fontSize:14}}>Aulas de Hoje</span>
          <span style={{fontSize:11,color:"var(--font-muted)",marginLeft:4}}>
            {hoje.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
          </span>
        </div>
        {aulasHoje.length===0
          ?<div style={{textAlign:"center",padding:"16px 0",color:"var(--font-muted)",fontSize:13}}>Nenhuma aula agendada para hoje.</div>
          :aulasHoje.map(s=>(
            <div key={s.uid} className="aula-hoje-item">
              {s.foto
                ?<img src={s.foto} alt={s.name} style={{width:36,height:36,borderRadius:"50%",objectFit:"cover",border:"2px solid var(--divider)",flexShrink:0}}/>
                :<div style={{width:36,height:36,borderRadius:"50%",background:"var(--badge)",border:"1px solid var(--divider)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="user" size={16}/></div>
              }
              <div className="aula-hoje-hora">{s.horarioAulas||"—"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13}}>{s.name||"Aluno"}</div>
                <div style={{fontSize:11,color:"var(--font-muted)"}}>{CONTRATOS.find(c=>c.v===s.contrato)?.l||"—"}</div>
              </div>
              <StatusBadge status={s.status||"lead"}/>
            </div>
          ))
        }
      </div>

      {/* DISTRIBUIÇÃO */}
      <div className="glass rounded-2xl p-5 mb-5">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <Icon name="users" size={16} style={{color:"#1e8fa8"}}/>
          <span style={{fontWeight:700,fontSize:14}}>Distribuição por Status</span>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {[
            {v:"todos",l:"Total",cls:"status-pill-all",n:contadores.todos},
            {v:"ativo",l:"Ativos",cls:"status-pill-ativo",n:contadores.ativo},
            {v:"lead",l:"Lead",cls:"status-pill-lead",n:contadores.lead},
            {v:"interessado",l:"Interessados",cls:"status-pill-interesse",n:contadores.interessado},
            {v:"trancado",l:"Trancados",cls:"status-pill-trancado",n:contadores.trancado},
            {v:"evadido",l:"Evadidos",cls:"status-pill-evadido",n:contadores.evadido},
          ].map(f=>(
            <div key={f.v} className={"status-pill "+f.cls} style={{cursor:"default",fontSize:12}}>
              {f.l}<span style={{marginLeft:5,background:"rgba(255,255,255,.18)",borderRadius:99,padding:"1px 7px",fontSize:11}}>{f.n}</span>
            </div>
          ))}
        </div>
      </div>

      {/* NAVEGAÇÃO */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {navBtns.map(b=>(
          <button key={b.id} className="dash-nav-btn" onClick={()=>b.ativo&&onNavigate(b.id)} style={{opacity:b.ativo?1:.6,cursor:b.ativo?"pointer":"default"}}>
            <Icon name={b.icon} size={22} style={{color:b.cor}}/>
            <span>{b.label}</span>
            {!b.ativo&&<span style={{fontSize:9,color:"var(--font-muted)",marginTop:-4}}>Em breve</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── LISTA DE ALUNOS ── */
function AdminAlunos({students,onSelectUid}){
  const [filtroStatus,setFiltroStatus]=useState("todos");
  const [editStudent,setEditStudent]=useState(null);

  const STATUS_FILTERS=[
    {v:"todos",   l:"Todos",        cls:"status-pill-all"},
    {v:"ativo",   l:"Ativos",       cls:"status-pill-ativo"},
    {v:"lead",    l:"Lead",         cls:"status-pill-lead"},
    {v:"interessado",l:"Interessados",cls:"status-pill-interesse"},
    {v:"trancado",l:"Trancados",    cls:"status-pill-trancado"},
    {v:"evadido", l:"Evadidos",     cls:"status-pill-evadido"},
  ];

  const alunosFiltrados=useMemo(()=>{
    if(!students)return[];
    if(filtroStatus==="todos")return students;
    return students.filter(s=>(s.status||"lead")===filtroStatus);
  },[students,filtroStatus]);

  const contadores=useMemo(()=>{
    if(!students)return{};
    const c={todos:students.length};
    ["ativo","lead","interessado","trancado","evadido"].forEach(s=>{c[s]=students.filter(a=>(a.status||"lead")===s).length;});
    return c;
  },[students]);

  return(
    <div>
      {editStudent&&<ModalEdicao student={editStudent} onClose={()=>setEditStudent(null)} onSaved={()=>setEditStudent(null)}/>}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:20}}>
        {STATUS_FILTERS.map(f=>(
          <button key={f.v} className={"status-pill "+(filtroStatus===f.v?f.cls:"status-pill-inactive")} onClick={()=>setFiltroStatus(f.v)} style={{fontSize:11}}>
            {f.l}{contadores[f.v]!==undefined&&<span style={{marginLeft:5,background:"rgba(255,255,255,.15)",borderRadius:99,padding:"1px 6px",fontSize:10}}>{contadores[f.v]}</span>}
          </button>
        ))}
      </div>
      {alunosFiltrados.length===0
        ?<div className="glass rounded-2xl p-12 text-center" style={{color:"var(--font-muted)"}}>
            <Icon name="users" size={40} className="mx-auto mb-4 opacity-30"/>
            <p>{filtroStatus==="todos"?"Nenhum aluno cadastrado ainda.":"Nenhum aluno com este status."}</p>
          </div>
        :(
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {alunosFiltrados.map(s=>{
              const merged=mergeBooks(s.trilha||{});let done=0,total=0;
              merged.forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida")done++;}));
              const pct=total?Math.round((done/total)*100):0;
              const mod=getCurrentModule(merged);
              const finVencida=s.financeiro?.parcelas?.some(p=>p.status==="vencida");
              return(
                <div key={s.uid} className="student-card" style={{position:"relative"}}>
                  <button onClick={e=>{e.stopPropagation();setEditStudent(s);}}
                    style={{position:"absolute",top:10,right:10,background:"var(--badge)",border:"1px solid var(--divider)",borderRadius:8,padding:"4px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontSize:11,color:"var(--font-muted)",zIndex:2}}>
                    <Icon name="pencil" size={11}/>Editar
                  </button>
                  <div onClick={()=>onSelectUid(s.uid)} style={{cursor:"pointer"}}>
                    <div className="flex items-center gap-3 mb-3">
                      {s.foto
                        ?<img src={s.foto} alt={s.name} style={{width:40,height:40,borderRadius:"50%",objectFit:"cover",border:"2px solid var(--divider)",flexShrink:0}}/>
                        :<div className="w-10 h-10 rounded-full chip flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div>
                      }
                      <div className="flex-1 min-w-0" style={{paddingRight:56}}>
                        <div className="font-bold truncate">{s.name||"Aluno"}</div>
                        <div style={{fontSize:11,color:"var(--font-muted)"}}>Módulo {mod} · Nível {s.level||"—"}</div>
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:8}}>
                      <StatusBadge status={s.status||"lead"}/>
                      {finVencida&&<span className="fin-badge fin-vencida" style={{fontSize:10}}>Atrasado</span>}
                      {s.contrato&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:99,background:"var(--badge)",border:"1px solid var(--divider)",color:"var(--font-muted)"}}>{CONTRATOS.find(c=>c.v===s.contrato)?.l||s.contrato}</span>}
                    </div>
                    <div className="flex items-center justify-between text-xs mb-1" style={{color:"var(--font-muted)"}}>
                      <span>Progresso</span><span className="font-semibold">{pct}%</span>
                    </div>
                    <div className="h-1.5 rounded-full overflow-hidden" style={{background:"var(--badge)"}}>
                      <div className="h-full rounded-full progress-fill" style={{width:pct+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/>
                    </div>
                    <div style={{fontSize:11,color:"var(--font-muted)",marginTop:6}}>{done} de {total} lições concluídas</div>
                  </div>
                </div>
              );
            })}
          </div>
        )
      }
    </div>
  );
}

/* ── ADMINAPP ── */
function AdminApp({user}){
  const [students,setStudents]=useState(null);
  const [selectedUid,setSelectedUid]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [adminView,setAdminView]=useState("dashboard");

  useEffect(()=>db.collection("students").onSnapshot(snap=>setStudents(snap.docs.map(d=>({uid:d.id,...d.data()})))),[]);

  if(selectedUid)return <StudentDetail uid={selectedUid} isAdmin onBack={()=>setSelectedUid(null)}/>;

  return(
    <div className="min-h-screen">
      {showModal&&<ModalCadastro onClose={()=>setShowModal(false)} onSaved={()=>setShowModal(false)}/>}
      <LogoBar isAdmin={true} showLogout={true}/>
      <div className="px-4 py-4 sticky top-[49px] z-40" style={{background:"var(--header)",backdropFilter:"blur(14px)",borderBottom:"1px solid var(--divider)"}}>
        <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {adminView==="alunos"&&(
              <button className="btn" style={{padding:"6px 10px",borderRadius:8,display:"flex",alignItems:"center",gap:6}} onClick={()=>setAdminView("dashboard")}>
                <Icon name="arrow-left" size={14}/><span style={{fontSize:12}}>Dashboard</span>
              </button>
            )}
            <div>
              <h1 className="text-xl font-bold">{adminView==="dashboard"?"Painel do Professor":"Alunos"}</h1>
              <p style={{fontSize:12,color:"var(--font-muted)"}}>Fluency Studio · Área Administrativa</p>
            </div>
          </div>
          <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>setShowModal(true)}>
            <Icon name="user-plus" size={16}/> Novo Aluno
          </button>
        </div>
      </div>
      <main className="px-5 pb-10 max-w-6xl mx-auto pt-6">
        {!students
          ?<LoadingScreen/>
          :adminView==="dashboard"
          ?<AdminDashboard students={students} onNavigate={id=>{if(id==="alunos")setAdminView("alunos");}}/>
          :<AdminAlunos students={students} onSelectUid={setSelectedUid}/>
        }
      </main>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>auth.onAuthStateChanged(u=>setUser(u||null)),[]);
  if(user===undefined)return <LoadingScreen/>;
  if(!user)return <Login/>;
  if(user.uid===ADMIN_UID)return <AdminApp user={user}/>;
  return <StudentDetail uid={user.uid} isAdmin={false}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
