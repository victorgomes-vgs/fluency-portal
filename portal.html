    dataNasc:student.dataNasc||student.birthday||"",estadoCivil:student.estadoCivil||"",
    profissao:student.profissao||student.profession||"",nacionalidade:student.nacionalidade||"",
    endereco:student.endereco||"",foto:student.foto||"",
    dataCadastro:student.dataCadastro||new Date().toISOString().slice(0,10),
    contrato:student.contrato||"fluency_foundation",duracao:student.duracao||"",
    diasAulas:student.diasAulas||[],horarioAulas:student.horarioAulas||"",
    valorCheio:student.valorCheio||"",descontos:student.descontos||"",
    valorFinal:student.valorFinal||"",diaVencimento:student.diaVencimento||"",
    status:student.status||"lead",
    dataInicio:student.dataInicio||"",licaoInicio:student.licaoInicio||"1",
  });
  const [triagem,setTriagem]=useState(student.triagem||BLANK_TRIAGEM);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const [novaSenha,setNovaSenha]=useState("");
  const [loginMsg,setLoginMsg]=useState("");
  const [fotoFile,setFotoFile]=useState(null);
  const [fotoPreview,setFotoPreview]=useState(student.foto||"");

  function setD(k,v){setDados(p=>({...p,[k]:v}));}
  function setT(k,v){setTriagem(p=>({...p,[k]:v}));}
  function toggleDia(d){setDados(p=>({...p,diasAulas:p.diasAulas.includes(d)?p.diasAulas.filter(x=>x!==d):[...p.diasAulas,d]}));}
  function handleFotoSelect(file){
    if(fotoPreview&&fotoPreview.indexOf("blob:")===0)try{URL.revokeObjectURL(fotoPreview);}catch(e){}
    setFotoFile(file);
    setFotoPreview(URL.createObjectURL(file));
    setErr("");
  }
  function handleFotoClear(){
    if(fotoPreview&&fotoPreview.indexOf("blob:")===0)try{URL.revokeObjectURL(fotoPreview);}catch(e){}
    setFotoFile(null);
    setFotoPreview("");
    setD("foto","");
  }

  async function handleCreateLogin(){
    const email=(dados.email||"").trim().toLowerCase();
    const pass=(novaSenha||"").trim();
    if(!email){setErr("Informe o email do aluno antes de criar o login.");return;}
    if(pass.length<6){setErr("Senha com no mínimo 6 caracteres.");return;}
    setSaving(true);setErr("");setLoginMsg("");
    try{
      const res=await linkStudentPortalLogin(student.uid,email,pass);
      if(res.alreadyExists){
        setLoginMsg("Email já tem login no Firebase. Vinculamos o cadastro — a aluna entra com a senha que já usa (ou use Esqueci a senha no login).");
      }else{
        setLoginMsg("Login criado! Pode entrar com "+email+" e a senha definida.");
      }
      setNovaSenha("");
    }catch(e){
      setErr("Erro ao criar login: "+(e.message||e.code||"desconhecido"));
    }finally{
      setSaving(false);
    }
  }

  function TriOpt({label,field,value}){
    const sel=triagem[field]===value;
    return <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,value)}>
      <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>{label}</div>;
  }
  function TriMulti({label,field,value}){
    const arr=triagem[field]||[];const sel=arr.includes(value);
    return <div className={"triagem-option"+(sel?" selected":"")} onClick={()=>setT(field,sel?arr.filter(x=>x!==value):[...arr,value])}>
      <div className="triagem-check">{sel&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>{label}</div>;
  }
  function Rating({field,label}){
    return <div style={{marginBottom:10}}>
      <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:4}}>{label}</div>
      <div className="rating-row">{[1,2,3,4,5].map(n=><button key={n} className={"rating-btn"+(triagem[field]===n?" selected":"")} onClick={()=>setT(field,n)}>{n}</button>)}</div>
    </div>;
  }

  async function handleSave(){
    if(!dados.nome.trim()){setErr("Nome é obrigatório.");return;}
    setSaving(true);setErr("");
    try{
      const email=(dados.email||"").trim().toLowerCase();
      let fotoUrl=(dados.foto||"").trim();
      if(fotoFile){
        fotoUrl=await uploadStudentFoto(fotoFile,student.uid);
      }
      await db.collection("students").doc(student.uid).update({
        name:dados.nome.trim(),email,
        phone:dados.telefone.trim(),telefone2:dados.telefone2.trim(),
        cpf:dados.cpf.trim(),rg:dados.rg.trim(),
        dataNasc:dados.dataNasc,estadoCivil:dados.estadoCivil,
        profissao:dados.profissao.trim(),nacionalidade:dados.nacionalidade.trim(),
        endereco:dados.endereco.trim(),foto:fotoUrl,
        dataCadastro:dados.dataCadastro,contrato:dados.contrato,
        duracao:dados.duracao.trim(),diasAulas:dados.diasAulas,
        horarioAulas:dados.horarioAulas.trim(),
        valorCheio:parseFloat(dados.valorCheio)||0,
        descontos:parseFloat(dados.descontos)||0,
        valorFinal:parseFloat(dados.valorFinal)||0,
        diaVencimento:parseInt(dados.diaVencimento)||1,
        status:dados.status,
        dataInicio:dados.dataInicio,
        licaoInicio:parseInt(dados.licaoInicio)||1,
        program:CONTRATOS.find(c=>c.v===dados.contrato)?.l||"Fluency Foundation",
        birthday:dados.dataNasc||"",
        profession:dados.profissao.trim(),
        triagem,
      });
      onSaved();onClose();
    }catch(e){setErr("Erro: "+e.message);setSaving(false);}
  }

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box">
        <div className="modal-header">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Icon name="pencil" size={18}/>
            <div><div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Editar Aluno</div>
            <div style={{fontSize:11,opacity:.75}}>{student.name}</div></div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff",display:"flex",alignItems:"center"}}><Icon name="x" size={16}/></button>
        </div>
        <div className="modal-tab-bar">
          {["Dados Pessoais","Perfil do Aluno"].map((l,i)=><button key={i} className={"modal-tab"+(tab===i?" modal-tab-active":"")} onClick={()=>setTab(i)}>{l}</button>)}
        </div>
        <div className="modal-body">
          {tab===0&&(
            <div>
              <div className="form-section-title">Identificação</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1",marginBottom:4}}>
                  <FotoUploadField
                    previewUrl={fotoPreview||dados.foto||""}
                    onSelectFile={handleFotoSelect}
                    onClear={handleFotoClear}
                    disabled={saving}
                    busy={saving&&!!fotoFile}
                  />
                </div>
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Nome Completo *</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.nome} onChange={e=>setD("nome",e.target.value)}/></div>
                <div><label className="form-label">Nacionalidade</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.nacionalidade} onChange={e=>setD("nacionalidade",e.target.value)}/></div>
                <div><label className="form-label">Estado Civil</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.estadoCivil} onChange={e=>setD("estadoCivil",e.target.value)}>
                    <option value="">Selecione...</option>
                    {["Solteiro(a)","Casado(a)","Divorciado(a)","Viúvo(a)","União Estável","Outro"].map(o=><option key={o}>{o}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Profissão</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.profissao} onChange={e=>setD("profissao",e.target.value)}/></div>
                <div><label className="form-label">Data de Nascimento</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataNasc} onChange={e=>setD("dataNasc",e.target.value)}/></div>
                <div><label className="form-label">CPF</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.cpf} onChange={e=>setD("cpf",e.target.value)}/></div>
                <div><label className="form-label">RG</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.rg} onChange={e=>setD("rg",e.target.value)}/></div>
              </div>
              <div className="form-section-title">Contato</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Email</label><input type="email" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.email} onChange={e=>setD("email",e.target.value)}/></div>
                <div><label className="form-label">Telefone / WhatsApp</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.telefone} onChange={e=>setD("telefone",e.target.value)}/></div>
                <div><label className="form-label">Telefone 2</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.telefone2} onChange={e=>setD("telefone2",e.target.value)}/></div>
                <div style={{gridColumn:"1/-1"}}><label className="form-label">Endereço</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.endereco} onChange={e=>setD("endereco",e.target.value)}/></div>
              </div>
              <div className="form-section-title">Acesso ao Portal (alunos antigos)</div>
              <div style={{padding:"12px 14px",borderRadius:12,background:"rgba(30,143,168,.08)",border:"1px solid rgba(30,143,168,.25)",marginBottom:12,fontSize:12,lineHeight:1.5}}>
                {student.hasPortalLogin||student.authUid
                  ?<>Login já vinculado{student.authUid?<> · authUid: <code style={{fontSize:10}}>{student.authUid}</code></>:null}. O aluno entra com o email cadastrado.</>
                  :<>Este aluno pode não ter login Firebase. Defina uma senha e clique em <strong>Criar login</strong> para liberar o portal.</>
                }
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3" style={{marginBottom:8}}>
                <div>
                  <label className="form-label">Nova senha do portal</label>
                  <input type="text" className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="mín. 6 caracteres" value={novaSenha} onChange={e=>setNovaSenha(e.target.value)} autoComplete="new-password"/>
                </div>
                <div style={{display:"flex",alignItems:"flex-end"}}>
                  <button type="button" className="btn btn-primary rounded-xl px-4 py-2.5 text-sm font-semibold w-full" onClick={handleCreateLogin} disabled={saving}>
                    {saving?"Aguarde...":"Criar / vincular login"}
                  </button>
                </div>
              </div>
              {loginMsg&&<div style={{fontSize:12,color:"#60daa8",marginBottom:10,padding:"8px 12px",borderRadius:10,background:"rgba(30,160,110,.12)",border:"1px solid rgba(30,160,110,.3)"}}>{loginMsg}</div>}
              <div className="form-section-title">Contrato</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label className="form-label">Tipo de Contrato</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.contrato} onChange={e=>setD("contrato",e.target.value)}>
                    {CONTRATOS.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Duração</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.duracao} onChange={e=>setD("duracao",e.target.value)}/></div>
                <div><label className="form-label">Data de Início</label><input type="date" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.dataInicio} onChange={e=>setD("dataInicio",e.target.value)}/></div>
                <div><label className="form-label">Lição de Início (1–150)</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.licaoInicio} onChange={e=>setD("licaoInicio",e.target.value)}>
                    {Array.from({length:150},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
                  </select>
                </div>
                <div style={{gridColumn:"1/-1"}}>
                  <label className="form-label">Dias das Aulas</label>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:4}}>
                    {DIAS_SEMANA.map(d=><button key={d} onClick={()=>toggleDia(d)} className={"status-pill "+(dados.diasAulas.includes(d)?"status-pill-ativo":"status-pill-inactive")} style={{fontSize:11,padding:"5px 12px"}}>{d}</button>)}
                  </div>
                </div>
                <div><label className="form-label">Horário das Aulas</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="Ex: 19:00 – 20:00" value={dados.horarioAulas} onChange={e=>setD("horarioAulas",e.target.value)}/></div>
                <div><label className="form-label">Valor Cheio (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorCheio} onChange={e=>setD("valorCheio",e.target.value)}/></div>
                <div><label className="form-label">Descontos (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.descontos} onChange={e=>setD("descontos",e.target.value)}/></div>
                <div><label className="form-label">Valor Final (R$)</label><input type="number" className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.valorFinal} onChange={e=>setD("valorFinal",e.target.value)}/></div>
                <div><label className="form-label">Dia de Vencimento</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.diaVencimento} onChange={e=>setD("diaVencimento",e.target.value)}>
                    <option value="">Selecione...</option>
                    {Array.from({length:31},(_,i)=><option key={i+1} value={i+1}>Dia {i+1}</option>)}
                  </select>
                </div>
                <div><label className="form-label">Nº de Parcelas</label>
                  <select className="w-full input rounded-xl px-3 py-2.5 text-sm" value={dados.numParcelas||18} onChange={e=>setD("numParcelas",parseInt(e.target.value))}>
                    {Array.from({length:24},(_,i)=><option key={i+1} value={i+1}>{i+1}x</option>)}
                  </select>
                </div>
              </div>
              {/* GERAR PARCELAS + CALENDÁRIO */}
              {((dados.dataInicio&&dados.diaVencimento&&dados.valorFinal)||(dados.dataInicio&&dados.diasAulas?.length>0))&&(
                <div style={{marginTop:14,padding:"14px 16px",borderRadius:14,border:"1px solid rgba(30,143,168,.3)",background:"rgba(30,143,168,.06)"}}>
                  <div style={{fontSize:12,color:"var(--font-muted)",marginBottom:12}}>
                    <strong style={{color:"#1e8fa8"}}>Automação</strong> — gere parcelas financeiras e/ou o calendário completo de aulas (Data Prevista em cada lição).
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
                    {dados.dataInicio&&dados.diaVencimento&&dados.valorFinal&&(
                      <button
                        onClick={async()=>{
                          const novas=gerarParcelas(dados.dataInicio,dados.diaVencimento,dados.valorFinal,dados.numParcelas||18,student.financeiro?.parcelas||[]);
                          if(!novas){alert("Preencha: Data de Início, Dia de Vencimento e Valor Final.");return;}
                          if(!confirm(`Gerar ${novas.length} parcelas para ${student.name}?`))return;
                          try{
                            await db.collection("students").doc(student.uid).update({"financeiro.parcelas":novas});
                            alert("Parcelas geradas com sucesso!");
                          }catch(e){alert("Erro: "+e.message);}
                        }}
                        className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2">
                        <Icon name="refresh-cw" size={14}/>Gerar {dados.numParcelas||18} Parcelas
                      </button>
                    )}
                    {dados.dataInicio&&dados.diasAulas?.length>0&&(
                      <button
                        onClick={async()=>{
                          const preview=gerarCalendarioCompleto({
                            dataInicio:dados.dataInicio,diasAulas:dados.diasAulas,licaoInicio:dados.licaoInicio||1,
                            trilhaExistente:student.trilha||{},horarioAulas:dados.horarioAulas||"",
                          });
                          if(!preview){alert("Preencha Data de Início e selecione os Dias das Aulas.");return;}
                          if(!confirm(`Gerar calendário completo com ${preview.total} aulas (${formatDateBR(preview.dataInicio)} → ${formatDateBR(preview.dataFim)}) para ${student.name}? As Data Prevista serão atualizadas na trilha.`))return;
                          try{
                            const result=await aplicarCalendarioAluno(student.uid,{...student,...dados,licaoInicio:parseInt(dados.licaoInicio,10)||1},student.trilha||{});
                            alert(`Calendário gerado! ${result.total} aulas previstas até ${formatDateBR(result.dataFim)}.`);
                          }catch(e){alert("Erro: "+e.message);}
                        }}
                        className="btn rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2"
                        style={{background:"linear-gradient(135deg,#9b7de8,#6b4fc8)",color:"#fff",border:"none"}}>
                        <Icon name="calendar-days" size={14}/>Gerar Calendário Completo
                      </button>
                    )}
                  </div>
                </div>
              )}
              <div className="form-section-title">Status</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATUS_OPTIONS.map(s=>{
                  const cls={lead:"status-pill-lead",interessado:"status-pill-interesse",ativo:"status-pill-ativo",trancado:"status-pill-trancado",evadido:"status-pill-evadido"}[s]||"status-pill-inactive";
                  const lbl={lead:"Lead",interessado:"Interessado",ativo:"Ativo",trancado:"Trancado",evadido:"Evadido"}[s];
                  return <button key={s} onClick={()=>setD("status",s)} className={"status-pill "+(dados.status===s?cls:"status-pill-inactive")} style={{fontSize:12}}>{lbl}</button>;
                })}
              </div>
            </div>
          )}
          {tab===1&&(
            <div>
              <p style={{fontSize:12,color:"var(--font-muted)",marginBottom:16,fontStyle:"italic"}}>Perfil pedagógico e triagem do aluno.</p>
              <div className="form-section-title">1. Faixa Etária</div>
              <div className="triagem-group">{["Menos de 18 anos","18–24 anos","25–34 anos","35–44 anos","45–54 anos","55+ anos"].map(v=><TriOpt key={v} label={v} field="idadeFaixa" value={v}/>)}</div>
              <div className="form-section-title">2. Formação</div>
              <div className="triagem-group">{["Ensino Fundamental Incompleto","Ensino Fundamental Completo","Ensino Médio Incompleto","Ensino Médio Completo","Ensino Superior Incompleto","Ensino Superior Completo","Pós-graduação ou mais"].map(v=><TriOpt key={v} label={v} field="formacao" value={v}/>)}</div>
              <div className="form-section-title">3. Situação Profissional</div>
              <div className="triagem-group">{["Estudante","Autônomo","Funcionário público","CLT","Empreendedor","Outro"].map(v=><TriOpt key={v} label={v} field="ocupacao" value={v}/>)}</div>
              <div style={{marginTop:8}}><label className="form-label">Área de interesse</label><input className="w-full input rounded-xl px-3 py-2.5 text-sm" value={triagem.areaInteresse||""} onChange={e=>setT("areaInteresse",e.target.value)}/></div>
              <div className="form-section-title">4. Experiência com Inglês</div>
              <div style={{marginBottom:10}}><label className="form-label">Já estudou inglês antes?</label>
                <div style={{display:"flex",gap:8,marginTop:4}}>{["Sim","Não"].map(v=><button key={v} onClick={()=>setT("estudouIngles",v)} className={"status-pill "+(triagem.estudouIngles===v?"status-pill-ativo":"status-pill-inactive")} style={{fontSize:12}}>{v}</button>)}</div>
              </div>
              {triagem.estudouIngles==="Sim"&&(<>
                <div style={{marginBottom:8}}><label className="form-label">Onde estudou</label><div className="triagem-group" style={{marginTop:4}}>{["Escola regular","Curso de idiomas","Online","Outro"].map(v=><TriMulti key={v} label={v} field="ondeComo" value={v}/>)}</div></div>
                <div style={{marginBottom:8}}><label className="form-label">Avaliação</label><div style={{marginTop:8}}><Rating field="qualidadeMaterial" label="Material"/><Rating field="qualidadeProfessores" label="Professores"/><Rating field="qualidadeMetodologia" label="Metodologia"/></div></div>
                <div style={{marginBottom:8}}><label className="form-label">Pontos positivos</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.pontosPositivos||""} onChange={e=>setT("pontosPositivos",e.target.value)}/></div>
                <div style={{marginBottom:8}}><label className="form-label">O que poderia melhorar</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.melhorias||""} onChange={e=>setT("melhorias",e.target.value)}/></div>
              </>)}
              <div className="form-section-title">5. Interesses</div>
              <div style={{marginBottom:10}}><label className="form-label">Tópicos</label><div className="triagem-group" style={{marginTop:4}}>{["Cultura (artes, história, tradições)","Tecnologia","Esportes","Moda e tendências","Negócios e economia","Sustentabilidade e meio ambiente"].map(v=><TriMulti key={v} label={v} field="topicos" value={v}/>)}</div></div>
              <div style={{marginBottom:8}}><label className="form-label">Temas que não gosta</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={2} style={{resize:"vertical"}} value={triagem.temasSemInteresse||""} onChange={e=>setT("temasSemInteresse",e.target.value)}/></div>
              <div className="form-section-title">6. Expectativas</div>
              <div style={{marginBottom:10}}><label className="form-label">Objetivo</label><div className="triagem-group" style={{marginTop:4}}>{["Conseguir um emprego","Falar fluentemente em viagens","Passar em testes de proficiência","Melhorar minha confiança na comunicação","Outro"].map(v=><TriOpt key={v} label={v} field="objetivo" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Horas por semana</label><div className="triagem-group" style={{marginTop:4}}>{["Menos de 1 hora","1–2 horas","3–4 horas","Mais de 4 horas"].map(v=><TriOpt key={v} label={v} field="horasSemana" value={v}/>)}</div></div>
              <div style={{marginBottom:10}}><label className="form-label">Prazo esperado</label><div className="triagem-group" style={{marginTop:4}}>{["3 meses","6 meses","1 ano","Mais de 1 ano"].map(v=><TriOpt key={v} label={v} field="prazo" value={v}/>)}</div></div>
              <div><label className="form-label">Observações</label><textarea className="w-full input rounded-xl px-3 py-2 text-sm" rows={3} style={{resize:"vertical"}} value={triagem.observacoes||""} onChange={e=>setT("observacoes",e.target.value)}/></div>
            </div>
          )}
        </div>
        {err&&<div className="err-box" style={{margin:"0 20px 12px"}}>{err}</div>}
        <div className="modal-footer">
          {tab===1&&<button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setTab(0)}>← Dados Pessoais</button>}
          {tab===0&&<button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={()=>setTab(1)}>Perfil →</button>}
          <button className="btn rounded-xl px-4 py-2 text-sm" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary rounded-xl px-5 py-2 text-sm font-semibold inline-flex items-center gap-2" onClick={handleSave} disabled={saving}>
            {saving?<div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>:<Icon name="check-circle" size={15}/>}
            {saving?"Salvando...":"Salvar Alterações"}
          </button>
        </div>
      </div>
    </div>
  );
}

function FluencyCalendar({monthKey,events,onMonthChange,selectedDate,onSelectDate,compact,dayDetailEvents,embedded}){
  const [y,m]=monthKey.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startPad=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  const cells=[];
  for(let i=0;i<startPad;i++)cells.push({empty:true,key:"p"+i});
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells.push({iso,day:d,events:(events||[]).filter(e=>e.date===iso)});
  }
  const selectedEvents=selectedDate?(dayDetailEvents||(events||[]).filter(e=>e.date===selectedDate)):[];
  const evCls={aula:"fc-ev-aula",feriado:"fc-ev-feriado",carnaval:"fc-ev-carnaval",recesso:"fc-ev-recesso",agenda:"fc-ev-custom",google:"fc-ev-google"};
  const inner=(
    <>
      <div className="fc-head">
        <button className="fin-month-btn" onClick={()=>onMonthChange(shiftMonthKey(monthKey,-1))}><Icon name="chevron-left" size={16}/></button>
        <div className="fc-title">{formatMonthYear(monthKey)}</div>
        <button className="fin-month-btn" onClick={()=>onMonthChange(shiftMonthKey(monthKey,1))}><Icon name="chevron-right" size={16}/></button>
        <button className="btn rounded-xl px-3 py-1.5 text-xs" onClick={()=>{
          const today=new Date().toISOString().slice(0,10);
          onMonthChange(getMonthKey(new Date()));
          onSelectDate&&onSelectDate(today);
        }}>Hoje</button>
      </div>
      <div className="fc-grid">
        {["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=><div key={d} className="fc-dow">{d}</div>)}
        {cells.map((c,i)=>{
          if(c.empty)return <div key={c.key} className="fc-day other"/>;
          const closed=isStudioClosed(c.iso);
          return(
            <div key={c.iso} className={"fc-day"+(c.iso===todayStr?" today":"")+(closed?" closed":"")+(selectedDate===c.iso?" ring-2":"")}
              style={selectedDate===c.iso?{boxShadow:"inset 0 0 0 2px rgba(30,143,168,.6)"}:{}} onClick={()=>onSelectDate&&onSelectDate(c.iso)}>
              <div className="fc-day-num">{c.day}</div>
              {!compact&&c.events.slice(0,3).map((e,j)=><div key={j} className={"fc-ev "+(evCls[e.type]||"fc-ev-custom")} title={e.label}>{e.time?e.time.split("–")[0].trim()+" · ":""}{e.label}</div>)}
              {compact&&c.events.length>0&&<div style={{display:"flex",gap:3,marginTop:2,flexWrap:"wrap"}}>
                {c.events.slice(0,4).map((e,j)=><span key={j} style={{width:6,height:6,borderRadius:99,background:e.color||"#1e8fa8",display:"inline-block"}}/>)}
              </div>}
            </div>
          );
        })}
      </div>
      {selectedDate&&onSelectDate&&(
        <div className="fc-side">
          <div className="fc-side-title">{formatDateBR(selectedDate)}</div>
          {selectedEvents.length===0
            ?<div style={{fontSize:12,color:"var(--font-muted)"}}>Nenhum evento neste dia.</div>
            :selectedEvents.map((e,i)=><div key={i} style={{fontSize:12,marginBottom:6,display:"flex",gap:6,alignItems:"flex-start"}}>
              <span className={"fc-ev "+(evCls[e.type]||"fc-ev-custom")} style={{flexShrink:0,padding:"1px 5px",fontSize:8}}>{e.type==="aula"?"Aula":e.type==="google"?"Google":e.type==="agenda"?"Agenda":e.type}</span>
              <span style={{fontWeight:700,color:e.color||"var(--font)"}}>{e.time?e.time+" · ":""}{e.label}</span>
            </div>)}
        </div>
      )}
    </>
  );
  return embedded?inner:<div className="fc-wrap">{inner}</div>;
}

function AdminAgendaDashboard({students,onBack}){
  const hoje=new Date();
  const hojeISO=hoje.toISOString().slice(0,10);
  const [agenda,setAgenda]=useState({todos:[],eventos:[]});
  const [showAgendar,setShowAgendar]=useState(false);
  const [newTodo,setNewTodo]=useState("");
  const [googleEvents,setGoogleEvents]=useState([]);
  const [googleSyncing,setGoogleSyncing]=useState(false);
  const [googleLastSync,setGoogleLastSync]=useState(null);
  const [googleError,setGoogleError]=useState(null);

  useEffect(()=>db.collection("studio").doc("agenda").onSnapshot(doc=>{
    const d=doc.exists?doc.data():{};
    setAgenda({todos:d.todos||[],eventos:d.eventos||[]});
  }),[]);

  async function syncGoogle(){
    setGoogleSyncing(true);setGoogleError(null);
    try{
      const events=await fetchGoogleCalendarEvents();
      setGoogleEvents(events);
      setGoogleLastSync(new Date());
      if(!events.length)setGoogleError("Nenhum evento Google. Torne o calendário público nas configurações.");
    }catch(e){setGoogleError("Falha ao sincronizar Google Calendar.");}
    finally{setGoogleSyncing(false);}
  }
  useEffect(()=>{syncGoogle();},[]);

  async function saveAgenda(patch){
    const ref=db.collection("studio").doc("agenda");
    const cur=await ref.get();
    const base=cur.exists?cur.data():{todos:[],eventos:[]};
    await ref.set({...base,...patch},{merge:true});
  }

  const agendaExtra=useMemo(()=>({eventos:agenda.eventos,googleEvents}),[agenda.eventos,googleEvents]);

  const proxima=useMemo(()=>findProximaAulaUnified(students,agendaExtra),[students,agendaExtra]);
  const aulasHoje=useMemo(()=>getAulasDoDia(students,hojeISO,agendaExtra),[students,hojeISO,agendaExtra]);
  const todosPendentes=(agenda.todos||[]).filter(t=>!t.done).length;

  return(
    <div>
      <button className="btn rounded-xl px-3 py-2 text-sm mb-4 inline-flex items-center gap-2" onClick={onBack}><Icon name="arrow-left" size={14}/> Voltar ao Dashboard</button>

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#f0cc60",fontSize:18}}>{proxima?formatDateBR(proxima.date).slice(0,5):"—"}</div><div className="dash-stat-label">Próxima Aula</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#1e8fa8"}}>{aulasHoje.length}</div><div className="dash-stat-label">Aulas Hoje</div></div>
        <div className="dash-stat-card"><div className="dash-stat-num" style={{color:"#c0a0f8"}}>{todosPendentes}</div><div className="dash-stat-label">Tarefas Pendentes</div></div>
      </div>

      <div className="agenda-grid mb-5">
        <div className="space-y-4">
          <div className="agenda-next">
            <div className="agenda-next-label"><Icon name="zap" size={12} style={{display:"inline",marginRight:4}}/>Próxima Aula</div>
            {proxima
              ?<>
                <div className="agenda-next-title">{proxima.student?.name||"Aluno"}</div>
                <div style={{fontSize:13,color:"var(--font-muted)"}}>{formatDateBR(proxima.date)} · {proxima.time||"—"}</div>

  );
}

function StudentCalendarView({uid,trilhaData,schedule,studentName}){
  const studentAsArray=useMemo(()=>[{
    uid,name:studentName||"Aluno",status:"ativo",
    diasAulas:schedule?.diasAulas||[],horarioAulas:schedule?.horarioAulas||"",
    dataInicio:schedule?.dataInicio||"",trilha:trilhaData||{},calendarioCompleto:schedule?.calendarioCompleto||[],
  }],[uid,studentName,schedule,trilhaData]);
  const agendaExtra=useMemo(()=>({onlyUid:uid}),[uid]);
  const proximas=useMemo(()=>{
    const today=new Date().toISOString().slice(0,10);
    const out=[];
    for(let i=0;i<3;i++){
      const mk=shiftMonthKey(getMonthKey(new Date()),i);
      buildAgendaEventsForMonth(studentAsArray,mk,agendaExtra).forEach(e=>{
        if(e.type==="aula"&&e.date>=today)out.push(e);
      });
    }
    return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  },[studentAsArray,agendaExtra]);

  return(
    <div className="space-y-4">
      {schedule?.dataInicio&&(
        <div className="glass rounded-2xl p-4" style={{borderColor:"rgba(155,125,232,.25)"}}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#9b7de8",marginBottom:6}}>Seu Curso</div>
          <div style={{fontSize:14,fontWeight:700}}>{schedule.program||"Fluency Studio"}</div>
          <div style={{fontSize:12,color:"var(--font-muted)",marginTop:4}}>
            Início {formatDateBR(schedule.dataInicio)}
            {schedule.diasAulas?.length?` · ${schedule.diasAulas.join(", ")}`:""}
            {schedule.horarioAulas?` · ${schedule.horarioAulas}`:""}
          </div>
          {schedule.calendarioResumo&&<div style={{fontSize:11,color:"var(--font-muted)",marginTop:6}}>{schedule.calendarioResumo.total} aulas previstas · até {formatDateBR(schedule.calendarioResumo.dataFim)}</div>}
        </div>
      )}
      {proximas.length>0&&(
        <div className="glass rounded-2xl p-4">
          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Próximas Aulas</div>
          {proximas.map((e,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"6px 0",borderBottom:i<proximas.length-1?"1px solid var(--divider)":"none"}}>
            <span style={{fontWeight:600}}>{e.label}</span>
            <span style={{color:"var(--font-muted)"}}>{formatDateBR(e.date).slice(0,5)}</span>
          </div>)}
        </div>
      )}
      <PlatformCalendar students={studentAsArray} agendaExtra={agendaExtra}/>
    </div>
  );
}

/* ── LISTA DE ALUNOS ── */
function AdminAlunos({students,onSelectUid}){
  const [filtroStatus,setFiltroStatus]=useState("todos");
  const [busca,setBusca]=useState("");
  const [editStudent,setEditStudent]=useState(null);
  const [repairTarget,setRepairTarget]=useState(null);
  const [repairPass,setRepairPass]=useState("");
  const [repairBusy,setRepairBusy]=useState(false);
  const [repairMsg,setRepairMsg]=useState("");
  const [repairErr,setRepairErr]=useState("");

  const alunosFiltrados=useMemo(()=>{
    let list=filterStudentsByStatus(students,filtroStatus);
    const q=busca.trim().toLowerCase();
    if(q){
      list=list.filter(s=>
        (s.name||"").toLowerCase().includes(q)||
        (s.email||"").toLowerCase().includes(q)||
        (s.phone||"").toLowerCase().includes(q)
      );
    }
    return [...list].sort((a,b)=>(a.name||"").localeCompare(b.name||"","pt-BR"));
  },[students,filtroStatus,busca]);
  const contadores=useMemo(()=>getAdminStatusCounts(students),[students]);

  async function runRepair(){
    if(!repairTarget)return;
    setRepairBusy(true);setRepairErr("");setRepairMsg("");
    try{
      const email=(repairTarget.email||"").trim().toLowerCase();
      if(!email){setRepairErr("Este aluno não tem email cadastrado. Edite o perfil e salve o email primeiro.");setRepairBusy(false);return;}
      // Normaliza email no doc (evita falha de busca por maiúsculas)
      await db.collection("students").doc(repairTarget.uid).set({email},{merge:true});
      const res=await linkStudentPortalLogin(repairTarget.uid,email,repairPass);
      if(res.alreadyExists){
        setRepairMsg("Conta Auth já existia. Cadastro vinculado a "+email+". Peça para ela usar «Esqueci a senha» se não lembrar.");
      }else{
        setRepairMsg("Login criado para "+email+". Senha: a que você digitou agora.");
      }
      setRepairPass("");
    }catch(e){
      setRepairErr(e.message||String(e));
    }finally{
      setRepairBusy(false);
    }
  }

  return(
    <div>
      {editStudent&&<ModalEdicao student={editStudent} onClose={()=>setEditStudent(null)} onSaved={()=>setEditStudent(null)}/>}
      {repairTarget&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setRepairTarget(null);setRepairMsg("");setRepairErr("");}}}>
          <div className="modal-box" style={{maxWidth:440}}>
            <div className="modal-header">
              <div>
                <div style={{fontWeight:800,fontSize:15,fontFamily:"'Sora',sans-serif"}}>Reparar acesso ao portal</div>
                <div style={{fontSize:11,opacity:.75}}>{repairTarget.name} · {repairTarget.email||"sem email"}</div>
              </div>
              <button onClick={()=>{setRepairTarget(null);setRepairMsg("");setRepairErr("");}} style={{background:"rgba(255,255,255,.12)",border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"#fff"}}><Icon name="x" size={16}/></button>
            </div>
            <div className="modal-body">
              <p style={{fontSize:13,color:"var(--font-muted)",marginBottom:12,lineHeight:1.55}}>
                Cria ou vincula o login Firebase a este cadastro (necessário para alunos antigos).
              </p>
              <label className="form-label">Senha temporária (mín. 6)</label>
              <input type="text" className="w-full input rounded-xl px-3 py-2.5 text-sm" placeholder="ex: fluency2026" value={repairPass} onChange={e=>setRepairPass(e.target.value)} autoComplete="new-password"/>
              {repairErr&&<div className="err-box" style={{marginTop:12}}>{repairErr}</div>}
              {repairMsg&&<div style={{marginTop:12,padding:"10px 12px",borderRadius:10,background:"rgba(30,160,110,.12)",border:"1px solid rgba(30,160,110,.3)",fontSize:13,color:"#60daa8"}}>{repairMsg}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>{setRepairTarget(null);setRepairMsg("");setRepairErr("");}}>Fechar</button>
              <button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={runRepair} disabled={repairBusy||!repairPass.trim()}>
                {repairBusy?"Salvando...":"Criar / vincular login"}
              </button>
            </div>
          </div>
        </div>
      )}
      <div style={{marginBottom:14,position:"relative"}}>
        <Icon name="search" size={14} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",opacity:.5}}/>
        <input className="input-light" style={{paddingLeft:34,width:"100%"}} placeholder="Buscar por nome, email ou telefone... (ex: lorrayne)" value={busca} onChange={e=>setBusca(e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:20}}>
        {ADMIN_STATUS_FILTERS.map(f=>(
          <button key={f.v} className={"status-pill "+(filtroStatus===f.v?f.cls:"status-pill-inactive")} onClick={()=>setFiltroStatus(f.v)} style={{fontSize:11}}>
            {f.l}{contadores[f.v]!==undefined&&<span style={{marginLeft:5,background:"rgba(255,255,255,.15)",borderRadius:99,padding:"1px 6px",fontSize:10}}>{contadores[f.v]}</span>}
          </button>
        ))}
      </div>
      {alunosFiltrados.length===0
        ?<div className="glass rounded-2xl p-12 text-center" style={{color:"var(--font-muted)"}}>
            <Icon name="users" size={40} className="mx-auto mb-4 opacity-30"/>
            <p>{busca.trim()?"Nenhum aluno encontrado na busca.":filtroStatus==="todos"?"Nenhum aluno cadastrado ainda.":"Nenhum aluno com este status. Tente o filtro Todos."}</p>
          </div>
        :(
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {alunosFiltrados.map(s=>{
              try{
                const merged=mergeBooks(s.trilha||{});let done=0,total=0;

                const mod=getCurrentModule(merged,s.modulosOcultos);
                const finVencida=resolveFinanceSnapshot(s.financeiro?.parcelas||[]).isLate;
                return(
                  <div key={s.uid} className="student-card" style={{position:"relative"}}>
                    <div style={{position:"absolute",top:10,right:10,display:"flex",gap:6,zIndex:2}}>
                      {!(s.hasPortalLogin||s.authUid)&&(
                        <button onClick={e=>{e.stopPropagation();setRepairTarget(s);setRepairPass("");setRepairMsg("");setRepairErr("");}}
                          style={{background:"rgba(232,169,76,.18)",border:"1px solid rgba(232,169,76,.45)",borderRadius:8,padding:"4px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#c8860a"}}
                          title="Criar/vincular login do portal">
                          <Icon name="log-in" size={11}/>Acesso
                        </button>
                      )}
                      <button onClick={e=>{e.stopPropagation();setEditStudent(s);}}

                        {s.contrato&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:99,background:"var(--badge)",border:"1px solid var(--divider)",color:"var(--font-muted)"}}>{CONTRATOS.find(c=>c.v===s.contrato)?.l||s.contrato}</span>}
                      </div>
                      <div className="flex items-center justify-between text-xs mb-1" style={{color:"var(--font-muted)"}}>
                        <span>Progresso</span><span className="font-semibold">{pct}%</span>
                      </div>
                      <div className="h-1.5 rounded-full overflow-hidden" style={{background:"var(--badge)"}}>
                        <div className="h-full rounded-full progress-fill" style={{width:pct+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/>
                      </div>
                      <div style={{fontSize:11,color:"var(--font-muted)",marginTop:6}}>{done} de {total} lições concluídas</div>
                    </div>
                  </div>
                );
              }catch(cardErr){
                console.error("card aluno",s?.uid,cardErr);
                return(
                  <div key={s.uid||Math.random()} className="student-card" onClick={()=>onSelectUid(s.uid)} style={{cursor:"pointer"}}>
                    <div className="font-bold">{s.name||s.email||"Aluno"}</div>
                    <div style={{fontSize:12,color:"var(--font-muted)",marginTop:6}}>Dados incompletos — clique para abrir</div>
                  </div>
                );
              }
            })}
          </div>
        )
      }
    </div>
  );
}

/* ── ADMINAPP ── */
function AdminApp({user}){
  const [students,setStudents]=useState(null);
  const [studentsErr,setStudentsErr]=useState("");
  const [pendentesCount,setPendentesCount]=useState(0);
  const [selectedUid,setSelectedUid]=useState(null);
  const [selectedInitialTab,setSelectedInitialTab]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [adminView,setAdminView]=useState("dashboard");

  useEffect(()=>{
    const unsub=db.collection("students").onSnapshot(snap=>{
      try{
        const list=snap.docs.map(d=>normalizeStudent(d.id,d.data()));
        list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","pt-BR"));
        setStudents(list);
        setStudentsErr("");
        // Heal silencioso: email em minúsculas (evita falha de lookup case-sensitive)
        snap.docs.forEach(d=>{
          const raw=d.data().email;
          if(typeof raw==="string"&&raw.trim()){
            const norm=raw.trim().toLowerCase();
            if(raw!==norm){
              d.ref.set({email:norm},{merge:true}).catch(()=>{});
            }
          }
        });
      }catch(e){
        console.error("AdminApp normalize:",e);
        setStudents(snap.docs.map(d=>({uid:d.id,...d.data(),name:d.data().name||d.data().nome||"Aluno"})));
        setStudentsErr("");
      }
    },err=>{
      console.error("AdminApp students:",err);
      setStudents([]);
      setStudentsErr("Não foi possível carregar os alunos. Verifique a conexão e as regras do Firestore.");
    });
    return()=>unsub();
  },[]);
  useEffect(()=>db.collection("students").where("status","==","pendente_aprovacao").onSnapshot(snap=>setPendentesCount(snap.size),()=>setPendentesCount(0)),[]);

  if(selectedUid)return <StudentDetail uid={selectedUid} isAdmin initialTab={selectedInitialTab} onBack={()=>{setSelectedUid(null);setSelectedInitialTab(null);if(selectedInitialTab)setAdminView("financeiro");}}/>;

  const viewTitles={dashboard:"Painel do Professor",alunos:"Alunos",cadastros:"Cadastros Pendentes",financeiro:"Financeiro",agenda:"Agenda"};
  const showBack=adminView!=="dashboard";

  return(
    <div className="min-h-screen">
      {showModal&&<ModalCadastro onClose={()=>setShowModal(false)} onSaved={()=>setShowModal(false)}/>}
      <LogoBar isAdmin={true} showLogout={true}/>
      <div className="admin-toolbar px-4 py-4 sticky top-[49px] z-40" style={{background:"var(--header)",backdropFilter:"blur(14px)",borderBottom:"1px solid var(--divider)"}}>
        <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {showBack&&(
              <button className="btn" style={{padding:"6px 10px",borderRadius:8,display:"flex",alignItems:"center",gap:6}} onClick={()=>setAdminView("dashboard")}>
                <Icon name="arrow-left" size={14}/><span style={{fontSize:12}}>Dashboard</span>
              </button>
            )}
            <div>
              <h1 className="text-xl font-bold">{viewTitles[adminView]||"Painel"}</h1>
              <p style={{fontSize:12,color:"var(--font-muted)"}}>Fluency Studio · Área Administrativa</p>
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {pendentesCount>0&&(
              <button className="btn rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>setAdminView("cadastros")}
                style={{background:"linear-gradient(135deg,rgba(232,169,76,.25),rgba(240,204,96,.15))",border:"1px solid rgba(232,169,76,.45)",color:"#c8860a"}}>
                <Icon name="clipboard-check" size={16}/> {pendentesCount} pendente{pendentesCount>1?"s":""}
              </button>
            )}
            <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>setShowModal(true)}>
              <Icon name="user-plus" size={16}/> Novo Aluno
            </button>
          </div>
        </div>
      </div>
      <main className="px-5 pb-10 max-w-6xl mx-auto pt-6">
        {studentsErr&&(
          <div className="err-box mb-4" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <span>{studentsErr}</span>
            <button className="btn rounded-lg px-3 py-1.5 text-xs" onClick={()=>window.location.reload()}>Recarregar</button>
          </div>
        )}
        {!students
          ?<LoadingScreen/>
          :adminView==="dashboard"
          ?<AdminDashboard students={students} pendentesCount={pendentesCount} onNavigate={id=>{if(id==="alunos")setAdminView("alunos");if(id==="cadastros")setAdminView("cadastros");if(id==="financeiro")setAdminView("financeiro");if(id==="agenda")setAdminView("agenda");}}/>
          :adminView==="cadastros"
          ?<AdminCadastrosPendentes onBack={()=>setAdminView("dashboard")} onLaunched={uid=>{setSelectedUid(uid);setSelectedInitialTab(null);}}/>
          :adminView==="financeiro"
          ?<AdminFinanceiroDashboard students={students} onBack={()=>setAdminView("dashboard")} onSelectStudent={uid=>{setSelectedUid(uid);setSelectedInitialTab("financeiro");}}/>
          :adminView==="agenda"
          ?<AdminAgendaDashboard students={students} onBack={()=>setAdminView("dashboard")}/>
          :<AdminAlunos students={students} onSelectUid={uid=>{setSelectedUid(uid);setSelectedInitialTab(null);}}/>
        }
      </main>
      <IVi mode="admin"/>
    </div>
  );
}

function WaitingApproval({email}){
  return(
    <div className="min-h-screen flex flex-col items-center justify-center px-5">
      <div className="login-logo-wrap"><BrandLogo large/></div>
      <div className="w-full max-w-md glass rounded-2xl p-8 text-center">
        <div style={{width:64,height:64,borderRadius:"50%",background:"linear-gradient(135deg,#f0cc60,#e8a94c)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",boxShadow:"0 8px 28px rgba(232,169,76,.35)"}}>
          <Icon name="clipboard-check" size={28} style={{color:"#fff"}}/>
        </div>
        <h1 className="text-xl font-bold mb-2" style={{fontFamily:"'Sora',sans-serif"}}>Cadastro em análise</h1>
        <p className="muted text-sm" style={{lineHeight:1.65,marginBottom:16}}>
          Recebemos seu formulário! O professor Victor está revisando seus dados e em breve libera seu acesso completo ao portal.
        </p>
        {email&&<p className="text-xs muted">Conta: <strong>{email}</strong></p>}
        <a href={WPP_VICTOR} target="_blank" rel="noopener" className="btn btn-primary rounded-xl px-5 py-3 mt-6 inline-flex items-center gap-2 text-sm font-semibold" style={{textDecoration:"none"}}>
          <Icon name="message-circle" size={16}/> Falar com o Victor
        </a>
        <button className="btn rounded-xl px-4 py-2.5 mt-3 text-sm w-full" onClick={()=>auth.signOut()}>Sair</button>
      </div>
    </div>
  );
}

function PendingApprovalGate({uid,userEmail}){
  const [status,setStatus]=useState(undefined);
  const [gateErr,setGateErr]=useState("");
  useEffect(()=>{
    if(!uid){setStatus(null);return;}
    const unsub=db.collection("students").doc(uid).onSnapshot(doc=>{
      // Firebase compat: doc.exists é propriedade booleana (NÃO método)
      if(doc.exists){
        const n=normalizeStudent(uid,doc.data());
        setStatus(n.status||null);
        setGateErr("");
      }else{
        setStatus(null);
        setGateErr("");
      }
    },err=>{
      console.error("PendingApprovalGate:",err);
      setStatus(null);
      setGateErr("Erro ao carregar perfil. Recarregue a página (Ctrl+Shift+R).");
    });
    return()=>unsub();
  },[uid]);
  if(status===undefined)return <LoadingScreen/>;
  if(status==="pendente_aprovacao")return <WaitingApproval email={userEmail}/>;
  if(status==="rejeitado")return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm mb-4">Seu cadastro não foi aprovado. Entre em contato com o professor Victor.</p>
        <a href={WPP_VICTOR} className="btn btn-primary rounded-xl px-4 py-2.5 text-sm" style={{textDecoration:"none",display:"inline-block"}}>WhatsApp</a>
        <button className="btn rounded-xl px-4 py-2.5 mt-3 text-sm w-full" onClick={()=>auth.signOut()}>Sair</button>
      </div>
    </div>
  );
  if(gateErr)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <p className="text-sm mb-4" style={{color:"#f0a0a8"}}>{gateErr}</p>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 text-sm w-full" onClick={()=>window.location.reload()}>Recarregar</button>
        <button className="btn rounded-xl px-4 py-2.5 mt-3 text-sm w-full" onClick={()=>auth.signOut()}>Sair</button>
      </div>
    </div>
  );
  return <StudentDetail uid={uid} isAdmin={false}/>;
}

/** Resolve students/{uid} OU doc legado pelo email (alunos antigos). */
function StudentSession({user}){
  const [studentUid,setStudentUid]=useState(undefined);
  const [resolveErr,setResolveErr]=useState("");
  useEffect(()=>{
    let cancelled=false;
    setStudentUid(undefined);
    setResolveErr("");
    (async()=>{
      try{
        const id=await resolveStudentDocId(user.uid,user.email);
        if(!cancelled)setStudentUid(id||user.uid);
      }catch(e){
        console.error("StudentSession resolve:",e);
        if(!cancelled){
          setStudentUid(user.uid);
          setResolveErr("Não foi possível localizar seu cadastro automaticamente.");
        }
      }
    })();
    return()=>{cancelled=true;};
  },[user.uid,user.email]);
  if(studentUid===undefined)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <div className="w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
        <p className="muted text-sm">Conectando seu perfil...</p>
        {resolveErr&&<p className="text-xs mt-3" style={{color:"#f0a0a8"}}>{resolveErr}</p>}
      </div>
    </div>
  );
  return <PendingApprovalGate uid={studentUid} userEmail={user.email}/>;
}

function App(){
  const [user,setUser]=useState(undefined);
  const [authErr,setAuthErr]=useState("");
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(u=>setUser(u||null),err=>{
      console.error("onAuthStateChanged:",err);
      setUser(null);
      setAuthErr("Falha na autenticação. Recarregue a página.");
    });
    const t=setTimeout(()=>{
      setAuthErr(prev=>prev||"Conexão lenta. Verifique sua internet e recarregue (Ctrl+Shift+R).");
    },10000);
    return()=>{unsub();clearTimeout(t);};
  },[]);
  useEffect(()=>{
    if(user!==undefined)setAuthErr("");
  },[user]);
  if(user===undefined)return(
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="chip rounded-2xl px-8 py-6 text-center glass max-w-sm">
        <div className="w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
        <p className="muted text-sm">Carregando portal...</p>
        {authErr&&<p className="text-xs mt-3" style={{color:"#f0a0a8"}}>{authErr}</p>}
      </div>
    </div>
  );
  if(!user)return <Login/>;
  if(user.uid===ADMIN_UID)return <AdminApp user={user}/>;
  return <StudentSession user={user}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
