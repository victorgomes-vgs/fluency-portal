    .btn-primary{border:1px solid rgba(44,160,180,.55);background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;}
    .btn-primary:hover{filter:brightness(1.10);}
    .btn-danger{border:1px solid rgba(200,60,80,.35);background:rgba(200,60,80,.10);color:#e07080;}
    .btn-danger:hover{background:rgba(200,60,80,.18);}

    /* ── INPUTS ── */
    .input{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.13);outline:none;color:var(--font);font-family:'Outfit',sans-serif;}
    .input:focus{border-color:rgba(44,160,180,.75);box-shadow:0 0 0 3px rgba(44,160,180,.14);}
    .input-light{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.11);outline:none;color:var(--font);border-radius:8px;padding:5px 10px;font-size:13px;width:100%;font-family:'Outfit',sans-serif;}

    /* ── TAB BAR ── */
    .tab-bar{display:flex;background:var(--tabbar);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:3px;overflow-x:auto;}
    .tab-btn{flex:1;padding:9px 10px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;border:none;background:transparent;color:rgba(180,200,220,.45);transition:all .18s;white-space:nowrap;min-width:fit-content;}

    .tab-btn-active{background:linear-gradient(135deg,#1e8fa8,#145f7a);color:#fff;border:1px solid rgba(44,160,180,.40)!important;box-shadow:0 2px 14px rgba(30,143,168,.25);}

    .book-m1:hover{background:linear-gradient(135deg,rgba(26,138,158,.26),rgba(13,82,98,.18));}

    .book-m2:hover{background:linear-gradient(135deg,rgba(42,100,190,.26),rgba(26,58,140,.18));}
    .book-m3{background:linear-gradient(135deg,rgba(26,154,122,.18),rgba(13,90,72,.12));border:1px solid rgba(26,154,122,.32);color:#a0e8cc;}
    .book-m3:hover{background:linear-gradient(135deg,rgba(26,154,122,.26),rgba(13,90,72,.18));}
    .book-m4{background:linear-gradient(135deg,rgba(110,84,200,.18),rgba(52,26,140,.12));border:1px solid rgba(110,84,200,.32);color:#c8b8f8;}
    .book-m4:hover{background:linear-gradient(135deg,rgba(110,84,200,.26),rgba(52,26,140,.18));}
    .book-m5{background:linear-gradient(135deg,rgba(42,130,190,.18),rgba(26,80,140,.12));border:1px solid rgba(42,130,190,.32);color:#a8d4f8;}

    .ap-preset{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;background:rgba(255,255,255,.04);}

    /* ── MISC ── */
    ::-webkit-scrollbar{width:5px;height:5px;}

    ::-webkit-scrollbar-thumb{background:rgba(30,143,168,.28);border-radius:99px;}
    .progress-fill{transition:width .6s ease;}

  <script>
  // Carrega tema do Firebase assim que possível e aplica CSS variables
  (function(){
    function applyTheme(t){
      if(!t)return;
      const r=document.documentElement.style;
      if(t.bg)r.setProperty('--bg',t.bg);
      if(t.font)r.setProperty('--font',t.font);
      if(t.card)r.setProperty('--card',t.card);
      if(t.lesson)r.setProperty('--lesson',t.lesson);
      if(t.detail)r.setProperty('--detail',t.detail);
      if(t.header)r.setProperty('--header',t.header);
      if(t.tabbar)r.setProperty('--tabbar',t.tabbar);
      if(t.badge)r.setProperty('--badge',t.badge);
      if(t.btn)r.setProperty('--btn',t.btn);
      if(t.done)r.setProperty('--done',t.done);
      if(t.doneBorder)r.setProperty('--done-border',t.doneBorder);
      if(t.doneText)r.setProperty('--done-text',t.doneText);
    }
    window.__applyTheme=applyTheme;
    // Tenta carregar antes do React montar
    try{
      firebase.firestore().collection('config').doc('aparencia').get().then(doc=>{
        if(doc.exists)applyTheme(doc.data());
      });
    }catch(e){}
  })();
  </script>

function playLessonSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
  [[440,0],[660,.07],[880,.13]].forEach(([freq,delay])=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';
    osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);osc.frequency.exponentialRampToValueAtTime(freq*1.5,ctx.currentTime+delay+.1);
    gain.gain.setValueAtTime(.07,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.28);
    osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+.3);});}catch(e){}
}

function generateBooks(){
  const books=[];let g=0;
  for(let bi=1;bi<=6;bi++){
    const items=[];
    for(let bl=1;bl<=5;bl++){
      for(let sq=1;sq<=10;sq++){
        g++;const isReview=(sq===10);const lt=isReview?null:([3,6,9].includes(sq)?"output":"input");
        items.push({id:isReview?`b${bi}-r${bl}`:`b${bi}-l${g}`,pos:g,type:isReview?"review":"lesson",lessonType:lt,num:g,title:getLessonTitle(g),status:"pendente",date:"",obs:"",link:"",attendance:"",evaluation:"",linkMaterial:"",linkAula:"",linkChamada:"",linkTarefa:""});
      }
    }
    books.push({bookIdx:bi,items});
  }
  return books;
}
const BOOKS_TEMPLATE=generateBooks();
function mergeBooks(trilhaData){return BOOKS_TEMPLATE.map(b=>({...b,items:b.items.map(i=>({...i,...(trilhaData[i.id]||{})}))}));}
function getCurrentModule(books){for(let i=books.length-1;i>=0;i--){if(books[i].items.some(it=>it.status==="andamento"||it.status==="concluida"))return i+1;}return 1;}

function FinanceiroStrip({financeiro,onGoToFinanceiro}){
  const tipo=financeiro?.tipo||"mensalidade";const parcelas=financeiro?.parcelas||[];const creditosTotal=financeiro?.creditosTotal||0;
  const hasData=parcelas.length>0||(tipo==="creditos"&&creditosTotal>0);
  if(!hasData)return null;
  const sorted=[...parcelas].sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const lastPaid=[...sorted].reverse().find(p=>p.status==="paga");
  const next=sorted.find(p=>p.status!=="paga");
  let statusLabel="",statusCls="";
  if(tipo==="creditos"){const r=creditosTotal-(financeiro?.creditosUsados||0);statusLabel=`${r} Crédito${r!==1?"s":""} Restante${r!==1?"s":""}`;statusCls="fin-creditos";}
  else if(sorted.some(p=>p.status==="vencida")){statusLabel="Atrasado";statusCls="fin-vencida";}
  else if(sorted.some(p=>p.status==="paga")){statusLabel="Em Dia";statusCls="fin-paga";}
  return(
    <div onClick={onGoToFinanceiro} style={{background:"#0c1524",borderRadius:12,padding:"10px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,marginTop:12,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}><Icon name="dollar-sign" size={13} style={{color:"rgba(44,122,142,1)"}}/><span style={{color:"#eaf2f7",fontWeight:700,fontSize:11,letterSpacing:"0.07em",textTransform:"uppercase"}}>Financeiro</span></div>
      <div style={{width:1,height:14,background:"rgba(255,255,255,.15)",flexShrink:0}}/>
      {lastPaid&&<span style={{color:"rgba(234,242,247,.65)",fontSize:12}}>Última: <strong style={{color:"#eaf2f7"}}>{lastPaid.mes}</strong> <span className="fin-badge fin-paga" style={{fontSize:10}}>Paga</span></span>}
      {next&&<><div style={{width:1,height:14,background:"rgba(255,255,255,.15)",flexShrink:0}}/><span style={{color:"rgba(234,242,247,.65)",fontSize:12}}>Próx: <strong style={{color:"#eaf2f7"}}>{next.mes}</strong>{next.dataVencimento&&<span> · {formatDateBR(next.dataVencimento)}</span>}</span></>}
      {statusLabel&&<span className={"fin-badge "+statusCls} style={{marginLeft:"auto",fontSize:10}}>{statusLabel}</span>}
    </div>
  );
}

              <div><div className="detail-label">Data de Nascimento</div><input type="date" className="input-light mt-1" value={editFields.birthday||""} onChange={e=>setEditFields(p=>({...p,birthday:e.target.value}))}/></div>
            </div>
            <div className="flex gap-2"><button className="btn btn-primary rounded-xl px-4 py-2 text-sm font-semibold" onClick={saveProfile}>Salvar</button><button className="btn rounded-xl px-4 py-2 text-sm" onClick={()=>setEditProfile(false)}>Cancelar</button></div>
          </div>}
        </div>
        <div className="tab-bar mb-5">{tabs.map(t=><button key={t.id} className={"tab-btn"+(activeTab===t.id?" tab-btn-active":"")} onClick={()=>setActiveTab(t.id)}>{t.label}</button>)}</div>
        {activeTab==="financeiro"&&<FinanceiroSection uid={uid} isAdmin={isAdmin} financeiro={financeiro||FINANCEIRO_DEFAULT}/>}
        {activeTab==="trilha"&&<TrilhaSection uid={uid} isAdmin={isAdmin}/>}
        {activeTab==="recursos"&&<RecursosSection uid={uid} isAdmin={isAdmin} links={links}/>}
        {activeTab==="diario"&&<DiarioSection uid={uid} isAdmin={isAdmin}/>}
        {activeTab==="config"&&isAdmin&&<AparenciaSection/>}
      </main>
      <IVictor/>
    </div>
  );
}


// ── SISTEMA DE TEMAS ────────────────────────────────────────────────────────
const BG_PRESETS = [
  {id:"dark-blue",   label:"Preto + Azul",    value:"linear-gradient(160deg,#05080f 0%,#080e1c 35%,#0b1328 60%,#0d1a35 80%,#0a1528 100%)"},
  {id:"blue-purple", label:"Azul + Roxo",     value:"linear-gradient(160deg,#08051a 0%,#0d0a2e 30%,#150f3e 55%,#1a1050 75%,#0f0828 100%)"},
  {id:"white-gray",  label:"Branco + Cinza",  value:"linear-gradient(160deg,#f8f9fb 0%,#eef0f4 35%,#e4e8ee 60%,#dde2ea 80%,#e8ecf2 100%)"},
];
const FONT_PRESETS = [
  {id:"f1",label:"Branco",        value:"#ffffff"},
  {id:"f2",label:"Branco-gelo",   value:"#f0f4f8"},
  {id:"f3",label:"Cinza-claro",   value:"#c8d4e0"},
  {id:"f4",label:"Preto",         value:"#0a0a0a"},
  {id:"f5",label:"Cinza-escuro",  value:"#2a3240"},
  {id:"f6",label:"Teal",          value:"#1e8fa8"},
  {id:"f7",label:"Dourado",       value:"#c8a84b"},
];
const CARD_PRESETS = [
  {id:"c1",label:"Deep Navy",   value:"#1c2438"},
  {id:"c2",label:"Branco",      value:"#ffffff"},
  {id:"c3",label:"Cinza-escuro",value:"#1e1e2e"},
  {id:"c4",label:"Grafite",     value:"#2a2d35"},
  {id:"c5",label:"Azul-aço",    value:"#162032"},
];
const DONE_PRESETS = [
  {id:"d1",label:"Verde-esmeralda", bg:"rgba(22,160,100,.30)",  border:"rgba(22,160,100,.65)",  text:"#4de0a0"},
  {id:"d2",label:"Verde-teal",      bg:"rgba(22,140,140,.30)",  border:"rgba(22,140,140,.65)",  text:"#4dd4d4"},
  {id:"d3",label:"Verde-lima",      bg:"rgba(100,180,30,.22)",  border:"rgba(100,180,30,.55)",  text:"#a0e040"},
  {id:"d4",label:"Azul-safira",     bg:"rgba(30,100,210,.28)",  border:"rgba(30,100,210,.60)",  text:"#80c0ff"},
  {id:"d5",label:"Roxo",            bg:"rgba(120,60,200,.24)",  border:"rgba(120,60,200,.55)",  text:"#c090ff"},
  {id:"d6",label:"Dourado",         bg:"rgba(200,150,20,.22)",  border:"rgba(200,150,20,.55)",  text:"#f0c840"},
];
const DEFAULT_THEME = {
  bg:         BG_PRESETS[0].value,
  font:       FONT_PRESETS[0].value,
  card:       CARD_PRESETS[0].value,
  lesson:     "#1a2236",
  detail:     "#111927",
  header:     "rgba(10,18,38,.94)",
  tabbar:     "rgba(255,255,255,.04)",
  badge:      "rgba(255,255,255,.07)",
  btn:        "rgba(255,255,255,.07)",
  done:       DONE_PRESETS[0].bg,
  doneBorder: DONE_PRESETS[0].border,
  doneText:   DONE_PRESETS[0].text,
};

function ColorPicker({label,value,onChange}){
  return(
    <div className="flex items-center gap-3">
      <label className="text-xs muted w-28 shrink-0">{label}</label>
      <input type="color" value={value||"#ffffff"} onChange={e=>onChange(e.target.value)}
        style={{width:36,height:36,border:"1px solid rgba(255,255,255,.15)",borderRadius:8,cursor:"pointer",background:"none",padding:2}}/>
      <span className="text-xs muted font-mono">{value}</span>
    </div>
  );
}

function AparenciaSection(){
  const [theme,setTheme]=useState(DEFAULT_THEME);
  const [saved,setSaved]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    db.collection("config").doc("aparencia").get().then(doc=>{
      if(doc.exists)setTheme({...DEFAULT_THEME,...doc.data()});
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  function set(key,val){setTheme(p=>({...p,[key]:val}));}

  function applyLive(patch){
    const t={...theme,...patch};
    window.__applyTheme&&window.__applyTheme(t);
  }

  function setAndApply(key,val){
    set(key,val);
    applyLive({[key]:val});
  }

  function setDonePreset(p){
    const patch={done:p.bg,doneBorder:p.border,doneText:p.text};
    setTheme(prev=>({...prev,...patch}));
    applyLive(patch);
  }

  function setBgPreset(p){setAndApply("bg",p.value);}
  function setCardPreset(p){
    const lesson=p.id==="c2"?"#f0f2f5":p.id==="c3"?"#191926":p.id==="c4"?"#242730":p.id==="c5"?"#101828":"#1a2236";
    const detail=p.id==="c2"?"#e8eaee":p.id==="c3"?"#111118":p.id==="c4"?"#1a1d23":p.id==="c5"?"#080e1a":"#111927";
    const patch={card:p.value,lesson,detail};
    setTheme(prev=>({...prev,...patch}));
    applyLive(patch);
  }

  async function saveTheme(){
    await db.collection("config").doc("aparencia").set(theme);
    window.__applyTheme&&window.__applyTheme(theme);
    setSaved(true);
    setTimeout(()=>setSaved(false),2500);
  }

  if(loading)return <div className="glass rounded-2xl p-8 text-center muted">Carregando configurações...</div>;

  return(
    <div className="max-w-2xl mx-auto space-y-4">
      <div className="glass rounded-2xl p-6">
        <h3 className="text-lg font-bold mb-1" style={{fontFamily:"'Sora',sans-serif"}}>Aparência do Portal</h3>
        <p className="muted text-sm mb-6">As alterações afetam todos os usuários ao salvar.</p>

        {/* FUNDO */}
        <div className="ap-section">
          <h4>🎨 Fundo Geral</h4>
          <div className="flex flex-wrap gap-2 mb-4">
            {BG_PRESETS.map(p=>(
              <button key={p.id} onClick={()=>setBgPreset(p)}
                className={"ap-preset"+(theme.bg===p.value?" selected":"")}>{p.label}</button>
            ))}
          </div>
          <div className="text-xs muted mb-2">Personalizado (cor inicial do gradiente):</div>
          <ColorPicker label="Cor do gradiente" value={theme.bgCustom||"#05080f"} onChange={v=>{
            const grad=`linear-gradient(160deg,${v} 0%,${v}dd 35%,${v}bb 65%,${v}99 100%)`;
            setTheme(p=>({...p,bg:grad,bgCustom:v}));
            applyLive({bg:grad});
          }}/>
        </div>

        {/* FONTE */}
        <div className="ap-section">
          <h4>🔤 Cor da Fonte Principal</h4>
          <div className="flex flex-wrap gap-2 mb-4">
            {FONT_PRESETS.map(p=>(
              <button key={p.id} onClick={()=>setAndApply("font",p.value)}
                className={"ap-preset"+(theme.font===p.value?" selected":"")}
                style={{color:p.value,borderColor:theme.font===p.value?"rgba(30,143,168,.8)":"rgba(255,255,255,.12)"}}>
                {p.label}
              </button>
            ))}
          </div>
          <ColorPicker label="Cor livre" value={theme.font} onChange={v=>setAndApply("font",v)}/>
        </div>

        {/* CARDS */}
        <div className="ap-section">
          <h4>🃏 Cards / Caixas</h4>
          <div className="text-xs muted mb-3">Cor principal das caixas (cards de aluno, painéis, etc.):</div>
          <div className="flex flex-wrap gap-2 mb-4">
            {CARD_PRESETS.map(p=>(
              <button key={p.id} onClick={()=>setCardPreset(p)}
                className={"ap-preset flex items-center gap-2"+(theme.card===p.value?" selected":"")}>
                <span style={{width:14,height:14,borderRadius:4,background:p.value,border:"1px solid rgba(255,255,255,.2)",display:"inline-block"}}/>
                {p.label}
              </button>
            ))}
          </div>
          <ColorPicker label="Card principal" value={theme.card} onChange={v=>{const patch={card:v};setTheme(p=>({...p,...patch}));applyLive(patch);}}/>
          <div className="mt-3"/>
          <ColorPicker label="Card de lição" value={theme.lesson} onChange={v=>setAndApply("lesson",v)}/>
          <div className="mt-3"/>
          <ColorPicker label="Painel de detalhe" value={theme.detail} onChange={v=>setAndApply("detail",v)}/>
        </div>

        {/* HEADER / TABBAR / BADGE / BTN */}
        <div className="ap-section">
          <h4>🧩 Elementos da Interface</h4>
          <div className="space-y-3">
            <ColorPicker label="Header (barra top)" value={theme.header||"#0a1226"} onChange={v=>setAndApply("header",v)}/>
            <ColorPicker label="Barra de abas" value={theme.tabbar||"rgba(255,255,255,.04)"} onChange={v=>setAndApply("tabbar",v)}/>
            <ColorPicker label="Badges / chips" value={theme.badge||"rgba(255,255,255,.07)"} onChange={v=>setAndApply("badge",v)}/>
            <ColorPicker label="Botões neutros" value={theme.btn||"rgba(255,255,255,.07)"} onChange={v=>setAndApply("btn",v)}/>
          </div>
        </div>

        {/* LIÇÃO CONCLUÍDA */}
        <div className="ap-section">
          <h4>✅ Cor da Lição Concluída / Realizada</h4>
          <div className="flex flex-wrap gap-2 mb-4">
            {DONE_PRESETS.map(p=>(
              <button key={p.id} onClick={()=>setDonePreset(p)}
                className={"ap-preset"+(theme.done===p.bg?" selected":"")}
                style={{color:p.text,borderColor:theme.done===p.bg?p.border:"rgba(255,255,255,.12)",background:theme.done===p.bg?p.bg:"rgba(255,255,255,.04)"}}>
                {p.label}
              </button>
            ))}
          </div>
          <div className="space-y-3">
            <ColorPicker label="Fundo do card" value={theme.doneBg||theme.done||"#1ea064"} onChange={v=>{const patch={done:v};setTheme(p=>({...p,...patch}));applyLive(patch);}}/>
            <ColorPicker label="Borda do card" value={theme.doneBorder||"#2ae090"} onChange={v=>setAndApply("doneBorder",v)}/>
            <ColorPicker label="Texto do card" value={theme.doneText||"#60daa8"} onChange={v=>setAndApply("doneText",v)}/>
          </div>
          <div className="mt-4 p-3 rounded-xl text-sm font-semibold flex items-center gap-2"
            style={{background:theme.done,border:"1px solid "+theme.doneBorder,color:theme.doneText,borderLeft:"3px solid "+theme.doneBorder}}>
            ✓ Prévia: Lesson 12 — Concluída
          </div>
        </div>

        <button onClick={saveTheme}
          className="btn btn-primary w-full py-3 rounded-xl font-bold text-base inline-flex items-center justify-center gap-2">
          {saved?"✓ Tema Salvo com Sucesso!":"Salvar e Publicar Tema"}
        </button>
      </div>
    </div>
  );
}

function AdminApp({user}){
  const [students,setStudents]=useState(null);const [selectedUid,setSelectedUid]=useState(null);const [showAdd,setShowAdd]=useState(false);const [newUid,setNewUid]=useState("");const [newName,setNewName]=useState("");const [newLevel,setNewLevel]=useState("A1");const [addErr,setAddErr]=useState("");const [imgOk,setImgOk]=useState(true);
  useEffect(()=>db.collection("students").onSnapshot(snap=>setStudents(snap.docs.map(d=>({uid:d.id,...d.data()})))),[]);
  async function createStudent(){
    if(!newUid.trim()||!newName.trim()){setAddErr("Preencha UID e nome.");return;}
    const ref=db.collection("students").doc(newUid.trim());const doc=await ref.get();
    if(doc.exists){setAddErr("Este UID já existe.");return;}
    await ref.set({name:newName.trim(),level:newLevel,program:"Fluência Real em 18 Meses",coach:"Victor Gomes",profession:"",birthday:"",links:[{id:1,label:"Materiais (Drive)",url:"https://drive.google.com/"},{id:2,label:"Tarefas (Classroom)",url:"https://classroom.google.com/"}],trilha:{},financeiro:FINANCEIRO_DEFAULT});
    setNewUid("");setNewName("");setNewLevel("A1");setAddErr("");setShowAdd(false);
  }
  if(selectedUid)return <StudentDetail uid={selectedUid} isAdmin onBack={()=>setSelectedUid(null)}/>;
  return(
    <div className="min-h-screen">
      <header className="px-5 py-5" style={{background:"var(--header)",backdropFilter:"blur(14px)",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
        <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
          <div className="flex items-center gap-4">
            {imgOk?<img src={LOGO_URL} alt="Fluency Studio" className="h-9" onError={()=>setImgOk(false)}/>:<span className="text-xl font-extrabold" style={{fontFamily:"'Sora',sans-serif"}}>Fluency Studio</span>}
            <div><h1 className="text-xl font-bold">Painel do Professor</h1><p className="muted text-xs">Gerencie alunos, trilhas e diários.</p></div>
          </div>
          <div className="flex items-center gap-2">
            <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={()=>setShowAdd(o=>!o)}><Icon name="user-plus" size={16}/> Novo Aluno</button>
            <button className="btn rounded-xl px-4 py-3 inline-flex items-center gap-2" onClick={()=>auth.signOut()}><Icon name="log-out"/><span className="hidden sm:inline text-sm">Sair</span></button>
          </div>
        </div>
      </header>
      <main className="px-5 pb-10 max-w-6xl mx-auto pt-6">
        {showAdd&&<div className="glass rounded-2xl p-6 mb-5">
          <h3 className="font-bold text-lg mb-4">Adicionar Aluno</h3>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div><label className="block text-xs muted mb-1">UID do Firebase</label><input className="w-full input rounded-xl px-4 py-3 text-sm" placeholder="UID" value={newUid} onChange={e=>setNewUid(e.target.value)}/></div>
            <div><label className="block text-xs muted mb-1">Nome</label><input className="w-full input rounded-xl px-4 py-3 text-sm" placeholder="Nome completo" value={newName} onChange={e=>setNewName(e.target.value)}/></div>
            <div><label className="block text-xs muted mb-1">Nível</label><select className="w-full input rounded-xl px-4 py-3 text-sm" value={newLevel} onChange={e=>setNewLevel(e.target.value)}>{["A1","A2","B1","B2","C1","C2"].map(l=><option key={l}>{l}</option>)}</select></div>
          </div>
          {addErr&&<div className="err-box mt-3">{addErr}</div>}
          <div className="flex gap-3 mt-4"><button className="btn btn-primary rounded-xl px-5 py-2.5 font-semibold text-sm" onClick={createStudent}>Criar</button><button className="btn rounded-xl px-5 py-2.5 text-sm" onClick={()=>{setShowAdd(false);setAddErr("");}}>Cancelar</button></div>
        </div>}
        {!students?<LoadingScreen/>:students.length===0?<div className="glass rounded-2xl p-12 text-center muted"><Icon name="users" size={40} className="mx-auto mb-4 opacity-30"/><p>Nenhum aluno cadastrado ainda.</p></div>:(
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {students.map(s=>{
              const merged=mergeBooks(s.trilha||{});let done=0,total=0;merged.forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida")done++;}));const pct=total?Math.round((done/total)*100):0;const mod=getCurrentModule(merged);const finVencida=s.financeiro?.parcelas?.some(p=>p.status==="vencida");
              return(<div key={s.uid} className="student-card" onClick={()=>setSelectedUid(s.uid)}>
                <div className="flex items-center gap-3 mb-3"><div className="w-10 h-10 rounded-full chip flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div><div className="flex-1 min-w-0"><div className="font-bold truncate">{s.name||"Aluno"}</div><div className="text-xs muted">Módulo {mod} · Nível {s.level||"—"}</div></div>{finVencida&&<span className="fin-badge fin-vencida" style={{fontSize:10}}>Atrasado</span>}<Icon name="chevron-right" size={16} className="muted shrink-0"/></div>
                <div className="flex items-center justify-between text-xs muted mb-1"><span>Progresso</span><span className="font-semibold">{pct}%</span></div>
                <div className="h-1.5 rounded-full overflow-hidden" style={{background:"rgba(255,255,255,.09)"}}><div className="h-full rounded-full progress-fill" style={{width:pct+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/></div>
                <div className="text-xs muted mt-2">{done} de {total} lições concluídas</div>
              </div>);
            })}
          </div>
        )}
      </main>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(undefined);
  useEffect(()=>auth.onAuthStateChanged(u=>setUser(u||null)),[]);
  if(user===undefined)return <LoadingScreen/>;
  if(!user)return <Login/>;
  if(user.uid===ADMIN_UID)return <AdminApp user={user}/>;
  return <StudentDetail uid={user.uid} isAdmin={false}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
