function coursesCatalogRef(){
  return db.collection("students").doc(COURSES_CATALOG_DOC);
}
function persistCoursesLocal(list){
  try{localStorage.setItem(COURSES_LS_KEY,JSON.stringify(list));}catch(e){}
}
function loadCoursesLocal(){
  try{
    const raw=localStorage.getItem(COURSES_LS_KEY);
    if(!raw)return null;
    const arr=JSON.parse(raw);
    return Array.isArray(arr)&&arr.length?arr:null;
  }catch(e){return null;}
}
function normalizeCoursesList(list){
  if(!Array.isArray(list)||!list.length)return DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
  return list.map(c=>({...c,id:c.id,modulos:Array.isArray(c.modulos)?c.modulos:[]}))
    .sort((a,b)=>(a.ordem||0)-(b.ordem||0));
}
/** Grava o catálogo onde o admin tem permissão (students/__system_courses) e tenta a coleção `courses`. */
async function writeCoursesCatalog(list){
  const clean=normalizeCoursesList(list).map(c=>JSON.parse(JSON.stringify(c)));
  _coursesCache=clean;
  persistCoursesLocal(clean);
  let lastErr=null;
  try{
    await coursesCatalogRef().set({
      type:"courses_catalog",
      courses:clean,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    },{merge:true});
  }catch(e){lastErr=e;}
  // Espelho opcional na coleção `courses` (quando as regras permitirem)
  try{
    const batch=db.batch();
    clean.forEach(c=>{batch.set(db.collection("courses").doc(c.id),c,{merge:true});});
    await batch.commit();
  }catch(e){/* coleção courses pode estar bloqueada */}
  if(lastErr)throw lastErr;
  return clean;
}
async function upsertCourseDoc(course){
  const list=normalizeCoursesList(_coursesCache);
  const idx=list.findIndex(c=>c.id===course.id);
  const next={...course};
  if(idx>=0)list[idx]={...list[idx],...next};
  else list.push(next);
  return writeCoursesCatalog(list);
}
async function deleteCourseDoc(courseId){
  const list=normalizeCoursesList(_coursesCache).filter(c=>c.id!==courseId);
  return writeCoursesCatalog(list);
}

/** Sincroniza nome/cor/ordem dos 6 cursos oficiais (landing) sem apagar estrutura editada. */
async function ensureCoursesSeeded(forceBrandMeta){
  try{
    let existing=null;
    try{
      const doc=await coursesCatalogRef().get();
      if(doc.exists&&Array.isArray(doc.data().courses)&&doc.data().courses.length){
        existing=doc.data().courses;
      }
    }catch(e){/* sem permissão de leitura do catálogo */}
    if(!existing){
      try{
        const snap=await db.collection("courses").get();
        if(!snap.empty)existing=snap.docs.map(d=>({id:d.id,...d.data()}));
      }catch(e){/* coleção courses bloqueada */}
    }
    if(!existing)existing=loadCoursesLocal();
    if(!existing||!existing.length){
      const seeded=DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
      try{await writeCoursesCatalog(seeded);}catch(e){
        _coursesCache=seeded;
        persistCoursesLocal(seeded);
        console.warn("ensureCoursesSeeded write:",e.message||e);
      }
      return;
    }
    const byId={};
    existing.forEach(c=>{if(c&&c.id)byId[c.id]=c;});
    for(const c of DEFAULT_COURSES){
      const payload=JSON.parse(JSON.stringify(c));
      if(!byId[c.id]){
        byId[c.id]=payload;
        continue;
      }
      const cur=byId[c.id];
      cur.nome=c.nome;
      cur.corBase=c.corBase;
      cur.ordem=c.ordem;
      if(c.grupo!=null)cur.grupo=c.grupo;
      if(c.padraoVisual!=null)cur.padraoVisual=c.padraoVisual;
      if(c.numeroInicio!=null)cur.numeroInicio=c.numeroInicio;
      if(forceBrandMeta||!cur.modulos||!cur.modulos.length){
        cur.modulos=payload.modulos;
      }
      if(c.id==="speech_b"&&forceBrandMeta){
        cur.modulos=payload.modulos;
        cur.numeroInicio=121;
      }
      byId[c.id]=cur;
    }
    const merged=Object.values(byId);
    try{await writeCoursesCatalog(merged);}catch(e){
      _coursesCache=normalizeCoursesList(merged);
      persistCoursesLocal(_coursesCache);
      console.warn("ensureCoursesSeeded (ok se não-admin):",e.message||e);
    }
  }catch(e){
    console.warn("ensureCoursesSeeded (ok se não-admin):",e.message||e);
  }
}

/** Migra alunos com contrato legado (fluency_foundation etc.) sem alterar trilha. */
async function migrateLegacyContratosIfNeeded(){
  try{
    const flagRef=db.collection("config").doc("migrations");
    const flag=await flagRef.get();
    if(flag.exists&&flag.data().contratosV2)return{skipped:true};
    const snap=await db.collection("students").get();
    let migrated=0;
    const docs=snap.docs.filter(d=>{
      const c=d.data().contrato;
      return c&&CONTRATO_LEGACY_MAP[c];
    });
    for(let i=0;i<docs.length;i+=400){
      const batch=db.batch();
      docs.slice(i,i+400).forEach(d=>{
        const old=d.data().contrato;
        const newId=CONTRATO_LEGACY_MAP[old];
        const course=DEFAULT_COURSES.find(c=>c.id===newId);
        batch.update(d.ref,{
          contrato:newId,
          program:course?course.nome:(d.data().program||""),
          contratoMigradoDe:old,
        });
        migrated++;
      });
      await batch.commit();
    }
    await flagRef.set({contratosV2:true,migrated,at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    return{migrated};
  }catch(e){
    console.error("migrateLegacyContratos:",e);
    return{error:e.message};
  }
}

function useCourses(){
  const[courses,setCourses]=useState(()=>{
    const local=loadCoursesLocal();
    return local?normalizeCoursesList(local):_coursesCache;
  });
  useEffect(()=>{
    let unsub=()=>{};
    let alive=true;
    (async()=>{
      try{await ensureCoursesSeeded();}catch(e){console.error("ensureCoursesSeeded",e);}
      if(!alive)return;
      // Fonte principal: students/__system_courses (admin consegue criar/editar)
      unsub=coursesCatalogRef().onSnapshot(doc=>{
        if(doc.exists&&Array.isArray(doc.data().courses)&&doc.data().courses.length){
          _coursesCache=normalizeCoursesList(doc.data().courses);
          persistCoursesLocal(_coursesCache);
        }else{
          const local=loadCoursesLocal();
          _coursesCache=local?normalizeCoursesList(local):DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
        }
        if(alive)setCourses(_coursesCache);
      },err=>{
        console.warn("courses catalog listen:",err&&err.message||err);
        const local=loadCoursesLocal();
        _coursesCache=local?normalizeCoursesList(local):DEFAULT_COURSES.map(c=>JSON.parse(JSON.stringify(c)));
        if(alive)setCourses(_coursesCache);
      });
    })();
    return()=>{alive=false;if(typeof unsub==="function")unsub();};
  },[]);
  return courses;
}

/** Feedback de salvamento: som + toast + notificação do sistema (quando permitido) */
function playSaveChime(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    const now=ctx.currentTime;
    [[880,.0,.12],[1174.66,.11,.14],[1567.98,.24,.18]].forEach(([freq,start,dur])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,now+start);
      g.gain.exponentialRampToValueAtTime(0.12,now+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(now+start);o.stop(now+start+dur+0.02);
    });
    setTimeout(()=>{try{ctx.close();}catch(e){}},600);
  }catch(e){}
}
function ensureToastHost(){
  let host=document.getElementById("fs-toast-host");
  if(!host){
    host=document.createElement("div");
    host.id="fs-toast-host";
    host.className="fs-toast-host";
    document.body.appendChild(host);
  }
  return host;
}
function showFsToast(message,kind){
  const host=ensureToastHost();
  const el=document.createElement("div");
  el.className="fs-toast "+(kind==="err"?"fs-toast-err":"fs-toast-ok");
  const title=kind==="err"?"Atenção":"Salvo";
  el.innerHTML="<div><div class=\"fs-toast-title\">"+title+"</div><div></div></div>";
  el.querySelector("div > div:last-child").textContent=String(message||"Alterações salvas");
  host.appendChild(el);
  setTimeout(()=>{try{el.remove();}catch(e){}},4200);
}
function notifySaveSuccess(message){
  playSaveChime();
  showFsToast(message||"Alterações salvas com sucesso!","ok");
  try{
    if(typeof Notification!=="undefined"){
      if(Notification.permission==="granted"){
        new Notification("Fluency Studio",{body:message||"Alterações salvas com sucesso!",icon:"https://thefluency.studio/logo.png"});
      }else if(Notification.permission!=="denied"){
        Notification.requestPermission().then(p=>{
          if(p==="granted")new Notification("Fluency Studio",{body:message||"Alterações salvas com sucesso!"});
        }).catch(()=>{});
      }
    }
  }catch(e){}
  try{if(document.hidden&&typeof window.focus==="function")window.focus();}catch(e){}
}
function notifySaveError(message){
  showFsToast(message||"Erro ao salvar","err");
}

const MESES_CURTOS=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const MESES_LONGOS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function getParcelValor(p){const v=p?.valorDesconto>0?p.valorDesconto:p?.valor;return v>0?v:0;}
function getMonthKey(d){if(typeof d==="string")return d.slice(0,7);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function formatMonthYear(monthKey){if(!monthKey)return"—";const[y,m]=monthKey.split("-");return`${MESES_LONGOS[parseInt(m,10)-1]} ${y}`;}
function shiftMonthKey(monthKey,delta){const[y,m]=monthKey.split("-").map(Number);const d=new Date(y,m-1+delta,1);return getMonthKey(d);}
function computeStudioFinanceMonth(students,monthKey){
  let previsto=0,recebido=0;
  (students||[]).forEach(s=>(s.financeiro?.parcelas||[]).forEach(p=>{
    const vencMonth=p.dataVencimento?p.dataVencimento.slice(0,7):null;
    if(vencMonth===monthKey)previsto+=getParcelValor(p);
    if(p.status==="paga"){
      const payMonth=p.dataPagamento?p.dataPagamento.slice(0,7):vencMonth;
      if(payMonth===monthKey)recebido+=getParcelValor(p);
    }
  }));
  return{previsto,recebido};
}
function filterStudentsByStatus(students,statusFilter){
  if(!students)return[];

  return students.filter(s=>{

    return st===statusFilter;
  });
}

function getTodayISO(){const t=new Date();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;}
function getEffectiveParcelStatus(parcela,todayStr){
  if(parcela.status==="paga")return"paga";
  if(parcela.dataVencimento&&parcela.dataVencimento<todayStr)return"vencida";
  return parcela.status||"em_aberto";
}
function formatMonthDay(iso){if(!iso)return"—";const[y,m,d]=iso.split("-");return`${MESES_CURTOS[parseInt(m,10)-1]}/${d}`;}
function resolveFinanceSnapshot(parcelas){
  const todayStr=getTodayISO();
  const sorted=[...(parcelas||[])].filter(p=>p.dataVencimento).sort((a,b)=>a.dataVencimento>b.dataVencimento?1:-1);
  const unpaid=sorted.filter(p=>getEffectiveParcelStatus(p,todayStr)!=="paga");
  const current=unpaid[0]||null;
  let next=null;
  if(current)next=unpaid.find(p=>p.dataVencimento>current.dataVencimento)||null;
  const isLate=current?getEffectiveParcelStatus(current,todayStr)==="vencida":false;
  const allPaid=sorted.length>0&&unpaid.length===0;
  return{todayStr,current,next,isLate,isOk:allPaid||(!current?null:!isLate),allPaid,sorted};
}

function playClickSound(kind){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    const ctx=new Ctx();const now=ctx.currentTime;
    const seq=kind==="open"
      ?[[523.25,0,.1],[659.25,.08,.12],[783.99,.16,.14]]
      :kind==="mod"
      ?[[392,0,.1],[523.25,.09,.12]]
      :[[440,0],[660,.07],[880,.13]];
    seq.forEach((row)=>{
      const freq=row[0],delay=row[1],dur=row[2]!=null?row[2]:.12;
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);osc.type="sine";
      osc.frequency.setValueAtTime(freq,now+delay);
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(0.09,now+delay+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+dur);
      osc.start(now+delay);osc.stop(now+delay+dur+0.02);
    });
    setTimeout(()=>{try{ctx.close();}catch(e){}},500);
  }catch(e){}
}

function getLessonTypeFromModule(mod,posInModule){
  if(!mod||mod.semBlocos)return"input";
  if(!mod.blocos||!mod.blocos.length)return FOUNDATION_BLOCK[(posInModule-1)%10];
  let remaining=posInModule;
  for(const bloco of mod.blocos){
    const size=bloco.tamanho||(bloco.padrao&&bloco.padrao.length)||10;
    if(remaining<=size){
      const padrao=bloco.padrao&&bloco.padrao.length?bloco.padrao:FOUNDATION_BLOCK;
      return padrao[(remaining-1)%padrao.length]||"input";
    }
    remaining-=size;
  }
  return"input";
}
function getBlockLessonType(posInModule){return FOUNDATION_BLOCK[(posInModule-1)%10];}

function getLessonBorderColor(item){
  const done=item.status==="concluida"||item.status==="realizada";
  const isReview=item.lessonType==="review"||item.type==="review";
  const isOutput=item.lessonType==="output";
  if(item.status==="andamento")return "#38bdf8";
  if(item.status==="pendente"||(!done&&!item.status))return "#94a3b8"; // cinza pendente
  if(isReview)return done?"#6D28D9":"#7C3AED"; // review sólido
  if(isOutput)return done?"#0F766E":"#0D9488"; // output sólido
  // input concluída → azul sólido
  if(done)return "#1D4ED8";
  return "#2563EB";
}

function getReflectiveMeta(lessonType, contentNum, reviewNum){
  if(lessonType==="review"){
    return{tema:"Revisão "+reviewNum,objetivos:REFLECTIVE_REVIEW_OBJ};
  }
  if(lessonType==="output"){
    const prev=REFLECTIVE_MIND_INPUT_META[contentNum-1];
    return{tema:prev?prev.tema:("Aplicação da lição "+(contentNum-1)),objetivos:REFLECTIVE_OUTPUT_OBJ};
  }
  const m=REFLECTIVE_MIND_INPUT_META[contentNum];
  return m?{tema:m.tema,objetivos:m.objetivos}:{tema:"",objetivos:""};
}

/** Gera estrutura de livros/lições a partir do documento do curso (mesmos campos de antes). */
function generateBooks(course){
  const c=course||DEFAULT_COURSES[0];
  const books=[];
  let globalIdx=0;
  const isReflective=c.id==="speech_b"||c.numeroInicio===121||c.padraoVisual==="orange"&&c.grupo==="special";
  const startNum=c.numeroInicio!=null?c.numeroInicio:(isReflective?121:1);
  let contentNum=startNum-1;
  let reviewNum=0;
  (c.modulos||[]).forEach((mod,mi)=>{
    const bi=mod.id!=null?mod.id:mi+1;
    const total=getModuleLessonCount(mod);
    const items=[];
    for(let li=1;li<=total;li++){
      globalIdx++;
      const lt=getLessonTypeFromModule(mod,li);
      const isReview=lt==="review";
      let num, pos, title, tema="", objetivos="";
      if(isReview){
        reviewNum++;
        num=reviewNum;
        pos="R"+reviewNum;
        title="Review "+reviewNum;
        if(isReflective){
          const meta=getReflectiveMeta("review",0,reviewNum);
          tema=meta.tema;objetivos=meta.objetivos;
        }
      }else{
        contentNum++;
        num=contentNum;
        pos=contentNum;
        title=getLessonTitle(contentNum);
        if(isReflective){
          const meta=getReflectiveMeta(lt,contentNum,0);
          tema=meta.tema;objetivos=meta.objetivos;
        }
      }
      items.push({
        id:`b${bi}-l${globalIdx}`,pos:pos,type:isReview?"review":"lesson",lessonType:lt,num:num,
        title:title,status:"pendente",
        date:"",dataPrevista:"",tema:tema,objetivos:objetivos,feedback:"",obs:"",link:"",

function getCurrentModule(books,modulosOcultos){

/* ── Finance Architecture: invoices (owed) vs transactions (paid) ───────────
   Collections: invoices, transactions
   Legacy student.financeiro.parcelas is preserved and mirrored — never deleted.
   ─────────────────────────────────────────────────────────────────────────── */
const INVOICE_STATUS={UNPAID:"unpaid",PARTIAL:"partially_paid",PAID:"paid",OVERDUE:"overdue"};
function mapParcelaToInvoiceStatus(parcela,todayStr){
  const eff=getEffectiveParcelStatus(parcela,todayStr||getTodayISO());
  if(eff==="paga")return INVOICE_STATUS.PAID;
  if(eff==="vencida")return INVOICE_STATUS.OVERDUE;
  return INVOICE_STATUS.UNPAID;
}
function invoiceStatusBadgeClass(status){
  if(status==="paid")return"status-badge status-badge-paid";
  if(status==="overdue")return"status-badge status-badge-overdue";
  if(status==="partially_paid")return"status-badge status-badge-partial";
  return"status-badge status-badge-pending";
}
function invoiceStatusLabel(status){
  if(status==="paid")return"Pago";
  if(status==="overdue")return"Vencido";
  if(status==="partially_paid")return"Parcial";
  if(status==="unpaid")return"Em aberto";
  return status||"—";
}
function toJsDate(val){
  if(!val)return null;
  if(val instanceof Date)return val;
  if(typeof val.toDate==="function")return val.toDate();
  if(typeof val==="string"){const d=new Date(val.length===10?val+"T12:00:00":val);return isNaN(d)?null:d;}
  if(typeof val.seconds==="number")return new Date(val.seconds*1000);
  return null;
}
function invoiceDocId(studentId,parcelaId){return String(studentId||"s")+"__"+String(parcelaId||"p").replace(/[^a-zA-Z0-9_-]/g,"_");}
/** ID estável da parcela — evita cobranças fantasma (ex.: mesmo aluno várias vezes). */
function parcelaStableId(studentId,p,idx){
  if(p&&p.id!=null&&String(p.id).trim()!=="")return String(p.id).trim();
  const bits=[studentId||"s",p&&p.dataVencimento||"nodate",p&&p.mes||"nomes",String(idx)];
  return "auto_"+bits.join("_").replace(/\s+/g,"_");
}
/**
 * Fonte de verdade do financeiro: SOMENTE parcelas em students.*.financeiro.parcelas
 * — valor > 0 (sem cobrança vazia)
 * — sem duplicar o mesmo id
 * — ignora docs do sistema
 */
function buildFinanceFromStudents(students){
  const today=getTodayISO();
  const invoices=[];
  const transactions=[];
  const seen=new Set();
  (students||[]).forEach(s=>{
    if(!s)return;
    const sid=s.uid||s.id;
    if(!sid||sid===COURSES_CATALOG_DOC||String(sid).startsWith("__system"))return;
    const parcelas=Array.isArray(s.financeiro?.parcelas)?s.financeiro.parcelas:[];
    parcelas.forEach((p,idx)=>{
      if(!p||typeof p!=="object")return;
      const amount=getParcelValor(p);
      if(!(amount>0))return;
      const pid=parcelaStableId(sid,p,idx);
      const invId=invoiceDocId(sid,pid);
      if(seen.has(invId))return;
      seen.add(invId);
      const status=mapParcelaToInvoiceStatus(p,today);
      const studentName=s.name||s.nome||"Aluno";
      const description=(p.mes&&String(p.mes).trim())||("Parcela "+(p.dataVencimento?formatDateBR(p.dataVencimento):String(idx+1)));
      invoices.push({
        id:invId,studentId:sid,studentName,amount,description,status,
        dueDate:p.dataVencimento||null,createdAt:p.dataVencimento||null,
        legacyParcelaId:pid,parcelaIndex:idx,_source:"parcela",
      });
      if((p.status==="paga"||status==="paid")&&amount>0){
        const payDate=p.dataPagamento||p.dataVencimento||today;
        transactions.push({
          id:"tx_"+invId,studentId:sid,studentName,invoiceId:invId,amount,
          type:"payment",method:p.boletoPix?"bank_transfer":"cash",
          date:payDate,status:"paid",_source:"parcela",description,
        });
      }
    });
  });
  return{invoices,transactions};
}
/** @deprecated alias */
function deriveFinanceFromParcelas(students){return buildFinanceFromStudents(students);}
/** KPIs do MÊS corrente (não 30 dias / não histórico total). */
function computeFinanceKpis(invoices,transactions,monthKey){
  const mk=monthKey||getMonthKey(new Date());
  let revenueMonth=0,outstanding=0,overdue=0;
  const revenueItems=[],outstandingItems=[],overdueItems=[];
  (transactions||[]).forEach(t=>{
    if((t.type||"payment")!=="payment")return;
    const amt=parseFloat(t.amount)||0;
    if(!(amt>0))return;
    const d=toJsDate(t.date);
    if(!d)return;
    if(getMonthKey(d)!==mk)return;
    revenueMonth+=amt;
    revenueItems.push(t);
  });
  (invoices||[]).forEach(inv=>{
    const amt=parseFloat(inv.amount)||0;
    if(!(amt>0))return;
    if(inv.status!=="paid"){outstanding+=amt;outstandingItems.push(inv);}
    if(inv.status==="overdue"){overdue+=amt;overdueItems.push(inv);}
  });
  revenueItems.sort((a,b)=>(toJsDate(b.date)?.getTime()||0)-(toJsDate(a.date)?.getTime()||0));
  outstandingItems.sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
  overdueItems.sort((a,b)=>String(a.dueDate||"").localeCompare(String(b.dueDate||"")));
  return{revenueMonth,outstanding,overdue,revenueItems,outstandingItems,overdueItems,monthKey:mk};
}
function computeCashFlowSeries(transactions,expensesByMonth){
  // Last 6 months revenue (payments) vs expenses
  const months=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(getMonthKey(d));
  }
  const revenue=months.map(mk=>{
    let sum=0;
    (transactions||[]).forEach(t=>{
      if((t.type||"payment")!=="payment")return;
      const d=toJsDate(t.date);
      if(d&&getMonthKey(d)===mk)sum+=(parseFloat(t.amount)||0);
    });
    return sum;
  });
  const expenses=months.map(mk=>(expensesByMonth&&expensesByMonth[mk])||0);
  return{months,revenue,expenses};
}
/** Upsert invoice (+ optional payment transaction) from a legacy parcela. Never deletes user data. */
async function upsertInvoiceFromParcela(studentId,parcela,studentName){
  if(!studentId||!parcela)return;
  const amount=getParcelValor(parcela);
  if(!(amount>0))return; // não cria fatura fantasma sem valor
  const invId=invoiceDocId(studentId,parcelaStableId(studentId,parcela,0));
  const status=mapParcelaToInvoiceStatus(parcela);
  const invPayload={
    studentId:String(studentId),
    amount:amount||0,
    description:parcela.mes||("Parcela "+(parcela.dataVencimento||"")),
    status,
    dueDate:parcela.dataVencimento||null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    legacyParcelaId:parcela.id||null,
    studentName:studentName||null,
  };
  try{
    await db.collection("invoices").doc(invId).set(invPayload,{merge:true});
    if(status==="paid"&&amount>0){
      const txId="tx_"+invId;
      await db.collection("transactions").doc(txId).set({
        studentId:String(studentId),
        invoiceId:invId,
        amount:amount||0,
        type:"payment",
        method:parcela.boletoPix?"bank_transfer":"cash",
        date:parcela.dataPagamento||parcela.dataVencimento||getTodayISO(),
        studentName:studentName||null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      },{merge:true});
    }
  }catch(err){
    console.warn("upsertInvoiceFromParcela (check Firestore rules for invoices/transactions):",err&&err.message);
  }
}
async function syncStudentParcelasToInvoices(studentId,parcelas,studentName){
  const list=Array.isArray(parcelas)?parcelas:[];
  for(const p of list){await upsertInvoiceFromParcela(studentId,p,studentName);}
}

const STATUS_LEGACY_MAP={
  active:"ativo",ativo:"ativo",Active:"ativo",ACTIVE:"ativo",
  lead:"lead",Lead:"lead",
  interessado:"interessado",interesse:"interessado",
  trancado:"trancado",trancada:"trancado",
  evadido:"evadido",inativo:"evadido",
  pendente_aprovacao:"pendente_aprovacao",pendente:"pendente_aprovacao",
  rejeitado:"rejeitado",
};
function normalizeStatus(raw,data){
  if(raw!=null&&raw!==""){
    const mapped=STATUS_LEGACY_MAP[raw]||STATUS_LEGACY_MAP[String(raw).toLowerCase()]||String(raw).toLowerCase();
    return mapped;
  }
  // Documentos antigos sem status: se parece matriculado → ativo
  if(data&&(data.financeiro||data.trilha||data.program||data.contrato||data.dataInicio||data.diasAulas?.length))return"ativo";
  return"lead";
}
function normalizeFinanceiro(fin){
  if(!fin||typeof fin!=="object")return{...FINANCEIRO_DEFAULT,parcelas:[]};
  return{
    tipo:fin.tipo||"mensalidade",
    creditosTotal:Number(fin.creditosTotal)||0,
    creditosUsados:Number(fin.creditosUsados)||0,
    parcelas:Array.isArray(fin.parcelas)?fin.parcelas:[],
  };
}
function normalizeTrilha(trilha){
  if(!trilha||typeof trilha!=="object"||Array.isArray(trilha))return{};
  return trilha;
}
/** Normaliza doc Firestore → objeto de aluno seguro para UI (alunos antigos inclusos). */

/** Auth secundário: cria login sem deslogar o admin. */
function getSecondaryAuth(){
  let app;
  try{app=firebase.app("Secondary");}
  catch(e){app=firebase.initializeApp(firebase.app().options,"Secondary");}
  return app.auth();
}
function emailVariants(email){
  const raw=(email||"").toString().trim();
  if(!raw)return[];
  const low=raw.toLowerCase();
  const set=new Set([raw,low]);
  // Hotmail/Outlook às vezes salvos com espaços ou maiúsculas
  set.add(low.replace(/\s+/g,""));
  return[...set];
}

/**
 * Resolve o ID do documento do aluno:
 * 1) students/{authUid}
 * 2) users/{authUid}.studentId
 * 3) students where email == email do login (várias capitalizações)
 */
async function resolveStudentDocId(authUid,email){
  if(!authUid)return null;
  try{
    const byUid=await db.collection("students").doc(authUid).get();
    if(byUid.exists)return authUid;
  }catch(e){console.warn("resolveStudentDocId byUid:",e);}
  try{
    const userMap=await db.collection("users").doc(authUid).get();
    if(userMap.exists){
      const sid=userMap.data().studentId;
      if(sid){
        const chk=await db.collection("students").doc(sid).get();
        if(chk.exists)return sid;
      }
    }
  }catch(e){console.warn("resolveStudentDocId users map:",e);}
  const variants=emailVariants(email);
  for(const em of variants){
    try{
      const q=await db.collection("students").where("email","==",em).limit(5).get();
      if(q.empty)continue;
      const docs=q.docs;
      const preferred=docs.find(x=>{
        const st=normalizeStatus(x.data().status,x.data());
        return st==="ativo"||st==="lead"||st==="interessado"||st==="trancado";
      })||docs[0];
      const sid=preferred.id;
      const emailNorm=em.toLowerCase();
      try{
        await db.collection("users").doc(authUid).set({
          email:emailNorm,role:"student",studentId:sid,authUid,
          linkedAt:firebase.firestore.FieldValue.serverTimestamp(),
        },{merge:true});
        await db.collection("students").doc(sid).set({authUid,email:emailNorm,hasPortalLogin:true},{merge:true});
      }catch(linkErr){console.warn("link student map:",linkErr);}
      return sid;
    }catch(e){console.warn("resolveStudentDocId email:",em,e);}
  }
  return authUid;
}

/** Admin: cria/vincula login Firebase a um doc de aluno já existente. */
async function linkStudentPortalLogin(studentUid,email,password){
  const em=(email||"").toString().trim().toLowerCase();
  const pass=(password||"").toString();
  if(!studentUid)throw new Error("UID do aluno ausente.");
  if(!em)throw new Error("Email obrigatório.");
  if(pass.length<6)throw new Error("Senha com no mínimo 6 caracteres.");
  const secondary=getSecondaryAuth();
  let authUid=null;
  let created=false;
  try{
    try{
      const cred=await secondary.createUserWithEmailAndPassword(em,pass);
      authUid=cred.user.uid;
      created=true;
    }catch(authErr){
      if(authErr.code==="auth/email-already-in-use"){
        // Conta Auth já existe: só normaliza email e marca login (aluno entra com senha atual)
        await db.collection("students").doc(studentUid).set({
          email:em,hasPortalLogin:true,loginNote:"email-already-in-use",
        },{merge:true});
        return{created:false,alreadyExists:true,studentUid,email:em};
      }
      throw authErr;
    }
  }finally{
    try{await secondary.signOut();}catch(e){}
  }
  await db.collection("students").doc(studentUid).set({
    email:em,authUid,hasPortalLogin:true,
  },{merge:true});
  await db.collection("users").doc(authUid).set({
    email:em,role:"student",studentId:studentUid,authUid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
  },{merge:true});
  return{created,alreadyExists:false,studentUid,authUid,email:em};
}

function LessonBadge({status}){
  const m={pendente:"ls-pendente",andamento:"ls-andamento",concluida:"ls-concluida"};
  const l={pendente:"Pendente",andamento:"Em Andamento",concluida:"Concluída"};
  return <span className={m[status]||m.pendente}>{l[status]||"Pendente"}</span>;
}

function AdminLessonPanel({item,uid}){
  const ST=[{v:"pendente",l:"Pendente"},{v:"andamento",l:"Em Andamento"},{v:"concluida",l:"Concluída"}];
  const LK=[
    {f:"linkAula",l:"Lição Online"},
    {f:"linkTarefa",l:"Tarefa Online"},
    {f:"linkMaterial",l:"Lição PDF"},
    {f:"linkChamada",l:"Aula ao Vivo"},
    {f:"linkExtra",l:"Extra (Materiais)"},
    {f:"linkGravacao",l:"Aulas Gravadas (Recorded Classes)"},
    {f:"linkRelatorio",l:"Relatório da Reunião"},
  ];
  const FIELD_KEYS=["status","dataPrevista","date","evalF","evalA","evalL","evalE","tema","objetivos","feedback","obs","linkAula","linkTarefa","linkMaterial","linkChamada","linkExtra","linkGravacao","linkRelatorio"];
  function snapshotFromItem(it){
    const s={};
    FIELD_KEYS.forEach(k=>{
      if(k==="linkMaterial")s[k]=it.linkMaterial||it.link||"";
      else s[k]=it[k]!=null?it[k]:"";
    });
    if(!s.status)s.status="pendente";
    return s;
  }
  const [draft,setDraft]=useState(()=>snapshotFromItem(item));
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");
  const [saveErr,setSaveErr]=useState("");
  useEffect(()=>{setDraft(snapshotFromItem(item));setSaveMsg("");setSaveErr("");},[item.id]);
  function setD(field,val){setDraft(p=>({...p,[field]:val}));setSaveMsg("");setSaveErr("");}
  async function saveLesson(){
    if(!uid||!item?.id){setSaveErr("Acesso negado: Aluno ou lição ausente.");return;}
    setSaving(true);
    setSaveErr("");
    setSaveMsg("");
    
    try{
      const patch={};
      FIELD_KEYS.forEach(k=>{
        let v=draft[k];
        if(v===undefined||v===null)v="";
        patch[`trilha.${item.id}.${k}`]=v;
      });
      
      await db.collection("students").doc(uid).update(patch);
      
      setSaveMsg("✓ Alterações salvas com sucesso!");
      notifySaveSuccess("Lição salva com sucesso!");
      setTimeout(()=>setSaveMsg(""), 3500);
    }catch(e){
      console.error("Erro no salvamento Firebase:", e);
      setSaveErr("Falha na conexão. Verifique sua rede e tente novamente.");
    }finally{
      setSaving(false);
    }
  }
  return(
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><div className="detail-label">Status</div><div className="flex gap-2 flex-wrap mt-1">{ST.map(s=><button key={s.v} type="button" onClick={()=>setD("status",s.v)} className={"sbtn "+(draft.status===s.v?"sbtn-"+s.v:"sbtn-off")}>{s.l}</button>)}</div></div>
        <div className="grid grid-cols-2 gap-2">
          <div><div className="detail-label">Data Prevista</div><input type="date" className="input-light mt-1" value={draft.dataPrevista||""} onChange={e=>setD("dataPrevista",e.target.value)}/></div>
          <div><div className="detail-label">Data Realizada</div><input type="date" className="input-light mt-1" value={draft.date||""} onChange={e=>setD("date",e.target.value)}/></div>
        </div>
      </div>
      <div>
        <div className="detail-label">Avaliação F/A/L/E</div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-2">
          {EVAL_SKILLS.map(sk=>(
            <div key={sk.f}>
              <div className="text-xs font-bold mb-1" style={{color:"var(--font-muted)"}}>{sk.l} — {sk.name}</div>
              <div className="flex flex-col gap-1">{EVAL_OPTS.map(e=><button key={e.v} type="button" onClick={()=>setD(sk.f,e.v)} className={"eval-btn text-xs "+(draft[sk.f]===e.v?"eval-"+e.v:"eval-inactive")}>{e.l}</button>)}</div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="detail-label mb-2">Links</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {LK.map(lk=>(
            <div key={lk.f}>
              <div className="text-xs font-semibold mb-1" style={{color:"var(--font-muted)"}}>{lk.l}</div>
              <input type="url" className="input-light" placeholder="https://" value={draft[lk.f]||""} onChange={e=>setD(lk.f,e.target.value)}/>
            </div>
          ))}
        </div>
      </div>
      <div><div className="detail-label">Tema</div><input className="input-light mt-1" placeholder="Tema da lição (sem parênteses)" value={draft.tema||""} onChange={e=>setD("tema",e.target.value)}/></div>
      <div><div className="detail-label">Objetivos da Aula</div><textarea className="input-light mt-1" rows={2} style={{resize:"vertical"}} placeholder="O que será aprendido nesta aula..." value={draft.objetivos||""} onChange={e=>setD("objetivos",e.target.value)}/></div>
      <div><div className="detail-label">Feedback para o Aluno</div><textarea className="input-light mt-1" rows={3} style={{resize:"vertical"}} placeholder="Retorno personalizado para o aluno..." value={draft.feedback||""} onChange={e=>setD("feedback",e.target.value)}/></div>
      <div><div className="detail-label">Observações Internas</div><textarea className="input-light mt-1" rows={2} style={{resize:"vertical"}} placeholder="Notas do professor (não visíveis ao aluno)..." value={draft.obs||""} onChange={e=>setD("obs",e.target.value)}/></div>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",paddingTop:4,borderTop:"1px solid var(--divider)"}}>
        <button type="button" className="btn btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold inline-flex items-center gap-2" onClick={saveLesson} disabled={saving}>
          <Icon name="check" size={14}/>{saving?"Salvando…":"Salvar na Trilha"}
        </button>
        {saveMsg&&<span className="text-xs font-semibold" style={{color:"#60daa8"}}>{saveMsg}</span>}
        {saveErr&&<span className="text-xs font-semibold" style={{color:"#f0909a"}}>{saveErr}</span>}
        <span className="text-xs muted">As alterações só são gravadas ao clicar em Salvar.</span>
      </div>
    </div>
  );
}

function StudentLessonView({item}){
  const EL={revisao:"Precisa de revisão",atingiu:"Atingiu",superou:"Superou"};
  const ES={revisao:"eval-revisao",atingiu:"eval-atingiu",superou:"eval-superou"};
  const SKILL_FULL={
    evalF:"FALA",
    evalA:"ESCUTA",
    evalL:"LEITURA",
    evalE:"ESCRITA",
  };
  const concluida=item.status==="concluida"||item.status==="realizada";
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const typeTag=isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":isOutput?"Output":"Input";
  const statusMap={pendente:"Pendente",andamento:"Em andamento",concluida:"Concluída",realizada:"Concluída"};
  const statusLabel=statusMap[item.status]||item.status||"Pendente";

  const urlLicao=item.linkAula||"";
  const urlMaterial=item.linkMaterial||item.link||"";
  const urlTarefa=item.linkTarefa||"";
  const urlAoVivo=item.linkChamada||"";
  const urlGravacao=item.linkGravacao||"";
  const urlRelatorio=item.linkRelatorio||"";
  const urlExtra=item.linkExtra||"";
  // Aula ao vivo: mostra se houver link (mesmo após concluída, se o professor deixar)
  const showAoVivo=!!urlAoVivo;
  const hasEval=EVAL_SKILLS.some(sk=>item[sk.f]);
  const pairBtns=[
    urlLicao&&{href:urlLicao,icon:"zap",label:"Lição Online"},
    urlTarefa&&{href:urlTarefa,icon:"check-square",label:"Tarefa Online"},
    urlMaterial&&{href:urlMaterial,icon:"file-text",label:"Lição PDF"},
    urlExtra&&{href:urlExtra,icon:"sparkles",label:"Extra"},
    urlGravacao&&{href:urlGravacao,icon:"camera",label:"Aulas Gravadas"},
    urlRelatorio&&{href:urlRelatorio,icon:"clipboard-list",label:"Relatório"},
  ].filter(Boolean);
  // pairs of 2
  const pairs=[];
  for(let i=0;i<pairBtns.length;i+=2)pairs.push(pairBtns.slice(i,i+2));

  const hasTheme=item.tema||item.objetivos;
  const hasPerf=(concluida&&item.feedback)||(concluida&&hasEval);
  const hasAny=showAoVivo||pairBtns.length||hasTheme||hasPerf;
  if(!hasAny)return <p className="text-xs muted">Nenhuma informação disponível ainda. Quando o professor liberar links e conteúdo, eles aparecem aqui.</p>;

  return(
    <div className="space-y-1">
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <span className={typeTag}>{typeLabel}</span>
        <LessonBadge status={item.status==="realizada"?"concluida":(item.status||"pendente")}/>
        <span style={{fontSize:12,color:"var(--font-muted)",fontWeight:600}}>{statusLabel}</span>
      </div>

      {showAoVivo&&(
        <div className="slv-btn-row-center">
          <a href={urlAoVivo} target="_blank" rel="noreferrer" className="slv-btn slv-btn-live">
            <Icon name="video" size={18}/> Aula ao Vivo
          </a>
        </div>
      )}

      {pairs.map((row,ri)=>(
        <div key={ri} className="slv-btn-row" style={{marginBottom:10}}>
          {row.map(b=>(
            <a key={b.label} href={b.href} target="_blank" rel="noreferrer" className="slv-btn slv-btn-pair">
              <Icon name={b.icon} size={14}/> {b.label}
            </a>
          ))}
          {row.length===1&&<div style={{flex:1}}/>}
        </div>
      ))}

      {hasTheme&&(
        <div className="slv-theme-card">
          {item.tema&&(
            <>
              <div className="slv-theme-label">Tema</div>
              <p className="slv-theme-text">{item.tema}</p>
            </>
          )}
          {item.objetivos&&(
            <>
              <div className="slv-theme-label">Objetivo</div>
              <p className="slv-theme-text">{item.objetivos}</p>
            </>
          )}
        </div>
      )}

      {hasPerf&&(
        <>
          <div className="slv-perf-line"/>
          <div className="slv-perf-title">Sua performance</div>
          {concluida&&item.feedback&&(
            <p style={{fontSize:14,lineHeight:1.6,color:"#1E1E1E",margin:"0 0 14px",fontWeight:500}}>{item.feedback}</p>
          )}
          {concluida&&hasEval&&(
            <div>
              {EVAL_SKILLS.map(sk=>item[sk.f]?(
                <div key={sk.f} className="slv-skill-row">
                  <span className="slv-skill-name">{SKILL_FULL[sk.f]||sk.name}</span>
                  <span className={"slv-skill-note eval-btn "+ES[item[sk.f]]}>{EL[item[sk.f]]||item[sk.f]}</span>
                </div>
              ):null)}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── MODIFICAÇÃO 3: LessonItem com botão Tarefa Feita
// ── MODIFICAÇÃO 3: LessonItem com botão Tarefa Feita ───────────────────────
function LessonItem({item,uid,isAdmin,defaultOpen=false,onFocused,embedMode=false}){
  const [open,setOpen]=useState(embedMode||false);
  const rootRef=useRef(null);
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const isDone=item.status==="concluida"||item.status==="realizada";
  const isAndamento=item.status==="andamento";
  const isPending=!isDone&&!isAndamento;
  const locked=isPending&&!isAdmin;
  useEffect(()=>{
    if(embedMode||!defaultOpen)return;
    if(locked){onFocused?.();return;}
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{
      rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});
      onFocused?.();
    },120);
    return()=>clearTimeout(t);
  },[defaultOpen,embedMode,locked]);
  function handleToggle(){
    if(locked)return;
    if(!open)playLessonSound();
    setOpen(o=>!o);
  }
  async function toggleTarefa(e){
    e.stopPropagation();
    if(locked&&!isAdmin)return;
    const newVal=!item.tarefaFeita;
    const patch={};
    patch[`trilha.${item.id}.tarefaFeita`]=newVal;
    await db.collection("students").doc(uid).update(patch);
  }
  const borderColor=getLessonBorderColor(item);
  const typeTag=isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":isOutput?"Output":"Input";
  const doneTypeCls=isDone?(isOutput?" done-output":isReview?" done-review":" done-input"):"";
  const statusCls=isPending?" lesson-pending":isAndamento?" lesson-andamento":"";
  const lockCls=locked?" lesson-locked":"";
  if(embedMode)return(
    <div ref={rootRef} className="lesson-detail" style={{padding:"12px 14px"}}>
      <div className="flex items-center gap-2 flex-wrap mb-3 pb-3" style={{borderBottom:"1px solid var(--divider)"}}>
        <span className={typeTag} style={{fontSize:10}}>{typeLabel}</span>
        <LessonBadge status={item.status}/>
        {!isReview&&isAdmin&&<button type="button" title={item.tarefaFeita?"Tarefa entregue":"Marcar tarefa"} onClick={toggleTarefa} style={{width:28,height:28,borderRadius:8,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",background:item.tarefaFeita?"rgba(34,197,94,.18)":"var(--badge)",color:item.tarefaFeita?"#22c55e":"var(--font-muted)",marginLeft:"auto"}}><Icon name={item.tarefaFeita?"check-square":"square"} size={14}/></button>}
      </div>
      {isAdmin?<AdminLessonPanel item={item} uid={uid}/>:<StudentLessonView item={item}/>}
    </div>
  );
  return(
    <div ref={rootRef} className={(isReview?"review-card":"lesson-card")+(isDone?" done-card":"")+doneTypeCls+statusCls+lockCls} style={{borderLeft:`3px solid ${borderColor}`}}>
      <div className="flex items-center gap-3 px-4 py-3" style={{cursor:locked?"not-allowed":"pointer"}} onClick={handleToggle} title={locked?"Lição bloqueada":undefined}>
        <span className={isReview?"num-dark":"num-light"}>{item.pos}</span>
        <div className="flex-1 min-w-0">
          <div className="font-semibold text-sm flex items-center gap-2 flex-wrap">
            {item.title}
            <span className={typeTag}>{typeLabel}</span>
          </div>
          <div className="text-xs mt-0.5 flex items-center gap-2 flex-wrap" style={{opacity:.85}}>
            <span>{isReview?("R"+item.num):("Lesson "+item.num)}</span>
            {item.tema&&!locked&&<span style={{opacity:.9}}>{item.tema}</span>}
            {item.date&&!locked&&<span className="flex items-center gap-1"><Icon name="calendar" size={10}/>{formatDateBR(item.date)}</span>}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {isPending&&<span className="tl-badge-pendente"><Icon name="lock" size={10}/> Pendente</span>}
          {!isReview&&isAdmin&&(
            <button
              type="button"
              title={item.tarefaFeita ? "Tarefa entregue ✓" : "Marcar tarefa como entregue"}
              onClick={toggleTarefa}
              style={{
                width:28,height:28,borderRadius:8,border:'none',cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',
                background:item.tarefaFeita?'rgba(34,197,94,.18)':'var(--badge)',
                color:item.tarefaFeita?'#22c55e':'var(--font-muted)',
                transition:'all 180ms ease',
                flexShrink:0,
              }}
            >
              <Icon name={item.tarefaFeita?"check-square":"square"} size={14}/>
            </button>
          )}
          <LessonBadge status={item.status}/>
          {!locked&&<Icon name="chevron-down" size={14} className={"chevron-icon"+(open?" chevron-open":"")} style={{opacity:.75}}/>}
        </div>
      </div>
      {open&&!locked&&<div className="lesson-detail">{isAdmin?<AdminLessonPanel item={item} uid={uid}/>:<StudentLessonView item={item}/>}</div>}
    </div>
  );
}

function TimelineSegment({height,variant}){
  const h=height||32;
  return(
    <div className="tl-segment" style={{minHeight:h}}>
      <svg className="tl-segment-svg" width="2" height={h} viewBox={`0 0 2 ${h}`} preserveAspectRatio="none">
        <line x1="1" y1="0" x2="1" y2={h} className="tl-line-track"/>
        <line x1="1" y1="0" x2="1" y2={h} className={"tl-line-flow"+(variant==="mod"?" tl-line-flow-mod":"")}/>
        <polygon className="tl-arrow" points={`1,${h-2} -2,${h-8} 4,${h-8}`}/>
      </svg>
    </div>
  );
}

function TimelineLesson({item,uid,isAdmin,defaultOpen,onFocused,isLast}){
  const [open,setOpen]=useState(false);
  const rootRef=useRef(null);
  const concluida=item.status==="concluida"||item.status==="realizada";
  const andamento=item.status==="andamento";
  const isPending=!concluida&&!andamento;
  // Aluno: lição pendente bloqueada (não abre). Admin: pode abrir sempre.
  const locked=isPending&&!isAdmin;
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  const typeTag=isReview?"tag-review":isOutput?"tag-output":"tag-input";
  const typeLabel=isReview?"Review":isOutput?"Output":"Input";
  useEffect(()=>{
    if(!defaultOpen)return;
    if(locked){onFocused?.();return;}
    setOpen(true);
    playLessonSound();
    const t=setTimeout(()=>{rootRef.current?.scrollIntoView({behavior:"smooth",block:"center"});onFocused?.();},120);
    return()=>clearTimeout(t);
  },[defaultOpen,locked]);
  function toggle(){
    if(locked)return;
    if(!open)playLessonSound();
    setOpen(o=>!o);
  }
  let pillCls;
  if(concluida){
    pillCls="tl-pill-done"+(isOutput?" tl-pill-done-output":isReview?" tl-pill-done-review":"");
  }else if(andamento){
    pillCls="tl-pill-active";
  }else{
    pillCls="tl-pill-pending"+(locked?" tl-pill-locked":"");
  }
  const nodeCls="tl-node-lesson"+(concluida?(" tl-node-done"+(isOutput?" tl-node-done-output":isReview?" tl-node-done-review":"")):andamento?" tl-node-active":"");
  const temaRaw=item.tema||(item.objetivos?item.objetivos.split(/[.!?\n]/)[0]:"");
  const tema=temaRaw?String(temaRaw).replace(/^\(|\)$/g,"").trim():"";
  const temaShort=tema?(tema.length>36?tema.slice(0,36)+"…":tema):"";
  const label=isReview?("R"+item.num):("Lesson "+item.num);
  return(
    <div ref={rootRef} className="tl-lesson-row">
      <div className="tl-lesson-rail">
        <div className={"tl-node "+nodeCls}/>
        {!isLast&&<div className="tl-segment-sm"><TimelineSegment height={20}/></div>}
      </div>
      <div className="tl-lesson-body">
        <button type="button" className={"tl-lesson-pill "+pillCls} onClick={toggle} aria-disabled={locked} title={locked?"Lição bloqueada — disponível quando for liberada":undefined}>
          <div style={{minWidth:0,flex:1}}>
            <div className="tl-lesson-title" style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span>{label}{temaShort?<> <span style={{fontWeight:500,opacity:.9}}>{temaShort}</span></>:null}</span>
              <span className={typeTag} style={{fontSize:9}}>{typeLabel}</span>
            </div>
            {item.dataPrevista&&!locked&&<div className="tl-lesson-meta"><span className="tl-previsao">previsão</span> · {formatDateBR(item.dataPrevista).slice(0,5)}</div>}
          </div>
          {isPending&&(
            <span className="tl-badge-pendente" title={locked?"Lição pendente e bloqueada":"Pendente"}>
              <Icon name="lock" size={10}/> Pendente
            </span>
          )}
          {concluida&&<span className={"tl-badge-done"+(isOutput?" tl-badge-done-output":isReview?" tl-badge-done-review":"")}>concluída</span>}
          {andamento&&!concluida&&<span className="tl-badge-current">atual</span>}
          {!locked&&<Icon name="chevron-down" size={14} className={"tl-mod-chevron"+(open?" tl-mod-chevron-open":"")} style={{opacity:.75,color:"inherit"}}/>}
        </button>
        {open&&!locked&&<div className="tl-lesson-expand"><LessonItem item={item} uid={uid} isAdmin={isAdmin} embedMode={true}/></div>}
      </div>
    </div>
  );
}

function TrilhaTimelineModule({bookIdx,modMeta,items,uid,isAdmin,hidden,onToggleHidden,focusLessonId,onLessonFocused,isLast,defaultOpen}){
  const hasFocus=focusLessonId&&items.some(i=>i.id===focusLessonId);
  const [open,setOpen]=useState(defaultOpen||hasFocus);
  const mod=modMeta||{name:"Módulo "+bookIdx};
  useEffect(()=>{if(hasFocus)setOpen(true);},[hasFocus]);
  return(
    <div className="tl-module-block">
      <div className="tl-rail">
        <div className="tl-node tl-node-mod"/>
        {!isLast&&<TimelineSegment height={48} variant="mod"/>}
      </div>
      <div className="tl-content">
        <div className="tl-mod-row">
          <button type="button" className="tl-mod-header" onClick={()=>setOpen(o=>!o)}>
            <div className="tl-mod-num"><span className="tl-mod-lbl">Módulo</span><span className="tl-mod-id">{bookIdx}</span></div>
            <div className="tl-mod-sep"/>
            <div className="tl-mod-title">{mod.name}{hidden&&<span className="tl-mod-hidden-badge">oculto</span>}</div>
            <Icon name="chevron-down" size={16} className={"tl-mod-chevron"+(open?" tl-mod-chevron-open":"")}/>
          </button>
          {isAdmin&&<button type="button" className={"tl-hide-btn"+(hidden?" tl-hidden-active":"")} onClick={onToggleHidden} title={hidden?"Mostrar módulo ao aluno":"Ocultar módulo do aluno"}>
            <Icon name={hidden?"eye-off":"eye"} size={15}/>
            <span>{hidden?"Oculto":"Visível"}</span>
          </button>}
        </div>
        {open&&items.map((item,idx)=><TimelineLesson key={item.id} item={item} uid={uid} isAdmin={isAdmin} defaultOpen={item.id===focusLessonId} onFocused={item.id===focusLessonId?onLessonFocused:undefined} isLast={idx===items.length-1}/>)}
      </div>
    </div>
  );
}

function statusClassForLesson(item){
  const done=item.status==="concluida"||item.status==="realizada";
  const andamento=item.status==="andamento";
  const isReview=item.type==="review"||item.lessonType==="review";
  const isOutput=item.lessonType==="output";
  if(done)return"done"+(isOutput?"-output":isReview?"-review":"");
  if(andamento)return"active";
  return"pending";
}
function statusLabelShort(item){
  if(item.status==="concluida"||item.status==="realizada")return"ok";
  if(item.status==="andamento")return"atual";
  return"pend.";
}

/** Timeline vertical mobile: módulos em círculos + lições em círculos + sheet fullscreen */
function StudentTrilhaJourney({uid,visibleModules,books,modulosOcultos,isAdmin,focusLessonId,onLessonFocused,onOpenLesson,progress,course,onToggleHidden}){
  const [openMod,setOpenMod]=useState(null);
  const [sheetItem,setSheetItem]=useState(null);

  // URL / focusLessonId é a fonte da verdade do sheet (voltar do browser fecha a lição)
  useEffect(()=>{
    if(!focusLessonId){
      setSheetItem(null);
      return;
    }
    const modId=parseInt((focusLessonId.split("-")[0]||"").slice(1),10);
    if(modId)setOpenMod(modId);
    const book=books.find(b=>b.bookIdx===modId);
    const item=book?.items?.find(i=>i.id===focusLessonId);
    if(item){
      const locked=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento")&&!isAdmin;
      if(!locked)setSheetItem(item);
      else setSheetItem(null);
    }
  },[focusLessonId,books,isAdmin]);

  function toggleMod(id){
    playClickSound("mod");
    setOpenMod(cur=>cur===id?null:id);
  }
  function openLesson(item){
    const isPending=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento");
    const locked=isPending&&!isAdmin;
    if(locked)return;
    playClickSound("open");
    // Navega via URL para empilhar no histórico do browser
    if(onOpenLesson)onOpenLesson(item.id);
    else setSheetItem(item);
  }
  function closeSheet(){
    playClickSound("mod");
    setSheetItem(null);
    onLessonFocused?.();
  }

  return(
    <div>
      <div className="tj-stage">
        <div className="tj-title">
          <h2>Sua Trilha</h2>
          <p>{course?.nome||"Curso"} · toque no módulo, depois na lição</p>
        </div>
        <div className="tj-progress">
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94A3B8",marginBottom:6}}>
            <span>Progresso</span><strong style={{color:"#E2E8F0"}}>{progress}%</strong>
          </div>
          <div className="tj-progress-bar"><div className="tj-progress-fill" style={{width:progress+"%"}}/></div>
        </div>

        <div className="tj-list">
          {visibleModules.map((mod,idx)=>{
            const items=books.find(b=>b.bookIdx===mod.id)?.items||[];
            const isOpen=openMod===mod.id;
            const isLast=idx===visibleModules.length-1;
            return(
              <div key={mod.id} className="tj-mod" style={{animationDelay:(idx*0.06)+"s"}}>
                <button type="button" className={"tj-mod-circle"+(isOpen?" open":"")} onClick={()=>toggleMod(mod.id)} aria-expanded={isOpen}>
                  <span className="tj-mod-num">Módulo</span>
                  <span className="tj-mod-id">{mod.id}</span>
                  <span className="tj-mod-name">{(mod.name||"").split(" ").slice(0,2).join(" ")}</span>
                </button>
                {isAdmin&&(
                  <button type="button" className={"tl-hide-btn"+(isModuleHidden(modulosOcultos,mod.id)?" tl-hidden-active":"")} style={{marginTop:8}} onClick={()=>onToggleHidden(mod.id)}>
                    <Icon name={isModuleHidden(modulosOcultos,mod.id)?"eye-off":"eye"} size={14}/>
                    <span>{isModuleHidden(modulosOcultos,mod.id)?"Oculto":"Visível"}</span>
                  </button>
                )}

                {isOpen&&(
                  <div className="tj-lessons">
                    <div className="tj-connector open-gap"/>
                    {items.map((item,li)=>{
                      const isReview=item.type==="review"||item.lessonType==="review";
                      const isOutput=item.lessonType==="output";
                      const isPending=!(item.status==="concluida"||item.status==="realizada"||item.status==="andamento");
                      const locked=isPending&&!isAdmin;
                      const sc=statusClassForLesson(item);
                      const label=isReview?("R"+item.num):String(item.num);
                      const typeLabel=isReview?"Review":isOutput?"Output":"Input";
                      return(
                        <div key={item.id} className="tj-lesson-row" style={{animationDelay:(li*0.04)+"s"}}>
                          <button
                            type="button"
                            className={"tj-lesson-circle "+sc+(locked?" locked":"")}
                            onClick={()=>openLesson(item)}
                            title={locked?"Lição bloqueada":("Lição "+label)}
                          >
                            <span className="tj-l-num">{label}</span>
                            <span className="tj-l-st">{statusLabelShort(item)}</span>
                            <span className={"tj-l-type "+(isReview?"tag-review":isOutput?"tag-output":"tag-input")} style={{fontSize:7,padding:"1px 5px",marginTop:2}}>{typeLabel}</span>
                          </button>
                          {li<items.length-1&&<div className="tj-lesson-connector"/>}
                        </div>
                      );
                    })}
                    {items.length===0&&<p className="tj-admin-note">Sem lições neste módulo.</p>}
                  </div>
                )}

                {!isLast&&!isOpen&&<div className="tj-connector"/>}
                {!isLast&&isOpen&&<div className="tj-connector"/>}
              </div>
            );
          })}
          {visibleModules.length===0&&(
            <div className="text-center py-10" style={{color:"rgba(255,255,255,.45)"}}>
              <Icon name="eye-off" size={28} className="mx-auto mb-2 opacity-40"/>
              <p className="text-sm">Nenhum módulo visível.</p>
            </div>
          )}
        </div>
        <p className="tj-admin-note">Linha do tempo · toque para expandir</p>
      </div>

      {sheetItem&&(
        <div className="tj-sheet" role="dialog" aria-modal="true" onClick={e=>{if(e.target===e.currentTarget)closeSheet();}}>
          <div className="tj-sheet-panel" onClick={e=>e.stopPropagation()}>
            <div className="tj-sheet-head">
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span className={(sheetItem.lessonType==="review"||sheetItem.type==="review")?"tag-review":sheetItem.lessonType==="output"?"tag-output":"tag-input"}>
                    {(sheetItem.lessonType==="review"||sheetItem.type==="review")?"Review":sheetItem.lessonType==="output"?"Output":"Input"}
                  </span>
                  <LessonBadge status={sheetItem.status==="realizada"?"concluida":(sheetItem.status||"pendente")}/>
                </div>
                <div style={{fontSize:18,fontWeight:800,fontFamily:"'Sora',sans-serif",lineHeight:1.2}}>
                  {(sheetItem.type==="review"||sheetItem.lessonType==="review")?("R"+sheetItem.num):("Lesson "+sheetItem.num)}
                </div>
              </div>
              <button type="button" className="tj-sheet-close" onClick={closeSheet} aria-label="Fechar"><Icon name="x" size={20}/></button>
            </div>
            <div className="tj-sheet-body">
              <LessonItem item={sheetItem} uid={uid} isAdmin={isAdmin} embedMode={true}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TrilhaSection({uid,isAdmin,focusLessonId,onLessonFocused,onOpenLesson,contrato}){
  const courses=useCourses();
  const [trilhaData,setTrilhaData]=useState(null);
  const [modulosOcultos,setModulosOcultos]=useState([]);
  const [studentContrato,setStudentContrato]=useState(contrato||"");
  useEffect(()=>db.collection("students").doc(uid).onSnapshot(doc=>{
    if(!doc.exists){setTrilhaData({});setModulosOcultos([]);return;}
    const d=doc.data();
    setTrilhaData(d.trilha||{});
    setModulosOcultos(d.modulosOcultos||[]);
    if(d.contrato)setStudentContrato(d.contrato);
  }),[uid]);
  const course=useMemo(()=>getCourseById(contrato||studentContrato),[courses,contrato,studentContrato]);
  const books=useMemo(()=>trilhaData?mergeBooks(trilhaData,course):[],[trilhaData,course]);
  const visibleModules=getVisibleModules(modulosOcultos,isAdmin,course);
  const {totalDone,totalItems}=useMemo(()=>{
    let done=0,total=0;
    books.filter(b=>isAdmin||!isModuleHidden(modulosOcultos,b.bookIdx)).forEach(b=>b.items.forEach(i=>{total++;if(i.status==="concluida"||i.status==="realizada")done++;}));
    return{totalDone:done,totalItems:total};
  },[books,modulosOcultos,isAdmin]);
  const progress=totalItems?Math.round((totalDone/totalItems)*100):0;
  async function toggleModuleHidden(modId){
    const next=modulosOcultos.includes(modId)?modulosOcultos.filter(id=>id!==modId):[...modulosOcultos,modId];
    await db.collection("students").doc(uid).update({modulosOcultos:next});
  }
  useEffect(()=>{
    if(isAdmin||!focusLessonId)return;
    const modId=parseInt((focusLessonId.split("-")[0]||"").slice(1),10);
    if(isModuleHidden(modulosOcultos,modId))onLessonFocused?.();
  },[focusLessonId,modulosOcultos,isAdmin]);
  if(!trilhaData)return <LoadingScreen/>;

  // Aluno (e admin em preview mobile-friendly): journey timeline
  if(!isAdmin){
    return(
      <StudentTrilhaJourney
        uid={uid}
        visibleModules={visibleModules}
        books={books}
        modulosOcultos={modulosOcultos}
        isAdmin={false}
        focusLessonId={focusLessonId}
        onLessonFocused={onLessonFocused}
        onOpenLesson={onOpenLesson}
        progress={progress}
        course={course}
        onToggleHidden={toggleModuleHidden}
      />
    );
  }

  // Admin: journey + painel de progresso
  return(
    <div>
      <div className="glass rounded-2xl p-5 mb-5 text-center">
        <h2 className="text-xl font-bold mb-1 flex items-center justify-center gap-2" style={{fontFamily:"'Sora',sans-serif"}}>
          <Icon name="route" size={18} style={{color:'rgba(44,122,142,1)'}}/>Trilha
        </h2>
        <p className="text-xs muted mb-1" style={{color:course.corBase||"var(--font-muted)"}}>{course.nome||"Curso"} · {getTotalLicoes(course)} lições</p>
        <div className="max-w-sm mx-auto mt-3">
          <div className="flex justify-between text-xs muted mb-1"><span>Progresso</span><span className="font-semibold">{progress}%</span></div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{background:"var(--badge)"}}><div className="h-full rounded-full progress-fill" style={{width:progress+"%",background:"linear-gradient(90deg,rgba(44,122,142,.9),rgba(17,75,95,.8))"}}/></div>
        </div>
        <p className="text-xs muted mt-3">Toque nos círculos de módulo e lição. Use o botão de olho para ocultar módulos do aluno.</p>
      </div>
      <StudentTrilhaJourney
        uid={uid}
        visibleModules={visibleModules}
        books={books}
        modulosOcultos={modulosOcultos}
        isAdmin={true}
        focusLessonId={focusLessonId}
        onLessonFocused={onLessonFocused}
        progress={progress}
        course={course}
        onToggleHidden={toggleModuleHidden}
      />
    </div>
  );
}

function DiarioSection({uid,isAdmin,contrato}){
  const courses=useCourses();
  const [entries,setEntries]=useState(null);
  const [studentContrato,setStudentContrato]=useState(contrato||"");
  useEffect(()=>db.collection("students").doc(uid).collection("diario").orderBy("num","asc").onSnapshot(snap=>setEntries(snap.docs.map(d=>({id:d.id,...d.data()})))),[uid]);
  useEffect(()=>{
    if(contrato){setStudentContrato(contrato);return;}
    return db.collection("students").doc(uid).onSnapshot(doc=>{if(doc.exists&&doc.data().contrato)setStudentContrato(doc.data().contrato);});
  },[uid,contrato]);
  const course=useMemo(()=>getCourseById(studentContrato),[courses,studentContrato]);
  const maxLicao=getTotalLicoes(course);
  async function addEntry(){const nextNum=entries&&entries.length>0?Math.max(...entries.map(e=>e.num))+1:1;await db.collection("students").doc(uid).collection("diario").add({num:nextNum,date:new Date().toISOString().slice(0,10),licaoNum:1,status:"andamento",obs:"",reposicaoTipo:"",reposicaoMotivo:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
  async function updateEntry(id,patch){
    const merged={...entries.find(e=>e.id===id),...patch};
    if(patch.status==="ausente"&&patch.reposicaoTipo==="com"&&!merged.reposicaoVence){
      const d=new Date(merged.date||new Date());d.setDate(d.getDate()+30);
      patch.reposicaoVence=d.toISOString().slice(0,10);
      patch.status="a_repor";
    }
    if(patch.status==="rep_feita")patch.status="rep_feita";
    await db.collection("students").doc(uid).collection("diario").doc(id).update(patch);
    if((patch.status==="realizada"||patch.status==="rep_feita")&&merged.licaoNum){
      const licaoNum=parseInt(merged.licaoNum);
      if(licaoNum>=1&&licaoNum<=maxLicao){
        const trilhaItemId=lessonIdFromNum(licaoNum,course);
        const trilhaPatch={};
        trilhaPatch[`trilha.${trilhaItemId}.status`]="concluida";
        if(merged.date)trilhaPatch[`trilha.${trilhaItemId}.date`]=merged.date;
        try{await db.collection("students").doc(uid).update(trilhaPatch);}catch(e){}
      }
    }
  }
  async function deleteEntry(id){if(!confirm("Remover esta aula?"))return;await db.collection("students").doc(uid).collection("diario").doc(id).delete();}
  if(!entries)return null;
  const stats=computeDiarioStats(entries);
  const iS={background:"var(--input-bg)",border:"1px solid var(--input-border)",color:"var(--font)",borderRadius:8,padding:"4px 8px",fontSize:12,outline:"none",fontFamily:"'Outfit',sans-serif"};
  const studentStatusLabel={realizada:"realizada",ausente:"ausente",a_repor:"a repor",rep_vencida:"reposição vencida",rep_feita:"reposição feita",andamento:"em andamento",cancelada:"cancelada"};

  if(!isAdmin){
    return(
      <div className="space-y-4">
        <div className="glass rounded-2xl p-4 diario-grid">
          {[
            {n:stats.realizadas,l:"aulas feitas"},
            {n:stats.ausentes,l:"aulas ausentes"},
            {n:stats.paraRepor,l:"para repor",color:"#e8a94c"},
            {n:stats.semRepor,l:"sem repor"},
            {n:stats.repFeitas,l:"reposições feitas",color:"#3ecf8e"},
            {n:stats.repVencidas,l:"reposições vencidas",color:"#e5636b"},
          ].map((s,i)=>(
            <div key={i}><div style={{fontSize:18,fontWeight:800,color:s.color||"var(--font)"}}>{s.n}</div><div className="text-xs muted">{s.l}</div></div>
          ))}
        </div>
        {entries.length===0?<div className="glass rounded-2xl p-8 text-center muted">Nenhuma aula lançada ainda.</div>:(
          <div className="space-y-2">{entries.map(e=>{
            const ds=dStatusMap[e.status]||{cls:"",label:studentStatusLabel[e.status]||e.status};
            const dateLabel=e.status==="a_repor"&&e.reposicaoVence?`vence em ${formatDateBR(e.reposicaoVence).slice(0,5)}`:formatDateBR(e.date).slice(0,5);
            return(
              <div key={e.id} className="glass rounded-xl px-4 py-3 flex justify-between items-center gap-3">
                <div><div className="text-sm font-semibold">Aula {e.num} · {dateLabel}</div><div className="text-xs muted">{e.licaoNum?`Lesson ${e.licaoNum}`:"—"}</div></div>
                <span className={"diario-badge "+ds.cls}>{ds.label||studentStatusLabel[e.status]}</span>
              </div>
            );
          })}</div>
        )}
      </div>
    );
  }

  return(
    <div><div className="glass rounded-2xl p-5">
      <div className="flex items-center justify-between gap-3 flex-wrap mb-5">
        <div><h3 className="text-lg font-bold flex items-center gap-2"><Icon name="book-open" size={18} style={{color:'rgba(44,122,142,1)'}}/>Diário de Aulas</h3></div>
        <button className="btn btn-primary rounded-xl px-4 py-2.5 inline-flex items-center gap-2 text-sm font-semibold" onClick={addEntry}><Icon name="plus" size={16}/> Nova Aula</button>
      </div>
      {entries.length===0?<div className="text-center py-12 muted"><p>Nenhuma aula lançada ainda.</p></div>:(
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead><tr className="text-left muted text-xs"><th className="py-3 pr-3">Aula</th><th className="py-3 pr-3">Data</th><th className="py-3 pr-3">Lição</th><th className="py-3 pr-3">Status</th><th className="py-3 pr-3">Reposição</th><th className="py-3 pr-3">Observações</th><th className="py-3"/></tr></thead>
          <tbody>{entries.map(e=>{const ds=dStatusMap[e.status]||DIARIO_STATUS[0];return(
            <tr key={e.id} className="dtable-row align-top">
              <td className="py-3 pr-3"><div className="num-aula inline-flex flex-col items-center"><span className="text-xs opacity-70">Aula</span><span>{e.num}</span></div></td>
              <td className="py-3 pr-3"><input type="date" value={e.date||""} onChange={ev=>updateEntry(e.id,{date:ev.target.value})} style={{...iS,width:130}}/></td>
              <td className="py-3 pr-3"><input type="number" min={1} max={maxLicao} value={e.licaoNum||1} onChange={ev=>updateEntry(e.id,{licaoNum:parseInt(ev.target.value)||1})} style={{...iS,width:65,textAlign:"center"}}/></td>
              <td className="py-3 pr-3"><select className="ds-select" value={e.status==="a_repor"?"ausente":e.status} onChange={ev=>{const v=ev.target.value;updateEntry(e.id,v==="ausente"?{status:"ausente"}:{status:v,reposicaoTipo:"",reposicaoMotivo:""});}}>{DIARIO_STATUS.filter(s=>!["a_repor","rep_vencida"].includes(s.value)).map(s=><option key={s.value} value={s.value}>{s.label}</option>)}</select><div className="mt-1"><span className={"diario-badge "+ds.cls}>{ds.label}</span></div></td>
              <td className="py-3 pr-3" style={{minWidth:180}}>
                {(e.status==="ausente"||e.status==="a_repor")&&<>
                  <select className="ds-select mb-1" value={e.reposicaoTipo||""} onChange={ev=>updateEntry(e.id,{reposicaoTipo:ev.target.value,reposicaoMotivo:""})}>
                    <option value="">— tipo —</option><option value="com">Com Reposição</option><option value="sem">Sem Reposição</option>
                  </select>
                  {e.reposicaoTipo==="com"&&<select className="ds-select" value={e.reposicaoMotivo||""} onChange={ev=>updateEntry(e.id,{reposicaoMotivo:ev.target.value,status:"a_repor"})}>{REP_COM_MOTIVOS.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}</select>}
                  {e.reposicaoTipo==="sem"&&<select className="ds-select" value={e.reposicaoMotivo||""} onChange={ev=>updateEntry(e.id,{reposicaoMotivo:ev.target.value})}>{REP_SEM_MOTIVOS.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}</select>}
                </>}
              </td>
              <td className="py-3 pr-3" style={{minWidth:160}}><textarea className="obs-input" rows={2} value={e.obs||""} onChange={ev=>updateEntry(e.id,{obs:ev.target.value})}/></td>
              <td className="py-3"><button className="btn btn-danger rounded-lg px-2.5 py-2" onClick={()=>deleteEntry(e.id)}><Icon name="trash-2" size={14}/></button></td>
            </tr>);})}</tbody>
        </table></div>
      )}
    </div></div>
  );
}

function FinanceiroStrip({financeiro,onGoToFinanceiro,compact}){
  const parcelas=financeiro?.parcelas||[];
  const {current,next,isLate,allPaid,sorted}=resolveFinanceSnapshot(parcelas);
  const statusLabel=isLate?"EM ATRASO":allPaid||current?"EM DIA":"—";
  const statusCls=isLate?"fin-vencida":"fin-paga";
  return(
    <div className="glass rounded-2xl p-4" style={{cursor:onGoToFinanceiro?"pointer":"default"}} onClick={onGoToFinanceiro}>
      <div className="flex justify-between items-center mb-2">
        <span className="detail-label" style={{margin:0}}>Financeiro</span>
        {onGoToFinanceiro&&<span className="text-xs" style={{color:"rgba(44,122,142,1)"}}>Ver completo ↗</span>}
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        {sorted.length>0&&<span className={"fin-badge "+statusCls}>{statusLabel}</span>}
        {current?.dataVencimento&&<span className="text-xs muted">{current.mes||formatMonthDay(current.dataVencimento)} · vence <strong style={{color:"var(--font)"}}>{formatDateBR(current.dataVencimento).slice(0,5)}</strong></span>}
        {next?.dataVencimento&&<span className="text-xs muted">Próximo: <strong style={{color:"var(--font)"}}>{formatMonthDay(next.dataVencimento)}</strong></span>}
        {sorted.length===0&&!compact&&<span className="text-xs muted">Sem lançamentos cadastrados</span>}
      </div>
    </div>
  );
}
