<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Corporate Speech — Módulo 1 | Fluency Studio</title>
<link rel="icon" href="logo.png" />
<script src="page-flip.browser.js"></script>
<script src="lessons.js?v=20260821"></script>
<style>
:root{
  --bg:#070b14;
  --panel:rgba(14,22,40,.92);
  --panel-solid:#0e1628;
  --accent:#14a394;
  --accent-2:#3b82f6;
  --accent-deep:#0e7a72;
  --indigo:#241b40;
  --navy:#12233f;
  --ink:#f3f6fb;
  --muted:#9aa8bd;
  --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050910}
body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);
  overflow:hidden;user-select:none;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%,rgba(20,163,148,.18),transparent 55%),
    radial-gradient(ellipse 40% 40% at 90% 80%,rgba(59,130,246,.12),transparent 50%),
    #050910;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
.flipbook-container{position:fixed;inset:0;display:flex;flex-direction:column}
.splash-screen{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(20,163,148,.22),transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(36,27,64,.45),transparent 45%),
    #070b14;
  transition:opacity .7s;
}
.splash-screen.hide{opacity:0;pointer-events:none}
.splash-content{
  text-align:center;padding:32px 28px;max-width:480px;
  background:rgba(14,22,40,.78);border:1px solid var(--line);border-radius:24px;
  backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45);
}
.splash-logo-img{width:84px;height:84px;border-radius:20px;margin:0 auto;box-shadow:0 0 40px rgba(20,163,148,.35)}
.splash-kicker{margin-top:14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.splash-title{
  margin-top:8px;font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(120deg,#fff 0%,var(--accent) 55%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.splash-subtitle{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.45}
.splash-meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.splash-pill{
  font-size:11px;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);
}
.splash-btn{
  margin-top:20px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#041018;
  box-shadow:0 8px 24px rgba(20,163,148,.35);
}
.splash-btn:hover{filter:brightness(1.06)}
.flipbook-header{
  position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;background:linear-gradient(180deg,rgba(5,9,16,.95),transparent);backdrop-filter:blur(8px);
}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{width:34px;height:34px;border-radius:10px}
.header-title{font-size:14px;font-weight:700}
.header-subtitle{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.lesson-chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:rgba(20,163,148,.12);border:1px solid rgba(20,163,148,.35);
  font-size:12px;font-weight:600;max-width:min(360px,42vw);
}
.lesson-chip .chip-n{color:var(--accent)}
.lesson-chip .chip-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-page-indicator{
  font-size:12px;color:var(--muted);padding:7px 12px;border-radius:99px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);
}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.flipbook-main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0}
.flipbook-wrapper{width:min(560px,94vw);transform-origin:center center}
@media(min-width:1100px){.flipbook-wrapper{width:min(1100px,96vw)}}
.flipbook-element{width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.flip-page{overflow:hidden;background:#0b1220}
.flip-page-img{width:100%;height:100%;object-fit:contain;background:#0b1220;pointer-events:none}
.flipbook-controls{
  position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;
  background:rgba(14,22,40,.88);border:1px solid var(--line);backdrop-filter:blur(12px);
}
.ctrl-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);font-size:18px;
}
.ctrl-btn:hover{background:rgba(20,163,148,.22)}
.drawer-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.index-drawer{
  position:fixed;z-index:80;top:0;left:0;bottom:0;width:min(420px,92vw);background:var(--panel-solid);
  border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .3s;
  display:flex;flex-direction:column;
}
.index-drawer.open{transform:translateX(0)}
.drawer-head{padding:16px;border-bottom:1px solid var(--line)}
.drawer-search{
  width:100%;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:#fff;font:inherit;font-size:13px;outline:none;
}
.drawer-search:focus{border-color:rgba(20,163,148,.55)}
.drawer-list{flex:1;overflow:auto;padding:10px}
.unit-label{
  margin:12px 6px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
}
.lesson-row{
  width:100%;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;
  padding:10px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,.03);
}
.lesson-row:hover{background:rgba(20,163,148,.1)}
.lesson-row.current{border:1px solid rgba(20,163,148,.4);background:rgba(20,163,148,.12)}
.lesson-row .ln{font-weight:800;color:var(--accent)}
.lesson-row .lt{font-size:13px;font-weight:600}
.lesson-row .ls{font-size:11px;color:var(--muted);margin-top:2px}
.thumb-rail{position:fixed;bottom:5.2rem;left:0;right:0;z-index:35;padding:0 12px}
.thumb-scroll{display:flex;gap:8px;overflow-x:auto;padding:8px 4px;scrollbar-width:thin}
.thumbnail-btn{flex:0 0 auto;width:64px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#101828}
.thumbnail-btn.current{border-color:var(--accent)}
.thumbnail-img{width:64px;height:90px;object-fit:cover}
html.embed-mode .splash-screen{display:none!important}
html.embed-mode .flipbook-footer{display:none}
.flipbook-footer{
  position:fixed;bottom:0;left:0;right:0;text-align:center;padding:4px;
  font-size:10px;color:var(--muted);pointer-events:none;
}
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;
  padding:8px 14px;border-radius:999px;background:rgba(20,163,148,.95);color:#041018;
  font-size:12px;font-weight:700;opacity:0;transition:opacity .2s;
}
#toast.show{opacity:1}
.loader-inline{margin-top:16px;color:var(--muted);font-size:12px}

/* FLIPBOOK_UX_V2 compact */
.flipbook-main{position:relative;overflow:hidden}
.flipbook-wrapper{transform-origin:center center}
.flipbook-controls{flex-wrap:wrap;max-width:min(720px,96vw);justify-content:center}
.zoom-slider-wrap{display:flex;align-items:center;gap:8px;min-width:160px;max-width:240px}
.zoom-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.18);outline:none;cursor:pointer}
.zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid currentColor}
.zoom-label{font-size:11px;min-width:40px;text-align:center;opacity:.85}
.pan-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:25;font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:opacity .2s}
.pan-hint.show{opacity:1}
.flipbook-main.is-panning{cursor:grab}
.flipbook-main.is-panning.dragging{cursor:grabbing}

</style>
</head>
<body>
<div class="flipbook-container">
  <div class="splash-screen" id="splash">
    <div class="splash-content">
      <img class="splash-logo-img" src="logo.png" alt="Fs" onerror="this.style.display='none'"/>
      <div class="splash-kicker">The Fluency Studio</div>
      <div class="splash-title">Corporate Speech</div>
      <p class="splash-subtitle">Módulo 1 · Student Book<br/>Units 1–8 · Lessons 1–32 + Reviews 1–5</p>
      <div class="splash-meta">
        <span class="splash-pill">Flip 3D</span>
        <span class="splash-pill">Alta resolução</span>
        <span class="splash-pill" id="splashPages">— páginas</span>
      </div>
      <button class="splash-btn" id="btnStart" type="button">Abrir o livro</button>
      <div class="loader-inline" id="splashHint">Preparando páginas…</div>
    </div>
  </div>

  <header class="flipbook-header">
    <div class="header-left">
      <img class="header-logo" src="logo.png" alt="" onerror="this.style.display='none'"/>
      <div>
        <div class="header-title">Corporate Speech</div>
        <div class="header-subtitle">Student Book · Módulo 1</div>
      </div>
    </div>
    <div class="header-right">
      <div class="lesson-chip" id="lessonChip"><span class="chip-n">—</span><span class="chip-t">Student Book</span></div>
      <div class="header-page-indicator"><span id="pageCur">1</span> / <span id="pageTotal">—</span></div>
      <button class="icon-btn" id="btnFullscreen" type="button" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
      <button class="icon-btn" id="btnIndex" type="button" title="Índice" aria-label="Índice">☰</button>
    </div>
  </header>

  <main class="flipbook-main">
    <div class="flipbook-wrapper" id="wrapper">
      <div class="flipbook-element" id="flipbook"></div>
    </div>
  </main>

  <div class="thumb-rail"><div class="thumb-scroll" id="thumbnailsScroll"></div></div>
  <div class="flipbook-controls">
    <button class="ctrl-btn" id="btnPrev" type="button" aria-label="Anterior">‹</button>
    <button class="ctrl-btn" id="btnNext" type="button" aria-label="Próxima">›</button>
    <button class="ctrl-btn" id="btnZoomOut" type="button" title="Reduzir">−</button>
    <div class="zoom-slider-wrap"><input class="zoom-slider" id="zoomSlider" type="range" min="50" max="250" step="5" value="100" aria-label="Zoom"/><span class="zoom-label" id="zoomLabel">100%</span></div>
    <button class="ctrl-btn" id="btnZoomIn" type="button" title="Ampliar">+</button>
  </div>
  <footer class="flipbook-footer">© Fluency Studio · Corporate Speech Módulo 1 · Student Book</footer>
</div>

<div class="drawer-scrim" id="scrim"></div>
<aside class="index-drawer" id="drawer" aria-label="Índice do livro">
  <div class="drawer-head">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong style="letter-spacing:.08em;text-transform:uppercase;font-size:13px">Índice</strong>
      <button class="icon-btn" id="btnCloseDrawer" type="button" aria-label="Fechar">✕</button>
    </div>
    <input class="drawer-search" id="lessonSearch" type="search" placeholder="Buscar lição ou unidade…" />
  </div>
  <div class="drawer-list" id="lessonList"></div>
</aside>
<div id="toast"></div>

<script>
"use strict";
const TOTAL_PAGES = window.FLIPBOOK_TOTAL_PAGES || 0;
const LESSONS = window.FLIPBOOK_LESSONS || [];
const LS_LAST = "cs-m1-student-last";
const $ = (id) => document.getElementById(id);
let currentPage = 0, pf = null, pendingStart = 0, ready = false;
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed-mode");

function pad(n){ return String(n).padStart(2,"0"); }
function lessonAt(idx){
  for (let i = LESSONS.length - 1; i >= 0; i--) if (idx + 1 >= LESSONS[i].start) return LESSONS[i];
  return null;
}
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
function buildPages(){
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= TOTAL_PAGES; i++){
    const page = document.createElement("div");
    page.className = "flip-page";
    page.dataset.density = (i === 1 || i === TOTAL_PAGES) ? "hard" : "soft";
    page.innerHTML = '<img src="pages/page-' + pad(i) + '.png" alt="Página ' + i + '" class="flip-page-img" draggable="false" loading="' + (i <= 4 ? "eager" : "lazy") + '" />';
    frag.appendChild(page);
  }
  $("flipbook").appendChild(frag);
}
function buildThumbnails(){
  const scroll = $("thumbnailsScroll");
  for (let i = 1; i <= TOTAL_PAGES; i++){
    const idx = i - 1;
    const btn = document.createElement("button");
    btn.className = "thumbnail-btn";
    btn.type = "button";
    btn.dataset.idx = idx;
    btn.title = "Página " + i;
    btn.innerHTML = '<img src="thumbs/page-' + pad(i) + '.png" alt="" class="thumbnail-img" loading="lazy" />';
    btn.addEventListener("click", () => flipToPage(idx));
    scroll.appendChild(btn);
  }
}
function renderIndex(){
  const q = ($("lessonSearch").value || "").toLowerCase().trim();
  const list = $("lessonList");
  list.innerHTML = "";
  let lastUnit = null;
  LESSONS.forEach((L) => {
    const hay = [L.n, L.title, L.short, L.type, L.unit, L.unitTitle].filter(Boolean).join(" ").toLowerCase();
    if (q && !hay.includes(q)) return;
    if (L.type === "lesson" && L.unit && L.unit !== lastUnit){
      lastUnit = L.unit;
      const lab = document.createElement("div");
      lab.className = "unit-label";
      lab.textContent = "Unit " + L.unit + " · " + (L.unitTitle || "");
      list.appendChild(lab);
    } else if (L.type === "review"){
      const lab = document.createElement("div");
      lab.className = "unit-label";
      lab.textContent = "Review " + L.n;
      list.appendChild(lab);
    }
    const cur = lessonAt(currentPage);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lesson-row" + (cur && cur.key === L.key ? " current" : "");
    const tag = L.type === "review" ? ("R" + L.n) : ("L" + String(L.n).padStart(2,"0"));
    btn.innerHTML = '<span class="ln">' + tag + '</span><span><span class="lt">' + L.title + '</span><span class="ls">' + L.short + ' · p.' + L.start + '</span></span>';
    btn.addEventListener("click", () => { flipToPage(L.start - 1); closeDrawer(); });
    list.appendChild(btn);
  });
}
function onCurrentChange(){
  $("pageCur").textContent = String(currentPage + 1);
  const L = lessonAt(currentPage);
  if (L){
    const tag = L.type === "review" ? ("R" + L.n) : ("L" + String(L.n).padStart(2,"0"));
    $("lessonChip").innerHTML = '<span class="chip-n">' + tag + '</span><span class="chip-t">' + L.title + '</span>';
  }
  document.querySelectorAll(".thumbnail-btn").forEach((b) => {
    b.classList.toggle("current", parseInt(b.dataset.idx, 10) === currentPage);
    if (parseInt(b.dataset.idx, 10) === currentPage) b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  try { localStorage.setItem(LS_LAST, String(currentPage)); } catch(e){}
  if ($("drawer").classList.contains("open")) renderIndex();
}
function flipToPage(idx){
  const clamped = Math.max(0, Math.min(TOTAL_PAGES - 1, idx));
  if (pf) { try { pf.turnToPage(clamped); } catch(e){} }
  currentPage = clamped;
  onCurrentChange();
}
function openDrawer(){ $("drawer").classList.add("open"); $("scrim").classList.add("open"); renderIndex(); }
function closeDrawer(){ $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }
function toggleFullscreen(){
  const root = document.documentElement;
  if (!document.fullscreenElement) {
    (root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen).call(root);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
  }
}
function initFlip(){
  if (!TOTAL_PAGES || !LESSONS.length){
    toast("Metadados do livro ausentes — rode o render");
    $("splashHint").textContent = "Erro: lessons.js não carregou.";
    return;
  }
  $("pageTotal").textContent = String(TOTAL_PAGES);
  $("splashPages").textContent = TOTAL_PAGES + " páginas";
  buildPages();
  buildThumbnails();
  const el = $("flipbook");
  const PageFlipCtor = (window.St && window.St.PageFlip) || window.PageFlip;
  if (!PageFlipCtor){
    toast("Engine de flip não carregou");
    $("splashHint").textContent = "Engine St.PageFlip não encontrada.";
    return;
  }
  const start = Math.max(0, Math.min(TOTAL_PAGES - 1, pendingStart || 0));
  pf = new PageFlipCtor(el, {
    width: 560, height: 790,
    size: "stretch",
    minWidth: 280, maxWidth: 1200,
    minHeight: 400, maxHeight: 1200,
    drawShadow: true,
    maxShadowOpacity: 0.4,
    showCover: true,
    mobileScrollSupport: true, disableFlipByClick: true,
    usePortrait: true,
    startPage: start,
  });
  pf.loadFromHTML(el.querySelectorAll(".flip-page"));
  pf.on("flip", (e) => { currentPage = e.data; onCurrentChange(); });
  currentPage = start;
  onCurrentChange();
  if (start > 0) {
    // Defer jump: loadFromHTML finishes layout on next frame.
    requestAnimationFrame(() => {
      try { pf.turnToPage(start); } catch (e) {}
      currentPage = start;
      onCurrentChange();
      setTimeout(() => {
        try { pf.turnToPage(start); } catch (e) {}
        currentPage = start;
        onCurrentChange();
      }, 120);
    });
  }
  ready = true;
  $("splashHint").textContent = "Pronto para abrir.";
}
function startBook(){
  $("splash").classList.add("hide");
  setTimeout(() => { $("splash").style.display = "none"; }, 700);
  if (!pf) initFlip();
}
$("btnStart").addEventListener("click", startBook);
$("btnPrev").addEventListener("click", () => { if (pf) pf.flipPrev(); else flipToPage(currentPage - 1); });
$("btnNext").addEventListener("click", () => { if (pf) pf.flipNext(); else flipToPage(currentPage + 1); });
$("btnIndex").addEventListener("click", openDrawer);
$("btnCloseDrawer").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
$("btnFullscreen").addEventListener("click", toggleFullscreen);
$("lessonSearch").addEventListener("input", renderIndex);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") $("btnPrev").click();
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); $("btnNext").click(); }
  if (e.key === "Escape") closeDrawer();
  if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey) toggleFullscreen();
  if (e.key === "Home") flipToPage(0);
  if (e.key === "End") flipToPage(TOTAL_PAGES - 1);
});

const q = new URLSearchParams(location.search);
const pageQ = parseInt(q.get("page") || "", 10);
const lessonQ = parseInt(q.get("lesson") || "", 10);
const reviewQ = parseInt(q.get("review") || "", 10);
const keyQ = (q.get("key") || "").trim();
function lessonStart(hit){
  if (!hit || !hit.start) return 0;
  return Math.max(0, (hit.start | 0) - 1);
}
if (pageQ >= 1) pendingStart = pageQ - 1;
else if (keyQ){
  pendingStart = lessonStart(LESSONS.find((x) => x.key === keyQ));
}
else if (!isNaN(reviewQ) && reviewQ >= 1){
  pendingStart = lessonStart(LESSONS.find((x) => x.type === "review" && Number(x.n) === reviewQ));
}
else if (!isNaN(lessonQ) && lessonQ >= 1){
  pendingStart = lessonStart(LESSONS.find((x) => x.type === "lesson" && Number(x.n) === lessonQ));
}
else {
  try {
    const last = parseInt(localStorage.getItem(LS_LAST) || "0", 10);
    if (last > 0) pendingStart = last;
  } catch(e){}
}
document.documentElement.dataset.start = String(pendingStart);

if (EMBED) startBook();
else setTimeout(() => { if (!pf) initFlip(); }, 80);
</script>
<script>

/* FLIPBOOK_UX_V2 compact runtime */
(function(){
  const ZOOM_MIN=50, ZOOM_MAX=250, ZOOM_STEP=10;
  let zoom=100, fitScale=1, panX=0, panY=0, panning=false;
  let panStartX=0, panStartY=0, panOriginX=0, panOriginY=0;
  const wrap=document.getElementById("wrapper") || document.getElementById("flipbookWrapper");
  const main=document.querySelector(".flipbook-main");
  if(!wrap || !main) return;
  if(!document.getElementById("panHint")){
    const hint=document.createElement("div");
    hint.id="panHint"; hint.className="pan-hint";
    hint.textContent="Arraste a página para ler · zoom > 100%";
    main.appendChild(hint);
  }
  function canPan(){return zoom>105;}
  function apply(){
    wrap.style.transform=`translate(${panX}px,${panY}px) scale(${(fitScale*zoom/100).toFixed(4)})`;
    const label=document.getElementById("zoomLabel");
    const slider=document.getElementById("zoomSlider");
    if(label) label.textContent=zoom+"%";
    if(slider && String(slider.value)!==String(zoom)) slider.value=String(zoom);
    const hint=document.getElementById("panHint");
    if(hint) hint.classList.toggle("show", canPan());
    main.classList.toggle("is-panning", canPan());
    if(!canPan()){panX=0;panY=0;}
  }
  function setZoom(z){
    zoom=Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z)));
    if(!canPan()){panX=0;panY=0;}
    apply();
  }
  function applyFit(){
    const availW=main.clientWidth-12, availH=main.clientHeight-12;
    const bw=wrap.offsetWidth||460, bh=wrap.offsetHeight||650;
    fitScale=Math.min(availW/bw, availH/bh, 1.85);
    apply();
  }
  const zin=document.getElementById("btnZoomIn");
  const zout=document.getElementById("btnZoomOut");
  const slider=document.getElementById("zoomSlider");
  if(zin) zin.addEventListener("click", ()=>setZoom(zoom+ZOOM_STEP));
  if(zout) zout.addEventListener("click", ()=>setZoom(zoom-ZOOM_STEP));
  if(slider) slider.addEventListener("input", e=>setZoom(parseInt(e.target.value,10)));
  main.addEventListener("pointerdown", ev=>{
    if(!canPan()) return;
    if(ev.target.closest("button,input,a,.index-drawer")) return;
    if(ev.pointerType==="mouse" && ev.button!==0) return;
    panning=true; panStartX=ev.clientX; panStartY=ev.clientY; panOriginX=panX; panOriginY=panY;
    main.classList.add("dragging");
    try{main.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault();
  }, {passive:false});
  main.addEventListener("pointermove", ev=>{
    if(!panning) return;
    panX=panOriginX+(ev.clientX-panStartX);
    panY=panOriginY+(ev.clientY-panStartY);
    apply();
  });
  function endPan(ev){ if(!panning) return; panning=false; main.classList.remove("dragging"); try{main.releasePointerCapture(ev.pointerId);}catch(e){} }
  main.addEventListener("pointerup", endPan);
  main.addEventListener("pointercancel", endPan);
  main.addEventListener("wheel", ev=>{
    if(ev.ctrlKey||ev.metaKey){ ev.preventDefault(); setZoom(zoom+(ev.deltaY<0?ZOOM_STEP:-ZOOM_STEP)); return; }
    if(canPan()){ ev.preventDefault(); panY-=ev.deltaY; panX-=ev.deltaX; apply(); }
  }, {passive:false});
  window.addEventListener("keydown", e=>{
    if(["INPUT","TEXTAREA"].includes((e.target.tagName||""))) return;
    if(e.key==="+"||e.key==="=") setZoom(zoom+ZOOM_STEP);
    if(e.key==="-") setZoom(zoom-ZOOM_STEP);
    if(e.key==="0"){ panX=0; panY=0; setZoom(100); }
  });
  window.addEventListener("resize", ()=>{ clearTimeout(applyFit._t); applyFit._t=setTimeout(applyFit,120); });
  // Prefer larger pages in PageFlip if present
  setTimeout(applyFit, 200);
  setTimeout(applyFit, 800);
})();

</script>
</body>
</html>
